# Load the netfilter NAT subsystem in the initramfs, BEFORE switch_root.
#
# systemd-modules-load.service (ordered Before=sysinit.target, i.e. before the
# powernode-agent service which is After=basic.target) modprobes each line here
# at initramfs boot. Because switch_root re-uses the SAME running kernel, a
# module loaded here stays loaded across the pivot.
#
# Discovered on the FIRST real-boot verification of the bridge fix
# (powernode-bridge.conf): bridge/br_netfilter/llc/stp let dockerd create the
# docker0 bridge, but its next step — `iptables -t nat -I POSTROUTING ... -j
# MASQUERADE`, so containers get outbound NAT — then failed with "Extension
# MASQUERADE revision 0 not supported, missing kernel module?" and
# "CHAIN_ADD failed (No such file or directory): chain POSTROUTING". The nat
# table itself was never created because nf_nat was never force-included:
# dracut's dependency resolution only pulls a requested module's OWN deps
# (nf_conntrack, already force-listed for nf_tables), never modules that
# depend ON it — so nf_nat being absent stayed invisible until something
# actually needed the nat table. Same failure class as BUG-J (nf_tables) and
# the bridge gap above, just one module family deeper.
#
# nf_nat        — NAT core; owns the nat table's connection-tracking-backed
#                 rewrite engine. Hard dep: nf_conntrack (already loaded via
#                 powernode-nftables.conf).
# nft_masq      — the nftables-backend MASQUERADE target. This is what
#                 iptables-nft (the xtables-nft-multi backend this platform's
#                 iptables ships) actually invokes under the hood.
# xt_MASQUERADE — the legacy-xtables MASQUERADE target, kept alongside for
#                 the compat path in case a rule ever gets evaluated through
#                 it instead of the nft backend.
# nft_chain_nat — nf_nat alone wasn't enough: `nft add table ip nat` succeeds
#                 (an empty table needs nothing special) but creating a
#                 `type nat hook postrouting` CHAIN then failed with "No such
#                 file or directory" — the nat chain-type registration is a
#                 separate module from nf_nat (the rewrite engine) and
#                 nft_masq (the MASQUERADE target), found on the SECOND
#                 real-boot verification (after nf_nat/nft_masq/xt_MASQUERADE
#                 alone still left dockerd unable to start).
# nft_compat    — with table/chain/rule all proven working via raw `nft`,
#                 dockerd's actual `iptables -j MASQUERADE` STILL failed the
#                 same way: iptables (xtables-nft-multi) invokes xtables-
#                 style targets THROUGH the nft backend via this shim,
#                 distinct from nft_masq (nftables' own native masquerade
#                 expression, which is why a raw `nft add rule ...
#                 masquerade` succeeded while `iptables -j MASQUERADE`
#                 didn't). Found on the THIRD real-boot verification.
# xt_conntrack, xt_addrtype, xt_tcpudp, xt_multiport — dockerd's other
#                 default-bridge iptables extensions (ICC forwarding's
#                 conntrack state match, port-publish's tcp/udp + multiport
#                 match); force-included alongside nft_compat rather than
#                 discovering each via a separate round-trip, since they are
#                 dockerd's fixed, well-known default rule set.
#
# The .ko files are force-included into the initramfs via build.sh
# force_drivers. powernode-mount.service ExecStartPre re-modprobes the same
# set as a guaranteed belt in case systemd-modules-load is not wired in this
# boot.
nf_nat
nft_masq
xt_MASQUERADE
nft_chain_nat
nft_compat
xt_conntrack
xt_addrtype
xt_tcpudp
xt_multiport
