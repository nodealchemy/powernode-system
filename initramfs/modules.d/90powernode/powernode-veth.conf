# Load the veth (virtual ethernet pair) driver in the initramfs, BEFORE
# switch_root.
#
# systemd-modules-load.service (ordered Before=sysinit.target, i.e. before the
# powernode-agent service which is After=basic.target) modprobes each line here
# at initramfs boot. Because switch_root re-uses the SAME running kernel, a
# module loaded here stays loaded across the pivot.
#
# With docker0 bridge creation AND its NAT/MASQUERADE POSTROUTING rule both
# confirmed working (see powernode-bridge.conf and powernode-nat.conf),
# `docker run` still failed -- this time actually RUNNING a container, at
# endpoint creation: "failed to add the host <=> sandbox veth pair
# interfaces: operation not supported". veth connects a container's network
# namespace to the host bridge; it is only exercised once a container
# actually starts (not at daemon startup), which is why this stayed
# invisible through every prior bridge/NAT round. Same force-included-but-
# never-explicitly-loaded gap as those, just one layer deeper -- table →
# chain → rule → bridge → endpoint.
#
# veth — zero module dependencies of its own.
#
# The .ko file is force-included into the initramfs via build.sh
# force_drivers. powernode-mount.service ExecStartPre re-modprobes the same
# set as a guaranteed belt in case systemd-modules-load is not wired in this
# boot.
veth
