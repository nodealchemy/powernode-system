# Drop-in for systemd-networkd-wait-online.service in the INITRAMFS context.
#
# Measured on dev-cell 2026-08-17: this unit was the single largest cost of
# every boot — `systemd-analyze blame` put it at 2min 0.119s of a 2min 42s
# boot, i.e. the initrd phase (2min 11s) was almost entirely this one wait.
# It started at 15:42:08, sat for the full stock 120s timeout, and exited
# 1/FAILURE at 15:44:08 ("Timeout occurred while waiting for network
# connectivity"). Boot then continued regardless.
#
# Nothing is gained by that wait. It is pulled into the initrd by Wants= on
# powernode-agent.service, sshd.service and powernode-federation-accept.service,
# and post-pivot the uplink reads `routable (configured)` with
# `Required For Online: yes` — the network is genuinely fine. The unit does not
# succeed late; it never succeeds at all, it just expires.
#
# WHY THIS IS SAFE, and the reason it is a timeout change rather than a
# reordering: the CURRENT shipped behaviour is already "wait-online fails and
# boot proceeds". Every node in the fleet boots, enrols and runs today with this
# unit in a failed state, so nothing downstream can be depending on it having
# succeeded. Bounding the wait therefore cannot regress the success path — it
# can only shorten a failure the system already tolerates. The agent carries its
# own retry loop for a not-yet-ready network (the same way dev-cell-bootstrap
# retries an ops-hub 502 during Rails start), so an early start is recoverable
# where a two-minute stall is simply lost time on every boot of every node.
#
#   --any       succeed as soon as ONE link is online. The node needs its
#               uplink, not every managed link; the stock default waits for all
#               of them, which is what never completes here.
#   --timeout=30 bound the worst case at 30s instead of 120s. Kept non-zero so
#               a genuinely slow DHCP lease is still waited for.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=30
