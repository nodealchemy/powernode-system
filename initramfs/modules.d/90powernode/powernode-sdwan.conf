# Load the SDWAN data-plane netdev drivers in the initramfs, BEFORE
# switch_root.
#
# systemd-modules-load.service (ordered Before=sysinit.target, i.e. before the
# powernode-agent service which is After=basic.target) modprobes each line here
# at initramfs boot. Because switch_root re-uses the SAME running kernel, a
# module loaded here stays loaded across the pivot.
#
# Discovered 2026-08-20 on two freshly provisioned Proxmox nodes (and
# reproduced on dev-cell): the agent's SDWAN reconciler logged, every 30s
# tick, "apply_vrfs: create vrf sdwan-1: ip link add: exit status 2; Error:
# Unknown device type" followed by "apply_interface:wg-sdwan-1: ... Unknown
# device type". `ip link add ... type dummy` fails identically. Netlink and
# iproute2 are fine — the netdev types are simply absent: all three are
# CONFIG_*=m on Ubuntu 24.04 generic (verified NOT builtin via
# /proc/kallsyms — no dummy_setup / wg_socket_init / vrf_newlink symbols),
# and the mmdebstrap-minbase pivot rootfs ships no /lib/modules tree to
# autoload them from (same gap as every family above, one subsystem over:
# the SDWAN appliers instead of dockerd). apply_vrfs dies before wg_applier
# ever runs, so the SDWAN overlay cannot exist and every downstream
# data-plane behavior is untestable.
#
# wireguard — wg_applier's `ip link add <ifname> type wireguard`
#             (agent/internal/sdwan/wg_applier.go). Its modinfo deps
#             (udp_tunnel, ip6_udp_tunnel, and the arch-specific
#             chacha20/poly1305/curve25519 crypto lib modules) are the
#             module's OWN deps: dracut pulls them into the initramfs at
#             build time and modprobe resolves them from modules.dep at
#             load time, so they are deliberately not listed here — the
#             crypto names differ per arch and this file is arch-shared.
# vrf       — vrf_applier's `ip link add <name> type vrf table <id>`
#             (agent/internal/sdwan/vrf_applier.go), one VRF per SDWAN
#             network. Zero module deps of its own; the l3mdev core it
#             uses is a builtin (CONFIG_NET_L3_MASTER_DEV=y).
# dummy     — vip_applier's VIP anchor interfaces (`ip link add <name>
#             type dummy`, agent/internal/sdwan/vip_applier.go). Zero
#             module deps. Listed now rather than left for the next
#             real-boot verification to trip over: the nf_nat →
#             nft_chain_nat → nft_compat → veth history above cost one
#             round-trip per module, and with wireguard+vrf fixed the very
#             next thing the reconciler does is create VIP dummies.
#
# `ip rule` (fib rules) needs no entry: fib_rules is builtin on this
# kernel family (fib_rules_register present in /proc/kallsyms).
#
# The .ko files are force-included into the initramfs via build.sh
# force_drivers. powernode-mount.service ExecStartPre re-modprobes the same
# set as a guaranteed belt in case systemd-modules-load is not wired in this
# boot.
wireguard
vrf
dummy

# ── The nft EXPRESSION modules the same reconcile pass needs next ──────────
# apply_firewall and apply_nat run immediately after apply_interface in the
# SAME manager pass (agent/internal/sdwan/manager.go), and the rulesets they
# apply are compiled server-side. Each of these is a SEPARATE module from the
# nf_* infrastructure already listed above — the table/chain machinery being
# loaded does NOT bring the statement expressions with it, which is the same
# trap that made nft_chain_nat a third round-trip after nf_nat and nft_masq.
#
# nat_applier applies the whole ruleset atomically, so a single missing
# expression fails the ENTIRE ruleset, not just the one rule — the first port
# mapping or expose-service on a node would fail wholesale.
#
# nft_nat         — the `dnat to ...` STATEMENT expression emitted by
#                   Sdwan::NatCompiler for every port mapping. Distinct from
#                   nf_nat (the rewrite engine), nft_chain_nat (the chain type)
#                   and nft_masq (the masquerade target), all listed above.
# nft_limit       — `limit rate over N/second drop`, the per-port-mapping rate
#                   guard Sdwan::NatCompiler emits.
# nft_reject      — Sdwan::FirewallRule permits action: reject, emitted
# nft_reject_inet   verbatim by Sdwan::FirewallCompiler; the inet-family table
#                   these rules live in needs the _inet variant too.
# xt_nat          — iptables-nft DNAT/SNAT, which dockerd invokes for
#                   published container ports (`docker run -p`). Sibling of
#                   xt_MASQUERADE, already listed above.
nft_nat
nft_limit
nft_reject
nft_reject_inet
xt_nat
