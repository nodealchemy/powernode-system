# Load the Linux bridge kernel subsystem in the initramfs, BEFORE switch_root.
#
# systemd-modules-load.service (ordered Before=sysinit.target, i.e. before the
# powernode-agent service which is After=basic.target) modprobes each line here
# at initramfs boot. Because switch_root re-uses the SAME running kernel, a
# module loaded here stays loaded across the pivot — so any module's dockerd
# (services: default bridge networking, e.g. dev-cell-docker — unlike
# gitea-act-runner's --bridge=none) finds the bridge subsystem already
# registered post-pivot and does NOT need the pivot rootfs (mmdebstrap
# minbase base-os) to carry a /lib/modules tree.
#
# Without this, dockerd's default network init failed with "Failed to create
# bridge docker0 via netlink: operation not supported" (bridge.ko never
# loaded → the kernel has no bridge netlink family registered) — same failure
# class as BUG-J (nf_tables), just hitting Docker's own bridge creation
# instead of the egress reconciler's `nft` calls.
#
# bridge       — the Linux bridging driver itself (netlink family + bridge
#                netdevice type).
# br_netfilter — hooks bridged traffic into netfilter/iptables, which dockerd
#                also needs for its per-container DNAT/port-publish rules.
# llc          — 802.2 Logical Link Control, a hard module dependency of
#                bridge.ko (STP/BPDU framing).
# stp          — Spanning Tree Protocol, bridge.ko's other hard dependency.
#
# The .ko files are force-included into the initramfs via build.sh
# force_drivers. powernode-mount.service ExecStartPre re-modprobes the same
# set as a guaranteed belt in case systemd-modules-load is not wired in this
# boot.
bridge
br_netfilter
llc
stp
