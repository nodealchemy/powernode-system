# Load the overlay + erofs filesystem modules in the initramfs, BEFORE
# switch_root — same mechanism and rationale as powernode-nftables.conf.
#
# systemd-modules-load.service (ordered Before=sysinit.target, i.e. before the
# powernode-agent / powernode-mount services which are After=basic.target)
# modprobes each line here at initramfs boot. Without this, the kernel only
# loads "overlay"/"erofs" on demand via the mount(2) syscall's own implicit
# request_module() call — which raced the very first union/module mount and
# intermittently failed with "mount: /sysroot: special device overlay does
# not exist" (exit status 32), sending the reconciler into its degraded
# fallback path every time that race lost.
#
# overlay — the union filesystem MountUnion composes /sysroot from.
# erofs   — each individual module blob is erofs-mounted (mount.MountModule)
#           BEFORE it can be used as an overlay lowerdir entry; same race.
#
# The .ko files are force-included into the initramfs via build.sh
# force_drivers. powernode-mount.service and powernode-agent.service
# ExecStartPre re-modprobe the same set as a guaranteed belt in case
# systemd-modules-load is not wired in this boot (same pattern BUG-J
# established for nf_tables).
overlay
erofs
