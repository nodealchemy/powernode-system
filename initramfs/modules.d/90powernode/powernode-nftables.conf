# Load the nftables kernel subsystem in the initramfs, BEFORE switch_root.
#
# systemd-modules-load.service (ordered Before=sysinit.target, i.e. before the
# powernode-agent service which is After=basic.target) modprobes each line here
# at initramfs boot. Because switch_root re-uses the SAME running kernel, a
# module loaded here stays loaded across the pivot — so the post-pivot
# steady-state reconciler's `nft` egress apply (reconcile.go attachModule →
# security.ApplyEgressAllowlist) finds nf_tables already registered and does NOT
# need the pivot rootfs (mmdebstrap minbase base-os) to carry a /lib/modules
# tree. Without this the first `nft add table inet powernode_module_egress`
# failed with "Unable to initialize Netlink socket: Protocol not supported" and
# every module's units were left empty (BUG-J).
#
# nf_tables    — the nftables core + NFNETLINK subsystem (the netlink socket).
# nft_ct       — the `ct state established,related` conntrack expression the
#                egress chain's first rule uses.
# nf_conntrack — conntrack core (dep of nft_ct; listed explicitly for clarity).
#
# The .ko files are force-included into the initramfs via build.sh
# force_drivers. powernode-mount.service ExecStartPre re-modprobes the same set
# as a guaranteed belt in case systemd-modules-load is not wired in this boot.
nf_tables
nft_ct
nf_conntrack
