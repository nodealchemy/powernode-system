# Powernode shared dracut configuration.
# Per-architecture overlays live in powernode-{amd64,arm64}.conf.
#
# Reference: Golden Eclipse plan M3 — initramfs builder.

# Compress with zstd — produces ~30% smaller cpio than gzip and decompresses
# fast enough for boot.
compress="zstd"

# Hostonly = no — these initramfs images must boot on any compatible
# hardware, not just the build host.
hostonly="no"
hostonly_cmdline="no"

# Powernode custom module embeds the agent binary and the boot init script.
# Listed explicitly in build.sh's --modules flag, but reaffirmed here so
# direct dracut invocations also pull it in.
add_dracutmodules+=" powernode "

# Universal kernel module set — anything that might be needed to find a
# rootfs, mount /var, or talk to the platform. Per-arch additions below.
add_drivers+=" overlay composefs dm-verity fs-verity "
add_drivers+=" virtio_net virtio_blk virtio_scsi virtio_console "
add_drivers+=" e1000 igb ixgbe mlx5_core "
add_drivers+=" nvme xhci_hcd ahci ext4 vfat "
# isofs: mount the PVE cloud-init NoCloud CD-ROM (ISO9660) so
# powernode-cidata-payload.sh can stage the federation payload on token-auth
# Proxmox spawns. Loadable module (CONFIG_ISO9660_FS=m) on Ubuntu generic; the
# optical/IDE bus drivers it needs (sr_mod, cdrom, ata_piix) are =y builtins.
add_drivers+=" isofs "
# qemu_fw_cfg exposes the QEMU virtio-fw-cfg device under /sys/firmware/.
# The agent's identity package reads bootstrap_token / instance_uuid /
# platform_url / ca_pem from there on first boot under libvirt/QEMU.
# Use force_drivers (not add_drivers) — dracut's auto-detection skips
# qemu_fw_cfg since it's not a "boot-essential" driver per its heuristics.
force_drivers+=" qemu_fw_cfg "

# Filesystems (iso9660 for the NoCloud federation-payload CD-ROM — see isofs above)
filesystems+=" ext4 vfat overlay composefs iso9660 "

# Kernel command-line additions enforced at boot time.
# - lockdown=integrity: no module loading except signed
# - ima_appraise=enforce: kernel verifies file integrity
# - powernode.boot=1: signal to powernode-agent that it should run init flow
# - loglevel=5: keep the serial console READABLE. auditd does not run on a
#   composed node, so every systemd unit start/stop audit record lands in the
#   kernel ring buffer and, at the default console_loglevel of 7, is painted
#   onto ttyS0 — thousands of lines burying anything useful. The serial console
#   is the PRIMARY diagnostic channel when a node will not enrol (it is how the
#   2026-07-29 ops-cell identity failure was found), so drowning it is a real
#   cost, not cosmetic.
#
#   5, NOT 3 or 4. printk prints messages with priority STRICTLY LESS THAN
#   console_loglevel, and audit records are priority 5 (notice) — measured, 17
#   of them in a 30s sample. So 5 drops notice/info/debug while KEEPING
#   warnings (4) and errors. 4 would also have hidden warnings, which is where
#   boot diagnostics like "unknown filesystem type vfat" live — an off-by-one
#   that would have silently cost us the next boot investigation.
#
#   Deliberately NOT audit=0. That would kill the noise by disabling the audit
#   subsystem, and key operations are required to be audit-logged — undermining
#   an audit guarantee to fix a readability problem is a bad trade. Records
#   still reach the ring buffer and the journal; they just stop shouting at the
#   console.
#
#   Verified on ops-cell 2026-07-29: agent output is UNAFFECTED because
#   powernode-agent runs StandardOutput=journal+console, which writes straight
#   to the console device and never goes through printk. With loglevel active,
#   3 of 3 console lines were agent messages and 0 were audit.
kernel_cmdline+=" lockdown=integrity ima_appraise=enforce ima_template=ima-ng powernode.boot=1 loglevel=5 "

# Don't strip — symbols help debugging boot failures on real hardware.
do_strip="no"

# Skip files we don't need — saves ~10MB of initramfs size.
omit_dracutmodules+=" plymouth bootchart memstrack "

# Don't auto-include locale or fonts.
i18n_install_all="no"
