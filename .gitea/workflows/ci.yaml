name: ci

# Top-level CI for the powernode-system extension. Validates the Rails
# extension code, the React frontend type-correctness, and the Go agent
# tests. Per-subproject builds (initramfs, module-repo template, agent
# binary release) live in their own .gitea/workflows/build.yaml files.

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Reap any sidecar containers left behind by a previously cancelled
  # run. The Gitea services: block (used by rspec + worker-specs below
  # to start postgres + redis) does NOT reliably clean up on external
  # cancellation in act-runner — the killed container survives, keeps
  # port 6379 / 5432 bound on the runner, and the NEXT job's services
  # block fails to start ("port already in use") + the job fails at
  # first connect with no obvious symptom. Running a tiny job first
  # that nukes anything holding those ports gives the downstream
  # services: blocks a clean slate. Best-effort: failure to find/kill
  # any stale container should not block the rest of CI.
  #
  # Assumes the same runner picks up the dependent jobs (true for
  # single-runner act-runner deployments — this is a per-runner state
  # problem, so a per-runner reap step is the correct shape).
  ci-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - name: Reap stale CI sidecar containers
        run: |
          set +e
          # Match by published port (covers both `redis:7` + `pgvector:pg16`
          # sidecars + any other test containers that happened to bind
          # these ports). awk on the Ports column avoids relying on a
          # specific image tag.
          for port in 6379 5432; do
            stale_ids=$(docker ps --format '{{.ID}} {{.Ports}}' | awk -v p=":$port->" 'index($0, p) {print $1}')
            if [ -n "$stale_ids" ]; then
              echo "Reaping containers holding port $port: $stale_ids"
              echo "$stale_ids" | xargs -r docker rm -f
            fi
          done
          # Catch-all by image — covers the case where the container is
          # in a state with no exposed-port info on ps (rare but seen).
          docker rm -f $(docker ps -aq --filter "ancestor=redis:7") 2>/dev/null
          docker rm -f $(docker ps -aq --filter "ancestor=pgvector/pgvector:pg16") 2>/dev/null
          exit 0

  rspec:
    needs: ci-hygiene
    # Split into 3 parallel suites (controllers/requests, services, models+lib+
    # integration) so wall-clock is max-of-three rather than sum-of-all. Each
    # matrix entry pays the bundle-install + db-setup cost independently but
    # they run concurrently on separate runners. Target <10 min per suite.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [controllers, services, models-lib]
    # Service addressing: sidecars publish container ports to the host;
    # the job container reaches them at the docker bridge gateway IP
    # (172.17.0.1 on a default Linux docker setup), NOT localhost.
    #
    # Why not "localhost"? Tried on commit ${PRIOR-FIX-SHA-OMITTED} with
    # `postgres://postgres:postgres@localhost:5432/...`. The job
    # container's NetworkMode is "bridge" — its localhost is the JOB's
    # OWN loopback, not the docker host's. Sidecars publishing to host
    # 0.0.0.0:5432 ARE reachable from the job, but only via the bridge
    # gateway (172.17.0.1). Result: postgres connection at 127.0.0.1
    # / ::1 refused, every rspec/worker-specs job died:
    #   PG::ConnectionBad: connection to server at "127.0.0.1",
    #     port 5432 failed: Connection refused
    #
    # Why not service-name DNS ("postgres://postgres@postgres:5432/...")?
    # Tried 2026-05-24 (commit 2cd80135). Default docker bridge has NO
    # service-name DNS — every job died with
    #   PG::ConnectionBad: could not translate host name "postgres"
    #     to address: Name or service not known
    # (Per-job custom network + DNS aliases is the canonical Gitea/GHA
    # pattern, but THIS act runner doesn't create per-job networks.)
    #
    # The current "host-ports + 172.17.0.1" approach works because:
    #   - Sidecars publish to host 0.0.0.0:{5432,6379} (host-routable)
    #   - Job container on default bridge reaches host via gateway
    #     (the bridge gateway IS the docker host's bridge interface)
    #   - 172.17.0.1 is the well-known default bridge gateway for
    #     unconfigured Linux docker daemons; hardcoded.
    #
    # Tried a runtime "Discover host gateway" step using `ip route` but
    # the act-24.04 runner image doesn't have iproute2 (exit code 127).
    # Could install it via apt-get but added latency outweighs the
    # robustness of a near-universal default. If a runner with a
    # non-default bridge gateway shows up, override per-job via a
    # job-level `env: DATABASE_URL: ...` block.
    #
    # Port-collision risk: cancelled jobs leak sidecar containers that
    # keep the host port bound. Manually mitigated 2026-05-24 by
    # `docker rm -f` of orphan GITEA-ACTIONS-TASK containers on fna.
    # Runner-level systemd ExecStartPre hook is the proper fix (task
    # #76); workflow-level changes can't reach that.
    services:
      postgres:
        # pgvector/pgvector:pg16 = postgres 16 + pgvector extension
        # baked in. The parent platform's schema uses `CREATE EXTENSION
        # vector` for embedding storage; the standard postgres:16
        # image rejects with `PG::FeatureNotSupported: extension "vector"
        # is not available` during db:schema:load.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: powernode_test
        # Explicit 0.0.0.0 binding — act runner parses bare `5432:5432`
        # as HostIP="invalid IP" (literal string), leaving the port not
        # actually bound to the host's all-interfaces. Without this the
        # job container can't reach 172.17.0.1:5432 even though the
        # sidecar starts successfully. Verified via earlier run 572's
        # docker create cmd: `PortBindings:[5432/tcp:[{HostIP:invalid
        # IP HostPort:5432}]]`.
        ports:
          - 0.0.0.0:5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 0.0.0.0:6379:6379
    env:
      RAILS_ENV: test
      # Default to the standard docker bridge gateway. Overridden at
      # runtime by the "Discover host gateway" step below if the bridge
      # uses a non-default IP.
      DATABASE_URL: postgres://postgres:postgres@172.17.0.1:5432/powernode_test
      REDIS_URL: redis://172.17.0.1:6379/0
    steps:
      - name: Check out the system extension
        uses: actions/checkout@v4
        with:
          path: extensions/system

      - name: Check out the parent platform
        uses: actions/checkout@v4
        with:
          repository: powernode/powernode-platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
          path: powernode-platform
          # Pull submodules (business, marketing, supply-chain, system).
          # Bundler requires these gemspec paths to resolve — without them
          # 'bundle install' fails with 'lockfile can't be updated because
          # frozen mode is set' since the Gemfile.lock references them.
          submodules: recursive

      # The system extension's specs autoload through the parent platform's
      # Rails app. We mount this checkout into the parent's
      # extensions/system/ directory and run rspec from there.
      - name: Mount extension into parent
        run: |
          rm -rf powernode-platform/extensions/system
          # Use mv (not ln -s) — git>=2.43 rejects symlinks at submodule paths
          mv extensions/system powernode-platform/extensions/system

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.8
          bundler-cache: true
          working-directory: powernode-platform/server

      - name: Prepare test database
        working-directory: powernode-platform/server
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load
          # Backfill schema_migrations from extension migrations so rspec
          # doesn't complain about pending migrations
          bundle exec rails runner '
            Dir.glob("../extensions/*/server/db/migrate/*.rb").each do |f|
              v = File.basename(f)[/\A\d+/]
              ActiveRecord::Base.connection.execute(
                "INSERT INTO schema_migrations (version) VALUES ('"'"'#{v}'"'"') ON CONFLICT DO NOTHING"
              )
            end
          '

      - name: Run system extension specs (${{ matrix.suite }})
        working-directory: powernode-platform/server
        # Each suite runs a disjoint subset. Adding a new spec directory?
        # Slot it into the closest-matching bucket here so total coverage stays
        # at 100% across the matrix.
        run: |
          case "${{ matrix.suite }}" in
            controllers)
              paths="../extensions/system/server/spec/controllers ../extensions/system/server/spec/requests"
              ;;
            services)
              paths="../extensions/system/server/spec/services"
              ;;
            models-lib)
              paths="../extensions/system/server/spec/models ../extensions/system/server/spec/lib ../extensions/system/server/spec/integration"
              ;;
            *)
              echo "FATAL: unknown matrix.suite=${{ matrix.suite }}"
              exit 1
              ;;
          esac
          # No-op gracefully if a directory doesn't exist yet (e.g. before P0.1
          # controller specs land).
          existing=""
          for p in $paths; do
            [ -d "$p" ] && existing="$existing $p"
          done
          if [ -z "$existing" ]; then
            echo "no spec directories present for matrix suite ${{ matrix.suite }} — skipping"
            exit 0
          fi
          bundle exec rspec $existing --format progress

      # Post-job sidecar cleanup. Runs on normal completion AND on most
      # cancellations (act-runner sends SIGTERM with a grace period
      # before SIGKILL — if: always() fires during the grace window).
      # Pairs with the ci-hygiene job which catches the SIGKILL case
      # before the NEXT run. Best-effort — empty `docker ps` or already-
      # gone containers should not fail the post-job step.
      - name: Reap own sidecars
        if: always()
        run: |
          set +e
          for port in 6379 5432; do
            docker ps --format '{{.ID}} {{.Ports}}' \
              | awk -v p=":$port->" 'index($0, p) {print $1}' \
              | xargs -r docker rm -f
          done
          exit 0

  frontend-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: extensions/system

      - uses: actions/checkout@v4
        with:
          repository: powernode/powernode-platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
          path: powernode-platform

      - name: Mount extension into parent
        run: |
          rm -rf powernode-platform/extensions/system
          # Use mv (not ln -s) — git>=2.43 rejects symlinks at submodule paths
          mv extensions/system powernode-platform/extensions/system

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: powernode-platform/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: powernode-platform/frontend
        run: npm ci

      # Same node_modules-symlink dance as the frontend-jest job —
      # tsc also resolves modules via the standard upward walk and
      # would fail to find @types/* + react-dom typings without it.
      - name: Symlink extension frontend node_modules → parent
        working-directory: powernode-platform/extensions/system/frontend
        run: |
          rm -rf node_modules
          ln -sf ../../../frontend/node_modules node_modules
          ls -la node_modules | head -3

      - name: Type-check the system extension
        # extensions/system was MOVED into powernode-platform/extensions/system
        # by the Mount step above, so cwd must follow.
        working-directory: powernode-platform/extensions/system/frontend
        run: |
          if [ -f tsconfig.check.json ]; then
            npx --prefix ../../../frontend tsc --noEmit -p tsconfig.check.json
          else
            echo "no tsconfig.check.json — skipping (this is expected for extension-only PRs)"
          fi

  frontend-jest:
    # Mirrors frontend-typecheck's mount-into-parent layout (the extension's
    # jest.config.js extends the parent's; it cannot resolve without the parent
    # checked out at extensions/system's neighbor path). Runs the extension's
    # component/page test suite via the parent's jest runner. Per
    # project_extension_jest_infra.md, the invocation pattern is
    # `npx --prefix ../../../frontend jest --config=jest.config.js`.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: extensions/system

      - uses: actions/checkout@v4
        with:
          repository: powernode/powernode-platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
          path: powernode-platform

      - name: Mount extension into parent
        run: |
          rm -rf powernode-platform/extensions/system
          mv extensions/system powernode-platform/extensions/system

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: powernode-platform/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: powernode-platform/frontend
        run: npm ci

      # The extension's frontend dir intentionally doesn't ship its own
      # node_modules — locally validate.sh symlinks it to the parent's
      # node_modules and the symlink is .gitignored (line 48 of
      # extensions/system/.gitignore). CI has to recreate the same
      # symlink after npm ci runs, so jest's babel-loader can resolve
      # @babel/preset-env (and other presets) by walking up from
      # extensions/system/frontend/. Without this, babel's preset
      # resolver bails with "Cannot find module '@babel/preset-env'"
      # because the walk-up from jest.config.js's dir never reaches
      # powernode-platform/frontend/node_modules.
      - name: Symlink extension frontend node_modules → parent
        working-directory: powernode-platform/extensions/system/frontend
        run: |
          rm -rf node_modules  # in case checkout extracted a stale dir
          ln -sf ../../../frontend/node_modules node_modules
          ls -la node_modules | head -3

      - name: Run extension Jest suite
        working-directory: powernode-platform/extensions/system/frontend
        env:
          CI: "true"
        run: |
          if [ -f jest.config.js ]; then
            npx --prefix ../../../frontend jest --config=jest.config.js
          else
            echo "no jest.config.js — skipping (extension may not have a jest harness yet)"
          fi

  go-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum
      - name: Run agent tests
        working-directory: agent
        run: |
          if [ -f go.mod ]; then
            go test ./...
          else
            echo "agent/ has no go.mod yet — skipping"
          fi

  ruby-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.8
      - name: Ruby syntax check on every .rb in the extension
        run: |
          fail=0
          while IFS= read -r f; do
            ruby -c "$f" >/dev/null || { echo "syntax error: $f"; fail=1; }
          done < <(find server worker -name '*.rb' 2>/dev/null)
          exit $fail

  todo-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject unlabeled standalone TODO comments
        run: bash scripts/audit-todos.sh

  rubocop:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the system extension
        uses: actions/checkout@v4
        with:
          path: extensions/system

      - name: Check out the parent platform
        uses: actions/checkout@v4
        with:
          repository: powernode/powernode-platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
          path: powernode-platform
          # Submodules required so 'bundle install' resolves frozen lockfile
          submodules: recursive

      - name: Mount extension into parent
        run: |
          rm -rf powernode-platform/extensions/system
          mv extensions/system powernode-platform/extensions/system

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.8
          bundler-cache: true
          working-directory: powernode-platform/server

      - name: Run RuboCop on extension Ruby
        working-directory: powernode-platform/server
        run: |
          bundle exec rubocop \
            ../extensions/system/server/app \
            ../extensions/system/server/lib \
            ../extensions/system/server/spec \
            ../extensions/system/worker/app

  # Per audit plan P3.7b — run the 12 system_*_spec.rb files that landed
  # in P0.2. They live under the parent worker (worker/spec/jobs/) because
  # the extension's worker jobs are autoloaded by the parent worker app;
  # there's no separate spec harness for extension-only worker jobs.
  worker-specs:
    needs: ci-hygiene
    runs-on: ubuntu-24.04
    # Same docker-bridge-gateway addressing as the rspec matrix above —
    # see the long comment up there for why localhost and service-name
    # DNS both don't work on this Gitea Actions installation.
    services:
      redis:
        image: redis:7
        # Explicit 0.0.0.0 binding — see the long comment in the rspec
        # services block. `6379:6379` alone leaves HostIP="invalid IP"
        # in the act runner.
        ports:
          - 0.0.0.0:6379:6379
    env:
      REDIS_URL: redis://172.17.0.1:6379/0
      # Worker startup hard-requires these two env vars. Empty values
      # abort the process before spec loading even begins:
      #   ERROR [WORKER] Missing required environment variables: WORKER_ID, JWT_SECRET_KEY
      #   ERROR [WORKER] Worker cannot start without these configurations
      # Both are only used inside the test process, so deterministic
      # non-secret strings are fine — production rotates these from
      # Vault. Don't reuse a known-rotated value here.
      WORKER_ID: ci-worker-ephemeral
      JWT_SECRET_KEY: ci-jwt-secret-not-for-prod
    steps:
      - name: Check out the system extension
        uses: actions/checkout@v4
        with:
          path: extensions/system

      - name: Check out the parent platform
        uses: actions/checkout@v4
        with:
          repository: powernode/powernode-platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
          path: powernode-platform
          submodules: recursive

      - name: Mount extension into parent
        run: |
          rm -rf powernode-platform/extensions/system
          mv extensions/system powernode-platform/extensions/system

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.8
          bundler-cache: true
          working-directory: powernode-platform/worker

      - name: Run system worker job specs
        working-directory: powernode-platform/worker
        run: |
          # Run only the system_*_spec.rb files. Other parent-worker jobs
          # (ai_*, mission_*, etc.) are out of this extension's scope.
          bundle exec rspec spec/jobs/system_*_spec.rb --format progress

      # Post-job sidecar cleanup. Mirrors the rspec job's cleanup —
      # catches normal completion + most cancellations; ci-hygiene
      # handles the SIGKILL case before the next run.
      - name: Reap own sidecars
        if: always()
        run: |
          set +e
          docker ps --format '{{.ID}} {{.Ports}}' \
            | awk 'index($0, ":6379->") {print $1}' \
            | xargs -r docker rm -f
          exit 0
