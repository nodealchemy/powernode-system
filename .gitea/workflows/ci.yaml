name: ci

# Top-level CI for the powernode-system extension. Validates the Rails
# extension code, the React frontend type-correctness, and the Go agent
# tests. Per-subproject builds (initramfs, module-repo template, agent
# binary release) live in their own .gitea/workflows/build.yaml files.

on:
  push:
    # ci-isolation/** exists so a change to THIS file can be validated by a
    # real run before it reaches develop. There is no other way to test a
    # workflow: it only executes when it triggers, and develop is the branch
    # a broken one would break. Mirrors the ci-probe/** prefix on
    # probe-ci-isolation.yaml. A push here runs the full suite, so use it for
    # CI-mechanism changes, not as a general scratch branch.
    branches: [master, develop, "ci-isolation/**"]
  pull_request:
    branches: [master, develop]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Reap any sidecar containers left behind by a previously cancelled
  # run. The Gitea services: block (used by rspec + worker-specs below
  # to start postgres + redis) does NOT reliably clean up on external
  # cancellation in act-runner — the killed container survives, keeps
  # port 6379 / 5432 bound on the runner, and the NEXT job's services
  # block fails to start ("port already in use") + the job fails at
  # first connect with no obvious symptom. Running a tiny job first
  # that nukes anything holding those ports gives the downstream
  # services: blocks a clean slate. Best-effort: failure to find/kill
  # any stale container should not block the rest of CI.
  #
  # Assumes the same runner picks up the dependent jobs (true for
  # single-runner act-runner deployments — this is a per-runner state
  # problem, so a per-runner reap step is the correct shape).
  ci-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - name: Reap stale CI sidecar containers
        run: |
          set +e
          # SCOPED BY AGE. This job is a `needs:` prerequisite of every job in
          # this workflow, so it runs first in EVERY run — and the previous
          # form reaped by published port AND by a bare `ancestor=` image
          # match with no port, age or run scoping at all. On a shared runner
          # host that means run N+1 `docker rm -f`s run N's LIVE postgres and
          # redis mid-suite. The same catch-all exists in the parent repo
          # (.gitea/workflows/extensions-bundle.yml), so pushes to either repo
          # could reap the other's sidecars.
          #
          # Age is the discriminator that needs no cooperation from the
          # runner: a job container is created with `/bin/sleep 10800`, so a
          # run cannot outlive 3h, so a sidecar YOUNGER than that may belong
          # to a live run and one OLDER than it is definitionally orphaned.
          # Nothing here depends on a label or naming convention we do not
          # control.
          CEILING_SECS=10800
          now=$(date +%s)

          # Pass 1: OWN sidecars, which now carry their own expiry. A job
          # labels each container with a deadline past its own timeout, so an
          # expired label means the owning job cannot still be running — that
          # is a stronger statement than age, and it reaps a crashed job's
          # leftovers without waiting out the 3h ceiling. Unlabeled containers
          # (older runs, the parent repo's bundle workflow) fall through to
          # pass 2 unchanged.
          for id in $(docker ps -aq --filter "label=powernode.ci=sidecar"); do
            dl=$(docker inspect -f '{{index .Config.Labels "powernode.ci.deadline"}}' "$id" 2>/dev/null)
            case "$dl" in ''|*[!0-9]*) continue ;; esac
            if [ "$now" -gt "$dl" ]; then
              echo "expired ($(( (now - dl) / 60 ))m past deadline): $id"
              docker rm -f "$id" >/dev/null 2>&1
            else
              echo "LEAVING ($(( (dl - now) / 60 ))m before deadline): $id"
            fi
          done

          # Candidates: by published port (catches a test container on these
          # ports whatever its image) OR by image (catches one whose ps row
          # carries no port info — the case the old catch-all existed for).
          by_port=$(docker ps -a --format '{{.ID}} {{.Ports}}' \
                    | awk '/:6379->|:5432->/ {print $1}')
          by_image=$(docker ps -aq --filter "ancestor=redis:7" \
                                   --filter "ancestor=pgvector/pgvector:pg16")
          candidates=$(printf '%s\n%s\n' "$by_port" "$by_image" | sort -u | sed '/^$/d')

          reap=""
          for id in $candidates; do
            created=$(docker inspect -f '{{.Created}}' "$id" 2>/dev/null)
            [ -z "$created" ] && continue
            ts=$(date -d "$created" +%s 2>/dev/null)
            [ -z "$ts" ] && continue
            age=$(( now - ts ))
            if [ "$age" -gt "$CEILING_SECS" ]; then
              echo "orphan  ($((age/60))m old): $id"
              reap="$reap $id"
            else
              echo "LEAVING ($((age/60))m old, may belong to a live run): $id"
            fi
          done

          if [ -n "$reap" ]; then
            echo "Reaping:$reap"
            echo "$reap" | xargs -r docker rm -f
          else
            echo "no orphaned sidecars older than ${CEILING_SECS}s"
          fi
          exit 0

  rspec:
    needs: ci-hygiene
    # SIX SHARDS, balanced by example count, each computing its own slice.
    #
    # This was one job running all four suites sequentially, and that job could
    # not finish: the suite is ~217 minutes of work while the job container's
    # own entrypoint is /bin/sleep 10800 = 180 minutes. No timeout-minutes
    # value fixes that — past 180 the container dies instead of the step, which
    # is strictly less legible. Run 1780 is the proof: controllers (2153) and
    # services (8435) ran, the other two suites never started, and the job was
    # killed at its ceiling with two suites unexecuted.
    #
    # The earlier 4-entry matrix failed for an unrelated reason — every entry
    # published the same fixed 0.0.0.0:5432 — which step 2 removed by giving
    # each job kernel-assigned sidecar ports. A matrix is safe again now.
    #
    # Shards are by FILE, not by directory: `services` alone is 56% of the
    # suite, so any directory split needs a human to rebalance it as the suite
    # grows, and a directory list as the coverage contract is what let eight
    # directories go silently unrun in 2026-08. Measured balance at N=6 on the
    # real suite: 2495/2495/2495/2495/2494/2494 across 956 files, max/mean
    # 1.0001, union complete, zero duplicates.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with CI_RSPEC_SHARDS below and with the rspec-gate job;
        # ci-spec-shard.rb refuses an index outside the count.
        shard: [0, 1, 2, 3, 4, 5]
    # Was: one job holding a FIXED host port, with four suites sequenced
    # inside it because a 4-entry matrix had every entry contend for
    # 0.0.0.0:5432. That made the suites run and converted the problem into a
    # slower one — the job holds the port for its whole duration, so any run
    # starting inside that window loses all three of its database jobs (run
    # 1772 held it 02:17-03:28; run 1773's three died inside 23s). Sidecars now
    # take a kernel-assigned port each, so nothing contends and the three jobs
    # no longer need chaining.
    #
    # Two scheduler-level fixes were tried here and BOTH failed. Do not retry
    # either without new evidence: a `concurrency:` group shared across these
    # jobs deadlocked with everything waiting and nothing running (run 1675),
    # and `strategy.max-parallel: 1` was silently ignored (run 1676). The
    # mechanism below needs no scheduler feature at all, which is the point.
    #
    # timeout-minutes is honoured here (run 1776 P4: killed 113s into a 300s
    # sleep under a 2-minute cap), so this ceiling is real, not decoration.
    #
    # Per SHARD now, not per suite. One sixth of ~217 minutes is ~36, plus
    # setup and the dry run; 75 leaves headroom for the slowest shard while
    # staying far below the container's own /bin/sleep 10800 = 180 minutes —
    # which matters, because past that ceiling the container dies instead of
    # the step and the failure stops being legible.
    timeout-minutes: 75
    env:
      RAILS_ENV: test
    steps:
      # Sidecars are started HERE, by hand, instead of in a `services:` block.
      # A services: sidecar can only publish a FIXED host port, and a fixed
      # port means one run at a time on a shared runner host: run 1772 held
      # 5432 from 02:17 to 03:28 and run 1773's three database jobs each died
      # inside 23 seconds on "Bind for 0.0.0.0:5432 failed: port is already
      # allocated", with no rspec output at all. `-p <gw>::<port>` asks the
      # kernel for a free port instead, atomically, per socket — so concurrent
      # jobs cannot collide by construction. Proven on run 1776: two entries
      # started together took 32768/32770 and 32769/32771 while run 1775 held
      # the fixed 5432 on develop.
      #
      # The mapped port is read back with `docker port`, which needs nothing
      # from the runner beyond the docker socket already mounted in job
      # containers. That is why this is not an ephemeral `services:` port:
      # reading one back there would need `${{ }}` inside the services block,
      # which fails UNSAFE if unsupported (the literal string becomes the
      # port), or the untried job.services context.
      #
      # Addressing is unchanged — the job container reaches the sidecar at the
      # docker bridge gateway, not localhost and not by service name; see the
      # git history of this file for the two runs that ruled those out. The
      # gateway is now discovered rather than assumed, with the old hardcoded
      # value as fallback (run 1776 confirmed they agree).
      - name: Start isolated sidecars on kernel-assigned ports
        run: |
          set -euo pipefail
          GW=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}' 2>/dev/null || true)
          GW=${GW:-172.17.0.1}
          OWNER="${GITHUB_RUN_ID:-norun}-${GITHUB_JOB:-nojob}-$(date +%s)-$RANDOM"
          # Labels, not ports, are how ci-hygiene identifies a reapable orphan.
          # The deadline is this job's own ceiling, so a sidecar is only ever
          # reaped after the job that owns it could not still be running.
          DEADLINE=$(( $(date +%s) + 9000 ))
          LABELS="--label powernode.ci=sidecar --label powernode.ci.owner=$OWNER --label powernode.ci.deadline=$DEADLINE"

          PG=$(docker run -d $LABELS -p "$GW::5432" \
                -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=powernode_test \
                pgvector/pgvector:pg16 \
                -c fsync=off -c synchronous_commit=off -c full_page_writes=off)
          RD=$(docker run -d $LABELS -p "$GW::6379" redis:7 --save '' --appendonly no)

          PGPORT=$(docker port "$PG" 5432/tcp | head -1 | awk -F: '{print $NF}')
          RDPORT=$(docker port "$RD" 6379/tcp | head -1 | awk -F: '{print $NF}')
          [ -n "$PGPORT" ] && [ -n "$RDPORT" ] || { echo "sidecar published no port"; exit 1; }
          echo "sidecars: postgres $GW:$PGPORT  redis $GW:$RDPORT  owner=$OWNER"

          for _ in $(seq 1 60); do docker exec "$PG" pg_isready -U postgres -q && break; sleep 1; done
          docker exec "$PG" pg_isready -U postgres

          { echo "DATABASE_URL=postgres://postgres:postgres@$GW:$PGPORT/powernode_test"
            echo "REDIS_URL=redis://$GW:$RDPORT/0"
            echo "CI_SIDECAR_OWNER=$OWNER"; } >> "$GITHUB_ENV"

      - name: Check out the system extension
        uses: actions/checkout@v4
        with:
          path: extensions/system

      - name: Check out the parent platform
        uses: actions/checkout@v4
        with:
          repository: powernode/powernode-platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
          path: powernode-platform
          # Pull submodules (business, marketing, supply-chain, system).
          # Bundler requires these gemspec paths to resolve — without them
          # 'bundle install' fails with 'lockfile can't be updated because
          # frozen mode is set' since the Gemfile.lock references them.
          submodules: recursive

      # The system extension's specs autoload through the parent platform's
      # Rails app. We mount this checkout into the parent's
      # extensions/system/ directory and run rspec from there.
      - name: Mount extension into parent
        run: |
          rm -rf powernode-platform/extensions/system
          # Use mv (not ln -s) — git>=2.43 rejects symlinks at submodule paths
          mv extensions/system powernode-platform/extensions/system

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.8
          bundler-cache: true
          working-directory: powernode-platform/server

      - name: Prepare test database
        working-directory: powernode-platform/server
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load
          # Backfill schema_migrations for everything db:schema:load did not
          # stamp — extension migrations, AND core migrations newer than
          # schema.rb's version (a data-only migration never bumps it). See the
          # script header; it is shared so the two jobs cannot drift.
          bundle exec rails runner ../extensions/system/scripts/ci-stamp-migration-versions.rb

      # Fails when a migration is stamped applied but its table was never
      # created — db:schema:load + assume_migrated_upto_version produces
      # exactly that for any table missing from schema.rb, and db:migrate
      # cannot repair it. Cheap (~1s) and runs before any spec, so the failure
      # names the schema gap instead of surfacing as an unrelated
      # PG::UndefinedTable thousands of examples later — or, worse, not
      # surfacing at all where the caller rescues StandardError.
      - name: Assert every stamped migration actually materialised
        working-directory: powernode-platform/server
        run: bundle exec rails runner ../extensions/system/scripts/ci-assert-schema-materialised.rb

      - name: Run this shard's specs
        working-directory: powernode-platform/server
        env:
          CI_RSPEC_SHARDS: "6"
          CI_RSPEC_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          EXT=../extensions/system/server/spec

          # Directory list is DERIVED, never enumerated: a new top-level spec
          # directory is covered automatically. The three helper dirs carry no
          # *_spec.rb and are loaded by rails_helper.
          dirs=""
          for d in "$EXT"/*/; do
            name=$(basename "$d")
            case "$name" in
              factories|fixtures|support) ;;
              *) dirs="$dirs ${d%/}" ;;
            esac
          done
          [ -n "$dirs" ] || { echo "no spec directories found under $EXT"; exit 1; }

          # Every shard computes the SAME partition from the SAME commit, so no
          # artifact, cache or job output crosses between them. That only holds
          # because ci-spec-shard.rb is a pure function of this plan.
          echo "::group::dry-run plan"
          bundle exec rspec --dry-run --format json --out plan.json $dirs
          echo "::endgroup::"

          ruby ../extensions/system/scripts/ci-spec-shard.rb \
            plan.json --shards "$CI_RSPEC_SHARDS" --index "$CI_RSPEC_INDEX" > shard.txt

          planned=$(ruby -rjson -e '
            plan = JSON.parse(File.read("plan.json"))
            want = File.readlines("shard.txt").map(&:strip).reject(&:empty?).to_set
            puts plan["examples"].count { |e| want.include?(e["id"].to_s.split("[").first) }
          ' 2>/dev/null || echo 0)
          echo "shard $CI_RSPEC_INDEX: $(wc -l < shard.txt) files, $planned examples planned"
          [ "$planned" -gt 0 ] || { echo "shard planned 0 examples — refusing to report a vacuous pass"; exit 1; }

          # ci-rspec.sh records the executed count for the zero-example gate and
          # exits with rspec's OWN status.
          rc=0
          bash ../extensions/system/scripts/ci-rspec.sh \
            --format progress --format json --out result.json $(cat shard.txt) || rc=$?

          # A file rspec silently skipped, or one dropped by a load error, is
          # caught HERE rather than surfacing as a smaller green run.
          ran=$(ruby -rjson -e 'puts JSON.parse(File.read("result.json"))["summary"]["example_count"]' 2>/dev/null || echo -1)
          echo "shard $CI_RSPEC_INDEX: planned $planned, ran $ran"
          if [ "$ran" != "$planned" ]; then
            echo "SHARD COVERAGE MISMATCH: planned $planned examples but ran $ran."
            echo "A spec file was skipped or failed to load. This is NOT an ordinary"
            echo "test failure — the shard tested less than it claimed to."
            exit 1
          fi
          exit $rc

      # Post-job sidecar cleanup. Runs on normal completion AND on most
      # cancellations (act-runner sends SIGTERM with a grace period
      # before SIGKILL — if: always() fires during the grace window).
      # Pairs with the ci-hygiene job which catches the SIGKILL case
      # before the NEXT run. Best-effort — empty `docker ps` or already-
      # gone containers should not fail the post-job step.
      # Removes exactly this job's sidecars, by owner label. Nothing here
      # matches on a port or an image, so it can never reach a concurrent
      # job's containers — which is what the old port/image sweep did.
      # A job that executed ZERO examples must not report a bare `failure`
      # alongside genuine test failures — that is what made run 1773 unreadable.
      # `if: always()` so it still speaks when an earlier step died, which is
      # precisely the case worth naming.
      - name: Assert this job actually ran examples
        if: always()
        run: |
          # "Mount extension into parent" mv's the checkout, so resolve either
          # location — this step runs even when that step never happened.
          s=powernode-platform/extensions/system/scripts/ci-assert-examples-ran.sh
          [ -f "$s" ] || s=extensions/system/scripts/ci-assert-examples-ran.sh
          bash "$s" rspec

      - name: Remove this job's sidecars
        if: always()
        run: |
          set +e
          docker ps -aq --filter "label=powernode.ci.owner=${CI_SIDECAR_OWNER:-none-set}" | xargs -r docker rm -f
          exit 0

  # Cloud-provider adapter specs WITH their optional SDK gems bundled.
  #
  # The `rspec` job's `services` suite runs the provider specs too, but the
  # aws/openstack ones self-skip there: their `before` blocks stub
  # `Aws::EC2::Client` / `Fog::OpenStack::Compute`, which aren't in the core
  # bundle (those gems are intentionally omitted — see
  # server/powernode_system.gemspec). So ~64 provider examples show `pending`
  # in that suite and AwsProvider / OpenStackProvider go UN-exercised — a
  # green `rspec` job is misleading for provider code. This lane layers the
  # SDK gems onto the core bundle (via extensions/system/scripts/test-provider-gems.sh)
  # so those specs actually run and provider regressions are caught.
  # Proves the six shards together covered the whole suite. A bug in the
  # directory glob, in the LPT assignment, or a stale shard count fails HERE
  # rather than showing up as a smaller-but-green run — the failure mode this
  # whole design exists to prevent, and the one that let eight directories go
  # silently unrun in 2026-08.
  #
  # `needs: rspec` WITHOUT `if: always()` is deliberate: a failed or cancelled
  # shard skips this job and the run is red anyway, so no needs.<job>.result
  # expression or matrix-output feature is required.
  rspec-gate:
    needs: rspec
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILS_ENV: test
    steps:
      - name: Start isolated sidecars on kernel-assigned ports
        run: |
          set -euo pipefail
          GW=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}' 2>/dev/null || true)
          GW=${GW:-172.17.0.1}
          OWNER="${GITHUB_RUN_ID:-norun}-${GITHUB_JOB:-nojob}-$(date +%s)-$RANDOM"
          DEADLINE=$(( $(date +%s) + 3600 ))
          LABELS="--label powernode.ci=sidecar --label powernode.ci.owner=$OWNER --label powernode.ci.deadline=$DEADLINE"

          PG=$(docker run -d $LABELS -p "$GW::5432" \
                -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=powernode_test \
                pgvector/pgvector:pg16 \
                -c fsync=off -c synchronous_commit=off -c full_page_writes=off)
          RD=$(docker run -d $LABELS -p "$GW::6379" redis:7 --save '' --appendonly no)

          PGPORT=$(docker port "$PG" 5432/tcp | head -1 | awk -F: '{print $NF}')
          RDPORT=$(docker port "$RD" 6379/tcp | head -1 | awk -F: '{print $NF}')
          [ -n "$PGPORT" ] && [ -n "$RDPORT" ] || { echo "sidecar published no port"; exit 1; }

          for _ in $(seq 1 60); do docker exec "$PG" pg_isready -U postgres -q && break; sleep 1; done
          docker exec "$PG" pg_isready -U postgres

          { echo "DATABASE_URL=postgres://postgres:postgres@$GW:$PGPORT/powernode_test"
            echo "REDIS_URL=redis://$GW:$RDPORT/0"
            echo "CI_SIDECAR_OWNER=$OWNER"; } >> "$GITHUB_ENV"

      - name: Check out the system extension
        uses: actions/checkout@v4
        with:
          path: extensions/system

      - name: Check out the parent platform
        uses: actions/checkout@v4
        with:
          repository: powernode/powernode-platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
          path: powernode-platform
          submodules: recursive

      - name: Mount extension into parent
        run: |
          rm -rf powernode-platform/extensions/system
          mv extensions/system powernode-platform/extensions/system

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.8
          bundler-cache: true
          working-directory: powernode-platform/server

      - name: Prepare test database
        working-directory: powernode-platform/server
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load
          bundle exec rails runner ../extensions/system/scripts/ci-stamp-migration-versions.rb

      - name: Assert the shards covered the whole suite
        working-directory: powernode-platform/server
        env:
          CI_RSPEC_SHARDS: "6"
        run: |
          set -euo pipefail
          EXT=../extensions/system/server/spec

          dirs=""
          for d in "$EXT"/*/; do
            name=$(basename "$d")
            case "$name" in
              factories|fixtures|support) ;;
              *) dirs="$dirs ${d%/}" ;;
            esac
          done

          bundle exec rspec --dry-run --format json --out plan.json $dirs

          for i in $(seq 0 $((CI_RSPEC_SHARDS - 1))); do
            ruby ../extensions/system/scripts/ci-spec-shard.rb \
              plan.json --shards "$CI_RSPEC_SHARDS" --index "$i" > "shard-$i.txt"
          done

          ruby -rjson -rset -e '
            plan  = JSON.parse(File.read("plan.json"))
            total = plan["examples"].length
            all_files = plan["examples"].map { |e| e["id"].to_s.split("[").first }.reject(&:empty?).to_set

            shards = Integer(ENV.fetch("CI_RSPEC_SHARDS"))
            lists  = (0...shards).map { |i| File.readlines("shard-#{i}.txt").map(&:strip).reject(&:empty?) }
            union  = lists.flatten

            dupes = union.tally.select { |_, n| n > 1 }.keys
            abort("SHARDS OVERLAP: #{dupes.first(5).join(", ")} — a file would run twice while another ran not at all") if dupes.any?

            missing = all_files - union.to_set
            abort("SHARDS DO NOT COVER THE SUITE: #{missing.size} file(s) unassigned, e.g. #{missing.first(5).join(", ")}") if missing.any?

            extra = union.to_set - all_files
            abort("SHARDS CLAIM UNKNOWN FILES: #{extra.first(5).join(", ")}") if extra.any?

            planned = lists.map { |l| want = l.to_set; plan["examples"].count { |e| want.include?(e["id"].to_s.split("[").first) } }
            abort("PLANNED SUM #{planned.sum} != DRY-RUN TOTAL #{total}") unless planned.sum == total

            puts "coverage OK: #{shards} shards, #{all_files.size} files, #{total} examples"
            puts "per-shard planned: #{planned.join(" / ")} (max/mean #{(planned.max.to_f / (total.to_f / shards)).round(3)})"
          '

      - name: Remove this job's sidecars
        if: always()
        run: |
          set +e
          docker ps -aq --filter "label=powernode.ci.owner=${CI_SIDECAR_OWNER:-none-set}" | xargs -r docker rm -f
          exit 0

  provider-specs:
    # No longer chained behind rspec. That chain existed only to stop two jobs
    # contending for the same fixed host port; each job now gets its own
    # kernel-assigned ports, so this runs concurrently with rspec and
    # worker-specs.
    needs: ci-hygiene
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RAILS_ENV: test
    steps:
      # Sidecars are started HERE, by hand, instead of in a `services:` block.
      # A services: sidecar can only publish a FIXED host port, and a fixed
      # port means one run at a time on a shared runner host: run 1772 held
      # 5432 from 02:17 to 03:28 and run 1773's three database jobs each died
      # inside 23 seconds on "Bind for 0.0.0.0:5432 failed: port is already
      # allocated", with no rspec output at all. `-p <gw>::<port>` asks the
      # kernel for a free port instead, atomically, per socket — so concurrent
      # jobs cannot collide by construction. Proven on run 1776: two entries
      # started together took 32768/32770 and 32769/32771 while run 1775 held
      # the fixed 5432 on develop.
      #
      # The mapped port is read back with `docker port`, which needs nothing
      # from the runner beyond the docker socket already mounted in job
      # containers. That is why this is not an ephemeral `services:` port:
      # reading one back there would need `${{ }}` inside the services block,
      # which fails UNSAFE if unsupported (the literal string becomes the
      # port), or the untried job.services context.
      #
      # Addressing is unchanged — the job container reaches the sidecar at the
      # docker bridge gateway, not localhost and not by service name; see the
      # git history of this file for the two runs that ruled those out. The
      # gateway is now discovered rather than assumed, with the old hardcoded
      # value as fallback (run 1776 confirmed they agree).
      - name: Start isolated sidecars on kernel-assigned ports
        run: |
          set -euo pipefail
          GW=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}' 2>/dev/null || true)
          GW=${GW:-172.17.0.1}
          OWNER="${GITHUB_RUN_ID:-norun}-${GITHUB_JOB:-nojob}-$(date +%s)-$RANDOM"
          # Labels, not ports, are how ci-hygiene identifies a reapable orphan.
          # The deadline is this job's own ceiling, so a sidecar is only ever
          # reaped after the job that owns it could not still be running.
          DEADLINE=$(( $(date +%s) + 9000 ))
          LABELS="--label powernode.ci=sidecar --label powernode.ci.owner=$OWNER --label powernode.ci.deadline=$DEADLINE"

          PG=$(docker run -d $LABELS -p "$GW::5432" \
                -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=powernode_test \
                pgvector/pgvector:pg16 \
                -c fsync=off -c synchronous_commit=off -c full_page_writes=off)
          RD=$(docker run -d $LABELS -p "$GW::6379" redis:7 --save '' --appendonly no)

          PGPORT=$(docker port "$PG" 5432/tcp | head -1 | awk -F: '{print $NF}')
          RDPORT=$(docker port "$RD" 6379/tcp | head -1 | awk -F: '{print $NF}')
          [ -n "$PGPORT" ] && [ -n "$RDPORT" ] || { echo "sidecar published no port"; exit 1; }
          echo "sidecars: postgres $GW:$PGPORT  redis $GW:$RDPORT  owner=$OWNER"

          for _ in $(seq 1 60); do docker exec "$PG" pg_isready -U postgres -q && break; sleep 1; done
          docker exec "$PG" pg_isready -U postgres

          { echo "DATABASE_URL=postgres://postgres:postgres@$GW:$PGPORT/powernode_test"
            echo "REDIS_URL=redis://$GW:$RDPORT/0"
            echo "CI_SIDECAR_OWNER=$OWNER"; } >> "$GITHUB_ENV"

      - name: Check out the system extension
        uses: actions/checkout@v4
        with:
          path: extensions/system

      - name: Check out the parent platform
        uses: actions/checkout@v4
        with:
          repository: powernode/powernode-platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
          path: powernode-platform
          submodules: recursive

      - name: Mount extension into parent
        run: |
          rm -rf powernode-platform/extensions/system
          mv extensions/system powernode-platform/extensions/system

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.8
          bundler-cache: true
          working-directory: powernode-platform/server

      - name: Prepare test database
        working-directory: powernode-platform/server
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load
          # Backfill schema_migrations for everything db:schema:load did not
          # stamp — extension migrations, AND core migrations newer than
          # schema.rb's version (a data-only migration never bumps it). See the
          # script header; it is shared so the two jobs cannot drift.
          bundle exec rails runner ../extensions/system/scripts/ci-stamp-migration-versions.rb

      # Fails when a migration is stamped applied but its table was never
      # created — db:schema:load + assume_migrated_upto_version produces
      # exactly that for any table missing from schema.rb, and db:migrate
      # cannot repair it. Cheap (~1s) and runs before any spec, so the failure
      # names the schema gap instead of surfacing as an unrelated
      # PG::UndefinedTable thousands of examples later — or, worse, not
      # surfacing at all where the caller rescues StandardError.
      - name: Assert every stamped migration actually materialised
        working-directory: powernode-platform/server
        run: bundle exec rails runner ../extensions/system/scripts/ci-assert-schema-materialised.rb

      # The script generates a throwaway supplementary Gemfile beside the core
      # Gemfile (eval_gemfile "Gemfile" + aws-sdk-ec2 + fog-openstack), does a
      # non-frozen install into the already-cached bundle, then runs the four
      # provider specs. aws/openstack now execute instead of self-skipping.
      - name: Run provider specs with SDK gems bundled
        working-directory: powernode-platform
        run: bash extensions/system/scripts/test-provider-gems.sh

      # Removes exactly this job's sidecars, by owner label. Nothing here
      # matches on a port or an image, so it can never reach a concurrent
      # job's containers — which is what the old port/image sweep did.
      # A job that executed ZERO examples must not report a bare `failure`
      # alongside genuine test failures — that is what made run 1773 unreadable.
      # `if: always()` so it still speaks when an earlier step died, which is
      # precisely the case worth naming.
      - name: Assert this job actually ran examples
        if: always()
        run: |
          # "Mount extension into parent" mv's the checkout, so resolve either
          # location — this step runs even when that step never happened.
          s=powernode-platform/extensions/system/scripts/ci-assert-examples-ran.sh
          [ -f "$s" ] || s=extensions/system/scripts/ci-assert-examples-ran.sh
          bash "$s" provider-specs

      - name: Remove this job's sidecars
        if: always()
        run: |
          set +e
          docker ps -aq --filter "label=powernode.ci.owner=${CI_SIDECAR_OWNER:-none-set}" | xargs -r docker rm -f
          exit 0

  frontend-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: extensions/system

      - uses: actions/checkout@v4
        with:
          repository: powernode/powernode-platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
          path: powernode-platform

      - name: Mount extension into parent
        run: |
          rm -rf powernode-platform/extensions/system
          # Use mv (not ln -s) — git>=2.43 rejects symlinks at submodule paths
          mv extensions/system powernode-platform/extensions/system

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: powernode-platform/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: powernode-platform/frontend
        run: npm ci

      # Same node_modules-symlink dance as the frontend-jest job —
      # tsc also resolves modules via the standard upward walk and
      # would fail to find @types/* + react-dom typings without it.
      - name: Symlink extension frontend node_modules → parent
        working-directory: powernode-platform/extensions/system/frontend
        run: |
          rm -rf node_modules
          ln -sf ../../../frontend/node_modules node_modules
          ls -la node_modules | head -3

      - name: Type-check the system extension
        # extensions/system was MOVED into powernode-platform/extensions/system
        # by the Mount step above, so cwd must follow.
        working-directory: powernode-platform/extensions/system/frontend
        run: |
          if [ -f tsconfig.check.json ]; then
            npx --prefix ../../../frontend tsc --noEmit -p tsconfig.check.json
          else
            echo "no tsconfig.check.json — skipping (this is expected for extension-only PRs)"
          fi

  frontend-jest:
    # Mirrors frontend-typecheck's mount-into-parent layout (the extension's
    # jest.config.js extends the parent's; it cannot resolve without the parent
    # checked out at extensions/system's neighbor path). Runs the extension's
    # component/page test suite via the parent's jest runner. Per
    # project_extension_jest_infra.md, the invocation pattern is
    # `npx --prefix ../../../frontend jest --config=jest.config.js`.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: extensions/system

      - uses: actions/checkout@v4
        with:
          repository: powernode/powernode-platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
          path: powernode-platform

      - name: Mount extension into parent
        run: |
          rm -rf powernode-platform/extensions/system
          mv extensions/system powernode-platform/extensions/system

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: powernode-platform/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: powernode-platform/frontend
        run: npm ci

      # The extension's frontend dir intentionally doesn't ship its own
      # node_modules — locally validate.sh symlinks it to the parent's
      # node_modules and the symlink is .gitignored (line 48 of
      # extensions/system/.gitignore). CI has to recreate the same
      # symlink after npm ci runs, so jest's babel-loader can resolve
      # @babel/preset-env (and other presets) by walking up from
      # extensions/system/frontend/. Without this, babel's preset
      # resolver bails with "Cannot find module '@babel/preset-env'"
      # because the walk-up from jest.config.js's dir never reaches
      # powernode-platform/frontend/node_modules.
      - name: Symlink extension frontend node_modules → parent
        working-directory: powernode-platform/extensions/system/frontend
        run: |
          rm -rf node_modules  # in case checkout extracted a stale dir
          ln -sf ../../../frontend/node_modules node_modules
          ls -la node_modules | head -3

      - name: Run extension Jest suite
        working-directory: powernode-platform/extensions/system/frontend
        env:
          CI: "true"
        run: |
          if [ -f jest.config.js ]; then
            npx --prefix ../../../frontend jest --config=jest.config.js
          else
            echo "no jest.config.js — skipping (extension may not have a jest harness yet)"
          fi

  go-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: agent/go.sum
      # Nothing enforced gofmt, and 54 files had drifted by 2026-08-19
      # (IMP-f1c1e6d61104 follow-up). Checked BEFORE the tests so a formatting
      # failure is not buried under a test log, and with `gofmt -l` rather than
      # `-w` so CI reports rather than rewrites.
      #
      # Deliberately not `gofmt -d`: the diff for a whole-tree drift is
      # unreadable in a CI log. The file list plus the local command to fix it
      # is what an engineer actually needs.
      - name: Check gofmt
        working-directory: agent
        run: |
          if [ ! -f go.mod ]; then
            echo "agent/ has no go.mod yet — skipping"
            exit 0
          fi
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt drift in $(echo "$unformatted" | wc -l) file(s). Run: cd agent && gofmt -w ./cmd ./internal"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt clean"

      - name: Run agent tests
        working-directory: agent
        run: |
          if [ -f go.mod ]; then
            go test ./...
          else
            echo "agent/ has no go.mod yet — skipping"
          fi

  ruby-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.8
      - name: Ruby syntax check on every .rb in the extension
        run: |
          fail=0
          while IFS= read -r f; do
            ruby -c "$f" >/dev/null || { echo "syntax error: $f"; fail=1; }
          done < <(find server worker -name '*.rb' 2>/dev/null)
          exit $fail

  todo-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject unlabeled standalone TODO comments
        run: bash scripts/audit-todos.sh

  rubocop:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the system extension
        uses: actions/checkout@v4
        with:
          path: extensions/system

      - name: Check out the parent platform
        uses: actions/checkout@v4
        with:
          repository: powernode/powernode-platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
          path: powernode-platform
          # Submodules required so 'bundle install' resolves frozen lockfile
          submodules: recursive

      - name: Mount extension into parent
        run: |
          rm -rf powernode-platform/extensions/system
          mv extensions/system powernode-platform/extensions/system

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.8
          bundler-cache: true
          working-directory: powernode-platform/server

      - name: Run RuboCop on extension Ruby
        working-directory: powernode-platform/server
        run: |
          bundle exec rubocop \
            ../extensions/system/server/app \
            ../extensions/system/server/lib \
            ../extensions/system/server/spec \
            ../extensions/system/worker/app

  # Per audit plan P3.7b — run the 12 system_*_spec.rb files that landed
  # in P0.2. They live under the parent worker (worker/spec/jobs/) because
  # the extension's worker jobs are autoloaded by the parent worker app;
  # there's no separate spec harness for extension-only worker jobs.
  worker-specs:
    # No longer the last link in a port-publishing chain; that chain only
    # existed to serialise the shared 6379/5432 bindings, which are gone.
    needs: ci-hygiene
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Worker startup hard-requires these two env vars. Empty values
      # abort the process before spec loading even begins:
      #   ERROR [WORKER] Missing required environment variables: WORKER_ID, JWT_SECRET_KEY
      # Both are only used inside the test process, so deterministic
      # non-secret strings are fine — production rotates these from
      # Vault. Don't reuse a known-rotated value here.
      WORKER_ID: ci-worker-ephemeral
      JWT_SECRET_KEY: ci-jwt-secret-not-for-prod
    steps:
      # Sidecars are started HERE, by hand, instead of in a `services:` block.
      # A services: sidecar can only publish a FIXED host port, and a fixed
      # port means one run at a time on a shared runner host: run 1772 held
      # 5432 from 02:17 to 03:28 and run 1773's three database jobs each died
      # inside 23 seconds on "Bind for 0.0.0.0:5432 failed: port is already
      # allocated", with no rspec output at all. `-p <gw>::<port>` asks the
      # kernel for a free port instead, atomically, per socket — so concurrent
      # jobs cannot collide by construction. Proven on run 1776: two entries
      # started together took 32768/32770 and 32769/32771 while run 1775 held
      # the fixed 5432 on develop.
      #
      # The mapped port is read back with `docker port`, which needs nothing
      # from the runner beyond the docker socket already mounted in job
      # containers. That is why this is not an ephemeral `services:` port:
      # reading one back there would need `${{ }}` inside the services block,
      # which fails UNSAFE if unsupported (the literal string becomes the
      # port), or the untried job.services context.
      #
      # Addressing is unchanged — the job container reaches the sidecar at the
      # docker bridge gateway, not localhost and not by service name; see the
      # git history of this file for the two runs that ruled those out. The
      # gateway is now discovered rather than assumed, with the old hardcoded
      # value as fallback (run 1776 confirmed they agree).
      - name: Start isolated sidecars on kernel-assigned ports
        run: |
          set -euo pipefail
          GW=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}' 2>/dev/null || true)
          GW=${GW:-172.17.0.1}
          OWNER="${GITHUB_RUN_ID:-norun}-${GITHUB_JOB:-nojob}-$(date +%s)-$RANDOM"
          # Labels, not ports, are how ci-hygiene identifies a reapable orphan.
          # The deadline is this job's own ceiling, so a sidecar is only ever
          # reaped after the job that owns it could not still be running.
          DEADLINE=$(( $(date +%s) + 9000 ))
          LABELS="--label powernode.ci=sidecar --label powernode.ci.owner=$OWNER --label powernode.ci.deadline=$DEADLINE"

          RD=$(docker run -d $LABELS -p "$GW::6379" redis:7 --save '' --appendonly no)

          RDPORT=$(docker port "$RD" 6379/tcp | head -1 | awk -F: '{print $NF}')
          [ -n "$RDPORT" ] || { echo "sidecar published no port"; exit 1; }
          echo "sidecar: redis $GW:$RDPORT  owner=$OWNER"

          { echo "REDIS_URL=redis://$GW:$RDPORT/0"
            echo "CI_SIDECAR_OWNER=$OWNER"; } >> "$GITHUB_ENV"

      - name: Check out the system extension
        uses: actions/checkout@v4
        with:
          path: extensions/system

      - name: Check out the parent platform
        uses: actions/checkout@v4
        with:
          repository: powernode/powernode-platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
          path: powernode-platform
          submodules: recursive

      - name: Mount extension into parent
        run: |
          rm -rf powernode-platform/extensions/system
          mv extensions/system powernode-platform/extensions/system

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.8
          bundler-cache: true
          working-directory: powernode-platform/worker

      - name: Run system worker job specs
        working-directory: powernode-platform/worker
        run: |
          # Run only the system_*_spec.rb files. Other parent-worker jobs
          # (ai_*, mission_*, etc.) are out of this extension's scope.
          bash ../extensions/system/scripts/ci-rspec.sh spec/jobs/system_*_spec.rb --format progress

      # Removes exactly this job's sidecars, by owner label. Nothing here
      # matches on a port or an image, so it can never reach a concurrent
      # job's containers — which is what the old port/image sweep did.
      # A job that executed ZERO examples must not report a bare `failure`
      # alongside genuine test failures — that is what made run 1773 unreadable.
      # `if: always()` so it still speaks when an earlier step died, which is
      # precisely the case worth naming.
      - name: Assert this job actually ran examples
        if: always()
        run: |
          # "Mount extension into parent" mv's the checkout, so resolve either
          # location — this step runs even when that step never happened.
          s=powernode-platform/extensions/system/scripts/ci-assert-examples-ran.sh
          [ -f "$s" ] || s=extensions/system/scripts/ci-assert-examples-ran.sh
          bash "$s" worker-specs

      - name: Remove this job's sidecars
        if: always()
        run: |
          set +e
          docker ps -aq --filter "label=powernode.ci.owner=${CI_SIDECAR_OWNER:-none-set}" | xargs -r docker rm -f
          exit 0
