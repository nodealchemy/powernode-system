# Platform modules build pipeline — builds each module in
# modules/*/ into an OCI artifact + composefs blob,
# signs with cosign, and pushes to the Gitea registry under
# powernode/<module-name>:<version>.
#
# Triggered by:
#   - workflow_dispatch (operator-initiated rebuild of all or one module)
#   - push to develop/master touching modules/**
#   - tag push v*.*.* (release builds — signed for production)
#
# Two-stage build per module:
#   Stage 1 (builder): templates/module-repo/Containerfile + apt-install
#                      from manifest.yaml's package_spec; layered with
#                      this module's rootfs/.
#   Stage 2 (composer): rsync filter from file_spec + mask + protected_spec,
#                       mkcomposefs, fs-verity merkle root, cosign sign,
#                       oras push.
#
# This workflow is the canonical M1 entry point for the platform's own
# modules — third-party modules use the per-repo workflow at
# templates/module-repo/.gitea/workflows/build.yaml.
#
# Plan reference: P8.2 (Containerfiles per module + M1 supply-chain
# glue from Golden Eclipse M1).

name: build-platform-modules

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Single module slug to rebuild (default: all)"
        required: false
        type: string
        default: ""
      tag:
        description: "Version tag for the published artifact (e.g. v1.0.0)"
        required: false
        type: string
        default: ""
  push:
    branches: [ develop, master ]
    paths:
      - "modules/**"
      - "templates/module-repo/Containerfile"
      - ".gitea/workflows/build-platform-modules.yaml"
  release:
    types: [ published ]

permissions:
  contents: read
  id-token: write    # cosign keyless via Sigstore Fulcio
  packages: write    # oras push

jobs:
  # Static matrix — Gitea Actions 1.x doesn't reliably substitute
  # ${{ matrix.foo }} when matrix is provided via fromJson(needs.x.outputs.y)
  # from a previous job (the values resolve to empty strings, breaking
  # every per-module step). Static enumeration is the workaround; the
  # tradeoff is that adding a new module here must accompany the new
  # modules/<name>/manifest.yaml in the same PR. The complete list is
  # defined once in modules/ on disk; the workflow mirrors it.
  build:
    runs-on: ubuntu-24.04
    # `runs-on` is just a label in Gitea Actions 1.x — it doesn't control
    # the actual environment. The underlying runner image happens to be
    # Debian-based without composefs/fsverity-utils. Force a real Ubuntu
    # 24.04 container so the apt-install step below finds the packages.
    container:
      image: docker.io/library/ubuntu:24.04
    # Gitea Actions defaults `run:` steps to `sh -e {0}` which doesn't
    # support `set -o pipefail`. Force bash so every step gets the
    # strict-mode triad (errexit + nounset + pipefail). Ubuntu 24.04
    # ships bash by default.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        module:
          - powernode-base-ruby
          - powernode-extension-system
          - powernode-hub-backend
          - powernode-hub-frontend
          - powernode-hub-worker
          - powernode-log-forwarder
          - powernode-node-exporter
          - powernode-pg-replica
          - powernode-postgres
          - powernode-redis
          - powernode-reverse-proxy
          - powernode-storage-tools
    steps:
      # Bootstrap the container with all the tooling the workflow needs.
      # `actions/checkout@v4` is intentionally skipped — it pulls in a
      # node runtime requirement (the action is a Node.js bundle) which
      # adds ~80MB of base image surface for one git clone. A raw
      # `git clone` does the same job in two seconds AND keeps the
      # container Debian-base-image clean.
      - name: Install build tools (git + buildah + composefs + squashfs + fsverity + cosign + oras)
        run: |
          set -euo pipefail
          # The Gitea runner mounts base Ubuntu 24.04. Install the
          # OCI-layer + content-addressed-FS + signing toolchain here.
          # ~30s per matrix entry, but avoids baking a custom runner
          # image (which is its own ops chore).
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q
          apt-get install -y --no-install-recommends \
            git \
            buildah \
            composefs \
            squashfs-tools \
            fsverity-utils \
            jq \
            rsync \
            python3-yaml \
            ca-certificates \
            curl \
            tar

      - name: Clone repo (full history for cosign provenance)
        env:
          # Gitea injects GITHUB_TOKEN for workflows running on private
          # repos. Threading it through the clone URL covers the
          # private-mirror case without an SSH key in the runner.
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Gitea Actions usually pre-allocates GITHUB_WORKSPACE; if the
          # dir is empty (no checkout action ran), clone into it.
          # safe.directory='*' silences the dubious-ownership warning
          # that surfaces when uid mismatches inside containers.
          git config --global --add safe.directory '*'
          ws="${GITHUB_WORKSPACE:-/workspace/${GITHUB_REPOSITORY}}"
          mkdir -p "$ws"
          # Construct the clone URL with token auth when GIT_TOKEN is
          # set (private repos); fall back to anonymous HTTPS for
          # public repos.
          base="${GITHUB_SERVER_URL:-https://git.ipnode.org}"
          if [ -n "${GIT_TOKEN:-}" ]; then
            clone_url="${base/https:\/\//https://x-access-token:${GIT_TOKEN}@}/${GITHUB_REPOSITORY}.git"
          else
            clone_url="${base}/${GITHUB_REPOSITORY}.git"
          fi
          # Clone into a temp dir then move so GITHUB_WORKSPACE retains
          # any prior mount-points Gitea set up. fetch-depth=0 keeps the
          # full git history for cosign keyless provenance.
          tmp="$(mktemp -d)"
          git clone "${clone_url}" "$tmp/repo"
          cp -a "$tmp/repo/." "$ws/"
          rm -rf "$tmp"
          cd "$ws"
          git checkout "${GITHUB_SHA}"

      - name: Install signing toolchain (cosign + oras)
        run: |
          set -euo pipefail
          # cosign — Sigstore keyless signing. Pin to a known-good release.
          COSIGN_VERSION="2.4.1"
          curl -fsSL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
            -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
          # oras — OCI Registry as Storage. Pin to 1.2.0 (matches the
          # `oras push --artifact-type` flag shape we use below).
          ORAS_VERSION="1.2.0"
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin oras
          chmod +x /usr/local/bin/oras
          # Sanity print
          buildah --version
          mkcomposefs --version || true
          fsverity --version
          cosign version | head -1
          oras version | head -1

      - name: Parse manifest for ${{ matrix.module }}
        id: manifest
        run: |
          set -euo pipefail
          mfpath="modules/${{ matrix.module }}/manifest.yaml"
          # Extract the fields the builder stage needs. yq is preferred;
          # fall back to python if not available on the runner.
          if command -v yq >/dev/null 2>&1; then
            yq -o=json '.' "$mfpath" > /tmp/manifest.json
          else
            python3 -c "import yaml,json,sys; json.dump(yaml.safe_load(open('$mfpath')), sys.stdout)" > /tmp/manifest.json
          fi
          jq -r '.package_spec[]?' /tmp/manifest.json > /tmp/package_spec.txt
          # rsync filter: drop anything in mask, keep anything in
          # file_spec, otherwise exclude.
          {
            jq -r '.mask[]?' /tmp/manifest.json | awk '{print "- " $0}'
            jq -r '.file_spec[]?' /tmp/manifest.json | awk '{print "+ " $0}'
            jq -r '.protected_spec[]?' /tmp/manifest.json | awk '{print "+ " $0}'
            echo "- *"
          } > /tmp/rsync_spec.txt
          # APT snapshot pin if declared.
          snapshot=$(jq -r '.build.apt_snapshot // "20260415T000000Z"' /tmp/manifest.json)
          echo "apt_snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          # Module-name slug (alphanumeric + hyphens) for image tag.
          echo "slug=${{ matrix.module }}" >> "$GITHUB_OUTPUT"

      - name: Stage 1 — builder image (apt install package_spec)
        run: |
          set -euo pipefail
          cp /tmp/package_spec.txt modules/${{ matrix.module }}/package_spec.txt
          buildah bud \
            --file templates/module-repo/Containerfile \
            --build-arg APT_SNAPSHOT=${{ steps.manifest.outputs.apt_snapshot }} \
            --tag powernode-${{ matrix.module }}-builder:ci \
            modules/${{ matrix.module }}/
        env:
          STORAGE_DRIVER: vfs    # rootless-safe; CI runners don't have overlayfs

      - name: Stage 2 — composer (rsync filter + mkcomposefs + mksquashfs + fs-verity)
        run: |
          set -euo pipefail
          # 1. Mount the stage-1 image so we can rsync out of it
          mountpoint=$(buildah mount powernode-${{ matrix.module }}-builder:ci)
          # 2. Apply rsync filter to carve the slim module rootfs
          mkdir -p /tmp/slim
          rsync -a \
            --filter='. /tmp/rsync_spec.txt' \
            --filter='+ */' \
            "$mountpoint/" /tmp/slim/
          # 3. Layer the module's static rootfs/ contents on top
          if [ -d "modules/${{ matrix.module }}/rootfs" ]; then
            rsync -a modules/${{ matrix.module }}/rootfs/ /tmp/slim/
          fi
          # 4a. mkcomposefs — composefs metadata image + shared CAS
          # (requires the runner kernel >= 6.5 with composefs enabled)
          mkcomposefs --digest-store=/tmp/objects /tmp/slim /tmp/${{ matrix.module }}.cfs
          CFS_ROOT=$(fsverity digest --hash-alg=sha256 /tmp/${{ matrix.module }}.cfs | awk '{print $1}')
          CFS_SIZE=$(stat -c%s /tmp/${{ matrix.module }}.cfs)
          {
            echo "fsverity_root=$CFS_ROOT"
            echo "size=$CFS_SIZE"
          } > /tmp/${{ matrix.module }}.composefs.meta
          # 4b. mksquashfs — universal lowerdir for kernels without
          # composefs (every Ubuntu LTS up to 24.04 ships overlayfs +
          # squashfs but disables composefs). Captures the same /tmp/slim
          # tree so the runtime view is identical across both paths.
          # zstd compression balances speed + ratio; -all-root keeps
          # ownership stable across hosts; -noappend ensures a clean
          # rebuild rather than incremental update.
          mksquashfs /tmp/slim /tmp/${{ matrix.module }}.sqfs \
            -comp zstd -no-progress -all-root -noappend
          SQFS_ROOT=$(fsverity digest --hash-alg=sha256 /tmp/${{ matrix.module }}.sqfs | awk '{print $1}')
          SQFS_SIZE=$(stat -c%s /tmp/${{ matrix.module }}.sqfs)
          {
            echo "fsverity_root=$SQFS_ROOT"
            echo "size=$SQFS_SIZE"
          } > /tmp/${{ matrix.module }}.squashfs.meta

      - name: Cosign sign + oras push (both formats)
        id: push
        run: |
          set -euo pipefail
          # Tag = workflow input, else commit SHA short.
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG=$(git rev-parse --short HEAD); fi
          REGISTRY_NS="git.ipnode.org/powernode"
          # Format-tagged refs let each artifact have its own cosign
          # signature + lifecycle. Every published module ships in BOTH
          # formats — agents detect at startup which one to mount and
          # request that format via the ModulesController#show response.
          COMPOSEFS_REF="${REGISTRY_NS}/${{ matrix.module }}:${TAG}-composefs"
          SQUASHFS_REF="${REGISTRY_NS}/${{ matrix.module }}:${TAG}-squashfs"

          # Composefs — metadata-image + shared CAS for kernels that
          # support it (Fedora 39+, custom-kernel Ubuntu, etc.).
          oras push "$COMPOSEFS_REF" \
            --artifact-type application/vnd.powernode.module.v1 \
            "/tmp/${{ matrix.module }}.cfs:application/vnd.powernode.composefs" \
            "/tmp/${{ matrix.module }}.composefs.meta:application/vnd.powernode.module.meta"
          cosign sign --yes "$COMPOSEFS_REF"

          # Squashfs — self-contained loop-mountable image for every
          # kernel with overlayfs + squashfs (Ubuntu 24.04 stock,
          # Debian, every cloud VM image).
          oras push "$SQUASHFS_REF" \
            --artifact-type application/vnd.powernode.module.v1 \
            "/tmp/${{ matrix.module }}.sqfs:application/vnd.powernode.squashfs" \
            "/tmp/${{ matrix.module }}.squashfs.meta:application/vnd.powernode.module.meta"
          cosign sign --yes "$SQUASHFS_REF"

          echo "composefs_ref=$COMPOSEFS_REF" >> "$GITHUB_OUTPUT"
          echo "squashfs_ref=$SQUASHFS_REF"  >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          ORAS_REGISTRY_USERNAME: ${{ secrets.GITEA_REGISTRY_USERNAME }}
          ORAS_REGISTRY_PASSWORD: ${{ secrets.GITEA_REGISTRY_PASSWORD }}
          COSIGN_EXPERIMENTAL: "1"

      - name: Notify platform — module published
        if: success()
        run: |
          # POSTs both artifact refs so the platform's ingest service
          # records them into NodeModuleVersion.artifacts JSONB. The
          # webhook handler verifies cosign signatures + populates one
          # entry per format. Both formats are mandatory for every
          # module — partial publishes fail the publication.
          CFS_ROOT=$(grep '^fsverity_root=' /tmp/${{ matrix.module }}.composefs.meta | cut -d= -f2)
          CFS_SIZE=$(grep '^size=' /tmp/${{ matrix.module }}.composefs.meta | cut -d= -f2)
          SQFS_ROOT=$(grep '^fsverity_root=' /tmp/${{ matrix.module }}.squashfs.meta | cut -d= -f2)
          SQFS_SIZE=$(grep '^size=' /tmp/${{ matrix.module }}.squashfs.meta | cut -d= -f2)
          payload=$(jq -nc \
            --arg name      "${{ matrix.module }}" \
            --arg tag       "${{ steps.push.outputs.tag }}" \
            --arg cfs_ref   "${{ steps.push.outputs.composefs_ref }}" \
            --arg cfs_root  "$CFS_ROOT" \
            --arg cfs_size  "$CFS_SIZE" \
            --arg sqfs_ref  "${{ steps.push.outputs.squashfs_ref }}" \
            --arg sqfs_root "$SQFS_ROOT" \
            --arg sqfs_size "$SQFS_SIZE" \
            '{
               module_name: $name,
               tag:         $tag,
               artifacts: {
                 composefs: {
                   oci_ref:       $cfs_ref,
                   fsverity_root: $cfs_root,
                   size:          ($cfs_size | tonumber),
                   media_type:    "application/vnd.powernode.composefs"
                 },
                 squashfs: {
                   oci_ref:       $sqfs_ref,
                   fsverity_root: $sqfs_root,
                   size:          ($sqfs_size | tonumber),
                   media_type:    "application/vnd.powernode.squashfs"
                 }
               }
             }')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.POWERNODE_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "${{ secrets.POWERNODE_WEBHOOK_URL }}/api/v1/system/module_publications"
