# Platform modules build pipeline — builds each module in
# modules/*/ into an OCI artifact + composefs blob,
# signs with cosign, and pushes to the Gitea registry under
# powernode/<module-name>:<version>.
#
# Triggered by:
#   - workflow_dispatch (operator-initiated rebuild of all or one module)
#   - push to develop/master touching modules/**
#   - tag push v*.*.* (release builds — signed for production)
#
# Two-stage build per module:
#   Stage 1 (builder): templates/module-repo/Containerfile + apt-install
#                      from manifest.yaml's package_spec; layered with
#                      this module's rootfs/.
#   Stage 2 (composer): rsync filter from file_spec + mask + protected_spec,
#                       mkcomposefs, fs-verity merkle root, cosign sign,
#                       oras push.
#
# This workflow is the canonical M1 entry point for the platform's own
# modules — third-party modules use the per-repo workflow at
# templates/module-repo/.gitea/workflows/build.yaml.
#
# Plan reference: P8.2 (Containerfiles per module + M1 supply-chain
# glue from Golden Eclipse M1).

name: build-platform-modules

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Single module slug to rebuild (default: all)"
        required: false
        type: string
        default: ""
      tag:
        description: "Version tag for the published artifact (e.g. v1.0.0)"
        required: false
        type: string
        default: ""
      base_sha:
        description: "Diff base for dirty-closure detection (default: parent commit)"
        required: false
        type: string
        default: ""
      force_all:
        description: "Skip dirty-closure detection and rebuild every module"
        required: false
        type: boolean
        default: false
      apt_drift_check:
        description: "Enable apt-closure drift detection (probes upstream apt for version changes)"
        required: false
        type: boolean
        default: false
  push:
    branches: [ develop, master ]
    paths:
      - "modules/**"
      - "templates/module-repo/Containerfile"
      - ".gitea/workflows/build-platform-modules.yaml"
      # Agent source changes must trigger a rebuild because
      # powernode-system-base's Stage 1.5 cross-compiles the agent
      # binary into its rootfs. Without this filter, an agent fix
      # would land in the repo but the in-fleet binary (baked into
      # system-base's erofs) would still be the old one until someone
      # bumped a module manifest.
      - "agent/**"
  release:
    types: [ published ]

permissions:
  contents: read
  id-token: write    # cosign keyless via Sigstore Fulcio
  packages: write    # oras push

jobs:
  # Static matrix — Gitea Actions 1.x doesn't reliably substitute
  # ${{ matrix.foo }} when matrix is provided via fromJson(needs.x.outputs.y)
  # from a previous job (the values resolve to empty strings, breaking
  # every per-module step). Static enumeration is the workaround; the
  # tradeoff is that adding a new module here must accompany the new
  # modules/<name>/manifest.yaml in the same PR. The complete list is
  # defined once in modules/ on disk; the workflow mirrors it.
  build:
    runs-on: ubuntu-24.04
    # `runs-on` is just a label in Gitea Actions 1.x — the actual
    # container is set below. Use Debian Trixie because:
    #   - composefs (userspace + tools) ships in Trixie's main repo
    #   - fsverity-utils ships in Trixie's main repo
    #   - both are missing from Ubuntu 24.04 (Noble), even after the
    #     `composefs` apt name landed upstream — Canonical hadn't
    #     backported it at LTS-cut time.
    # Trixie's apt layout has everything we need without PPAs or
    # source builds.
    container:
      image: docker.io/library/debian:trixie-slim
    # Gitea Actions defaults `run:` steps to `sh -e {0}` which doesn't
    # support `set -o pipefail`. Force bash so every step gets the
    # strict-mode triad (errexit + nounset + pipefail). Ubuntu 24.04
    # ships bash by default.
    defaults:
      run:
        shell: bash
    strategy:
      # fail-fast: true so the first failure (e.g. a broken notify step,
      # a manifest schema regression) auto-cancels the remaining matrix
      # entries instead of grinding through all 12 modules serially.
      # Cuts wasted CI time when a systemic problem hits — the cost of
      # losing diagnostic info on later modules is acceptable because
      # the failure pattern almost always repeats across the matrix.
      # Operators iterate faster: fix → push → see result in ~5 min
      # instead of ~50 min.
      fail-fast: true
      matrix:
        module:
          # Powernode-platform-specific (hub Rails app + agent runtime):
          - powernode-extension-system
          - powernode-hub-backend
          - powernode-hub-frontend
          - powernode-hub-worker
          - powernode-system-base
          # General-purpose modules — any service can depend on these
          # via capability tags (database.postgres, cache.redis, etc.).
          # Renamed from powernode-* prefix during the 2026-05-24
          # generalization pass to reflect their reusability across
          # future templates beyond powernode-hub. See modules' manifest
          # provides: blocks for the capability tags they export.
          - postgres-primary
          - postgres-replica
          - redis
          - reverse-proxy-traefik
          - log-forwarder-vector
          - node-exporter
          - storage-tools
          - runtime-ruby
          # PVE / qemu integration. qga is a single apt-installed binary
          # that talks to PVE over virtio-serial; safe to deploy on every
          # host (the binary exits cleanly when /dev/virtio-ports/... is
          # absent, so non-PVE hosts no-op). Listed in powernode-hub
          # template (db/seeds/powernode_platform_templates.rb:47).
          - qemu-guest-agent
          # OS-base layered family: minimal substrate (powernode-system-base
          # above, provides the agent binary) + os-specific userland that
          # provides `base.os` capability. Future variants like
          # base-os-debian-trixie + base-os-alpine follow the same pattern.
          - base-os-ubuntu-noble
    steps:
      # Bootstrap the container with all the tooling the workflow needs.
      # `actions/checkout@v4` is intentionally skipped — it pulls in a
      # node runtime requirement (the action is a Node.js bundle) which
      # adds ~80MB of base image surface for one git clone. A raw
      # `git clone` does the same job in two seconds AND keeps the
      # container Debian-base-image clean.
      - name: Install build tools (git + mmdebstrap + erofs-utils + fsverity + cosign + oras)
        run: |
          set -euo pipefail
          # The Gitea runner container is Debian Trixie. Install the
          # rootfs bootstrap + read-only-FS + signing toolchain here.
          # ~30s per matrix entry, but avoids baking a custom runner
          # image (which is its own ops chore).
          #
          # mmdebstrap replaces buildah for the rootfs build step.
          # buildah needed CLONE_NEWUSER which the Gitea Actions
          # container can't grant (kernel's unprivileged userns gate
          # is off, --privileged in container.options doesn't make it
          # through). mmdebstrap in --mode=root just chroots; no
          # namespaces, no userns.
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q
          apt-get install -y --no-install-recommends \
            git \
            mmdebstrap \
            arch-test \
            ubuntu-keyring \
            erofs-utils \
            fsverity \
            jq \
            rsync \
            python3-yaml \
            ca-certificates \
            curl \
            gnupg \
            tar

      - name: Clone repo (full history for cosign provenance)
        env:
          # Gitea injects GITHUB_TOKEN for workflows running on private
          # repos. Threading it through the clone URL covers the
          # private-mirror case without an SSH key in the runner.
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Gitea Actions usually pre-allocates GITHUB_WORKSPACE; if the
          # dir is empty (no checkout action ran), clone into it.
          # safe.directory='*' silences the dubious-ownership warning
          # that surfaces when uid mismatches inside containers.
          git config --global --add safe.directory '*'
          ws="${GITHUB_WORKSPACE:-/workspace/${GITHUB_REPOSITORY}}"
          mkdir -p "$ws"
          # Construct the clone URL with token auth when GIT_TOKEN is
          # set (private repos); fall back to anonymous HTTPS for
          # public repos.
          base="${GITHUB_SERVER_URL:-https://git.ipnode.org}"
          if [ -n "${GIT_TOKEN:-}" ]; then
            clone_url="${base/https:\/\//https://x-access-token:${GIT_TOKEN}@}/${GITHUB_REPOSITORY}.git"
          else
            clone_url="${base}/${GITHUB_REPOSITORY}.git"
          fi
          # Clone into a temp dir then move so GITHUB_WORKSPACE retains
          # any prior mount-points Gitea set up. fetch-depth=0 keeps the
          # full git history for cosign keyless provenance.
          tmp="$(mktemp -d)"
          git clone "${clone_url}" "$tmp/repo"
          cp -a "$tmp/repo/." "$ws/"
          rm -rf "$tmp"
          cd "$ws"
          git checkout "${GITHUB_SHA}"

      - name: Install signing toolchain (cosign + oras)
        run: |
          set -euo pipefail
          # cosign — Sigstore keyless signing. Pin to a known-good release.
          COSIGN_VERSION="2.4.1"
          curl -fsSL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
            -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
          # oras — OCI Registry as Storage. Pin to 1.2.0 (matches the
          # `oras push --artifact-type` flag shape we use below).
          ORAS_VERSION="1.2.0"
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin oras
          chmod +x /usr/local/bin/oras
          # Sanity print
          mmdebstrap --version || true
          mkfs.erofs --version || true
          fsverity --version
          cosign version | head -1
          oras version | head -1

      - name: Compute dirty closure (per-module path filter + apt drift)
        # Runs once per matrix entry — cheap (mostly manifest parsing +
        # git diff). Writes DIRTY_MODULES to GITHUB_ENV so every
        # subsequent step can gate on whether this matrix entry's module
        # is in the closure. Skips the closure check entirely when
        # workflow_dispatch.force_all=true (operator-initiated full
        # rebuild) or when the workflow can't determine a sane diff base.
        id: closure
        env:
          # Operator-supplied diff base via workflow_dispatch input takes
          # precedence; otherwise let the script use its own resolution
          # chain (GITEA_EVENT_BEFORE / GITHUB_BASE_SHA / HEAD~1).
          OPERATOR_BASE_SHA: ${{ inputs.base_sha }}
          FORCE_ALL: ${{ inputs.force_all }}
          APT_DRIFT_CHECK: ${{ inputs.apt_drift_check && '1' || '0' }}
        run: |
          set -euo pipefail
          if [[ "${FORCE_ALL:-false}" == "true" ]]; then
            echo "[closure] FORCE_ALL=true — every module marked dirty"
            DIRTY=$(ls -1 modules/ | xargs)
          else
            # The script accepts BASE_SHA HEAD_SHA as positional args.
            # When the operator didn't supply one, fall through to
            # the script's own GITEA_EVENT_BEFORE / HEAD~1 resolver.
            if [[ -n "${OPERATOR_BASE_SHA:-}" ]]; then
              DIRTY=$(bash scripts/ci-compute-dirty-closure.sh \
                "${OPERATOR_BASE_SHA}" "${GITHUB_SHA}" | xargs)
            else
              DIRTY=$(bash scripts/ci-compute-dirty-closure.sh | xargs)
            fi
          fi
          # Pad with leading + trailing space so substring-match in
          # downstream `if: contains()` doesn't get false positives
          # ("redis" matching "redis-cluster" etc.).
          PADDED=" $DIRTY "
          echo "DIRTY_MODULES=$PADDED" >> "$GITHUB_ENV"
          echo "[closure] dirty modules: $DIRTY"
          # Echo per-matrix-entry decision so the run log shows skip
          # rationale without having to cross-reference DIRTY_MODULES.
          if [[ "$PADDED" == *" ${{ matrix.module }} "* ]]; then
            echo "[closure] BUILD ${{ matrix.module }} — in closure"
          else
            echo "[closure] SKIP ${{ matrix.module }} — not in closure"
          fi

      - name: Parse manifest for ${{ matrix.module }}
        # Skip when this matrix entry's module isn't in the dirty closure.
        # The pad+contains pattern (leading + trailing space around the
        # needle) prevents false positives where "redis" matches inside
        # "redis-cluster" etc.
        if: contains(env.DIRTY_MODULES, format(' {0} ', matrix.module))
        id: manifest
        run: |
          set -euo pipefail
          mfpath="modules/${{ matrix.module }}/manifest.yaml"
          # Extract the fields the builder stage needs. yq is preferred;
          # fall back to python if not available on the runner.
          if command -v yq >/dev/null 2>&1; then
            yq -o=json '.' "$mfpath" > /tmp/manifest.json
          else
            python3 -c "import yaml,json,sys; json.dump(yaml.safe_load(open('$mfpath')), sys.stdout)" > /tmp/manifest.json
          fi
          jq -r '.package_spec[]?' /tmp/manifest.json > /tmp/package_spec.txt
          # rsync filter: drop anything in mask, keep anything in
          # file_spec, otherwise exclude.
          {
            jq -r '.mask[]?' /tmp/manifest.json | awk '{print "- " $0}'
            jq -r '.file_spec[]?' /tmp/manifest.json | awk '{print "+ " $0}'
            jq -r '.protected_spec[]?' /tmp/manifest.json | awk '{print "+ " $0}'
            echo "- *"
          } > /tmp/rsync_spec.txt
          # APT snapshot pin if declared.
          snapshot=$(jq -r '.build.apt_snapshot // "20260415T000000Z"' /tmp/manifest.json)
          echo "apt_snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          # Module-name slug (alphanumeric + hyphens) for image tag.
          echo "slug=${{ matrix.module }}" >> "$GITHUB_OUTPUT"

      - name: Stage 1 — bootstrap fat rootfs (mmdebstrap + package_spec)
        if: contains(env.DIRTY_MODULES, format(' {0} ', matrix.module))
        run: |
          set -euo pipefail
          # mmdebstrap produces a minimal Ubuntu noble rootfs at
          # /tmp/fat with `ca-certificates` + every package the
          # module's manifest declared in package_spec. --mode=root
          # avoids any namespace setup (we're running as root inside
          # the Trixie CI container).
          #
          # The mmdebstrap output is functionally identical to what
          # `buildah bud` against templates/module-repo/Containerfile
          # produced — pinned base image + apt install + static
          # ca-certs. We trade buildah's OCI-runtime isolation for a
          # plain chroot, which is fine for the CI hermeticity envelope
          # (the runner container itself is the security boundary).
          base_url="http://archive.ubuntu.com/ubuntu/"
          pkgs="ca-certificates"
          if [ -s /tmp/package_spec.txt ]; then
            pkgs="${pkgs},$(tr '\n' ',' < /tmp/package_spec.txt | sed 's/,$//')"
          fi

          # Some modules declare packages that aren't in Ubuntu's main/universe:
          #   - log-forwarder-vector ships `vector` (Timber/Datadog apt repo)
          #   - storage-tools ships `gcsfuse` (Google Cloud apt repo)
          # For those modules, register the upstream apt source + key via an
          # --essential-hook so the package is resolvable when mmdebstrap's
          # --include step runs. Hook executes after essential packages
          # install but BEFORE the manifest's package_spec packages.
          hook_args=()
          mkdir -p /tmp/hooks
          case "${{ matrix.module }}" in
            log-forwarder-vector)
              # Post-Datadog-acquisition, vector's apt key moved to
              # keys.datadoghq.com (DATADOG_APT_KEY_CURRENT.public) and
              # the legacy https://apt.vector.dev/vector.gpg returns 404.
              # The repo line is also `vector-<major>` not `main` per
              # vector's setup.vector.dev install script. Without these
              # updates the hook dies with: "gpg: not found" (fixed via
              # gnupg install above) + "curl: 404" (this URL change).
              cat > /tmp/hooks/essential00-vector-source.sh <<'EOF'
          #!/bin/sh
          # At essential-hook stage apt isn't yet installed in the chroot
          # (it comes in via mmdebstrap's --include pass that runs AFTER
          # this hook). Just drop the key + sources.list into place; the
          # subsequent apt-get pass will see them. Trying to chroot in
          # and apt-get update here dies with "chroot: failed to run
          # command 'apt-get': No such file or directory".
          set -eu
          ROOT="$1"
          mkdir -p "$ROOT/etc/apt/keyrings" "$ROOT/etc/apt/sources.list.d"
          curl -fsSL https://keys.datadoghq.com/DATADOG_APT_KEY_CURRENT.public | gpg --dearmor > "$ROOT/etc/apt/keyrings/vector.gpg"
          echo "deb [signed-by=/etc/apt/keyrings/vector.gpg] https://apt.vector.dev/ stable vector-0" > "$ROOT/etc/apt/sources.list.d/vector.list"
          EOF
              chmod +x /tmp/hooks/essential00-vector-source.sh
              hook_args+=("--hook-directory=/tmp/hooks")
              ;;
            storage-tools)
              cat > /tmp/hooks/essential00-gcsfuse-source.sh <<'EOF'
          #!/bin/sh
          # Same essential-hook-stage constraint as the vector hook above:
          # apt isn't yet in the chroot, so we only drop the key +
          # sources.list. mmdebstrap's --include pass will pick them up.
          set -eu
          ROOT="$1"
          mkdir -p "$ROOT/etc/apt/keyrings" "$ROOT/etc/apt/sources.list.d"
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor > "$ROOT/etc/apt/keyrings/google-cloud.gpg"
          echo "deb [signed-by=/etc/apt/keyrings/google-cloud.gpg] https://packages.cloud.google.com/apt gcsfuse-noble main" > "$ROOT/etc/apt/sources.list.d/gcsfuse.list"
          EOF
              chmod +x /tmp/hooks/essential00-gcsfuse-source.sh
              hook_args+=("--hook-directory=/tmp/hooks")
              ;;
          esac

          mmdebstrap \
            --mode=root \
            --variant=minbase \
            --components=main,universe \
            "${hook_args[@]}" \
            --include="$pkgs" \
            --keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg \
            --aptopt='Acquire::http::Pipeline-Depth "0"' \
            noble /tmp/fat \
            "$base_url"

      - name: Stage 1.5 — stage parent platform content (Class B modules)
        # Combined gate: only runs for Class B modules (the original
        # allow-list below) AND only when this matrix entry's module
        # is in the dirty closure (added 2026-05-24 as part of the
        # selective-rebuild work). A second `if:` line below would be
        # invalid YAML — both conditions must live in one expression.
        #
        # Class B modules ship source-code or vendored binaries that
        # don't come from apt. mmdebstrap left /tmp/fat with just
        # ca-certificates (since these manifests have package_spec: [])
        # — this step layers the actual deliverable on top before the
        # composer step's rsync filter trims to file_spec.
        #
        # hub-backend / hub-worker / hub-frontend / extension-system
        # need the parent powernode-platform repo (server/, worker/,
        # frontend/, extensions_loader_helper.rb, scripts/). The PAT
        # in POWERNODE_PARENT_PAT (or POWERNODE_REGISTRY_TOKEN as a
        # fallback) needs read access to that repo.
        #
        # reverse-proxy ships the vendored traefik binary that lives
        # in THIS submodule's agent/dist/.
        if: contains(env.DIRTY_MODULES, format(' {0} ', matrix.module)) && (matrix.module == 'powernode-hub-backend' || matrix.module == 'powernode-hub-worker' || matrix.module == 'powernode-hub-frontend' || matrix.module == 'powernode-extension-system' || matrix.module == 'reverse-proxy-traefik' || matrix.module == 'powernode-system-base' || matrix.module == 'base-os-ubuntu-noble')
        env:
          PARENT_PAT: ${{ secrets.POWERNODE_PARENT_PAT || secrets.POWERNODE_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-/workspace/${GITHUB_REPOSITORY}}"
          cd "$ws"

          needs_parent=0
          case "${{ matrix.module }}" in
            powernode-hub-backend|powernode-hub-worker|powernode-hub-frontend) needs_parent=1 ;;
          esac

          if [ "$needs_parent" = "1" ]; then
            parent_host="${POWERNODE_PARENT_HOST:-git.ipnode.org}"
            parent_path="${POWERNODE_PARENT_PATH:-powernode/powernode-platform}"
            clone_url="https://x-access-token:${PARENT_PAT}@${parent_host}/${parent_path}.git"
            echo "Cloning parent ${parent_host}/${parent_path}..."
            git clone --depth 1 "$clone_url" /tmp/parent
          fi

          case "${{ matrix.module }}" in
            powernode-hub-backend)
              mkdir -p /tmp/fat/opt/powernode
              rsync -a \
                --exclude='.git' --exclude='node_modules' --exclude='tmp' \
                --exclude='log' --exclude='coverage' --exclude='extensions' \
                /tmp/parent/server/ /tmp/fat/opt/powernode/server/
              # extensions_loader_helper.rb is required by the Gemfile
              cp /tmp/parent/extensions_loader_helper.rb /tmp/fat/opt/powernode/extensions_loader_helper.rb
              # Startup scripts (powernode-backend.sh etc.)
              if [ -d /tmp/parent/scripts ]; then
                rsync -a /tmp/parent/scripts/ /tmp/fat/opt/powernode/scripts/
              fi
              ;;
            powernode-hub-worker)
              mkdir -p /tmp/fat/opt/powernode
              rsync -a \
                --exclude='.git' --exclude='node_modules' --exclude='tmp' --exclude='log' \
                /tmp/parent/worker/ /tmp/fat/opt/powernode/worker/
              ;;
            powernode-hub-frontend)
              # Vite build needs node — install if missing. dist/ is
              # the only deliverable; if the build fails the module
              # still ships (just with an empty dist that traefik
              # serves a default error page from).
              mkdir -p /tmp/fat/opt/powernode/frontend/dist
              if ! command -v npm >/dev/null 2>&1; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get install -y --no-install-recommends nodejs npm || true
              fi
              if command -v npm >/dev/null 2>&1 && [ -f /tmp/parent/frontend/package.json ]; then
                (cd /tmp/parent/frontend && npm ci --no-audit --prefer-offline 2>&1 | tail -20 && npm run build 2>&1 | tail -20) || echo "frontend build failed — shipping empty dist"
                if [ -d /tmp/parent/frontend/dist ]; then
                  rsync -a /tmp/parent/frontend/dist/ /tmp/fat/opt/powernode/frontend/dist/
                fi
              else
                echo "no npm or no frontend package.json — shipping empty dist"
              fi
              ;;
            powernode-extension-system)
              # THIS submodule (powernode-system) IS the system extension.
              # Stage its server/ + extension.json into the parent's
              # extensions/system/ tree shape.
              mkdir -p /tmp/fat/opt/powernode/extensions/system
              rsync -a \
                --exclude='.git' --exclude='tmp' --exclude='log' \
                --exclude='node_modules' --exclude='coverage' \
                server/ /tmp/fat/opt/powernode/extensions/system/server/
              if [ -f extension.json ]; then
                cp extension.json /tmp/fat/opt/powernode/extensions/system/extension.json
              fi
              ;;
            reverse-proxy-traefik)
              # Traefik binary now comes from Stage 1 via package_spec:
              # [traefik] → /usr/bin/traefik. The vendored-binary path
              # under agent/dist/ was a stopgap before that; removing
              # it keeps the build hermetic (no hand-checked-in binaries
              # in git) and inherits Debian's CVE patching.
              mkdir -p /tmp/fat/etc/traefik/dynamic
              # Default static config — dynamic configs land in /etc/traefik/dynamic/
              # Use printf to avoid YAML/heredoc indent conflicts.
              printf '%s\n' \
                'api:' \
                '  dashboard: true' \
                'ping: {}' \
                'entryPoints:' \
                '  web:' \
                '    address: ":80"' \
                '  websecure:' \
                '    address: ":443"' \
                'providers:' \
                '  file:' \
                '    directory: /etc/traefik/dynamic' \
                '    watch: true' \
                'log:' \
                '  level: INFO' \
                > /tmp/fat/etc/traefik/traefik.yml
              ;;
            powernode-system-base)
              # Truly-minimal foundation: only the cross-compiled Go
              # agent + the /etc/powernode/ skeleton. No userland, no
              # init system, no apt packages — those land in
              # base-os-ubuntu-noble (or future
              # -debian-trixie, -alpine variants) which depend on
              # this module via the Powernode dependency resolver
              # and inherit /usr/sbin/powernode-agent through the
              # overlay union.
              #
              # CGO_ENABLED=0 + -trimpath + -s -w produces a static
              # binary that runs on every glibc/musl Linux without
              # additional deps — the whole point of decoupling the
              # agent from any specific base-OS.
              if ! command -v go >/dev/null 2>&1; then
                # Use the `golang-go` meta-package — Trixie's main archive
                # doesn't carry every individual golang-1.X versioned
                # package (verified by run 538 job 2689: golang-1.22 and
                # golang-1.23 both fail "Unable to locate package"). The
                # meta-package pulls in whatever Trixie's current default
                # is (1.24 at trixie release time) and installs the binary
                # at /usr/bin/go — no PATH manipulation needed. Trade-off:
                # the exact Go minor version drifts with Trixie's archive,
                # making reproducible builds depend on the apt snapshot
                # rather than an explicit pin. For deterministic builds,
                # switch to fetching the upstream go tarball from go.dev.
                apt-get install -y --no-install-recommends golang-go git
              fi
              echo "[stage-1.5] cross-compiling powernode-agent for amd64…"
              ( cd agent && \
                CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
                go build -trimpath -ldflags '-s -w' \
                  -o /tmp/powernode-agent ./cmd/powernode-agent )
              mkdir -p /tmp/fat/usr/sbin /tmp/fat/sbin /tmp/fat/etc/powernode
              install -m 0755 /tmp/powernode-agent /tmp/fat/usr/sbin/powernode-agent
              # /sbin/powernode-agent symlink — initramfs/dracut
              # hook looks at /sbin first; post-switch_root systemd
              # unit uses /usr/sbin/. Both paths kept for either
              # codepath.
              ln -sf /usr/sbin/powernode-agent /tmp/fat/sbin/powernode-agent
              ;;
            base-os-ubuntu-noble)
              # OS-specific layer: Ubuntu's apt-installed userland
              # comes from Stage 1's mmdebstrap (package_spec). The
              # rootfs/ overlay adds the Powernode-curated systemd
              # units (powernode-agent.service, ssh-host-keygen.service,
              # powernode-network-reload.service) + sshd config +
              # systemd-networkd DHCP profile.
              #
              # No agent binary baked here — it's inherited from
              # powernode-system-base via overlay union when both are
              # mounted on a node. Keeps the cross-compile in exactly
              # one place.
              #
              # /sbin/init → systemd symlink. mmdebstrap installs
              # systemd at /usr/lib/systemd/systemd. The systemd-sysv
              # package normally creates /sbin/init but in minbase
              # it may not — make it explicit so switch_root finds
              # an init binary at the conventional path.
              if [ ! -e /tmp/fat/sbin/init ]; then
                mkdir -p /tmp/fat/sbin
                ln -sf /usr/lib/systemd/systemd /tmp/fat/sbin/init
              fi
              ;;
          esac

          echo "=== /tmp/fat top-level layout after stage 1.5 ==="
          find /tmp/fat -maxdepth 3 -type d | sort | awk 'NR<=30'
          echo "=== file count ==="
          find /tmp/fat -type f | wc -l

      - name: Stage 2 — composer (rsync filter + mkfs.erofs + fs-verity)
        if: contains(env.DIRTY_MODULES, format(' {0} ', matrix.module))
        run: |
          set -euo pipefail
          # 1. Layer the module's static rootfs/ contents onto the
          # bootstrapped /tmp/fat. Anything in rootfs/ overrides the
          # apt-installed equivalent — that's how a module customizes
          # its package's defaults.
          if [ -d "modules/${{ matrix.module }}/rootfs" ]; then
            rsync -a modules/${{ matrix.module }}/rootfs/ /tmp/fat/
          fi
          # 2. Apply rsync filter to carve the slim module rootfs
          # from the fat tree. Same filter that the buildah-mounted
          # flow used.
          mkdir -p /tmp/slim
          # Filter order matters: --filter args are evaluated in CLI order
          # and FIRST MATCH WINS. The merge file ends with `- *` (exclude
          # everything not matched by an earlier `+`); if loaded first,
          # `- *` matches intermediate dirs like `opt/` by basename and
          # rsync never recurses into them. `+ */` must come FIRST so all
          # directories are kept, then the file rules carve the actual
          # contents. Without this, every Class B erofs blob ships empty
          # (4-8 KB filesystem with just the root dir).
          #
          # --prune-empty-dirs is the counter-balance: `+ */` is greedy
          # and would otherwise leave the entire fat tree's directory
          # skeleton in the slim carve (e.g. /var/lib/postgresql/16/main
          # appears as an empty 19-subdir tree because postgres's apt
          # post-install ran `pg_createcluster main 16` in /tmp/fat).
          # mkfs.erofs --all-root then bakes those root-owned empty
          # dirs into the read-only lower layer, and runtime chowns
          # against them trigger overlayfs metacopy copy-up which
          # requires CAP_SYS_ADMIN that systemd strips from per-service
          # namespaces → EPERM. Pruning empty dirs after the file rules
          # execute drops /var, /tmp, /home, etc. entirely — matching
          # the manifest's intent ("/var omitted, data dir initializes
          # on first boot into the overlay's writable upper layer").
          rsync -a \
            --filter='+ */' \
            --filter='. /tmp/rsync_spec.txt' \
            --prune-empty-dirs \
            /tmp/fat/ /tmp/slim/
          echo "=== Stage 2 carve result: /tmp/slim layout (first 40 dirs) ==="
          # awk-based truncation (NOT `| head`) — under `set -o pipefail`,
          # head exiting after N lines sends SIGPIPE upstream → sort/find
          # exit 141 → pipefail trips → whole step fails with no real
          # error. awk reads the entire stream, just prints the first N.
          find /tmp/slim -maxdepth 4 -type d | sort | awk 'NR<=40'
          echo "=== /tmp/slim file count ==="
          find /tmp/slim -type f | wc -l
          echo "=== /tmp/slim total size ==="
          du -sh /tmp/slim 2>&1 | awk 'NR==1'
          # 3. Layer the module's static rootfs/ contents on top
          if [ -d "modules/${{ matrix.module }}/rootfs" ]; then
            rsync -a modules/${{ matrix.module }}/rootfs/ /tmp/slim/
          fi
          # 4. mkfs.erofs — universal read-only lower-dir.
          #
          # erofs has been in mainline kernel since 5.4 (2019) and is
          # enabled in every distro we'd ever target — Ubuntu LTS 20.04+,
          # Debian 11+, Rocky/Alma 9+, Fedora 36+, Amazon Linux 2023,
          # Alpine. Replaces the earlier dual-format (composefs +
          # squashfs) machinery with a single artifact: erofs is
          # mounted directly via loop, supports fs-verity natively, and
          # generally produces smaller images than squashfs at the same
          # compression level thanks to tail-packing + chunked layout.
          #
          # -zlz4hc keeps decompression cheap (better than -zlzma for
          # cold-start) while still ~30-40% smaller than uncompressed.
          # --all-root keeps file ownership stable across CI runs +
          # production hosts so fs-verity hashes match.
          mkfs.erofs \
            -zlz4hc \
            --all-root \
            /tmp/${{ matrix.module }}.erofs \
            /tmp/slim
          EROFS_ROOT=$(fsverity digest --hash-alg=sha256 /tmp/${{ matrix.module }}.erofs | awk '{print $1}')
          EROFS_SIZE=$(stat -c%s /tmp/${{ matrix.module }}.erofs)
          {
            echo "fsverity_root=$EROFS_ROOT"
            echo "size=$EROFS_SIZE"
          } > /tmp/${{ matrix.module }}.erofs.meta

      - name: Cosign sign + oras push
        if: contains(env.DIRTY_MODULES, format(' {0} ', matrix.module))
        id: push
        run: |
          set -euo pipefail
          # Tag = workflow input, else commit SHA short.
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG=$(git rev-parse --short HEAD); fi
          REGISTRY_NS="git.ipnode.org/powernode"
          EROFS_REF="${REGISTRY_NS}/${{ matrix.module }}:${TAG}"
          LATEST_REF="${REGISTRY_NS}/${{ matrix.module }}:latest"

          # `oras` reads credentials from ~/.docker/config.json or
          # via explicit `oras login` — it does NOT pick up
          # ORAS_REGISTRY_USERNAME / PASSWORD env vars on its own.
          # Authenticate first so the subsequent `oras push` against
          # the private Gitea registry doesn't 401.
          oras login git.ipnode.org \
            --username "$ORAS_REGISTRY_USERNAME" \
            --password-stdin <<< "$ORAS_REGISTRY_PASSWORD"

          # Compute apt-closure-sha256 for this module so it lands on
          # the OCI artifact's annotations. The dirty-closure script's
          # drift-check mode reads this annotation on the next run to
          # decide whether to rebuild this module when its source
          # didn't change. APT_PROBE_MODE=local because the runner IS
          # debian:trixie-slim — running apt-cache here gives exactly
          # the versions Stage 1's mmdebstrap would see.
          APT_HASH=$(APT_PROBE_MODE=local \
            bash scripts/ci-compute-dirty-closure.sh \
              apt-hash "${{ matrix.module }}" 2>/dev/null || true)
          echo "[push] apt-closure-sha256 for ${{ matrix.module }}: ${APT_HASH:-<empty>}"

          # oras complains about absolute paths in source operands.
          # Run from /tmp so the file operands are bare names; the
          # registry sees them with the same shape it always has
          # (the colon-suffix is the mediaType annotation).
          cd /tmp
          ORAS_PUSH_ARGS=(
            "$EROFS_REF"
            --artifact-type application/vnd.powernode.module.v1
            "${{ matrix.module }}.erofs:application/vnd.powernode.erofs"
            "${{ matrix.module }}.erofs.meta:application/vnd.powernode.module.meta"
          )
          if [[ -n "$APT_HASH" ]]; then
            ORAS_PUSH_ARGS+=(--annotation "org.powernode.apt-closure-sha256=$APT_HASH")
          fi
          oras push "${ORAS_PUSH_ARGS[@]}"

          # Also tag this build as `:latest` so the drift-check's
          # canonical fetch (powernode/<mod>:latest) always points
          # at the newest annotation. Use `oras tag` to alias without
          # re-uploading layers.
          oras tag "$EROFS_REF" latest
          # Static-key cosign signing — keyless mode against
          # Sigstore's public-good Fulcio doesn't work for
          # Gitea-hosted CI (Gitea isn't on Fulcio's trusted-issuer
          # list). The keypair was generated via cosign generate-key-pair,
          # pushed to Gitea secrets as COSIGN_PRIVATE_KEY (encrypted at
          # rest with COSIGN_PASSWORD), COSIGN_PUBLIC_KEY, COSIGN_PASSWORD.
          # The agent verifies signatures against COSIGN_PUBLIC_KEY at
          # module attach time (see ModuleOciIngestService).
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$EROFS_REF"
          cd - >/dev/null

          echo "erofs_ref=$EROFS_REF" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          ORAS_REGISTRY_USERNAME: ${{ secrets.POWERNODE_REGISTRY_USER }}
          ORAS_REGISTRY_PASSWORD: ${{ secrets.POWERNODE_REGISTRY_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Notify platform — module published
        if: success() && contains(env.DIRTY_MODULES, format(' {0} ', matrix.module))
        run: |
          set -euo pipefail
          # POSTs the erofs artifact reference so the platform's ingest
          # service (ModulePublicationsController) records it into the
          # NodeModuleVersion.artifacts JSONB. Without this call, the
          # platform's record stays stale and the agent's reconcile
          # pulls outdated blobs — there is NO viable fallback (Gitea
          # registry pushes don't fire git-push webhooks).
          #
          # We also ship the raw manifest YAML (base64-encoded for safe
          # JSON transit) so the controller can re-apply it via
          # ManifestImportService — keeping NodeModule.{file_spec, mask,
          # services, manifest_yaml, ...} aligned with the same manifest
          # that the Stage 2 rsync filter used to carve THIS erofs blob.
          # Without this sync, the DB columns get pinned to whatever the
          # initial db:seed wrote and drift away from the manifests in
          # the source tree on every refactor.
          EROFS_ROOT=$(grep '^fsverity_root=' /tmp/${{ matrix.module }}.erofs.meta | cut -d= -f2)
          EROFS_SIZE=$(grep '^size=' /tmp/${{ matrix.module }}.erofs.meta | cut -d= -f2)
          MANIFEST_B64=$(base64 -w0 "modules/${{ matrix.module }}/manifest.yaml")
          payload=$(jq -nc \
            --arg name       "${{ matrix.module }}" \
            --arg tag        "${{ steps.push.outputs.tag }}" \
            --arg ref        "${{ steps.push.outputs.erofs_ref }}" \
            --arg root       "$EROFS_ROOT" \
            --arg size       "$EROFS_SIZE" \
            --arg manifest   "$MANIFEST_B64" \
            '{
               module_name: $name,
               tag:         $tag,
               manifest_yaml_b64: $manifest,
               artifacts: {
                 erofs: {
                   oci_ref:       $ref,
                   fsverity_root: $root,
                   size:          ($size | tonumber),
                   media_type:    "application/vnd.powernode.erofs"
                 }
               }
             }')
          API_BASE="${{ secrets.POWERNODE_API_BASE }}"
          API_BASE="${API_BASE:-https://ops.powernode.org}"
          CI_TOKEN="${{ secrets.POWERNODE_CI_WORKER_TOKEN }}"
          if [ -z "$CI_TOKEN" ]; then
            echo "::error::POWERNODE_CI_WORKER_TOKEN secret unset — cannot authenticate with platform ingest endpoint"
            exit 1
          fi

          # Pre-flight: confirm POWERNODE_API_BASE points at a live
          # platform before we publish the OCI artifact + notify. The
          # secret has historically drifted across deployments (dev
          # gets a stale ops URL, ops gets a stale staging URL, etc.)
          # and the only signal was a delayed connect-refused buried
          # in the notify-step log. HEAD /api/v1/health surfaces it
          # right at the start of Stage 3 with a clear message that
          # tells the operator EXACTLY which secret to fix.
          echo "Verifying API_BASE=$API_BASE is reachable..."
          if ! curl -fsSL -m 10 -o /dev/null -w 'health-check http=%{http_code}\n' \
                  "${API_BASE}/api/v1/health"; then
            echo "::error::POWERNODE_API_BASE=$API_BASE is not responding on /api/v1/health."
            echo "::error::  This usually means the secret POWERNODE_API_BASE has drifted out of sync"
            echo "::error::  with the actual platform deployment (e.g. pointing at a decommissioned ops"
            echo "::error::  URL, an old staging URL, or missing https:// scheme). Update the secret in"
            echo "::error::  Gitea Actions repo/org settings to the current platform URL and re-run."
            exit 1
          fi

          URL="${API_BASE}/api/v1/system/module_publications"
          echo "POSTing to $URL (token redacted)..."
          # --fail-with-body returns response body even on HTTP error so the
          # actual server-side message (auth, validation, etc.) lands in the
          # CI log instead of getting swallowed.
          if ! curl --fail-with-body -sS -X POST \
                 -H "Authorization: Bearer $CI_TOKEN" \
                 -H "Content-Type: application/json" \
                 -d "$payload" \
                 "$URL" \
                 -o /tmp/notify-response.json \
                 -w "http=%{http_code} time=%{time_total}s\n"; then
            echo "::error::Notify POST to $URL failed:"
            cat /tmp/notify-response.json 2>/dev/null || true
            echo
            echo "Payload was:"
            echo "$payload" | jq -c .
            exit 1
          fi
          echo "Response:"
          cat /tmp/notify-response.json
          echo
