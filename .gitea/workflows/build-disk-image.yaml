name: build-disk-image

# Builds operator-flashable disk images for the physical-device claim
# flow. Two artifacts:
#   - powernode-rpi4.img      (RPi 4: MBR + FAT32 boot + ext4 persist)
#   - powernode-arm64-uefi.img (Pi 5 / Ampere / generic UEFI arm64)
#
# Plan: docs/plans/wondrous-yawning-anchor.md §3.
#
# Pipeline:
#   1. Build the rpi4-firmware module (fetches Broadcom blobs at pinned ref)
#   2. Build kernel + initramfs (existing kernel-initrd variant)
#   3. Run build-disk-image-rpi4.sh + build-disk-image-arm64-uefi.sh
#   4. Compute SHA-256, cosign-sign, upload to FileStorageService via
#      the platform's worker_api/disk_images endpoint
#
# Trigger: tag push or manual dispatch. Runs on a privileged Gitea runner
# (the runner needs losetup + mount + sudo for filesystem creation).

on:
  push:
    tags:
      - 'system-disk-image/v*'
  workflow_dispatch:
    inputs:
      platform_url:
        description: "Platform URL to bake into identity.cfg"
        required: true
        default: "https://platform.example.com"
        type: string
      ca_pem_url:
        description: "URL of the platform CA chain to embed"
        required: false
        type: string
      firmware_ref:
        description: "raspberrypi/firmware ref (overrides manifest default)"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    # ubuntu-24.04 unprivileged runner. Filesystem creation uses offline
    # tools (mtools mformat/mcopy for FAT32, mkfs.ext4 -E offset for ext4)
    # so /dev/loop-control is not required. The disk-image-rpi4 script
    # produces a flashable, GPU-loader-bootable image on this runner.
    # For privileged runners (with losetup), the script auto-detects and
    # uses the loopback path instead.
    runs-on: ubuntu-24.04

    env:
      PLATFORM_URL: ${{ inputs.platform_url || 'https://platform.example.com' }}
      ARCH: arm64
      # Surface the publish-routing inputs into the job `env:` context so the
      # publish-step `if:` guards below can read them — a step's own `if:` does
      # NOT see that step's `env:`. Unset STORAGE_MODE → OCI-pull + HMAC-webhook.
      POWERNODE_STORAGE_MODE: ${{ vars.POWERNODE_STORAGE_MODE }}
      POWERNODE_DISK_IMAGE_WEBHOOK_URL: ${{ secrets.POWERNODE_DISK_IMAGE_WEBHOOK_URL }}
      POWERNODE_CI_WORKER_TOKEN: ${{ secrets.POWERNODE_CI_WORKER_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          # cosign + oras aren't in apt — fetch released binaries.
          # buildah/podman are in apt on Ubuntu 24.04.
          # util-linux is the canonical home of sfdisk; install explicitly
          # because some minimal runner images strip it. fdisk package is
          # the alternate provider on newer Ubuntu (split out in 24.04).
          sudo apt-get install -y \
            util-linux fdisk \
            dosfstools e2fsprogs gdisk \
            mtools \
            buildah podman \
            curl jq zstd
          # mtools (mformat/mcopy) lets the disk-image build script create
          # a populated FAT32 partition WITHOUT losetup — needed because
          # the runner doesn't have /dev/loop-control access. mkfs.ext4 -E
          # offset (already in e2fsprogs >= 1.42) handles the ext4 partition
          # similarly. Together they let us produce a flashable image on an
          # unprivileged runner.

          # Tool-availability diagnostic — make the next failure debuggable
          # without grovelling through full step logs. PATH is augmented
          # because Gitea runners strip /usr/sbin from non-root PATH.
          export PATH="/usr/local/sbin:/usr/sbin:/sbin:$PATH"
          echo "Tool availability:"
          for tool in sfdisk losetup mkfs.fat mkfs.ext4 mformat mcopy mdir cosign oras buildah curl jq zstd; do
            if path=$(command -v "$tool"); then
              echo "  ✓ $tool → $path"
            else
              echo "  ✗ $tool MISSING"
            fi
          done
          echo "Effective PATH: $PATH"

          # Install cosign v2.4 from upstream (apt's cosign pkg doesn't
          # exist on Ubuntu 24.04 base + we want a known-good version
          # to match the worker container per plan deferred risk #5).
          if ! command -v cosign >/dev/null 2>&1; then
            COSIGN_VERSION=2.4.1
            curl -fsSL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
              -o /tmp/cosign
            sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          fi

          # Install oras for OCI artifact push.
          if ! command -v oras >/dev/null 2>&1; then
            ORAS_VERSION=1.2.0
            curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
              -o /tmp/oras.tar.gz
            sudo tar -xzf /tmp/oras.tar.gz -C /usr/local/bin oras
            sudo chmod +x /usr/local/bin/oras
          fi

          echo "cosign $(cosign version --json 2>/dev/null | jq -r .GitVersion 2>/dev/null || cosign version 2>&1 | head -1)"
          echo "oras $(oras version | head -1)"

      - name: Set up QEMU for arm64 emulation
        # continue-on-error: ZFS-backed Docker storage drivers can't tear
        # down setup-qemu's container ('dataset is busy'). The disk-image
        # build can still proceed in placeholder mode (no actual arm64
        # cross-compile, just partition table + identity.cfg) without QEMU,
        # which is enough for the CI→platform→download smoke test.
        continue-on-error: true
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Stage cross-compiled powernode-agent (arm64)
        env:
          POWERNODE_AGENT_BINARY_URL: ${{ secrets.POWERNODE_AGENT_BINARY_URL }}
        run: |
          if [ -z "${POWERNODE_AGENT_BINARY_URL:-}" ]; then
            echo "FATAL: POWERNODE_AGENT_BINARY_URL secret not configured"
            echo "       Disk image builds bake the agent into the on-node rootfs;"
            echo "       a placeholder shim would silently produce non-bootable images."
            exit 1
          fi
          mkdir -p initramfs/scripts
          OUT="initramfs/scripts/powernode-agent-arm64"
          curl -fsSL "${POWERNODE_AGENT_BINARY_URL}/powernode-agent-linux-arm64" -o "$OUT"
          # .sha256 sidecar is optional: verify when the agent host serves it,
          # warn+skip when it doesn't. Mirrors the .cosign-bundle handling below.
          if curl -fsSL "${POWERNODE_AGENT_BINARY_URL}/powernode-agent-linux-arm64.sha256" -o "$OUT.sha256" 2>/dev/null; then
            (cd "$(dirname "$OUT")" && sha256sum -c "$(basename "$OUT").sha256") \
              || { echo "FATAL: sha256 mismatch for $OUT"; exit 1; }
          else
            echo "WARN: .sha256 sidecar absent — skipping integrity check."
          fi
          if curl -fsSL "${POWERNODE_AGENT_BINARY_URL}/powernode-agent-linux-arm64.cosign-bundle" \
                 -o "$OUT.cosign-bundle" 2>/dev/null; then
            cosign verify-blob --bundle "$OUT.cosign-bundle" "$OUT" \
              || { echo "FATAL: cosign signature verification failed for $OUT"; exit 1; }
          else
            echo "WARN: .cosign-bundle absent — skipping signature verify."
          fi
          chmod +x "$OUT"

      - name: Build rpi4-firmware module rootfs
        # Direct curl fetch — no need for buildah/QEMU when we just want
        # firmware files. Eliminates the arm64 cross-compile and ZFS-driver
        # cleanup issues that previously failed this step.
        run: |
          cd templates/example-modules/rpi4-firmware
          FIRMWARE_REF="${{ inputs.firmware_ref }}"
          if [ -z "$FIRMWARE_REF" ]; then
            FIRMWARE_REF="$(grep firmware_ref manifest.yaml | awk '{print $2}' | tr -d '"')"
          fi
          echo "Fetching rpi4-firmware at ref=$FIRMWARE_REF"

          mkdir -p /tmp/rpi4-firmware-rootfs/rootfs/boot/firmware
          cd /tmp/rpi4-firmware-rootfs/rootfs/boot/firmware

          # Download just the boot blobs we need (RPi 4 boot files).
          # Full repo is 5+ GB; we only need ~30MB of firmware.
          BASE="https://github.com/raspberrypi/firmware/raw/${FIRMWARE_REF}/boot"
          # kernel8.img comes from the firmware repo (RPi-tuned arm64 kernel).
          # This is what makes the SD-card flashable + bootable: the GPU
          # loader (start4.elf) reads kernel8.img from the FAT32 partition.
          # If our dracut build produces a custom kernel later, the disk-image
          # script will prefer it; otherwise this firmware kernel is used.
          for f in start4.elf fixup4.dat start.elf fixup.dat bootcode.bin \
                   bcm2711-rpi-4-b.dtb bcm2711-rpi-400.dtb bcm2711-rpi-cm4.dtb \
                   kernel8.img; do
            if curl -fsSL "$BASE/$f" -o "$f"; then
              echo "  ✓ $f ($(stat -c '%s' "$f") bytes)"
            else
              echo "  ⚠ $f — fetch failed (continuing in placeholder mode)"
              echo "placeholder" > "$f"
            fi
          done

          # Overlays directory — fetch a small set of common ones. For the
          # smoke-test image we only need disable-bt.dtbo (referenced by
          # config.txt's dtoverlay=disable-bt line). Missing overlays are
          # tolerated by the GPU loader (warning only, not boot failure).
          mkdir -p overlays
          for ov in disable-bt.dtbo miniuart-bt.dtbo; do
            if curl -fsSL "$BASE/overlays/$ov" -o "overlays/$ov"; then
              echo "  ✓ overlays/$ov ($(stat -c '%s' "overlays/$ov") bytes)"
            else
              echo "  ⚠ overlays/$ov — fetch failed"
            fi
          done
          echo "$FIRMWARE_REF" > POWERNODE_FIRMWARE_VERSION

          ls -la /tmp/rpi4-firmware-rootfs/rootfs/boot/firmware/ | head

      - name: Fetch platform CA
        if: inputs.ca_pem_url != ''
        run: |
          curl -fsSL "${{ inputs.ca_pem_url }}" -o /tmp/platform-ca.pem
          echo "CA fingerprint:"
          openssl x509 -in /tmp/platform-ca.pem -noout -fingerprint -sha256 || true

      - name: Build kernel + initramfs (arm64)
        working-directory: initramfs
        run: |
          ./build.sh --arch arm64 --variants kernel-initrd

      - name: Build disk-image-rpi4
        working-directory: initramfs
        env:
          # SIZE_GB=1 keeps the image under Gitea's container-registry blob
          # upload limit (typically ~1GB; default 4GB hit 413 Request Entity
          # Too Large during oras push). 1GB is plenty for the smoke flow:
          # 512MB FAT32 boot (firmware ~30MB + kernel ~10MB + initramfs +
          # config) + 512MB ext4 persist (mostly empty for Path C claim flow).
          # Operators with a registry that supports larger blobs can override
          # SIZE_GB on dispatch.
          SIZE_GB: "1"
          RPI4_FIRMWARE_DIR: /tmp/rpi4-firmware-rootfs/rootfs/boot/firmware
          CA_PEM_FILE: ${{ inputs.ca_pem_url != '' && '/tmp/platform-ca.pem' || '' }}
        run: |
          ./build.sh --arch arm64 --variants disk-image-rpi4

      - name: Build disk-image-arm64-uefi (UKI, in QEMU arm64 container)
        # arm64-uefi now uses the same ukify-UKI model as amd64 (compact,
        # 2-partition — fits SIZE_GB=1, unlike the old build-raw.sh 3-partition
        # layout). There's no native arm64 runner, so build the REAL arm64
        # kernel-initrd + UKI inside a QEMU-emulated arm64 container: apt +
        # dracut + ukify run as arm64, so the initramfs/UKI carry arm64 binaries.
        # Same build.sh path as the native amd64 build, just emulated (slower).
        working-directory: initramfs
        run: |
          # The setup-qemu step above is continue-on-error; (re)register the
          # arm64 binfmt handler and fail loud if emulation is unavailable.
          docker run --privileged --rm tonistiigi/binfmt --install arm64 >/dev/null 2>&1 || true
          docker run --rm --platform linux/arm64 ubuntu:24.04 true \
            || { echo "FATAL: arm64 emulation unavailable (binfmt not registered)"; exit 1; }
          # Host /tmp isn't visible in the container — stage the fetched CA into
          # the workspace so it rides along with the docker cp below; CA_PEM_FILE
          # points at the in-container path.
          ca_env=()
          if [ -n "${{ inputs.ca_pem_url }}" ] && [ -f /tmp/platform-ca.pem ]; then
            cp /tmp/platform-ca.pem ./platform-ca.pem
            ca_env=(-e "CA_PEM_FILE=/work/platform-ca.pem")
          fi
          # The runner's docker is host-side (docker-outside-of-docker), so a
          # `-v "$PWD:/work"` bind-mount of this job-container path resolves to an
          # empty dir on the host daemon → build.sh "No such file or directory".
          # DinD-safe: copy the workspace (incl. scripts/powernode-agent-arm64)
          # INTO a long-lived arm64 container, build, then copy artifacts back.
          C=pn-arm64-uefi
          docker rm -f "$C" >/dev/null 2>&1 || true
          docker run -d --name "$C" --platform linux/arm64 \
            -e SIZE_GB=1 -e "PLATFORM_URL=${PLATFORM_URL}" "${ca_env[@]}" \
            ubuntu:24.04 sleep 3600
          docker exec "$C" mkdir -p /work
          docker cp ./. "$C":/work
          docker exec "$C" bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              systemd iproute2 gdisk mtools dosfstools e2fsprogs \
              systemd-ukify systemd-boot-efi python3-pefile \
              dracut-core dracut-network linux-image-generic systemd-resolved jq zstd ca-certificates
            cd /work && ./build.sh --arch arm64 --variants "kernel-initrd,disk-image-arm64-uefi"
          '
          # Copy built artifacts back out (contents only, to avoid build/arm64/arm64
          # nesting and to preserve the host's rpi4 image), drop the container,
          # reclaim ownership for the publish steps.
          mkdir -p build/arm64
          docker cp "$C":/work/build/arm64/. build/arm64/
          docker rm -f "$C" >/dev/null 2>&1 || true
          sudo chown -R "$(id -u):$(id -g)" build

      - name: Cosign sign disk images (keyless, Fulcio)
        working-directory: initramfs/build/arm64
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # 30s timeout — cosign keyless tries interactive OIDC device flow
          # when no ambient OIDC token is present (Gitea Actions doesn't
          # publish one by default). The timeout makes the workflow
          # fail-fast instead of hanging for 5 minutes per image.
          # Platform-side LocalDiskImageAdapter (smoke mode) skips cosign
          # verify so missing bundles don't block ingestion.
          for img in disk-image-rpi4/powernode-rpi4.img disk-image-arm64-uefi/powernode-arm64-uefi.img; do
            if [ -f "$img" ]; then
              timeout 30s cosign sign-blob --yes --bundle "${img}.cosign-bundle" "$img" \
                || echo "WARN: cosign signing skipped/failed for $img (smoke mode tolerates this)"
            fi
          done

      - name: Compute manifest
        working-directory: initramfs/build/arm64
        run: |
          {
            echo "platform_url=${PLATFORM_URL}"
            echo "git_sha=${{ github.sha }}"
            echo "built_at=$(date -Iseconds)"
            for img in disk-image-rpi4/powernode-rpi4.img disk-image-arm64-uefi/powernode-arm64-uefi.img; do
              if [ -f "$img" ]; then
                echo "$(sha256sum "$img")"
                echo "size_$(basename "$img")=$(stat -c '%s' "$img")"
              fi
            done
          } >disk-image-manifest.txt
          cat disk-image-manifest.txt

      # ─── Disk-image registration with the platform (Phase 2 — Chunk 4) ───
      # Plan: docs/plans/wondrous-yawning-anchor.md.
      #
      # Three modes:
      #  1. Push to OCI registry (oras) with cosign sign-blob + cosign attest-blob
      #     for the publication payload. Default for all builds — needed even when
      #     the platform notify is skipped, so the artifact is durably stored.
      #  2. HMAC webhook to platform (default) — operator's CI provides
      #     POWERNODE_DISK_IMAGE_WEBHOOK_URL + POWERNODE_DISK_IMAGE_WEBHOOK_SECRET
      #     pointing at /api/v1/system/webhooks/disk_image/built/:webhook_id.
      #     Platform pulls from OCI, verifies cosign + attestation, registers.
      #  3. Cloud-direct upload (S3/Azure/GCS only) — POWERNODE_STORAGE_MODE=cloud-direct.
      #     CI uploads bytes directly to storage backend via signed PUT URL.
      #     Avoids OCI registry pull on the platform side.

      - name: Push disk images to OCI registry (cosign-signed + attested)
        if: env.POWERNODE_STORAGE_MODE != 'cloud-direct'
        env:
          ORAS_REGISTRY: ${{ secrets.POWERNODE_REGISTRY_HOST || 'registry.example.com' }}
          POWERNODE_REGISTRY_USER: ${{ secrets.POWERNODE_REGISTRY_USER }}
          POWERNODE_REGISTRY_TOKEN: ${{ secrets.POWERNODE_REGISTRY_TOKEN }}
        run: |
          if [ -n "$POWERNODE_REGISTRY_USER" ] && [ -n "$POWERNODE_REGISTRY_TOKEN" ]; then
            oras login -u "$POWERNODE_REGISTRY_USER" -p "$POWERNODE_REGISTRY_TOKEN" "$ORAS_REGISTRY" || true
          fi

          for entry in "ubuntu-24.04-rpi4:disk-image-rpi4/powernode-rpi4.img" \
                       "ubuntu-24.04-arm64-uefi:disk-image-arm64-uefi/powernode-arm64-uefi.img"; do
            platform="${entry%%:*}"
            img="initramfs/build/arm64/${entry#*:}"
            [ -f "$img" ] || { echo "FATAL: $img not built — refusing to publish a partial set"; exit 1; }

            sha="$(sha256sum "$img" | awk '{print $1}')"
            size="$(stat -c '%s' "$img")"
            ref="$ORAS_REGISTRY/powernode/disk-images/$platform:${{ github.sha }}"

            # 1. Sign blob (signature on the bytes themselves) — 30s
            #    timeout because cosign's keyless OIDC device flow hangs
            #    in non-interactive CI without an ambient OIDC token.
            timeout 30s cosign sign-blob --yes --bundle "$img.cosign-bundle" "$img" \
              || echo "WARN: cosign sign-blob skipped/failed for $img (smoke mode tolerates this)"

            # 2. Attest payload (signature on the publication metadata —
            #    catches webhook-payload tampering even if HMAC was leaked).
            cat >/tmp/payload-${platform}.json <<EOF
          {
            "platform_name": "$platform",
            "sha256":        "$sha",
            "size_bytes":    $size,
            "git_sha":       "${{ github.sha }}",
            "firmware_ref":  "${{ inputs.firmware_ref }}",
            "oci_ref":       "$ref",
            "arch":          "arm64",
            "built_at":      "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
            timeout 30s cosign attest-blob --yes --predicate /tmp/payload-${platform}.json \
              --bundle "$img.attestation-bundle" "$img" || echo "WARN: cosign attest-blob failed for $img"

            # 3. Push everything to OCI registry as a single artifact.
            #    cosign-bundle and attestation-bundle layers are optional
            #    (smoke mode skips cosign signing because there's no ambient
            #    OIDC token). Build the layer list dynamically so a missing
            #    bundle doesn't error out the whole push.
            push_args=("$ref" "--artifact-type" "application/vnd.powernode.disk-image.v1"
                       "$img:application/octet-stream")
            if [ -f "$img.cosign-bundle" ]; then
              push_args+=("$img.cosign-bundle:application/vnd.dev.cosign.bundle.v1+json")
            else
              echo "  (cosign-bundle missing — pushing without signature layer)"
            fi
            if [ -f "$img.attestation-bundle" ]; then
              push_args+=("$img.attestation-bundle:application/vnd.dev.cosign.attestation.v1+json")
            else
              echo "  (attestation-bundle missing — pushing without attestation layer)"
            fi
            if oras push "${push_args[@]}"; then
              echo "✓ Pushed $platform to $ref (sha=$sha size=$size)"
            else
              echo "WARN: oras push failed for $platform — webhook will fire but platform OCI pull will 404"
            fi
          done

      - name: Notify platform of new disk images (HMAC webhook — OCI-pull mode)
        if: env.POWERNODE_DISK_IMAGE_WEBHOOK_URL != '' && env.POWERNODE_STORAGE_MODE != 'cloud-direct'
        env:
          POWERNODE_DISK_IMAGE_WEBHOOK_URL: ${{ secrets.POWERNODE_DISK_IMAGE_WEBHOOK_URL }}
          POWERNODE_DISK_IMAGE_WEBHOOK_SECRET: ${{ secrets.POWERNODE_DISK_IMAGE_WEBHOOK_SECRET }}
          ORAS_REGISTRY: ${{ secrets.POWERNODE_REGISTRY_HOST || 'registry.example.com' }}
        run: |
          for entry in "ubuntu-24.04-rpi4:disk-image-rpi4/powernode-rpi4.img" \
                       "ubuntu-24.04-arm64-uefi:disk-image-arm64-uefi/powernode-arm64-uefi.img"; do
            platform="${entry%%:*}"
            img="initramfs/build/arm64/${entry#*:}"
            [ -f "$img" ] || { echo "FATAL: $img not built — refusing to publish a partial set"; exit 1; }

            sha="$(sha256sum "$img" | awk '{print $1}')"
            size="$(stat -c '%s' "$img")"
            ref="$ORAS_REGISTRY/powernode/disk-images/$platform:${{ github.sha }}"

            body=$(jq -nc \
              --arg p "$platform" \
              --arg ref "$ref" \
              --arg sha "$sha" \
              --arg gs "${{ github.sha }}" \
              --arg fr "${{ inputs.firmware_ref }}" \
              --argjson sz "$size" \
              --arg arch "arm64" \
              '{platform_name:$p, oci_ref:$ref, sha256:$sha, size_bytes:$sz,
                git_sha:$gs, firmware_ref:$fr, arch:$arch}')

            sig=$(printf %s "$body" | openssl dgst -sha256 -hmac "$POWERNODE_DISK_IMAGE_WEBHOOK_SECRET" -hex \
                  | awk '{print $2}')

            echo "→ Notifying platform: $POWERNODE_DISK_IMAGE_WEBHOOK_URL"
            curl -fsSL -X POST "$POWERNODE_DISK_IMAGE_WEBHOOK_URL" \
              -H "X-Powernode-Signature: sha256=$sig" \
              -H "Content-Type: application/json" \
              -d "$body" \
              || echo "WARN: webhook POST failed for $platform"
          done

      - name: Direct-upload disk images (cloud-install mode)
        if: env.POWERNODE_STORAGE_MODE == 'cloud-direct' && env.POWERNODE_CI_WORKER_TOKEN != ''
        env:
          POWERNODE_API_BASE: ${{ secrets.POWERNODE_API_BASE }}
          POWERNODE_CI_WORKER_TOKEN: ${{ secrets.POWERNODE_CI_WORKER_TOKEN }}
        run: |
          # Pre-flight: confirm POWERNODE_API_BASE points at a live
          # platform before we start the three-phase upload dance. The
          # secret has historically drifted across deployments — without
          # this check, a stale API_BASE only surfaces as a connect-
          # refused part-way through Phase 1, after the workflow has
          # already burned several minutes on the disk-image build.
          # See the same pattern + commentary in
          # build-platform-modules.yaml (Stage 3 notify step).
          : "${POWERNODE_API_BASE:=https://ops.powernode.org}"
          echo "Verifying API_BASE=$POWERNODE_API_BASE is reachable..."
          if ! curl -fsSL -m 10 -o /dev/null -w 'health-check http=%{http_code}\n' \
                  "${POWERNODE_API_BASE}/api/v1/health"; then
            echo "::error::POWERNODE_API_BASE=$POWERNODE_API_BASE is not responding on /api/v1/health."
            echo "::error::  Update the secret in Gitea Actions repo/org settings to the current"
            echo "::error::  platform URL (https://ops.powernode.org for the canonical deployment)"
            echo "::error::  and re-run. Skipping cloud-direct upload phase."
            exit 1
          fi

          for entry in "ubuntu-24.04-rpi4:disk-image-rpi4/powernode-rpi4.img" \
                       "ubuntu-24.04-arm64-uefi:disk-image-arm64-uefi/powernode-arm64-uefi.img"; do
            platform="${entry%%:*}"
            img="initramfs/build/arm64/${entry#*:}"
            [ -f "$img" ] || { echo "FATAL: $img not built — refusing to publish a partial set"; exit 1; }

            sha="$(sha256sum "$img" | awk '{print $1}')"
            size="$(stat -c '%s' "$img")"

            # Phase 1: initiate (returns presigned PUT URL + publication_id)
            init=$(curl -fsSL -X POST "$POWERNODE_API_BASE/api/v1/system/worker_api/disk_image_publications/initiate" \
              -H "X-Worker-Token: $POWERNODE_CI_WORKER_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"platform_name\":\"$platform\",\"sha256\":\"$sha\",\"size_bytes\":$size,\"git_sha\":\"${{ github.sha }}\",\"arch\":\"arm64\",\"firmware_ref\":\"${{ inputs.firmware_ref }}\"}")
            pub_id=$(echo "$init" | jq -r .data.publication_id)
            url=$(echo "$init" | jq -r .data.signed_upload_url)

            # Phase 2: PUT bytes directly to storage backend
            curl -fsSL -X PUT "$url" \
              --data-binary "@$img" \
              -H "Content-Type: application/octet-stream"

            # Phase 3: finalize (verify SHA + cosign + flip platform pointer)
            curl -fsSL -X POST "$POWERNODE_API_BASE/api/v1/system/worker_api/disk_image_publications/finalize" \
              -H "X-Worker-Token: $POWERNODE_CI_WORKER_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"publication_id\":\"$pub_id\",\"sha256_verify\":\"$sha\"}"
          done

      - name: Upload artifacts
        # actions/upload-artifact@v4 is GHES-only; the Gitea Actions
        # runtime here doesn't support v4. The OCI push above is the
        # primary distribution channel anyway — the platform pulls from
        # the registry, not from CI artifacts. continue-on-error so a
        # missing v4 backend doesn't fail the whole workflow.
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: powernode-disk-images-${{ github.sha }}
          path: |
            initramfs/build/arm64/disk-image-rpi4/
            initramfs/build/arm64/disk-image-arm64-uefi/
            initramfs/build/arm64/disk-image-manifest.txt
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────
  # Generic amd64 UEFI image for the claim-by-ID fleet flow. Native amd64
  # runner — NO QEMU emulation, NO rpi4 firmware. A UKI (kernel + initramfs +
  # cmdline fused into one EFI binary by `ukify`) on a BOOT-labelled ESP plus
  # an ext4 persist partition, assembled loop-free (mtools + mkfs.ext4 -E
  # offset). Publishes to the `ubuntu-24.04-amd64-uefi` NodePlatform. Parallel
  # to `build` (arm64) — distinct artifact + platform, no shared state.
  # ───────────────────────────────────────────────────────────────────────
  build-amd64-uefi:
    runs-on: ubuntu-24.04
    env:
      PLATFORM_URL: ${{ inputs.platform_url || 'https://platform.example.com' }}
      ARCH: amd64
      # See the arm64 `build` job: surface publish-routing inputs at job scope
      # so the publish-step `if:` guards evaluate. Unset STORAGE_MODE → OCI-pull
      # + HMAC-webhook (the on-prem path for ops).
      POWERNODE_STORAGE_MODE: ${{ vars.POWERNODE_STORAGE_MODE }}
      POWERNODE_DISK_IMAGE_WEBHOOK_URL: ${{ secrets.POWERNODE_DISK_IMAGE_WEBHOOK_URL }}
      POWERNODE_CI_WORKER_TOKEN: ${{ secrets.POWERNODE_CI_WORKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps (incl. UKI tooling)
        run: |
          sudo apt-get update
          # gdisk(sgdisk) + mtools + e2fsprogs = loop-free GPT/ESP/ext4 assembly.
          # systemd-ukify + systemd-boot-efi + python3-pefile build the UKI
          # (no separate GRUB/bootloader — OVMF boots /EFI/BOOT/BOOTX64.EFI).
          # dracut-core + linux-image-generic provide the initramfs builder and
          # a real distro kernel (/boot/vmlinuz-* + /lib/modules/*), so build.sh's
          # kernel-initrd variant produces a REAL kernel+initramfs (not the
          # dracut-absent placeholder) for ukify to fuse into the UKI. The amd64
          # runner is native, so dracut runs without emulation. linux-image-generic
          # carries the comprehensive module set the hostonly=no initramfs needs to
          # boot arbitrary fleet hardware.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gdisk mtools dosfstools e2fsprogs \
            systemd-ukify systemd-boot-efi python3-pefile \
            dracut-core linux-image-generic systemd-resolved \
            curl jq zstd
          export PATH="/usr/local/sbin:/usr/sbin:/sbin:$PATH"
          echo "Tool availability:"
          for tool in sgdisk mformat mkfs.ext4 ukify dracut cosign oras curl jq zstd; do
            if path=$(command -v "$tool"); then echo "  ✓ $tool → $path"; else echo "  ✗ $tool MISSING"; fi
          done
          # build.sh resolves kver from a /lib/modules/<v> that has a matching
          # /boot/vmlinuz-<v>. Fail loud here if linux-image-generic didn't land
          # both (a placeholder kernel would yield a non-bootable UKI).
          kver="$(ls -1 /lib/modules 2>/dev/null | sort -V | tail -n1)"
          if [ -n "$kver" ] && [ -e "/boot/vmlinuz-$kver" ]; then
            echo "  ✓ kernel present: $kver"
          else
            echo "  ✗ no usable kernel (/boot/vmlinuz-* + /lib/modules/*)"; exit 1
          fi
          if [ -f /usr/lib/systemd/boot/efi/linuxx64.efi.stub ]; then
            echo "  ✓ systemd-boot stub present"
          else
            echo "  ✗ systemd-boot stub MISSING (systemd-boot-efi)"; exit 1
          fi
          if ! command -v cosign >/dev/null 2>&1; then
            curl -fsSL "https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64" -o /tmp/cosign
            sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          fi
          if ! command -v oras >/dev/null 2>&1; then
            curl -fsSL "https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz" -o /tmp/oras.tar.gz
            sudo tar -xzf /tmp/oras.tar.gz -C /usr/local/bin oras && sudo chmod +x /usr/local/bin/oras
          fi

      - name: Stage powernode-agent (amd64)
        env:
          POWERNODE_AGENT_BINARY_URL: ${{ secrets.POWERNODE_AGENT_BINARY_URL }}
        run: |
          if [ -z "${POWERNODE_AGENT_BINARY_URL:-}" ]; then
            echo "FATAL: POWERNODE_AGENT_BINARY_URL secret not configured — the agent"
            echo "       is baked into the UKI's initramfs; a placeholder would produce"
            echo "       a non-bootable / non-enrolling image."
            exit 1
          fi
          mkdir -p initramfs/scripts
          OUT="initramfs/scripts/powernode-agent-amd64"
          curl -fsSL "${POWERNODE_AGENT_BINARY_URL}/powernode-agent-linux-amd64" -o "$OUT"
          # .sha256 sidecar is optional: verify integrity when the agent host
          # serves it, warn+skip when it doesn't (the /agent route serves the
          # bare binary). Mirrors the .cosign-bundle handling below.
          if curl -fsSL "${POWERNODE_AGENT_BINARY_URL}/powernode-agent-linux-amd64.sha256" -o "$OUT.sha256" 2>/dev/null; then
            (cd "$(dirname "$OUT")" && sha256sum -c "$(basename "$OUT").sha256") \
              || { echo "FATAL: sha256 mismatch for $OUT"; exit 1; }
          else
            echo "WARN: .sha256 sidecar absent — skipping integrity check."
          fi
          if curl -fsSL "${POWERNODE_AGENT_BINARY_URL}/powernode-agent-linux-amd64.cosign-bundle" \
                 -o "$OUT.cosign-bundle" 2>/dev/null; then
            cosign verify-blob --bundle "$OUT.cosign-bundle" "$OUT" \
              || { echo "FATAL: cosign signature verification failed for $OUT"; exit 1; }
          else
            echo "WARN: .cosign-bundle absent — skipping signature verify."
          fi
          chmod +x "$OUT"

      - name: Fetch platform CA
        if: inputs.ca_pem_url != ''
        run: |
          curl -fsSL "${{ inputs.ca_pem_url }}" -o /tmp/platform-ca.pem
          openssl x509 -in /tmp/platform-ca.pem -noout -fingerprint -sha256 || true

      - name: Build amd64 UEFI image (UKI, in clean amd64 container)
        working-directory: initramfs
        run: |
          # Build in a fresh ubuntu:24.04 container (native amd64 — no emulation,
          # so fast) for an env-independent, complete-systemd toolchain. The
          # act-runner host's systemd lacks the networkd binary, so dracut's
          # systemd-networkd module can't install there ("Module powernode
          # depends on systemd-networkd, which can't be installed"); a fresh
          # container's apt pulls a complete systemd and always can. Mirrors the
          # arm64 build for one consistent, reproducible path across both arches.
          # 1GB image: 512MB ESP (the ~85MB UKI fits) + ~512MB ext4 persist —
          # under the registry's typical ~1GB blob limit.
          ca_env=()
          if [ -n "${{ inputs.ca_pem_url }}" ] && [ -f /tmp/platform-ca.pem ]; then
            cp /tmp/platform-ca.pem ./platform-ca.pem
            ca_env=(-e "CA_PEM_FILE=/work/platform-ca.pem")
          fi
          # docker-outside-of-docker: a bind-mount of the job path is empty on the
          # host daemon, so copy the workspace (incl. scripts/powernode-agent-amd64)
          # into the container, build, then copy artifacts back out.
          C=pn-amd64-uefi
          docker rm -f "$C" >/dev/null 2>&1 || true
          docker run -d --name "$C" --platform linux/amd64 \
            -e SIZE_GB=1 -e "PLATFORM_URL=${PLATFORM_URL}" "${ca_env[@]}" \
            ubuntu:24.04 sleep 3600
          docker exec "$C" mkdir -p /work
          docker cp ./. "$C":/work
          docker exec "$C" bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              systemd iproute2 gdisk mtools dosfstools e2fsprogs \
              systemd-ukify systemd-boot-efi python3-pefile \
              dracut-core dracut-network linux-image-generic systemd-resolved jq zstd ca-certificates
            cd /work && ./build.sh --arch amd64 --variants "kernel-initrd,disk-image-amd64-uefi"
          '
          mkdir -p build/amd64
          docker cp "$C":/work/build/amd64/. build/amd64/
          docker rm -f "$C" >/dev/null 2>&1 || true
          sudo chown -R "$(id -u):$(id -g)" build

      - name: Push amd64 image to OCI registry (cosign-signed + attested)
        if: env.POWERNODE_STORAGE_MODE != 'cloud-direct'
        env:
          ORAS_REGISTRY: ${{ secrets.POWERNODE_REGISTRY_HOST || 'registry.example.com' }}
          POWERNODE_REGISTRY_USER: ${{ secrets.POWERNODE_REGISTRY_USER }}
          POWERNODE_REGISTRY_TOKEN: ${{ secrets.POWERNODE_REGISTRY_TOKEN }}
        run: |
          platform="ubuntu-24.04-amd64-uefi"
          img="initramfs/build/amd64/disk-image-amd64-uefi/powernode-amd64-uefi.img"
          [ -f "$img" ] || { echo "FATAL: $img not built"; exit 1; }
          if [ -n "$POWERNODE_REGISTRY_USER" ] && [ -n "$POWERNODE_REGISTRY_TOKEN" ]; then
            oras login -u "$POWERNODE_REGISTRY_USER" -p "$POWERNODE_REGISTRY_TOKEN" "$ORAS_REGISTRY" || true
          fi
          sha="$(sha256sum "$img" | awk '{print $1}')"
          size="$(stat -c '%s' "$img")"
          ref="$ORAS_REGISTRY/powernode/disk-images/$platform:${{ github.sha }}"
          timeout 30s cosign sign-blob --yes --bundle "$img.cosign-bundle" "$img" \
            || echo "WARN: cosign sign-blob skipped/failed (smoke mode tolerates this)"
          jq -nc --arg p "$platform" --arg sha "$sha" --argjson sz "$size" \
            --arg gs "${{ github.sha }}" --arg ref "$ref" --arg arch "amd64" \
            --arg ba "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{platform_name:$p,sha256:$sha,size_bytes:$sz,git_sha:$gs,oci_ref:$ref,arch:$arch,built_at:$ba}' \
            >/tmp/payload-amd64.json
          timeout 30s cosign attest-blob --yes --predicate /tmp/payload-amd64.json \
            --bundle "$img.attestation-bundle" "$img" || echo "WARN: cosign attest-blob failed"
          push_args=("$ref" "--artifact-type" "application/vnd.powernode.disk-image.v1" "$img:application/octet-stream")
          if [ -f "$img.cosign-bundle" ]; then
            push_args+=("$img.cosign-bundle:application/vnd.dev.cosign.bundle.v1+json")
          fi
          if [ -f "$img.attestation-bundle" ]; then
            push_args+=("$img.attestation-bundle:application/vnd.dev.cosign.attestation.v1+json")
          fi
          if oras push "${push_args[@]}"; then
            echo "✓ Pushed $platform to $ref (sha=$sha size=$size)"
          else
            echo "WARN: oras push failed — webhook fires but platform OCI pull will 404"
          fi

      - name: Notify platform of new amd64 image (HMAC webhook — OCI-pull mode)
        if: env.POWERNODE_DISK_IMAGE_WEBHOOK_URL != '' && env.POWERNODE_STORAGE_MODE != 'cloud-direct'
        env:
          POWERNODE_DISK_IMAGE_WEBHOOK_URL: ${{ secrets.POWERNODE_DISK_IMAGE_WEBHOOK_URL }}
          POWERNODE_DISK_IMAGE_WEBHOOK_SECRET: ${{ secrets.POWERNODE_DISK_IMAGE_WEBHOOK_SECRET }}
          ORAS_REGISTRY: ${{ secrets.POWERNODE_REGISTRY_HOST || 'registry.example.com' }}
        run: |
          platform="ubuntu-24.04-amd64-uefi"
          img="initramfs/build/amd64/disk-image-amd64-uefi/powernode-amd64-uefi.img"
          [ -f "$img" ] || { echo "FATAL: $img not built"; exit 1; }
          sha="$(sha256sum "$img" | awk '{print $1}')"
          size="$(stat -c '%s' "$img")"
          ref="$ORAS_REGISTRY/powernode/disk-images/$platform:${{ github.sha }}"
          body=$(jq -nc --arg p "$platform" --arg ref "$ref" --arg sha "$sha" \
            --arg gs "${{ github.sha }}" --argjson sz "$size" --arg arch "amd64" \
            '{platform_name:$p, oci_ref:$ref, sha256:$sha, size_bytes:$sz, git_sha:$gs, arch:$arch}')
          sig=$(printf %s "$body" | openssl dgst -sha256 -hmac "$POWERNODE_DISK_IMAGE_WEBHOOK_SECRET" -hex | awk '{print $2}')
          echo "→ Notifying platform: $POWERNODE_DISK_IMAGE_WEBHOOK_URL"
          curl -fsSL -X POST "$POWERNODE_DISK_IMAGE_WEBHOOK_URL" \
            -H "X-Powernode-Signature: sha256=$sig" \
            -H "Content-Type: application/json" \
            -d "$body" || echo "WARN: webhook POST failed"

      - name: Direct-upload amd64 image (cloud-install mode)
        if: env.POWERNODE_STORAGE_MODE == 'cloud-direct' && env.POWERNODE_CI_WORKER_TOKEN != ''
        env:
          POWERNODE_API_BASE: ${{ secrets.POWERNODE_API_BASE }}
          POWERNODE_CI_WORKER_TOKEN: ${{ secrets.POWERNODE_CI_WORKER_TOKEN }}
        run: |
          : "${POWERNODE_API_BASE:=https://ops.powernode.org}"
          platform="ubuntu-24.04-amd64-uefi"
          img="initramfs/build/amd64/disk-image-amd64-uefi/powernode-amd64-uefi.img"
          [ -f "$img" ] || { echo "FATAL: $img not built"; exit 1; }
          if ! curl -fsSL -m 10 -o /dev/null "${POWERNODE_API_BASE}/api/v1/health"; then
            echo "::error::POWERNODE_API_BASE=$POWERNODE_API_BASE not responding — skipping upload"; exit 1
          fi
          sha="$(sha256sum "$img" | awk '{print $1}')"
          size="$(stat -c '%s' "$img")"
          init=$(curl -fsSL -X POST "$POWERNODE_API_BASE/api/v1/system/worker_api/disk_image_publications/initiate" \
            -H "X-Worker-Token: $POWERNODE_CI_WORKER_TOKEN" -H "Content-Type: application/json" \
            -d "{\"platform_name\":\"$platform\",\"sha256\":\"$sha\",\"size_bytes\":$size,\"git_sha\":\"${{ github.sha }}\",\"arch\":\"amd64\"}")
          pub_id=$(echo "$init" | jq -r .data.publication_id)
          url=$(echo "$init" | jq -r .data.signed_upload_url)
          curl -fsSL -X PUT "$url" --data-binary "@$img" -H "Content-Type: application/octet-stream"
          curl -fsSL -X POST "$POWERNODE_API_BASE/api/v1/system/worker_api/disk_image_publications/finalize" \
            -H "X-Worker-Token: $POWERNODE_CI_WORKER_TOKEN" -H "Content-Type: application/json" \
            -d "{\"publication_id\":\"$pub_id\",\"sha256_verify\":\"$sha\"}"

      - name: Upload artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: powernode-disk-image-amd64-uefi-${{ github.sha }}
          path: |
            initramfs/build/amd64/disk-image-amd64-uefi/
          retention-days: 30
