name: debug-secret
on:
  workflow_dispatch: {}

jobs:
  show:
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/debian:trixie-slim
    steps:
      - name: Print sha of POWERNODE_CI_WORKER_TOKEN
        env:
          SECRET: ${{ secrets.POWERNODE_CI_WORKER_TOKEN }}
        run: |
          apt-get update -q > /dev/null && apt-get install -y coreutils > /dev/null
          if [ -z "$SECRET" ]; then
            echo "SECRET_UNSET"
          else
            echo "SECRET_LEN=${#SECRET}"
            echo "SECRET_SHA16=$(printf '%s' "$SECRET" | sha256sum | cut -c1-16)"
          fi
