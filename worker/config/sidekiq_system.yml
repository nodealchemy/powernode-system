# System extension scheduled jobs.
#
# This file deliberately holds ONE recurring job: the hourly reaper. The
# primary operation-dispatch path is event-driven (Operation#after_commit
# enqueues SystemExecuteTaskJob immediately on creation), so no
# 30-second cron polling exists.
#
# The reaper is a low-frequency safety net for missed enqueues (Redis
# blips during operation creation) and dead-worker recovery (a worker
# crashed while holding the /execute HTTP connection mid-operation).
#
# === Long-running operation guardrails ===
#
# Sidekiq does NOT provide per-queue timeouts (see worker/config/sidekiq.yml
# header). The system queue runs operations that may take many minutes
# (e.g., cloud provisioning, module build+commit). Three safeguards apply:
#
#   1. SystemExecuteTaskJob declares `retry: 0`. The Operation AASM
#      state machine is the source of truth — Sidekiq retries would corrupt
#      it. Failures terminate the job and surface to the reaper.
#   2. BackendApiClient's per-call timeout caps the worker→server HTTP wait.
#      If a runtime service exceeds this, the worker job raises and the op
#      stays in `:running`. The reaper picks it up after STUCK_RUNNING_THRESHOLD
#      (default 60 min) and transitions it to `:failed` with execution_lost.
#   3. Operator-tunable: SYSTEM_REAPER_STUCK_RUNNING_MIN env var raises the
#      reaper's "stuck" threshold for slow workloads (e.g., minute 90 for
#      AMI builds).
#
# A future P2 architecture change would move long ops to async runtime
# execution (worker calls /execute, server returns 202, worker polls/subscribes
# for completion) so the HTTP connection isn't held for the full op duration.
:schedule:
  system_task_reaper:
    cron: "0 */1 * * *"            # every hour at :00
    class: "SystemTaskReaperJob"
    queue: system
    description: "System: re-enqueue stuck pending ops and fail abandoned running ops"

  # Fleet autonomy reconciliation tick (Golden Eclipse M7).
  # Runs every minute. Hits POST /api/v1/system/worker_api/fleet/reconcile
  # which dispatches to FleetAutonomyService.tick! per active account:
  # sensors → DecisionEngine → LearningExtractor → PressureEmitter.
  #
  # Concurrency: Redis lock keyed `system:fleet:reconcile:lock` (90s TTL)
  # prevents double-fire if the cron worker pool is busy.
  system_fleet_reconcile:
    cron: "* * * * *"
    class: "SystemFleetReconcileJob"
    queue: system
    description: "Fleet: run sensors, route decisions, extract learnings, emit pressure signals"

  # CVE feed ingest (Golden Eclipse M-D2-2).
  # Hourly poll of NVD JSON. After ingestion, ExposureCalculator recomputes
  # System::CveExposure rows for every account. Operators can trigger
  # ad-hoc via the /worker_api/cve/ingest endpoint.
  system_cve_feed:
    cron: "7 * * * *"               # every hour at :07 (avoid :00 stampede)
    class: "SystemCveFeedJob"
    queue: system
    description: "Fleet: ingest CVE feed entries + recompute exposures"

  # CVE Responder autonomy reconcile tick (2026-05-11 wiring completion).
  # Runs every minute. Hits POST /api/v1/system/worker_api/cve_responder/reconcile
  # which dispatches to System::CveOps::CveResponderService.tick! per active
  # account: sensors (CvePublishedSensor, CriticalUpgradeAvailableSensor) →
  # DecisionEngine → inline dispatch (notify_and_proceed for critical
  # severity) or ApprovalRequest creation (require_approval) →
  # CveOps::LearningExtractor.
  #
  # Concurrency: Redis lock `system:cve_responder:reconcile:lock` (90s TTL).
  # Distinct from fleet's lock so the two ticks can interleave without
  # blocking each other.
  system_cve_responder_reconcile:
    cron: "* * * * *"
    class: "SystemCveResponderReconcileJob"
    queue: system
    description: "CVE Responder: scan exposures, decide, dispatch or queue approval"

  # FleetEvent retention sweep — nightly at 4:30 AM UTC.
  # Drops routine events older than POWERNODE_FLEET_EVENT_RETENTION_DAYS
  # (default 90); high/critical kept for POWERNODE_FLEET_EVENT_CRITICAL_RETENTION_DAYS
  # (default 365) so audit history of high-impact decisions persists.
  system_fleet_event_retention:
    cron: "30 4 * * *"
    class: "SystemFleetEventRetentionJob"
    queue: maintenance
    description: "Fleet: retention sweep of System::FleetEvent rows"

  # GitOps reconciliation — every 5 minutes.
  # Iterates GitopsRepository rows due for sync (last_synced_at older than
  # 5min OR null); per-repo: clones/pulls → parses fleet.yaml → diffs vs
  # live → opens Ai::AgentProposal rows for each diff.
  #
  # Single-flight enforced via Redis lock (10 min TTL bounded by clone
  # latency).
  #
  # Comprehensive stabilization sweep P5; Golden Eclipse M-D2-3.
  system_gitops_sync:
    cron: "*/5 * * * *"
    class: "SystemGitopsSyncJob"
    queue: system
    description: "GitOps: reconcile fleet.yaml → live state, open Ai::AgentProposal for diffs"

  # Cloud-state reconciliation — hourly at :17 (offset from :00 reaper and
  # :07 CVE feed to spread cloud-API load).
  # Iterates every account's enabled provider connections + each active
  # region; calls System::CloudSyncService.sync_region_instances per region
  # to reconcile NodeInstance status / IP / instance-type drift.
  #
  # Single-flight enforced via Redis lock (30 min TTL — bounded by
  # cloud-API latency on large fleets). A slow tick won't double-fire;
  # the next hour's tick simply skips with `{ skipped: true }` if the
  # lock is held.
  #
  # Comprehensive stabilization sweep P2.1.
  system_cloud_sync:
    cron: "17 * * * *"
    class: "SystemCloudSyncJob"
    queue: system
    description: "System: hourly cloud-state reconciliation across all accounts"

  # FulfillmentRequest sweep — every 60s (campaign 019f6084 inc-O, follow-up
  # to inc-M's durable state machine). Advances every open request via the
  # advance orchestrator (resuming ones parked at the build barrier / approved
  # out-of-band) and reaps task-scoped instances past lease expiry. The
  # fulfillment analog of core worker's ci_runner_lease_reconcile
  # (worker/config/sidekiq.yml).
  system_fulfillment_request_reconcile:
    every: "60s"
    class: "SystemFulfillmentRequestReconcileJob"
    queue: system
    description: "Fulfillment: advance open requests + reap expired task-scoped leases"

  # Package repository metadata sync. Daily fetch of upstream apt/rpm package
  # indexes for enabled repos (account-scoped + shared), upserts
  # system_packages rows, marks obsoleted entries. Provides the upstream
  # catalog for the "create module from package" materialization flow.
  #
  # Moved here from the core worker/config/sidekiq.yml so it only loads when
  # the system extension is enabled (core must never name extension classes).
  system_package_repository_sync:
    cron: "0 5 * * *"               # every day at 5:00 AM UTC
    class: "SystemPackageRepositorySyncJob"
    queue: system
    description: "System: sync apt/rpm package metadata from enabled upstream repositories"
