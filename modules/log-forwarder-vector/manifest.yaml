schema_version: 1
name: log-forwarder-vector
display_name: Powernode Log Forwarder (Vector)
description: >
  Tails journald + the powernode-agent log file; forwards to a platform log
  aggregator via HTTP. Vector chosen over fluent-bit for the smaller memory
  footprint on edge nodes. The upstream URL is set via a dependant child
  module's /etc/vector/upstream.toml (declared in dependency_spec) so
  per-fleet override doesn't require a custom build.
license: MPL-2.0
category: observability
# vector intentionally not in package_spec: mmdebstrap's --include applies
# a `?narrow(?archive(^noble$))` filter on the apt-get install command that
# excludes the Datadog vector apt repo (which has Codename: stable, not
# noble). Five iterations on essential-hook variants surfaced gpg-missing,
# 404 URLs, premature chroot apt, and finally this narrow-filter rejection
# — all of which prevent vector from installing via the mmdebstrap pass.
# Either bypass the filter via a customize-hook (chroot $ROOT apt-get
# install vector after main install) or vendor the vector binary into
# rootfs/usr/bin. Tracked separately so log-forwarder can stub-publish
# and the matrix isn't blocked on it. See task #64 in the TaskList.
package_spec: []
file_spec:
  - /etc/vector/vector.toml
  - /etc/systemd/system/vector.service
mask: []
dependency_spec:
  - /etc/vector/upstream.toml
protected_spec: []
reboot_required: false

dependencies:
  requires: []
  provides:
    - observability.logs

services:
  - name: vector
    start_command: "/usr/bin/vector --config /etc/vector/vector.toml"
    restart_policy: always
    user: vector
    working_directory: /var/lib/vector
    exposed_ports: []
    capabilities:
      - CAP_DAC_READ_SEARCH
    health:
      endpoint: "/health"
      method: GET
      interval_seconds: 30
      timeout_seconds: 3
      initial_delay_seconds: 10

# The `vector` service account is declared here so ManifestImportService
# flows it through System::Identity::UserAllocator, which pins it to its
# reserved fleet-global UID/GID (vector = 70460, see reserved_identities.rb
# / reserved.go) — consistent on every instance. Same pattern as
# reverse-proxy-traefik's traefik user; uid/gid intentionally omitted
# (platform-allocated).
groups:
  - name: vector
users:
  - name: vector
    primary_group: vector
    shell: /usr/sbin/nologin
    home: /var/lib/vector
    gecos: "Vector log forwarder"

security:
  # Vector reads journald via its dbus socket + agent log files. CAP_DAC_
  # READ_SEARCH lets it bypass mode-0640 log files owned by other users
  # without needing to be root.
  capabilities:
    - CAP_DAC_READ_SEARCH
  egress_allow: []
  privileged: false
  user_namespace: true

skills: []

build:
  apt_snapshot: "20260415T000000Z"
