# Bound so a persistent journal can never crowd what shares /persist — on a
# self-hosting control plane that partition also holds the PostgreSQL data
# directory, and a full disk there is an outage, not an inconvenience.
#
# SystemKeepFree is the load-bearing one: journald stops writing rather than
# consume the last of the partition. SystemMaxUse caps steady-state growth.
[Journal]
Storage=persistent
SystemMaxUse=2G
SystemKeepFree=20G
