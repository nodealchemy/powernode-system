schema_version: 1
name: redis
display_name: Redis
description: Redis for Sidekiq queues, ActionCable pub/sub, and Rails cache
license: BSD-3-Clause
package_spec:
  - redis-server
# Ship the full apt-installed tree under the four standard FHS roots.
# /usr covers redis-server + redis-cli + libs under /usr/lib. /lib +
# /lib64 cover early-boot libs (libc, libsystemd, libssl) that the
# binary dynamically links. /etc carries package-installed configs.
# /var is intentionally omitted — runtime state (data dirs, logs)
# materializes on first boot into the overlay's writable upper layer.
file_spec:
  - /usr/**
  - /lib/**
  - /lib64/**
  - /etc/**
mask: []
dependency_spec: []
protected_spec:
  - /etc/redis/redis.conf
reboot_required: false

# Platform-allocated fleet-wide Unix identity. redis maps to UID 70140
# (reserved-table slot for databases). Locked shell — redis is daemon-
# only, no interactive access expected.
users:
  - name: redis
    shell: /usr/sbin/nologin
    home: /var/lib/redis
    gecos: Redis server

services:
  - name: redis
    # Wrapper creates /var/lib/redis with redis ownership before
    # exec'ing redis-server. /var is intentionally not shipped in
    # the erofs (runtime state lives in overlay's writable upper).
    start_command: "/usr/local/bin/redis-start.sh"
    restart_policy: always
    user: root
    exposed_ports:
      - { port: 6379, protocol: tcp, name: redis }
    capabilities: []
    # TCP health probe deferred — see postgres-primary for the same
    # ModuleService.HEALTH_METHODS constraint.

dependencies:
  requires: []
  provides:
    - cache.redis
    - cache.kv

security:
  # redis-start.sh runs as root to prep the data dir, then drops to the
  # redis user via runuser. With RootDirectory=/sysroot the agent emits an
  # empty CapabilityBoundingSet= unless caps are declared here, which strips
  # even root's ability to chown/chmod — start.sh then dies with
  # "chown: Operation not permitted". Mirror postgres-primary's minimal set:
  #   CAP_CHOWN        — chown -R redis:redis on data/log/run dirs
  #   CAP_DAC_OVERRIDE — write into redis-owned dirs while still root
  #   CAP_FOWNER       — chmod 750 the data dir after it's redis-owned
  #   CAP_SETUID/GID   — runuser drops to the redis user for redis-server
  #   CAP_SETPCAP      — runuser adjusts the capability set on the dropped child
  capabilities:
    - CAP_CHOWN
    - CAP_DAC_OVERRIDE
    - CAP_FOWNER
    - CAP_SETUID
    - CAP_SETGID
    - CAP_SETPCAP
  egress_allow: []
  privileged: false
  user_namespace: true

build:
  apt_snapshot: "20260415T000000Z"
