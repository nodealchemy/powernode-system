schema_version: 1
name: redis
display_name: Redis
description: Redis for Sidekiq queues, ActionCable pub/sub, and Rails cache
license: BSD-3-Clause
package_spec:
  - redis-server
# The apt package's own redis-server.service auto-enables via the distro's
# systemd preset, but it's a dead unit in this boot model: /var is omitted
# from file_spec below (see comment there), so its expected data/log/run
# dirs don't exist at boot and it fails with a permission/path error. The
# platform's ACTUAL redis instance runs under the services: entry below, via
# redis-start.sh's own data-dir prep. rootfs/etc/systemd/system/
# redis-server.service -> /dev/null masks the distro unit (same on-disk
# state `systemctl mask` produces) so it never races the real one.
# Curated from the real apt-ownership closure (campaign 019f6084 P0-C,
# derive-file-spec.sh --mode deb-payload: 48 owned files; /etc/redis/
# redis.conf isn't repeated here — it's already carved via protected_spec
# below). Previously a broad /usr/**+/lib/**+/lib64/**+/etc/** carve —
# on Noble everything is usr-merged (dpkg -L never reports a bare /lib or
# /lib64 path for this closure), so those two globs were dead weight, and
# the broad /usr/**+/etc/** would carve any SIBLING module's /usr or /etc
# content unioned into the same fat rootfs, not just redis's own files.
# Per-library globs under the multiarch lib dir (not a whole-directory
# carve) — see qemu-guest-agent's file_spec comment for why a directory-
# wide glob risks over-carving base-shared candidates. /var is still
# intentionally omitted — runtime state (data dirs, logs) materializes
# on first boot into the overlay's writable upper layer.
file_spec:
  - /etc/default/redis-server
  - /etc/init.d/redis-server
  - /etc/logrotate.d/redis-server
  - /usr/bin/redis-benchmark
  - /usr/bin/redis-check-aof
  - /usr/bin/redis-check-rdb
  - /usr/bin/redis-cli
  - /usr/bin/redis-server
  - /usr/lib/systemd/system/redis-server.service
  - /usr/lib/systemd/system/redis-server@.service
  - /usr/lib/x86_64-linux-gnu/libatomic.so*
  - /usr/lib/x86_64-linux-gnu/libjemalloc.so*
  - /usr/lib/x86_64-linux-gnu/liblzf.so*
  - /usr/lib/x86_64-linux-gnu/libstdc++.so*
  - /usr/share/bash-completion/completions/redis-cli
  - /usr/share/doc/libatomic1
  - /usr/share/doc/libjemalloc2/**
  - /usr/share/doc/liblzf1/**
  - /usr/share/doc/libstdc++6
  - /usr/share/doc/redis-server/**
  - /usr/share/doc/redis-tools/**
  - /usr/share/gcc/python/libstdcxx/**
  - /usr/share/gdb/auto-load/usr/lib/x86_64-linux-gnu/libstdc++.so.6.0.33-gdb.py
  - /usr/share/man/man1/redis-*.1.gz
mask: []
dependency_spec: []
protected_spec:
  - /etc/redis/redis.conf
reboot_required: false

# Platform-allocated fleet-wide Unix identity. redis maps to UID 70140
# (reserved-table slot for databases). Locked shell — redis is daemon-
# only, no interactive access expected.
users:
  - name: redis
    shell: /usr/sbin/nologin
    home: /var/lib/redis
    gecos: Redis server

services:
  - name: redis
    # Wrapper creates /var/lib/redis with redis ownership before
    # exec'ing redis-server. /var is intentionally not shipped in
    # the erofs (runtime state lives in overlay's writable upper).
    start_command: "/usr/local/bin/redis-start.sh"
    restart_policy: always
    user: root
    exposed_ports:
      - { port: 6379, protocol: tcp, name: redis }
    capabilities: []
    # TCP health probe deferred — see postgres-primary for the same
    # ModuleService.HEALTH_METHODS constraint.

dependencies:
  requires:
    # redis-server dynamically links against base-os's glibc/libssl —
    # closure guarantee (campaign 019f6084 inc1).
    - capability:os.userland
  provides:
    - cache.redis
    - cache.kv

security:
  # redis-start.sh runs as root to prep the data dir, then drops to the
  # redis user via runuser. With RootDirectory=/sysroot the agent emits an
  # empty CapabilityBoundingSet= unless caps are declared here, which strips
  # even root's ability to chown/chmod — start.sh then dies with
  # "chown: Operation not permitted". Mirror postgres-primary's minimal set:
  #   CAP_CHOWN        — chown -R redis:redis on data/log/run dirs
  #   CAP_DAC_OVERRIDE — write into redis-owned dirs while still root
  #   CAP_FOWNER       — chmod 750 the data dir after it's redis-owned
  #   CAP_SETUID/GID   — runuser drops to the redis user for redis-server
  #   CAP_SETPCAP      — runuser adjusts the capability set on the dropped child
  capabilities:
    - CAP_CHOWN
    - CAP_DAC_OVERRIDE
    - CAP_FOWNER
    - CAP_SETUID
    - CAP_SETGID
    - CAP_SETPCAP
  egress_allow: []
  privileged: false
  user_namespace: false

build:
  apt_snapshot: "20260415T000000Z"
