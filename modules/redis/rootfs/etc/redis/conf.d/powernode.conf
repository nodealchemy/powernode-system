# !!! WARNING — THIS FILE IS CURRENTLY NOT LOADED. NOTHING BELOW IS IN EFFECT. !!!
#
# The header below claimed these are "loaded via `include` directives at the
# bottom of /etc/redis/redis.conf (debian default reads conf.d)". That is not
# true: the shipped apt redis.conf contains NO `include` directive, so this
# drop-in has never been read on any node. Verified on ops-hub-dev-cell
# 2026-07-31 — the file was present at /etc/redis/conf.d/powernode.conf while
# the running server reported the apt defaults for every setting here:
#
#   appendonly       no                        (this file says yes)
#   save             3600 1 300 100 60 10000   (this file says "")
#   maxmemory        0                         (this file says 512mb)
#   maxmemory-policy noeviction                (this file says allkeys-lru)
#   protected-mode   yes                       (this file says no)
#
# Consequences that have been live the whole time: RDB snapshotting runs
# despite `save ""` below (this is what filled the 512 MB overlay and wedged
# redis into MISCONF), AOF is off so Sidekiq queues do NOT survive a restart
# as the comment below promises, and Redis is memory-unbounded rather than
# evicting at 512 MB.
#
# Wiring the include is deliberately NOT done here: it would activate all five
# settings at once across every node, and `maxmemory 512mb` + allkeys-lru would
# begin evicting on any node whose working set already exceeds that. That needs
# an operator decision and a rolling upgrade, not a silent flip. Until then,
# `dir` is set by sed in redis-start.sh, which does take effect.
#
# Powernode platform Redis overrides.
#
# This Redis hosts three logically-separate workloads — Sidekiq queues
# (db 0), ActionCable pub/sub (db 1), Rails cache (db 2). DB separation
# is per-client convention; only one daemon runs.

bind 0.0.0.0 -::1
protected-mode no  # Platform-owned network; access scoped via VIP + firewall.
port 6379

# 512 MB hard cap is plenty for the platform's queues + cache; if the
# Rails cache fills it, evict allkeys-lru rather than crash Sidekiq.
maxmemory 512mb
maxmemory-policy allkeys-lru

# AOF persistence so Sidekiq doesn't lose jobs across restarts. Sidekiq
# queues are deduplicated at the app layer so any-redundant-replay is
# operator-tolerable, but losing a queued cancellation is not.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Don't dump to RDB — AOF is canonical. Setting save to empty disables.
save ""
