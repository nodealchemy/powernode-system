# Powernode platform Redis overrides.
#
# LOADED by redis-start.sh, which appends an `include` for this directory to
# the bottom of the staged config. It is appended LAST on purpose: redis takes
# the last occurrence of a directive, so these override the apt defaults above
# them. (The original header claimed Debian's redis.conf reads conf.d by
# default. It does not — there is no `include` in the shipped file — so for a
# long time nothing here was in effect. See git history.)
#
# This Redis hosts three logically-separate workloads — Sidekiq queues (db 0),
# ActionCable pub/sub (db 1), Rails cache (db 2). DB separation is per-client
# convention; only one daemon runs.
#
# DELIBERATELY MINIMAL. Everything here changes behaviour on every node the
# moment the include lands, so it carries only what is both necessary and safe:
#
#   * maxmemory / maxmemory-policy are NOT set. The previous draft specified
#     `512mb` + `allkeys-lru`, which is wrong for this instance: eviction on a
#     Redis holding SIDEKIQ QUEUES silently deletes queued jobs, contradicting
#     the AOF rationale below ("losing a queued cancellation is not
#     [tolerable]"). allkeys-lru suits a pure cache; this is a mixed
#     queue+cache daemon. Correct handling is noeviction (the apt default,
#     which is what runs today) plus monitoring — or splitting the workloads.
#     Left alone rather than shipped wrong.
#
#   * bind / protected-mode / port are NOT set. The previous draft widened the
#     bind to 0.0.0.0 with protected-mode off. Every consumer is co-located, so
#     that would expand network exposure fleet-wide for no gain. The apt
#     defaults are what runs today and they work.
#
# What remains flips exactly two things from current live behaviour, and both
# are the fix for a real outage: RDB snapshotting off, AOF on.

# AOF persistence so Sidekiq does not lose jobs across restarts. Sidekiq queues
# are deduplicated at the app layer so a redundant replay is operator-tolerable,
# but losing a queued cancellation is not.
#
# This has NEVER actually been on, because the include was missing — so the
# durability the module claims to provide has not existed on any node.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# No RDB snapshots — AOF is canonical. An empty `save` disables them.
#
# Not merely redundant with AOF: RDB rewrites fork and write a SECOND full copy
# beside the first, which is what wedged a node whose data dir sat on a 512 MB
# tmpfs overlay — the save failed, redis latched MISCONF, and every write was
# refused until it was repaired. redis-start.sh now puts the data dir on
# /persist, and this removes the snapshot path that failed there entirely.
save ""
