schema_version: 1

name: powernode-system-base
display_name: "Powernode System Base (minimal — agent runtime only)"
description: "The truly-minimal Powernode base — ships the cross-compiled Go agent binary at /sbin/powernode-agent and an /etc/powernode/ skeleton. NOT bootable alone (no init system, no userland). Designed as the shared substrate that every OS-specific base module (powernode-system-base-ubuntu-noble, -debian-trixie, -alpine, etc.) depends on, so the agent binary is built once + signed once + verified once regardless of which OS variant a node runs. Capability provided: powernode.agent."
license: "MIT"
category: system-base

# No apt packages — this module is hermetic, built from a fresh
# mmdebstrap that contributes nothing but the ca-certificates floor
# (which Stage 2's rsync filter discards because the file_spec below
# only keeps /sbin/powernode-agent + /etc/powernode/).
package_spec: []

# Only ships what's needed for the agent contract:
#   /usr/sbin/powernode-agent — canonical location, what the
#                                post-switch_root systemd unit invokes
#   /sbin/powernode-agent     — symlink to /usr/sbin/powernode-agent
#                                for the initramfs/dracut hook + legacy
#                                lookups that still expect /sbin
#   /etc/powernode/           — config skeleton; OS variants + boot.go fill it
file_spec:
  - "/usr/sbin/powernode-agent"
  - "/sbin/powernode-agent"
  - "/etc/powernode/**"
  # Recovery console drop-in (see the file's own header). Narrow glob on
  # purpose: a broad /etc/systemd/system/** would sweep unrelated units out
  # of the builder rootfs into this module's layer.
  - '/etc/systemd/system/serial-getty@ttyS0.service.d/**'
  # /persist soft-reboot survival drop-in (see the file's own header).
  # Same narrow-glob discipline as the line above.
  - '/etc/systemd/system/persist.mount.d/**'

# NOTE ON /sbin — do NOT ship real files here.
#
# Ubuntu is usr-merged: /sbin is a symlink to usr/sbin. Any module that ships a
# real path under /sbin forces the composed overlay to materialise /sbin as a
# DIRECTORY, which shadows that symlink and hides every binary in /usr/sbin from
# anything that resolves by /sbin path. On ops-hub that meant 1 visible entry
# against 170, and it silently broke two consumers: qemu-ga's guest-shutdown
# (execs /sbin/shutdown, so `qm shutdown` could never work — every stop degraded
# to a hard power-off) and the kernel's usermode helper (execs /sbin/modprobe, so
# request_module autoloading failed fleet-wide).
#
# This module previously carried a rootfs/sbin/.gitkeep placeholder plus explicit
# symlinks for the casualties as they were discovered. Both are gone: the agent's
# prepare-root now creates /sbin AS the usr-merge symlink (see ensureSbin), so
# /sbin/powernode-agent below resolves through it to /usr/sbin/powernode-agent —
# along with everything else in /usr/sbin — with nothing shipped here at all.
#
# 2026-08-07 — that last paragraph describes the SOURCE, not the fleet. ensureSbin
# is correct in-tree (c0e6e7e2, 2026-07-25) but the binary that actually runs
# prepare-root lives in the UKI initramfs, and dev-cell boots image 6924d16c
# (2026-07-20) — `git merge-base --is-ancestor c0e6e7e2 6924d16c` is FALSE, so
# the fix is absent from the running image and the defect recurred live. A new
# UKI is not deliverable by `agent update`, a module overlay, or an LKG retarget;
# it needs a disk-image rebuild. Until every node boots an image carrying
# c0e6e7e2, the usr-merge symlink is supplied by the OS layer instead — see the
# NOTE ON rootfs/sbin in modules/base-os-ubuntu-noble/manifest.yaml. Deleting
# that symlink regresses only nodes still on a stale UKI, which is exactly the
# kind of silent, delayed regression this note exists to prevent.
#
# The rule above is UNCHANGED and still absolute: do not ship real files under
# /sbin from this module. A symlink in the OS layer is not an exception to it —
# a real path here would still shadow the merge for the whole union.

mask: []
dependency_spec: []

# /sbin/powernode-agent is the platform-trust boundary — NO higher
# module may overlay-replace it. The cosign signature on this erofs
# blob is the only authority the agent runtime accepts; if an OS
# variant could shadow this path, an attacker who compromised the
# OS variant could swap the agent for a backdoored copy.
protected_spec:
  - "/usr/sbin/powernode-agent"
  - "/sbin/powernode-agent"

reboot_required: false

dependencies:
  requires: []
  # Capability tag that OS variants + standalone consumers depend on.
  # When a node template asks for `powernode.agent`, the resolver
  # picks this module (it's the only one that provides it). When a
  # template asks for `base.os`, the resolver picks one of the
  # OS-specific variants which transitively pull this one in via
  # their own requires.
  provides:
    - powernode.agent

services: []

security:
  capabilities: []
  egress_allow: []
  privileged: false
  user_namespace: false

skills: []

build:
  apt_snapshot: "20260415T000000Z"
