# Keep the /persist carrier mounted through the shutdown phase.
#
# WHAT THIS UNIT IS. It is the bind of /persist into the soft-reboot target
# root: `mount --rbind /persist /run/nextroot/persist`, made by the agent's
# prepareNextrootMounts. systemd synthesizes the unit from
# /proc/self/mountinfo, so like run-nextroot.mount it exists only between a
# prepare and the soft-reboot that consumes it.
#
# WHY A SECOND FILE, WHEN persist.mount ALREADY HAS ONE. Because a drop-in
# extends ONE unit. persist.mount.d/10-soft-reboot-survival.conf keeps
# /persist itself alive; it says nothing about this separate, generated
# unit. And after the /run-bind fix (see prepareNextrootMounts — binding
# /run into a target inside /run destroyed running nodes) this bind is the
# SOLE path by which /persist reaches the new root. Lose it and userspace
# comes up unable to resolve anything under /persist: no enrolled mTLS PKI,
# no boot LKG or pending-compose state, no module blob cache, and none of
# the durable state kept under /persist/var. On a self-hosted control plane
# that is unrecoverable: the platform the node would re-enroll against is
# the node itself.
#
# (Mechanism note, because the phrasing elsewhere in this tree misleads:
# that durable state is reached through absolute /persist/... paths. /var is
# NOT a separate bind mount on a current node — the agent's
# EnsurePersistentVar has no production caller — so what is lost is the
# ability to resolve those paths, not a /var mount.)
#
# NOTE ON A MEASUREMENT THAT LOOKS LIKE A CONTRADICTION. A scratch-VM run
# (systemd 255, 2026-08-11) found that when persist.mount is torn down the
# carrier goes with it, and that the carrier reported
# DefaultDependencies=yes in BOTH runs — including the one where /persist
# survived. That is why the agent's PREFLIGHT checks /persist and not this
# bind: at preflight time this unit does not exist at all. It is not an
# argument against this file. Those runs had no drop-in for this unit;
# nothing was measured about what one does. The two guards are
# complementary — persist.mount keeps the source alive, this keeps the
# carrier alive — and the gate that reads this file runs after the mount is
# real.
#
# WHY ONE DIRECTIVE IS ENOUGH, and why a real reboot is still safe: see the
# notes in persist.mount.d/10-soft-reboot-survival.conf — systemd adds
# Conflicts=umount.target as part of default-dependency processing, and
# systemd-shutdown's final pass still brings the filesystem down cleanly.
#
# VERIFIED / NOT VERIFIED, and the fail-closed pairing: identical to
# run-nextroot.mount.d/10-soft-reboot-survival.conf — read it there.
[Unit]
DefaultDependencies=no
