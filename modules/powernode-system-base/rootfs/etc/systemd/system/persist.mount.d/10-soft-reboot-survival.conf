# Keep /persist mounted across a systemd soft-reboot.
#
# WHY THIS EXISTS. `systemctl soft-reboot` restarts userspace without
# touching the kernel — the basis of the agent's `soft-recompose` tier,
# which applies a reboot_required module change in seconds instead of a
# full boot. But soft-reboot does NOT preserve mounts by default.
# systemd-soft-reboot.service(8) guarantees only that "/run/ file system
# remains mounted"; anything else survives only if "configured to remain
# until the very end of the shutdown process".
#
# /persist is not configured that way out of the box. On a stock pivot
# node it reports DefaultDependencies=yes and Conflicts=umount.target
# (verified on a live node 2026-08-07), so an unguarded soft-reboot would
# switch into the new root with /persist GONE: no enrolled mTLS PKI, no
# boot LKG or pending-compose, no durable /var. On a self-hosted control
# plane that is unrecoverable — the platform the node would re-enroll
# against is the node itself.
#
# WHY ONE DIRECTIVE IS ENOUGH. Conflicts=umount.target is not written
# anywhere; systemd ADDS it as part of default-dependency processing.
# Turning default dependencies off therefore removes both halves at once
# — confirmed empirically: with this drop-in loaded, persist.mount
# reports DefaultDependencies=no and an EMPTY Conflicts. Do not "also"
# add `Conflicts=` here; an explicit empty list is redundant and reads
# like the implicit conflict were still being fought.
#
# WHY THIS DOES NOT ENDANGER A REAL REBOOT. DefaultDependencies=no only
# removes the ordinary umount.target teardown. A genuine reboot/poweroff
# still ends in systemd-shutdown's final pass, which unmounts (or
# remounts read-only) every filesystem still standing. That is the same
# mechanism the early mounts — /, /usr — already depend on, since systemd
# gives them DefaultDependencies=no by default for exactly this reason.
# So /persist is still brought down cleanly; it is merely brought down at
# the end rather than in the middle.
#
# WHY A DROP-IN WITH NO UNIT FILE TO EXTEND. persist.mount has no
# fragment at all: the initramfs mounts /persist before systemd starts,
# and systemd synthesizes the unit from /proc/self/mountinfo
# (SourcePath=/proc/self/mountinfo, FragmentPath empty). Drop-ins still
# apply to such adopted units — verified on a live node, where this file
# showed up in DropInPaths and changed the resolved properties. There is
# consequently nothing to "override" here, and shipping a full
# persist.mount unit instead would be wrong: it would hard-code the
# device and options that discovery gets right per node.
#
# WHEN IT TAKES EFFECT. systemd only sees a new drop-in after a
# `systemctl daemon-reload` (or the next boot). This module carries no
# services, so a hot-reconcile that delivers this file does not itself
# trigger a reload. That is safe in the direction that matters: until
# systemd has loaded it, `systemctl show persist.mount` still reports the
# old properties, and the agent's soft-recompose preflight keeps refusing
# — it fails CLOSED, never silently proceeding on an unproven mount.
#
# WHY IT LIVES IN powernode-system-base. Same rationale as the recovery
# console drop-in alongside it: system-base is the floor of the
# composition, present on every node whatever OS variant it runs, and it
# is reboot_required:false so this reaches running nodes through the
# ordinary hot-reconcile path.
[Unit]
DefaultDependencies=no
