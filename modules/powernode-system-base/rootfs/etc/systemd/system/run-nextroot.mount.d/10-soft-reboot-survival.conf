# Keep the soft-reboot target union mounted through the shutdown phase.
#
# WHAT THIS UNIT IS. `powernode-agent soft-recompose` composes the node's
# desired module set as a fresh overlay at /run/nextroot — the path
# systemd-soft-reboot switches into. The unit is not shipped by anyone:
# systemd synthesizes it from /proc/self/mountinfo the moment the agent
# mounts the union, exactly as it does for persist.mount. It therefore
# exists only between a prepare and the soft-reboot that consumes it, and
# this drop-in is inert the rest of the time.
#
# WHY IT MUST SURVIVE. soft-reboot does NOT preserve mounts by default.
# systemd-soft-reboot.service(8) guarantees only that "/run/ file system
# remains mounted"; anything else survives only if "configured to remain
# until the very end of the shutdown process". If this union is torn down
# at umount.target, PID1 probes /run/nextroot, finds no OS tree, and
# SILENTLY DOES NOT SWITCH — userspace restarts on the old module set. That
# failure is worse than a crash because it is quiet: it looks exactly like a
# successful soft-reboot from the outside.
#
# WHY ONE DIRECTIVE IS ENOUGH. Conflicts=umount.target is not written
# anywhere; systemd ADDS it during default-dependency processing, so turning
# default dependencies off removes both halves at once. Do not "also" add an
# explicit `Conflicts=` — see the note in persist.mount.d.
#
# WHY THIS DOES NOT ENDANGER A REAL REBOOT. DefaultDependencies=no removes
# only the ordinary umount.target teardown. A genuine reboot still ends in
# systemd-shutdown's final pass, which unmounts everything left standing —
# and /run is a tmpfs that does not outlive the kernel in any case.
#
# WHAT IS VERIFIED AND WHAT IS NOT. That a drop-in applies to a
# mountinfo-synthesized unit with no fragment of its own is verified live,
# on persist.mount (it appeared in DropInPaths and changed the resolved
# properties). That the SAME mechanism works for this unit follows from the
# same code path but has NOT been measured on a pivot node — doing so needs
# a disposable one. This file is therefore paired with a gate that fails
# closed: runtime.NextrootSurvivalGate probes the resolved properties after
# a daemon-reload and REFUSES the soft-reboot if they are not what this file
# asks for. If the drop-in does not take effect, the tier stops working; it
# does not lose a node.
#
# WHEN IT TAKES EFFECT. systemd only picks up a new drop-in file after a
# `systemctl daemon-reload` (or the next boot). The agent runs that reload
# itself, immediately before probing — the properties are otherwise read
# pre-delivery and a correctly configured node is refused.
[Unit]
DefaultDependencies=no
