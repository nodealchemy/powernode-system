# Powernode recovery console — autologin on the serial port.
#
# WHY THIS EXISTS (ops-hub, 2026-07-27). The control plane spent an evening
# healthy and serving /up while being completely unmanageable: its
# qemu-guest-agent died, SSH was denied, and there was no way in. The console
# was in fact prompting the whole time — but a login prompt is useless without
# a credential, and these appliances have no console password. Recovery
# therefore depended entirely on the agent staying alive to sync operator SSH
# keys into /root/.ssh/authorized_keys, which lives on the tmpfs overlay and is
# rebuilt from the platform on EVERY boot. No agent, no keys, no access.
#
# WHY AUTOLOGIN IS NOT A WEAKENING. This unit is bound to ttyS0, which QEMU
# exposes only as a unix socket on the hypervisor
# (/var/run/qemu-server/<vmid>.serial0), readable solely by root on the PVE
# host. Anyone holding that already has strictly greater power than a shell in
# the guest: they can stop the VM and mount its disk offline, which is exactly
# how this node was inspected while locked out. Autologin grants nothing that
# access did not already confer — it only removes a single point of
# unrecoverability. It does NOT touch sshd, which keeps PasswordAuthentication
# no and key-only auth over the network.
#
# WHY IT LIVES IN powernode-system-base. There is no root filesystem in the
# disk image to put it in — the image ships only the UKI (kernel + initramfs)
# plus BOOT and persist partitions, and the entire running root is composed
# from modules. system-base is the floor of that composition: it carries the
# agent itself, at the lowest powernode priority, so if it is missing the node
# has nothing to recover TO. Placing the console here means it survives the
# failure class that actually occurred — a higher-priority module (qga) dying
# while the base composed fine.
#
# The empty ExecStart= is required: it clears the inherited command before the
# replacement is appended, otherwise systemd refuses the unit with two ExecStart
# entries for a Type=idle service.
#
# WHY /usr/sbin/agetty AND NOT /sbin/agetty. /sbin is only a path to agetty when
# it is the usr-merge SYMLINK, and that is guaranteed by the AGENT (prepare-root's
# ensureSbin, added 2026-07-25 in c0e6e7e2) — not by this module. Any node whose
# pre-pivot agent predates that fix composes /sbin as a real DIRECTORY holding
# just powernode-agent, and /sbin/agetty does not exist there. ops-hub is exactly
# such a node: it boots from a frozen 2026-07-19 LKG, so retargeting this module
# does NOT give it a newer pre-pivot agent. Combined with the leading `-` below
# (which tells systemd to ignore a failed exec) that would have failed SILENTLY —
# a recovery console that reports healthy and hands back nothing. /usr/sbin/agetty
# is where util-linux actually installs the binary and resolves either way.
[Service]
ExecStart=
ExecStart=-/usr/sbin/agetty --autologin root --keep-baud 115200,57600,38400,9600 - vt220
