  # above (dpkg's bug-report template, gcc/gdb's libstdc++ pretty-
  # printers, libc-bin's default nsswitch.conf, dpkg's lintian profile,
  # locales' language-pack helper scripts, polkit's dpkg-pkexec action,
  # readline's default inputrc, ssl-cert's openssl config template — same
  # set postgres-replica's manifest hit on its own first conformance pass).
