schema_version: 1
name: postgres-primary
display_name: PostgreSQL 16
description: PostgreSQL server providing the platform's primary database
license: PostgreSQL
category: data-plane
package_spec:
  - postgresql-16
  - postgresql-contrib-16
  - postgresql-client-16
  # pgvector — the platform schema enables the `vector` extension for embeddings
  # (db/schema.rb: enable_extension "vector"). Without it db:migrate aborts with
  # PG::FeatureNotSupported: extension "vector" is not available.
  - postgresql-16-pgvector
# campaign 019f6084 P0-C wave 2: curated from the real apt-ownership
# closure (derive-file-spec.sh --mode deb-payload against [postgresql-16,
# postgresql-contrib-16, postgresql-client-16, postgresql-16-pgvector]:
# 5505 owned files — 48 more than postgres-replica's identical [postgresql-
# 16, postgresql-client-16] pair, all of them pgvector's own extension
# files; postgresql-contrib-16 is a metapackage that adds nothing new of
# its own on top of postgresql-16's own closure). Same rationale as
# postgres-replica's manifest (read that file's file_spec comment for the
# full derivation story — perl/dpkg/netbase/locales/tzdata/readline-common
# genuinely owned, none pulled by base-os's own package_spec); this
# manifest's /usr/bin, /usr/sbin, /usr/lib/x86_64-linux-gnu (loose files),
# /usr/lib/systemd, /usr/share/lintian/overrides, /usr/share/perl5, and
# loose /etc entries are IDENTICAL to postgres-replica's (verified via
# diff against that module's own derive output — same two core packages,
# same closure) plus pgvector's own additions folded into the existing
# postgres-exclusive namespace globs (/usr/lib/postgresql/16/**,
# /usr/share/postgresql/16/**, /usr/share/doc/** already cover vector.so,
# the bitcode/ dir, the extension/vector--*.sql upgrade scripts, and
# vector.control) plus ONE new entry: pgvector also ships a C header
# under /usr/include/postgresql/16/server/, a tree no OTHER package in
# this closure populates (postgres-client/-contrib ship no server dev
# headers), so it's declared directly. /var is intentionally omitted —
# see postgres-replica's manifest for the identical first-boot-initdb
# rationale (this module's own version: postgres-start.sh below). This
# module's own hand-authored /usr/local/bin/postgres-start.sh and
# /etc/postgresql/16/main/conf.d/powernode.conf ride rootfs/ overlay
# (stage2-carve.sh layers it unconditionally, exempted from this check's
# over-inclusion count) — declared here anyway for readability, matching
# claude-tmux's/dev-cell's precedent for their own rootfs/-provided files.
file_spec:
  - /usr/local/bin/postgres-start.sh
  - /etc/postgresql/16/main/conf.d/powernode.conf
  - /usr/include/postgresql/16/server/extension/vector/vector.h

  - /usr/lib/x86_64-linux-gnu/libLLVM-17.so
  - /usr/lib/x86_64-linux-gnu/libLLVM-17.so.1
  - /usr/lib/x86_64-linux-gnu/libexslt.so.0
  - /usr/lib/x86_64-linux-gnu/libexslt.so.0.8.21
  - /usr/lib/x86_64-linux-gnu/libgdbm.so.6
  - /usr/lib/x86_64-linux-gnu/libgdbm.so.6.0.0
  - /usr/lib/x86_64-linux-gnu/libgdbm_compat.so.4
  - /usr/lib/x86_64-linux-gnu/libgdbm_compat.so.4.0.0
  - /usr/lib/x86_64-linux-gnu/libhistory.so.8
  - /usr/lib/x86_64-linux-gnu/libhistory.so.8.2
  - /usr/lib/x86_64-linux-gnu/libicudata.so.74
  - /usr/lib/x86_64-linux-gnu/libicudata.so.74.2
  - /usr/lib/x86_64-linux-gnu/libicui18n.so.74
  - /usr/lib/x86_64-linux-gnu/libicui18n.so.74.2
  - /usr/lib/x86_64-linux-gnu/libicuio.so.74
  - /usr/lib/x86_64-linux-gnu/libicuio.so.74.2
  - /usr/lib/x86_64-linux-gnu/libicutest.so.74
  - /usr/lib/x86_64-linux-gnu/libicutest.so.74.2
  - /usr/lib/x86_64-linux-gnu/libicutu.so.74
  - /usr/lib/x86_64-linux-gnu/libicutu.so.74.2
  - /usr/lib/x86_64-linux-gnu/libicuuc.so.74
  - /usr/lib/x86_64-linux-gnu/libicuuc.so.74.2
  - /usr/lib/x86_64-linux-gnu/libperl.so.5.38
  - /usr/lib/x86_64-linux-gnu/libperl.so.5.38.2
  - /usr/lib/x86_64-linux-gnu/libpq.so.5
  - /usr/lib/x86_64-linux-gnu/libpq.so.5.16
  - /usr/lib/x86_64-linux-gnu/libreadline.so.8
  - /usr/lib/x86_64-linux-gnu/libreadline.so.8.2
  - /usr/lib/x86_64-linux-gnu/libstdc++.so.6
  - /usr/lib/x86_64-linux-gnu/libstdc++.so.6.0.33
  - /usr/lib/x86_64-linux-gnu/libxml2.so.2
  - /usr/lib/x86_64-linux-gnu/libxml2.so.2.9.14
  - /usr/lib/x86_64-linux-gnu/libxslt.so.1
  - /usr/lib/x86_64-linux-gnu/libxslt.so.1.1.39
  # postgres's own binary/library tree + share/doc tree (incl. pgvector's
  # vector.so, its bitcode/ dir, and its extension--*.sql upgrade scripts)
  # — package-exclusive namespace, only this closure's postgresql*
  # packages would ever populate it.
  - /usr/lib/postgresql/16/**
  - /usr/share/postgresql/16/**
  - /usr/share/postgresql-common/**
  # perl's own CORE runtime module tree — see postgres-replica's manifest
  # for why /usr/share/perl5/ (the SHARED third-party sitelib debconf also
  # populates) is named explicitly instead of directory-globbed.
  - /usr/share/perl/**
  - /usr/share/perl5/JSON.pm
  - /usr/share/perl5/JSON/**
  - /usr/share/perl5/PgCommon.pm
  - /usr/lib/x86_64-linux-gnu/perl/**
  - /usr/lib/x86_64-linux-gnu/perl-base/**
  # locales (/usr/share/i18n) + tzdata (/usr/share/zoneinfo) + the C.utf8
  # locale postgres's own collation defaults to.
  - /usr/share/i18n/**
  - /usr/share/zoneinfo/**
  - /usr/lib/locale/**
  # dpkg's own aux dirs (postgresql-common's scripts shell out to
  # dpkg --compare-versions).
  - /usr/libexec/dpkg/**
  - /usr/share/dpkg/**
  - /usr/lib/mime/packages/tar
  - /usr/lib/tmpfiles.d/postgresql-common.conf
  # postgresql-common's/dpkg's own systemd units — not wired into this
  # module's services: lifecycle (this module's actual server process is
  # the services: entry below), listed here only so the apt-shipped files
  # themselves are carved.

  - /usr/lib/systemd/system-generators/postgresql-generator
  - /usr/lib/systemd/system/dpkg-db-backup.service
  - /usr/lib/systemd/system/dpkg-db-backup.timer
  - /usr/lib/systemd/system/pg_basebackup@.service
  - /usr/lib/systemd/system/pg_basebackup@.timer
  - /usr/lib/systemd/system/pg_compresswal@.service
  - /usr/lib/systemd/system/pg_compresswal@.timer
  - /usr/lib/systemd/system/pg_dump@.service
  - /usr/lib/systemd/system/pg_dump@.timer
  - /usr/lib/systemd/system/pg_receivewal@.service
  - /usr/lib/systemd/system/postgresql.service
  - /usr/lib/systemd/system/postgresql@.service
  - /usr/lib/systemd/system/ssl-cert.service
  # Per-package lintian overrides — not a directory-wide glob, same
  # base-shared-candidate reason as postgres-replica's/runtime-ruby's manifests.
  - /usr/share/lintian/overrides/dpkg
  - /usr/share/lintian/overrides/libc-bin
  - /usr/share/lintian/overrides/libgdbm-compat4t64
  - /usr/share/lintian/overrides/libgdbm6t64
