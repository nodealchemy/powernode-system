  - /usr/share/lintian/overrides/perl
  - /usr/share/lintian/overrides/perl-base
  - /usr/share/lintian/overrides/postgresql-16
  - /usr/share/lintian/overrides/postgresql-client-16
  - /usr/share/lintian/overrides/postgresql-client-common
  - /usr/share/lintian/overrides/postgresql-common
  - /usr/share/lintian/overrides/readline-common
  - /usr/share/lintian/overrides/ssl-cert
  - /usr/share/lintian/overrides/tzdata
  # /usr/bin, /usr/sbin, /usr/libexec/dpkg, /etc — enumerated individually.
  - /usr/bin/clusterdb
