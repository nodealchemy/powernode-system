schema_version: 1
name: postgres-primary
display_name: PostgreSQL 16
description: PostgreSQL server providing the platform's primary database
license: PostgreSQL
package_spec:
  - postgresql-16
  - postgresql-contrib-16
  - postgresql-client-16
# Ship the full apt-installed tree under the four standard FHS roots.
# /usr covers /usr/lib/postgresql/16/bin/postgres + initdb + pg_ctl
# + extension .so plugins + /usr/share/postgresql. /lib + /lib64
# cover libc, libssl, libxml2, libldap, libreadline, libgssapi-krb5
# that postgres dynamically links. /etc carries /etc/postgresql/16/
# + /etc/postgresql-common/ helpers. /var is omitted — the data dir
# at /var/lib/postgresql/16/main initializes on first boot into the
# overlay's writable upper layer (initdb runs from a wrapper script
# at module startup).
file_spec:
  - /usr/**
  - /lib/**
  - /lib64/**
  - /etc/**
mask: []
dependency_spec: []
protected_spec:
  - /etc/postgresql/16/main/postgresql.conf
reboot_required: false

# Platform-allocated fleet-wide Unix identities. postgres maps to UID
# 70110 (reserved-table slot for databases); ssl-cert is a supplementary
# group postgres joins so it can read certificates issued by the ACME
# pipeline into /etc/ssl/private/.
users:
  - name: postgres
    shell: /bin/bash
    home: /var/lib/postgresql
    gecos: PostgreSQL administrator
    supplementary_groups: [ssl-cert]
groups:
  - name: ssl-cert

# Narrow per-command sudo grant: postgres needs to invoke systemctl
# reload after the ACME pipeline rotates certificates (postgres only
# notices new cert files after SIGHUP). No restart grant — that would
# let postgres drop user connections at will.
sudoers:
  - id: reload
    user: postgres
    runas: root
    commands:
      - /usr/bin/systemctl reload postgresql.service

services:
  - name: postgres
    # The wrapper handles first-boot initdb (the module deliberately
    # omits /var from file_spec, so data dir is empty on first start).
    # Runs as root so it can mkdir + chown /var/lib/postgresql before
    # dropping to the postgres user via runuser.
    start_command: "/usr/local/bin/postgres-start.sh"
    stop_command: "/usr/bin/pg_ctl -D /var/lib/postgresql/16/main stop -m fast"
    restart_policy: always
    user: root
    working_directory: /var/lib/postgresql
    exposed_ports:
      - { port: 5432, protocol: tcp, name: postgres }
    capabilities: []
    # TCP health probe deferred: ModuleService.HEALTH_METHODS = GET/POST/PUT only.
    # Operator monitors Postgres readiness via `pg_isready` in a sidecar
    # systemd unit (future work) — model schema needs a TCP/exec method
    # before we can express it declaratively here.
    metadata:
      pg_data: /var/lib/postgresql/16/main
      pg_version: "16"

dependencies:
  requires: []
  provides:
    - database.postgres
    - database.postgres.primary
    - database.postgres.v16

security:
  # postgres-start.sh runs as root to prep the data dir, then drops to
  # the postgres user via runuser. With RootDirectory=/sysroot the agent
  # emits an empty CapabilityBoundingSet= unless caps are declared here,
  # which strips even root's ability to chown/chmod — start.sh then dies
  # with "chown: Operation not permitted". Declare the minimal set the
  # init sequence needs:
  #   CAP_CHOWN       — chown -R postgres:postgres on the data/run/log dirs
  #   CAP_DAC_OVERRIDE— write into postgres-owned dirs while still root
  #   CAP_FOWNER      — chmod 700 the data dir after it's postgres-owned
  #   CAP_SETUID/GID  — runuser drops to the postgres user for initdb/postgres
  #   CAP_SETPCAP     — runuser adjusts the capability set on the dropped child
  capabilities:
    - CAP_CHOWN
    - CAP_DAC_OVERRIDE
    - CAP_FOWNER
    - CAP_SETUID
    - CAP_SETGID
    - CAP_SETPCAP
  egress_allow: []
  privileged: false
  user_namespace: true

build:
  apt_snapshot: "20260415T000000Z"
