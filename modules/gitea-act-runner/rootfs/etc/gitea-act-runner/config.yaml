# gitea-act-runner config.yaml — non-secret act_runner configuration.
#
# Deliberately carries NO registration token or instance URL — those are
# live-minted per service start by gitea-act-runner-register.sh and fed to
# `act_runner register` over STDIN by gitea-act-runner-start.sh (see both
# scripts + this module's manifest.yaml `runner` service). runner.file
# below is the ONLY place the resulting `.runner` credentials file is
# recorded; that file itself is written by `act_runner register`, not this
# config.

log:
  level: info

runner:
  # Where `act_runner register` writes (and `act_runner daemon` reads) the
  # long-lived runner credentials it obtains from the one-time registration
  # token — NOT the token itself. Lives under StateDirectory
  # (/var/lib/gitea-act-runner), so it survives service restarts/reboots;
  # gitea-act-runner-register.sh's idempotency check tests for this exact
  # path.
  file: /var/lib/gitea-act-runner/.runner
  capacity: 1
  timeout: 3h
  insecure: false

cache:
  enabled: true
  dir: /var/lib/gitea-act-runner/cache

container:
  # Local unix socket only — no SDWAN, no docker-engine module, no managed
  # DockerHost (see this module's manifest.yaml description).
  #
  # /run, NOT /var/run: on this platform's pivot-boot rootfs, /var/run is a
  # real, root-only (0700) directory, not the usual symlink to /run — a
  # non-root process can't even traverse into /var/run, so
  # unix:///var/run/docker.sock fails "permission denied" (not "no such
  # file") despite pnrunner being in the docker group and the socket
  # existing fine at the real path, /run/docker.sock (see gitea-act-runner-
  # docker.socket's ListenStream=/run/docker.sock).
  docker_host: "unix:///run/docker.sock"
  # host, not bridge: this platform's disk images ship no /lib/modules, so
  # the kernel can't create bridge/veth devices ("Unknown device type") —
  # dockerd itself runs with --bridge=none (folded into gitea-act-runner-
  # docker.service's ExecStart) to skip the broken default-bridge creation.
  # Job containers share the instance's network namespace directly instead,
  # which needs no bridge kernel support and doesn't weaken this module's
  # already-documented security posture (isolation is the ephemeral
  # instance, not the container — see this module's manifest.yaml SECURITY
  # POSTURE section).
  network: host
  privileged: false

host:
  workdir_parent: /var/lib/gitea-act-runner/act
