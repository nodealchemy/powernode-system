# --bridge=none: this platform's disk images ship no /lib/modules, so the
# kernel can't create bridge/veth devices ("Unknown device type" from
# `ip link add type bridge`) — dockerd's default startup tries to create
# the docker0 bridge network unconditionally and fails with "operation not
# supported", taking the whole daemon down. Skipping it here means job
# containers run with --network host instead (see this module's
# rootfs/etc/gitea-act-runner/config.yaml container.network: host).
[Service]
ExecStart=
ExecStart=/usr/bin/dockerd -H fd:// --containerd=/run/containerd/containerd.sock --bridge=none
