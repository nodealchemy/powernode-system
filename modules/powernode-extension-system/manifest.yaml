schema_version: 1
name: powernode-extension-system
display_name: Powernode System Extension
description: The Powernode System extension Rails engine (nodes, modules, SDWAN, fleet autonomy, Go agent control plane)
license: MIT
category: platform-apps
package_spec: []
# Ships THIS submodule's content under /opt/powernode/extensions/system/.
# The extension.json sibling is what extensions_loader_helper.rb scans
# (it walks /opt/powernode/extensions/*/extension.json). server/ is the
# Rails engine the helper turns into a path-gem in hub-backend's Gemfile.
#
# The second entry ships the extension's DEDICATED-MODULE frontend build
# (stage15.sh's powernode-extension-system arm: `vite build --config
# vite.config.build.ts`, an ESM bundle with core's HOST_EXPOSED_IDS left
# external) under the SAME path core's own hub-frontend module serves from
# (/opt/powernode/frontend/dist/**) — the overlay union lands
# extensions/system/** under that root, so Caddy (powernode-hub-frontend's
# static server) serves /extensions/system/manifest.json + its entry/css
# same-origin, with zero change to the serving config.
file_spec:
  - /opt/powernode/extensions/system/**
  - /opt/powernode/frontend/dist/extensions/system/**
mask:
  - /opt/powernode/extensions/system/tmp/***
  - /opt/powernode/extensions/system/.git/***
  - /opt/powernode/extensions/system/agent/dist/***
  - /opt/powernode/extensions/system/modules/***
  - /opt/powernode/extensions/system/initramfs/***
  - /opt/powernode/extensions/system/docs/***
dependency_spec: []
protected_spec: []
reboot_required: false

dependencies:
  requires:
    - powernode/powernode-hub-backend@^1.0

# Extension is mounted under the Rails app's extensions/ tree and
# loaded by the hub-backend at boot; it owns no long-running services
# of its own — its controllers + jobs run inside hub-backend's rails
# and hub-worker's sidekiq processes.
services: []

# Because `services` is empty, updating this module used to restart NOTHING:
# the agent re-renders units only when a module's OWN services-block hash
# drifts, so new extension code landed on disk while the processes that load
# it kept serving the old copy. Verified live on 2026-08-16 — v53 was built,
# signed, promoted and materialised (the node's running_module_digests matched
# the published oci_digest byte-for-byte) and Rails never restarted; a 200s
# poll of /up across the delivery saw zero 502s. Every extension change before
# then had activated only by COINCIDENCE, when a core deploy happened to
# restart Rails.
#
# So name the processes that actually load this code. Each entry targets
# another module's service; the restart fires once that instance has
# materialised this module's new digest, never merely on promotion.
#
# All three are load-bearing, not defensive:
#   rails      — extensions_loader_helper turns server/ into a path-gem at boot
#   sidekiq    — worker/config/boot.rb requires worker/app/{services,jobs}/**
#   worker-web — config.ru line 3 requires the SAME config/application, so the
#                HTTP worker loads this extension exactly as sidekiq does.
#                Omitting it would leave the embeddings/LLM-proxy process on
#                stale code indefinitely, which is the quiet half of this bug.
restart_after_update:
  - module: powernode-hub-backend
    services: [rails]
  - module: powernode-hub-worker
    services: [sidekiq, worker-web]

security:
  capabilities: []
  egress_allow: []
  privileged: false
  user_namespace: true

build:
  apt_snapshot: "20260415T000000Z"
