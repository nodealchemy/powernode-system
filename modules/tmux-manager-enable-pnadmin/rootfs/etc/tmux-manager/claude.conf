# Managed by the tmux-manager-enable-pnadmin module — edit in git, not here.
#
# Local edits DO appear to work and are silently lost: /etc lives on the pivot
# node's tmpfs-backed overlay upper, so a write here (including
# `tmux-manager enable/disable`, which rewrites ENABLED=) copies up into tmpfs
# and is discarded on the next boot. This file is the source of truth.
SESSION_NAME=claude
ENABLED=true
WINDOW=claude:claude
