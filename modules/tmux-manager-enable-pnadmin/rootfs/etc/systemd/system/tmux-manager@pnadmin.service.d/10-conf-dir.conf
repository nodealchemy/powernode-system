# Read session declarations from composed content instead of $HOME.
#
# The default is ~/.tmux-manager, which cannot work here: persist-home
# bind-mounts /persist/home/pnadmin over /home/pnadmin, and a bind mount
# SHADOWS any composed content underneath it — so a module could never ship a
# session config into the home directory. Pointing the CLI at /etc/tmux-manager
# puts the declaration back on the composed side, where it is versioned,
# reviewable and re-applied every boot.
#
# Environment= is additive across drop-ins, so the template's
# TMUX_MANAGER_FROM_UNIT=1 is preserved.
[Service]
Environment=TMUX_MANAGER_CONF_DIR=/etc/tmux-manager
