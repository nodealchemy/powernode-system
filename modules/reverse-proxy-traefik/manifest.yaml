schema_version: 1
name: reverse-proxy-traefik
display_name: Powernode Reverse Proxy (Traefik + ACME DNS-01)
description: Traefik handles TLS termination and ACME DNS-01 cert issuance for all federated peers
license: MIT
# Traefik is in noble's universe repo, but mmdebstrap's --include applies a
# ?priority(required) narrow filter that drops it ("Unable to locate package
# traefik") — the same structural blocker as vector + gcsfuse. So package_spec
# stays empty and the binary is fetched-and-sha256-verified from the upstream
# GitHub release in the build-platform-modules Stage 1.5 step (staged into
# /usr/bin/traefik) — hermetic, no checked-in binary, CVE fixes on bump.
#
# campaign 019f6084 P0-C pilot note: this module's file_spec was left
# UNCHANGED here — deliberately, not an oversight. derive-file-spec.sh
# --mode deb-payload derives OWNED from package_spec's resolved apt
# closure; with package_spec empty, both the owned set AND the candidate
# universe it checks file_spec against are empty, so `conformance --mode
# deb-payload` for this module reports a trivial 0/0/0/0 PASS — it isn't
# verifying anything, because the entire /usr/bin/traefik +
# /usr/share/traefik/** + /etc/traefik/** content is staged (fetched in
# CI, not apt-installed) and deb-payload mode has no visibility into
# staged content at all (see the tool's own header, "Fidelity blind
# spots"). Confirmed by running it: real output was owned=0/carved=0/
# over=0/under=0/PASS. The existing three globs already look correct by
# inspection (they match exactly what Stage 1.5 stages + what package_spec
# would have carved were traefik apt-installable), but that's an eyeball
# check, not a tool-verified one — real verification of this module needs
# --mode fat-root against a real built rootfs (the parked builder-fleet
# land gate), not this increment's unprivileged approximation.
package_spec: []
file_spec:
  - /usr/bin/traefik
  - /usr/share/traefik/**
  - /etc/traefik/**
mask: []
dependency_spec: []
protected_spec:
  - /etc/traefik/dynamic
reboot_required: false

services:
  - name: traefik
    start_command: "/usr/bin/traefik --configFile=/etc/traefik/traefik.yml"
    restart_policy: always
    user: traefik
    working_directory: /etc/traefik
    exposed_ports:
      - { port: 80,  protocol: tcp, name: web }
      - { port: 443, protocol: tcp, name: websecure }
    capabilities:
      - CAP_NET_BIND_SERVICE
    health:
      endpoint: "/ping"
      method: GET
      interval_seconds: 15
      timeout_seconds: 3
      initial_delay_seconds: 5

dependencies:
  requires: []
  provides:
    - http.reverse-proxy
    - tls.acme

# The traefik service runs as User=traefik. With RootDirectory=/sysroot the
# agent renders /etc/passwd + /etc/group from module-declared identities
# (etcidentity), so the user must be declared here — apt isn't creating it
# (package_spec is empty; the binary is fetched in CI). uid/gid are
# platform-allocated (reserved.go) and intentionally omitted.
groups:
  - name: traefik
users:
  - name: traefik
    primary_group: traefik
    shell: /usr/sbin/nologin
    # NOT /etc/traefik: home is a passwd-rendering hint only (the process's
    # actual cwd + config path come from working_directory / --configFile
    # above), and the manifest-import validator restricts users[].home to
    # a fixed allowlist of managed roots (excludes /etc — see
    # ManifestImportService::ALLOWED_HOME_ROOTS) so a manifest can't point
    # the agent's home reconciler at a shared system config directory.
    home: /var/lib/traefik
    gecos: "Traefik reverse proxy"

security:
  capabilities:
    - CAP_NET_BIND_SERVICE
  egress_allow: []
  privileged: false
  user_namespace: false

build:
  # The traefik binary is fetched + sha256-verified from the upstream GitHub
  # release in build-platform-modules Stage 1.5 and staged into /usr/bin/traefik
  # (see that step for the pinned version + checksum). package_spec is empty.
  apt_snapshot: "20260415T000000Z"
