schema_version: 1
name: reverse-proxy-traefik
display_name: Powernode Reverse Proxy (Traefik + ACME DNS-01)
description: Traefik handles TLS termination and ACME DNS-01 cert issuance for all federated peers
license: MIT
# Traefik is technically in Ubuntu noble's universe repo, but
# mmdebstrap's --include constructs an apt-get install command with
# ?narrow(?or(?archive(^noble$),?codename(^noble$)),?priority(required))
# baked in — non-required-priority universe packages like traefik get
# filtered out and apt reports "Unable to locate package traefik".
# Same structural blocker as vector + gcsfuse (see log-forwarder +
# storage-tools manifests). Module publishes as a stub for now;
# traefik binary needs to be either (a) vendored into rootfs/usr/bin
# at build time via Stage 1.5 (cross-platform fetch + verify), or
# (b) installed via a customize-hook that bypasses the narrow filter
# (chroot $ROOT apt-get install traefik after main mmdebstrap pass).
# Tracked as a follow-up to CI selective-rebuild task #82.
package_spec: []
file_spec:
  - /usr/bin/traefik
  - /usr/share/traefik/**
  - /etc/traefik/**
mask: []
dependency_spec: []
protected_spec:
  - /etc/traefik/dynamic
reboot_required: false

services:
  - name: traefik
    start_command: "/usr/bin/traefik --configFile=/etc/traefik/traefik.yml"
    restart_policy: always
    user: traefik
    working_directory: /etc/traefik
    exposed_ports:
      - { port: 80,  protocol: tcp, name: web }
      - { port: 443, protocol: tcp, name: websecure }
    capabilities:
      - CAP_NET_BIND_SERVICE
    health:
      endpoint: "/ping"
      method: GET
      interval_seconds: 15
      timeout_seconds: 3
      initial_delay_seconds: 5

dependencies:
  requires: []
  provides:
    - http.reverse-proxy
    - tls.acme

security:
  capabilities:
    - CAP_NET_BIND_SERVICE
  egress_allow: []
  privileged: false
  user_namespace: true

build:
  # Vendored Traefik binary from extensions/system/agent/dist/.
  # The CI step copies it into /usr/local/bin during the
  # composer stage, so package_spec is empty.
  apt_snapshot: "20260415T000000Z"
