  # Small remainder caught by the first conformance pass's under-carve
  # WARN — genuinely owned, just missed by the directory globs above
  # (dpkg's bug-report template, gcc/gdb's libstdc++ pretty-printers
  # postgres's own libstdc++6 link pulls in, libc-bin's default
  # nsswitch.conf, dpkg's lintian profile, locales' language-pack
  # helper scripts, polkit's dpkg-pkexec action, readline's default
  # inputrc, ssl-cert's openssl config template).
  - /usr/share/bug/dpkg
  - /usr/share/gcc/python/libstdcxx/**
  - /usr/share/gdb/auto-load/usr/lib/x86_64-linux-gnu/libstdc++.so.6.0.33-gdb.py
  - /usr/share/libc-bin/nsswitch.conf
  - /usr/share/lintian/profiles/dpkg/main.profile
  - /usr/share/locales/install-language-pack
  - /usr/share/locales/remove-language-pack
  - /usr/share/polkit-1/actions/org.dpkg.pkexec.update-alternatives.policy
  - /usr/share/readline/inputrc
  - /usr/share/ssl-cert/ssleay.cnf
mask:
  - "/var/cache/apt/**"
  - "/var/lib/apt/lists/**"
  - "/usr/share/doc/**"
  - "/usr/share/man/**"
  - "/usr/share/locale/**"
  - "/usr/share/info/**"
# Owned (per the closure above) but masked out by the doc/man/locale/info
# rules above — same size-conscious convention base-os/storage-tools use.
# Waived so conformance doesn't WARN on the deliberate exclusion.
carve_waivers:
  - "/usr/share/doc/**"
  - "/usr/share/man/**"
  - "/usr/share/locale/**"
  - "/usr/share/info/**"
dependency_spec: []
protected_spec:
  - /etc/postgresql/16/replica/postgresql.conf
  - /var/lib/postgresql/16/replica
reboot_required: false

services:
  - name: pg-replica
    start_command: "/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/replica -c config_file=/etc/postgresql/16/replica/postgresql.conf"
    restart_policy: always
    user: postgres
    working_directory: /var/lib/postgresql/16/replica
    exposed_ports:
      - { port: 5433, protocol: tcp, name: pg-replica }
    capabilities: []
    # TCP health probe deferred — see postgres-primary.
    metadata:
      pg_role: streaming_replica
      pg_version: "16"
      pg_data: /var/lib/postgresql/16/replica
      notes: "Replication slot + primary connection string injected via virtio-fw-cfg at spawn time."
      # APO-6 (DR-3) — THE PROMOTE CONTRACT. Until this key existed the module
      # streamed from a parent primary and had no recovery path at all: a grep
      # for promote/pg_promote/failover across both postgres manifests, the
      # setup job (ClusterMemberPgReplicaSetupJob) and
      # PlatformDeploymentOrchestrator returned nothing, so "the primary is
      # gone" ended in a person with psql.
      #
      # DECLARED HERE, not hardcoded in the promoting service, because the data
      # dir and the pg_ctl path are properties of THIS module — a module that
      # moves to PG 17 or a different cluster name changes one manifest, not a
      # Ruby constant on the control plane.
      # System::Ai::Skills::PromoteReplicaExecutor resolves this key off the
      # imported System::ModuleService row (metadata.pg_role == streaming_replica)
      # and REFUSES the promote when it is absent, so the declaration is
      # load-bearing rather than documentation.
      #
      # ONLY promote_command is load-bearing. pg_ctl promote is preferred over
      # touching the trigger file because `-w` waits for the standby to finish
      # its promotion, so the task's exit status is the promotion's outcome
      # instead of "the file was created".
      #
      # promote_trigger_file below has NO CODE READER, deliberately and
      # explicitly: it is an OPERATOR ESCAPE HATCH, the path to touch by hand
      # on a node whose control path is down. Do not read it as a contract the
      # control plane resolves — PromoteReplicaExecutor resolves pg_role,
      # promote_command and (on the primary) fence_command, and nothing else.
      promote_command: "/usr/lib/postgresql/16/bin/pg_ctl -D /var/lib/postgresql/16/replica promote -w -t 60"
      promote_trigger_file: /var/lib/postgresql/16/replica/promote.signal

dependencies:
  requires:
    # postgres server binaries link against base-os's glibc — closure
    # guarantee (campaign 019f6084 inc1).
    - capability:os.userland
  provides:
    - database.postgres
    - database.postgres.replica
    - database.postgres.v16

security:
  # See postgres-primary/manifest.yaml — the start script runs as root to
  # prep the data dir then drops to postgres via runuser. An empty
  # CapabilityBoundingSet (the default under RootDirectory=/sysroot)
  # strips root's chown/chmod, so declare the minimal init-sequence set.
  capabilities:
    - CAP_CHOWN
    - CAP_DAC_OVERRIDE
    - CAP_FOWNER
    - CAP_SETUID
    - CAP_SETGID
    - CAP_SETPCAP
  egress_allow: []
  privileged: false
  user_namespace: true

build:
  apt_snapshot: "20260415T000000Z"
