schema_version: 1
name: qemu-guest-agent
display_name: QEMU Guest Agent
description: QEMU guest agent (qga) — reports guest IP + clean shutdown + freeze/thaw for snapshots when the hypervisor speaks the qga protocol. No-op on bare metal and on hypervisors that don't expose /dev/virtio-ports/org.qemu.guest_agent.0.
license: GPL-2.0
package_spec:
  - qemu-guest-agent
# Curated from the real apt-ownership closure (campaign 019f6084 P0-C,
# derive-file-spec.sh --mode deb-payload: qemu-guest-agent's package_spec
# closure minus base-os-ubuntu-noble's = 37 owned files, all accounted for
# below). Previously a broad /usr/**+/lib/**+/lib64/**+/etc/** carve — on
# Noble everything is usr-merged (dpkg -L never reports a bare /lib or
# /lib64 path for this closure), so those two globs were dead weight, and
# the broad /usr/**+/etc/** would carve any SIBLING module's /usr or /etc
# content unioned into the same fat rootfs, not just qga's own files.
# The multiarch lib dir is enumerated per-library rather than carved as a
# whole /usr/lib/x86_64-linux-gnu/** glob (unlike claude-tmux's identical
# directory, which DOES carve broadly) — deb-payload conformance caught
# the difference empirically: qga's OWN dependency closure (via libc6)
# also resolves glibc's gconv/locale modules, which are candidates for
# this module's payload but are NOT owned (base-os already ships glibc),
# so a whole-directory glob over-carves them. Per-library globs (still
# "**" per package so a point-release .so bump doesn't strand the
# module) avoid that overlap. /etc/qemu/** covers fsfreeze-hook (ships
# today) + the rarely-present qemu-ga.conf the old comment referenced.
# /var is still intentionally omitted — qga writes nothing persistent at
# runtime, its socket lives at /var/run via tmpfs.
file_spec:
  - /etc/init.d/qemu-guest-agent
  - /etc/qemu/**
  - /usr/lib/systemd/system/qemu-guest-agent.service
  - /usr/lib/udev/rules.d/60-qemu-guest-agent.rules
  - /usr/lib/x86_64-linux-gnu/glib-2.0/**
  - /usr/lib/x86_64-linux-gnu/libgio-2.0.so*
  - /usr/lib/x86_64-linux-gnu/libglib-2.0.so*
  - /usr/lib/x86_64-linux-gnu/libgmodule-2.0.so*
  - /usr/lib/x86_64-linux-gnu/libgobject-2.0.so*
  - /usr/lib/x86_64-linux-gnu/libgthread-2.0.so*
  - /usr/lib/x86_64-linux-gnu/libnuma.so*
  - /usr/lib/x86_64-linux-gnu/liburing*.so*
  - /usr/sbin/qemu-ga
  - /usr/share/doc/libglib2.0-0t64/**
  - /usr/share/doc/libnuma1/**
  - /usr/share/doc/liburing2/**
  - /usr/share/doc/qemu-guest-agent/**
  - /usr/share/lintian/overrides/libglib2.0-0t64
  - /usr/share/man/man7/qemu-ga-ref.7.gz
  - /usr/share/man/man8/qemu-ga.8.gz
mask: []
dependency_spec: []
protected_spec: []
reboot_required: false

# qga runs as root by design — the PVE convention is that the
# hypervisor can `qm guest exec` against the agent, which requires
# root privileges inside the guest. No platform user allocation.

services:
  - name: qga
    # ExecStart matches the upstream qemu-guest-agent.service shipped by
    # apt — invoking the binary directly (no wrapper script) since qga
    # has no first-boot setup; it just reads its socket and replies.
    # The qga binary itself checks /dev/virtio-ports/org.qemu.guest_agent.0
    # at startup and exits cleanly with a friendly message on substrates
    # that don't expose it, so the service is safe to declare for ALL
    # hub deployments — only PVE hosts will see it actively running.
    # -t /run overrides qga's compiled-in /var/run state-dir. Pivot-booted
    # nodes have no /var/run (base-os ships no /var; boot tmpfiles doesn't
    # create it), so the default statedir write to /var/run/qga.state fails,
    # qga logs "error initializing guest agent" and — a qga quirk — exits 0,
    # which Restart=always turns into a SILENT crash-loop (invisible as
    # "active (auto-restart)"). Builders with a daemon that mkdir's /var/run
    # as a side effect (dockerd) accidentally escaped this; native builders
    # did not. /run always exists (tmpfs). See also base-os /var/run symlink.
    start_command: "/usr/sbin/qemu-ga -t /run"
    restart_policy: always
    user: root
    capabilities: []
    # No exposed_ports — qga speaks over a virtio-serial char device,
    # not a TCP socket. Hypervisor reaches it via the hypervisor-side
    # /var/run/qemu-server/<vmid>.qga.sock proxied through PVE.
    metadata:
      protocol: virtio-serial
      socket_path: /dev/virtio-ports/org.qemu.guest_agent.0

dependencies:
  requires:
    # qga dynamically links against base-os's glibc/libnl3/libgmodule —
    # closure guarantee (campaign 019f6084 inc1).
    - capability:os.userland
  provides:
    - hypervisor.guest-agent
    - hypervisor.guest-agent.qemu

security:
  capabilities: []
  egress_allow: []
  privileged: false
  user_namespace: true

build:
  apt_snapshot: "20260415T000000Z"
