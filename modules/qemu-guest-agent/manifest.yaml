schema_version: 1
name: qemu-guest-agent
display_name: QEMU Guest Agent
description: QEMU guest agent (qga) — reports guest IP + clean shutdown + freeze/thaw for snapshots when the hypervisor speaks the qga protocol. No-op on bare metal and on hypervisors that don't expose /dev/virtio-ports/org.qemu.guest_agent.0.
license: GPL-2.0
category: storage-guest
package_spec:
  - qemu-guest-agent
# Curated from the real apt-ownership closure (campaign 019f6084 P0-C,
# derive-file-spec.sh --mode deb-payload: qemu-guest-agent's package_spec
# closure minus base-os-ubuntu-noble's = 37 owned files, all accounted for
# below). Previously a broad /usr/**+/lib/**+/lib64/**+/etc/** carve — on
# Noble everything is usr-merged (dpkg -L never reports a bare /lib or
# /lib64 path for this closure), so those two globs were dead weight, and
# the broad /usr/**+/etc/** would carve any SIBLING module's /usr or /etc
# content unioned into the same fat rootfs, not just qga's own files.
# The multiarch lib dir is enumerated per-library rather than carved as a
# whole /usr/lib/x86_64-linux-gnu/** glob (unlike claude-tmux's identical
# directory, which DOES carve broadly) — deb-payload conformance caught
# the difference empirically: qga's OWN dependency closure (via libc6)
# also resolves glibc's gconv/locale modules, which are candidates for
# this module's payload but are NOT owned (base-os already ships glibc),
# so a whole-directory glob over-carves them. Per-library globs (still
# "**" per package so a point-release .so bump doesn't strand the
# module) avoid that overlap. /etc/qemu/** covers fsfreeze-hook (ships
# today) + the rarely-present qemu-ga.conf the old comment referenced.
# /var is still intentionally omitted — qga writes nothing persistent at
# runtime, its socket lives at /var/run via tmpfs.
file_spec:
  - /etc/init.d/qemu-guest-agent
  - /etc/qemu/**
  - /usr/lib/systemd/system/qemu-guest-agent.service
  - /usr/lib/udev/rules.d/60-qemu-guest-agent.rules
  - /usr/lib/x86_64-linux-gnu/glib-2.0/**
  - /usr/lib/x86_64-linux-gnu/libgio-2.0.so*
  - /usr/lib/x86_64-linux-gnu/libglib-2.0.so*
  - /usr/lib/x86_64-linux-gnu/libgmodule-2.0.so*
  - /usr/lib/x86_64-linux-gnu/libgobject-2.0.so*
  - /usr/lib/x86_64-linux-gnu/libgthread-2.0.so*
  - /usr/lib/x86_64-linux-gnu/libnuma.so*
  - /usr/lib/x86_64-linux-gnu/liburing*.so*
  - /usr/sbin/qemu-ga
  - /usr/share/doc/libglib2.0-0t64/**
  - /usr/share/doc/libnuma1/**
  - /usr/share/doc/liburing2/**
  - /usr/share/doc/qemu-guest-agent/**
  - /usr/share/lintian/overrides/libglib2.0-0t64
  - /usr/share/man/man7/qemu-ga-ref.7.gz
  - /usr/share/man/man8/qemu-ga.8.gz
mask: []
dependency_spec: []
protected_spec: []
reboot_required: false

# qga runs as root by design — the PVE convention is that the
# hypervisor can `qm guest exec` against the agent, which requires
# root privileges inside the guest. No platform user allocation. See
# security.capabilities below for why that is expressed as the full known
# capability list rather than `privileged: true` (which needs an operator
# allowlist grant this module does not have on every account).

services:
  - name: qga
    # ExecStart matches the upstream qemu-guest-agent.service shipped by
    # apt — invoking the binary directly (no wrapper script) since qga
    # has no first-boot setup; it just reads its socket and replies.
    # The qga binary itself checks /dev/virtio-ports/org.qemu.guest_agent.0
    # at startup and exits cleanly with a friendly message on substrates
    # that don't expose it, so the service is safe to declare for ALL
    # hub deployments — only PVE hosts will see it actively running.
    # -t /run overrides qga's compiled-in /var/run state-dir. Pivot-booted
    # nodes have no /var/run (base-os ships no /var; boot tmpfiles doesn't
    # create it), so the default statedir write to /var/run/qga.state fails,
    # qga logs "error initializing guest agent" and — a qga quirk — exits 0,
    # which Restart=always turns into a SILENT crash-loop (invisible as
    # "active (auto-restart)"). Builders with a daemon that mkdir's /var/run
    # as a side effect (dockerd) accidentally escaped this; native builders
    # did not. /run always exists (tmpfs). See also base-os /var/run symlink.
    start_command: "/usr/sbin/qemu-ga -t /run"
    restart_policy: always
    user: root
    # No exposed_ports — qga speaks over a virtio-serial char device,
    # not a TCP socket. Hypervisor reaches it via the hypervisor-side
    # /var/run/qemu-server/<vmid>.qga.sock proxied through PVE.
    metadata:
      protocol: virtio-serial
      socket_path: /dev/virtio-ports/org.qemu.guest_agent.0

dependencies:
  requires:
    # qga dynamically links against base-os's glibc/libnl3/libgmodule —
    # closure guarantee (campaign 019f6084 inc1).
    - capability:os.userland
  provides:
    - hypervisor.guest-agent
    - hypervisor.guest-agent.qemu

security:
  # NOT privileged: true — REVERTED (operator, IMP-caef5c00d63f phase 2
  # review round). `privileged: true` is gated by the account's
  # `privileged_module_ids` allowlist (agent's privilegedApproved /
  # compose.go's enforcePrivileged), an operator-controlled list qga was
  # never added to. Live on ops-hub that allowlist names only dev-cell —
  # marking qga privileged made the pivot-compose path refuse to enable it
  # at all (compose:privileged_unapproved), which is WORSE than the bug this
  # phase set out to fix: qga would never start, and it is the documented
  # root-level recovery channel (`qm guest exec`) for this self-hosted
  # control plane. Caught by a live reviewer check on ops-hub, not by this
  # repo's own tests — the wiring test this task added for "a privileged
  # module gets no capability drop-in" used an EMPTY (unfrozen) breadcrumb,
  # which skips the allowlist gate entirely (compose.go's
  # `enforcePrivileged := bc != nil && bc.PrivilegedAllowlistFrozen`), so it
  # could not have caught this — see
  # TestPrivilegedModuleNotOnAllowlist_RefusedOnBothPaths for the test that
  # now does, with a FROZEN breadcrumb that excludes the module.
  #
  # Correction of a wrong precedent claim this manifest carried in the
  # reverted version above: module-forge and gitea-act-runner are BOTH
  # `privileged: false` today — each documents privileged: true only as a
  # FUTURE contingency ("if X is ever needed, flip this"), never exercised.
  # dev-cell is the only module in this tree that is actually privileged:
  # true today, and it is explicitly on the account's allowlist by design
  # (it is the module the allowlist exists FOR). Citing the other two as
  # "already using" the privileged escape hatch was wrong; corrected here so
  # a future reader does not repeat the same allowlist mistake this
  # correction fixes.
  #
  # THE ACTUAL FIX: qga's real requirement — hypervisor-ISSUED, ARBITRARY
  # root exec inside the guest, chosen by the PVE-side caller at call time,
  # not by anything fixed in this manifest — genuinely cannot be expressed
  # as a small, audited list the way postgres/redis/vault/hub-backend/
  # hub-worker's fixed startup scripts could. So declare the FULL set this
  # platform's agent recognizes (security.KnownCapabilities, 41 entries,
  # confirmed to equal the "ALL 41" bounding set already observed live on
  # ops-hub pre-fix) as the module ceiling, with `qga` (the only service)
  # left WITHOUT a per-service key so it inherits the whole thing. This
  # preserves today's actual effective behavior EXACTLY — before this whole
  # phase, no drop-in restricted qga at all — while making that posture an
  # explicit, auditable manifest declaration instead of an accident of the
  # pivot-compose path never having reset the bounding set. It does not
  # trigger the privileged-allowlist gate (privileged stays false), so it
  # does not depend on any account's operator-maintained list.
  capabilities:
    - CAP_AUDIT_CONTROL
    - CAP_AUDIT_READ
    - CAP_AUDIT_WRITE
    - CAP_BLOCK_SUSPEND
    - CAP_BPF
    - CAP_CHECKPOINT_RESTORE
    - CAP_CHOWN
    - CAP_DAC_OVERRIDE
    - CAP_DAC_READ_SEARCH
    - CAP_FOWNER
    - CAP_FSETID
    - CAP_IPC_LOCK
    - CAP_IPC_OWNER
    - CAP_KILL
    - CAP_LEASE
    - CAP_LINUX_IMMUTABLE
    - CAP_MAC_ADMIN
    - CAP_MAC_OVERRIDE
    - CAP_MKNOD
    - CAP_NET_ADMIN
    - CAP_NET_BIND_SERVICE
    - CAP_NET_BROADCAST
    - CAP_NET_RAW
    - CAP_PERFMON
    - CAP_SETFCAP
    - CAP_SETGID
    - CAP_SETPCAP
    - CAP_SETUID
    - CAP_SYSLOG
    - CAP_SYS_ADMIN
    - CAP_SYS_BOOT
    - CAP_SYS_CHROOT
    - CAP_SYS_MODULE
    - CAP_SYS_NICE
    - CAP_SYS_PACCT
    - CAP_SYS_PTRACE
    - CAP_SYS_RAWIO
    - CAP_SYS_RESOURCE
    - CAP_SYS_TIME
    - CAP_SYS_TTY_CONFIG
    - CAP_WAKE_ALARM
  egress_allow: []
  privileged: false
  # user_namespace: false (operator decision, review round, IMP-caef5c00d63f
  # phase 2, R2 follow-up). qga is this self-hosted control plane's
  # HOST-ROOT RECOVERY CHANNEL: `qm guest exec` reaches it from the
  # hypervisor to run arbitrary root commands on the guest when the
  # control-plane-driven paths are unavailable — break-glass used it on
  # ops-hub to write /etc/sudoers.d directly. PrivateUsers=yes would remap
  # qga's root to an unprivileged host UID/GID inside a private user
  # namespace, silently defeating that exact channel the first time it was
  # actually enforced — the same category of risk as the full-capability
  # ceiling above (qga's purpose is unconstrained hypervisor-issued exec, not
  # a fixed, auditable sequence a narrower policy could be sized against).
  # An earlier version of this manifest left `user_namespace: true` in place
  # pending the R2 investigation into why live ops-hub showed PrivateUsers=no
  # despite that declared value; the investigation found the mismatch was
  # simply because it had never yet been enforced there (attachModule only
  # rewrites a module's drop-ins when its manifest hash changes), which meant
  # the very next reconcile that touched this manifest would have silently
  # turned enforcement on for the first time and broken host-root recovery.
  # Set to false explicitly instead of leaving the stale value to eventually
  # apply by accident.
  user_namespace: false

build:
  apt_snapshot: "20260415T000000Z"
