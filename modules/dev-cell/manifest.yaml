  # Persistent-home mechanism (this module's own rootfs overlay files):
  # binds /home/pnadmin onto the durable /persist partition so the operator's
  # Claude Code auth, cloned source, ~/.ssh and shell history survive a
  # recompose/reboot (the root overlay upper is ephemeral 512M tmpfs). Same
  # rootfs .mount + local-fs.target.wants shipping convention gitea-act-runner
  # uses for var-lib-docker.mount.
  - "/usr/local/bin/dev-cell-persist-home.sh"
  - "/etc/systemd/system/dev-cell-persist-home.service"
  - "/etc/systemd/system/home-pnadmin.mount"
  - "/etc/systemd/system/local-fs.target.wants/dev-cell-persist-home.service"
  - "/etc/systemd/system/local-fs.target.wants/home-pnadmin.mount"
  # Operator development database (powernode role + powernode_development) —
  # creds-free local trust-auth Postgres; operator migrates from source.
  - "/usr/local/bin/dev-cell-dev-db.sh"
  - "/etc/systemd/system/dev-cell-dev-db.service"
  - "/etc/systemd/system/multi-user.target.wants/dev-cell-dev-db.service"
  # Operator git source workspace: on-VM key generation (private NEVER leaves
  # the cell) + a re-runnable `dev-cell-clone` that clones from git.powernode.net
  # once the operator registers his public key. No key material handled here.
  - "/usr/local/bin/dev-cell-git-keygen.sh"
  - "/usr/local/bin/dev-cell-clone.sh"
  - "/etc/systemd/system/dev-cell-git-keygen.service"
  - "/etc/systemd/system/dev-cell-clone.service"
  - "/etc/systemd/system/multi-user.target.wants/dev-cell-git-keygen.service"
  - "/etc/systemd/system/multi-user.target.wants/dev-cell-clone.service"

  # === Interactive dev userland (campaign #40 / dev-cell dev-readiness) ===
  # Derived via derive-file-spec.sh --mode deb-payload against
  # [ncurses-base, ncurses-term, less, vim-tiny, nano, rsync, wget, gnupg,
  #  file, tree, unzip] minus base-os-ubuntu-noble's closure: 3291 owned
  # files (2870 terminfo + 226 masked doc/man/locale + 195 payload). The
  # operator logs in as pnadmin over SSH/tmux and runs Claude Code here;
  # base-os ships NO terminfo (infocmp failed on the live cell) and no
  # pager/editor, so xterm/tmux/screen-256color, less and an editor are
  # the acute gaps. dpkg's DB isn't carved into the immutable compose, so
  # apt can't install at runtime — these MUST be baked.
