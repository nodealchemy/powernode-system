# dev-cell only ships its own service units + scripts + the git/jq
# runtime — no other module's paths.
protected_spec: []

# git + jq are the only packages dev-cell needs that aren't already carried
# by its sibling modules on the composed template (base-os-ubuntu-noble
# already provides curl/ca-certificates/bash/coreutils; claude-tmux
# provides node/npm/tmux/the claude CLI; runtime-ruby provides
# ruby/bundler). ca-certificates is re-listed anyway, matching claude-tmux's
# own defensive precedent — this module's bootstrap script also makes its
# own mTLS calls and should not silently depend on a neighbor's copy.
#
# THREE deps this module's SCRIPTS now need (SSH clone/push via a deploy
# key; psql/createuser/pg_isready for the powernode-role/pg-ready
# provisioning steps; Node for the local mTLS proxy + privilege drops via
# runuser) are deliberately NOT added here — all three are already on PATH
# via existing dependencies, so adding them would just duplicate a sibling
# module's own apt-installed binaries in a second, redundant mmdebstrap
# carve:
#   * `ssh` — comes from the `openssh-client` package, which is a hard
#     Depends: of `openssh-server` (verified via apt-cache show
#     openssh-server), which base-os-ubuntu-noble already lists in ITS OWN
#     package_spec (and carves the whole /usr/bin/** tree that ships it) —
#     a real, non-optional `requires:` dependency of this module.
#   * `psql`/`createuser`/`pg_isready` — come from postgresql-client-16,
#     which postgres-primary already lists in ITS OWN package_spec (and
#     carves /usr/**) — an ASSUMED co-module (see the comment at the
#     bottom of this file), same status quo as `bundle` from runtime-ruby.
#   * `node` (dev-cell-mcp-proxy.js — deliberately dependency-free, Node
#     core modules only, no npm install) and `runuser` (util-linux) — node
#     comes from claude-tmux's package_spec (a hard `requires:` dependency,
#     below), runuser from util-linux, which base-os-ubuntu-noble already
#     lists in ITS OWN package_spec (also carved under /usr/sbin/**).
package_spec:
  - git
  - jq
  - ca-certificates
  # Interactive dev userland (campaign #40): the operator SSHes in as pnadmin
  # and runs Claude Code / tmux here, so this cell needs a real terminal
  # userland base-os doesn't carry. terminfo (ncurses-base + ncurses-term:
  # xterm/tmux/screen-256color), a pager (less), editors (vim-tiny, nano) and
  # the common dev tools (rsync/wget/gnupg/file/tree/unzip). Baked, not
  # apt-installed — the immutable EROFS compose carves no dpkg DB, so runtime
  # apt is inert (dpkg-query returns 0 packages on the live cell). file_spec
  # below carries the derive-file-spec.sh --mode deb-payload closure.
  - ncurses-base
  - ncurses-term
  - less
  - vim-tiny
  - nano
  - rsync
  - wget
  - gnupg
  - file
  - tree
  - unzip
  # python3 is load-bearing on a node+ruby dev box, not optional: node-gyp /
  # native npm modules and many dev scripts need it. man-db gives a working
  # `man` for the interactive toolchain.
  - python3
  - man-db

dependencies:
  requires:
    - powernode/powernode-system-base@^1.0
    # dev-cell-executor.service's ExecStartPre invokes claude-tmux's
    # /usr/local/bin/claude-tmux-fetch-credential.sh directly (reused
    # as-is, rather than re-deriving PKI/platform-URL resolution a third
    # time in this module) to obtain its own ANTHROPIC_API_KEY — a real
    # file dependency, not just a documentation note.
    - powernode/claude-tmux@^1.0
    # dev-cell's own scripts + the apt packages in package_spec (git, rsync,
    # etc.) link against base-os's glibc — closure guarantee (campaign
    # 019f6084 inc1).
    - capability:os.userland
  provides:
    - dev.cell
    - dev.cell.executor

# NOT declared here as a `requires:` edge (no sibling module in this
# codebase — postgres-primary, runtime-ruby — declares one for a co-located
# runtime it needs either): dev-cell also assumes runtime-ruby (ruby +
# bundler on PATH, for scripts/validate.sh and bin/rails), runtime-node
# (node + npm on PATH, for `npm ci`, the mcp-proxy, and validate.sh's
# `npx tsc` — Noble's apt node is v18/npm-less and V8-crashes here, so
# shipping Node 24 via runtime-node is load-bearing, not a convenience),
# and postgres-primary (a local Postgres on 127.0.0.1:5432, trust-auth,
# matching server/config/database.yml.example's defaults) are co-assigned
# on the same NodeTemplate. dev-cell-provision.sh's own preflight step
# (`command -v bundle/npm/node/psql/...` + a node>=24 assertion) verifies this template
# composition explicitly at provisioning time, failing with a clear
# message rather than a cryptic error deep inside a later phase if either
# is missing — see that script for what's assumed vs. verified.

# unit_body passthrough (option A2): these 4 units carry hand-tuned
# Type=oneshot/RemainAfterExit=/StartLimit*=/ExecStartPre= semantics the
# generated-unit Service fields can't express, so each rides the
# services: lifecycle with its systemd unit file's body verbatim. Sibling
# ordering (After=/Requires= naming ANOTHER dev-cell unit) is expressed
# via `dependencies:` instead of hardcoded in the body — the generated
# unit name (powernode-<moduleUUID>-<name>.service) isn't knowable at
# authoring time; the agent re-emits the equivalent After=/Requires=
# lines from `dependencies:`. Non-sibling ordering (After=network-online.
# target) stays in each body verbatim. None declare `user:` — every body
# either sets User=root explicitly or, absent a User= line, systemd's own
# root default already matches; the body governs, same rationale as
# claude-tmux's `claude` service below.
services:
  - name: bootstrap
    unit_body: |
      [Unit]
      Description=Dev-cell: fetch mTLS bootstrap bundle (MCP url + Gitea SSH deploy key) + node identity, root-only
      Documentation=https://github.com/nodealchemy/powernode-platform
      After=network-online.target
      Wants=network-online.target
      ConditionPathExists=/usr/local/bin/dev-cell-bootstrap.sh

      [Service]
      # Oneshot + RemainAfterExit=yes: runs once per boot, then stays "active" so
      # its RuntimeDirectory (below) persists for dev-cell-provision.service,
      # dev-cell-mcp-proxy.service, and dev-cell-executor.service to read from
      # for the rest of this boot's uptime — tmpfs, so it's gone (and
      # re-fetched fresh) on the next reboot.
      Type=oneshot
      RemainAfterExit=yes
      User=root

      # Only root can read the on-node agent's mTLS private key
      # (/persist/var/lib/powernode/pki/node.key, 0600) — this whole unit runs as
      # root for that reason (unlike claude-tmux's single ExecStartPre= "+" line,
      # this module's entire bootstrap step is the credential fetch, so there is
      # no lower-privileged ExecStart to separate it from).
      #
      # RuntimeDirectory gives us a private, auto-created, auto-cleaned tmpfs dir
      # at /run/dev-cell, root:root 0700 because this unit's User=root — and
      # PRIVILEGE SEPARATION means it STAYS that way: unlike the pre-sandboxing
      # version of this module, the script never chowns anything in here to the
      # unprivileged pnagent sandbox user. Only root-run processes
      # (dev-cell-mcp-proxy.service, dev-cell-provision.sh, dev-cell-executor.sh)
      # ever read this directory — see dev-cell-bootstrap.sh's own top-of-file
      # comment for why that's load-bearing.
      RuntimeDirectory=dev-cell
      RuntimeDirectoryMode=0700

      ExecStart=/usr/local/bin/dev-cell-bootstrap.sh
      StandardOutput=journal
      StandardError=journal

      Restart=on-failure
      RestartSec=15s

      [Install]
      WantedBy=multi-user.target

  - name: breakglass
    unit_body: |
      [Unit]
      Description=Dev-cell: durably re-materialize the operator break-glass sudo drop-in (ephemeral /etc, every boot)
      Documentation=https://github.com/nodealchemy/powernode-platform
      ConditionPathExists=/usr/local/bin/dev-cell-breakglass.sh

      [Service]
      # Oneshot + RemainAfterExit=yes, same shape as bootstrap.service. No
      # network dependency (unlike bootstrap, this never leaves the box) and
      # deliberately NOT gated behind /persist/dev-cell/state/provisioned
      # (unlike provision.service) -- /etc is wiped every reboot, so this
      # must re-run every boot to keep the drop-in in place, not just once.
      Type=oneshot
      RemainAfterExit=yes
      User=root

      ExecStart=/usr/local/bin/dev-cell-breakglass.sh
      StandardOutput=journal
      StandardError=journal

      Restart=on-failure
      RestartSec=15s

      [Install]
      WantedBy=multi-user.target

  - name: provision
    dependencies:
      - { service: bootstrap, kind: start_before }
    unit_body: |
      [Unit]
      Description=Dev-cell: first-boot workspace provisioning (clone as root, bundle/test-DB as pnagent)
      Documentation=https://github.com/nodealchemy/powernode-platform
      After=network-online.target
      ConditionPathExists=/usr/local/bin/dev-cell-provision.sh
      # Belt-and-suspenders alongside the script's own internal marker check
      # (see dev-cell-provision.sh): skip even spawning the process once
      # provisioning has already completed successfully once. Matches
      # dev-cell-provision.sh's own $STATE_DIR default — the durable /persist
      # path (BUG-D: moved off /var/lib/dev-cell, which lives on the ephemeral
      # 512M tmpfs overlay), NOT under pnagent's (or any user's) $HOME, since
      # this phase's early steps run as root before pnagent's home is created.
      ConditionPathExists=!/persist/dev-cell/state/provisioned

      # Bounds Restart=on-failure below to at most 10 attempts per 30 minutes —
      # without this, a sustained failure (e.g. Postgres never comes up) would
      # otherwise crash-loop this oneshot forever at a fixed 30s cadence. After
      # the burst is exhausted the unit stays failed (visible in `systemctl
      # status`) until an operator intervenes or the window rolls over.
      StartLimitIntervalSec=1800
      StartLimitBurst=10

      [Service]
      # Oneshot: cloning + bundling + npm ci + the test-DB build can legitimately
      # take many minutes on first boot — disable systemd's default 90s
      # ExecStart timeout rather than race it. RemainAfterExit=yes so
      # dev-cell-executor.service's Requires=/After= ordering has something to
      # depend on being "active", not just "ran once and exited".
      Type=oneshot
      RemainAfterExit=yes
      TimeoutStartSec=0
      # PRIVILEGE SEPARATION: runs as root, NOT pnagent — this phase needs the
      # root-only Gitea deploy key to clone/init-submodules (see
      # dev-cell-bootstrap.sh). It internally drops to pnagent via `runuser` for
      # everything that doesn't need that key (bundle/npm/test-DB — see
      # dev-cell-provision.sh and dev-cell-provision-pnagent.sh). No User=/
      # Group=/HOME= override here — systemd's own root default is exactly
      # right.

      ExecStart=/usr/local/bin/dev-cell-provision.sh
      StandardOutput=journal
      StandardError=journal

      # The script (and its pnagent-side half) is fully idempotent (each phase
      # gated by its own marker file under /persist/dev-cell/state/), so a
      # crash mid-phase (e.g. Postgres/network transiently unavailable) just
      # resumes from the last completed step on restart rather than redoing
      # finished work — a transient failure here should not be terminal for
      # the whole cell.
      Restart=on-failure
      RestartSec=30s

      [Install]
      WantedBy=multi-user.target

  - name: mcp-proxy
    dependencies:
      - { service: bootstrap, kind: start_before }
    unit_body: |
      [Unit]
      Description=Dev-cell: local mTLS-terminating proxy for /mcp — the ONLY process holding the node client cert
      Documentation=https://github.com/nodealchemy/powernode-platform
      After=network-online.target
      ConditionPathExists=/usr/local/bin/dev-cell-mcp-proxy.js
      ConditionPathExists=/usr/local/bin/node

      [Service]
      # Runs as root — PRIVILEGE SEPARATION load-bearing detail, not
      # incidental: this is the only process on the instance that ever holds
      # the node's mTLS client cert/key in its own address space. The
      # unprivileged pnagent sandbox user (which runs headless `claude` and
      # scripts/validate.sh — see dev-cell-executor.sh) reaches /mcp ONLY
      # through this proxy's plain-HTTP localhost listener, with no cert
      # material of its own. Handing pnagent the node key directly (Claude
      # Code's native CLAUDE_CODE_CLIENT_CERT/KEY mTLS support would make that
      # easy) would let a compromised agent re-call dev_cell_bootstrap and mint
      # itself a fresh Gitea deploy key — see this module's manifest.yaml
      # description and dev-cell-bootstrap.sh's own comment for the full
      # rationale.
      Type=simple
      User=root
      # Deliberately NOT declaring this unit's own RuntimeDirectory=: it reads
      # (never owns) the dir dev-cell-bootstrap.service already created —
      # DEV_CELL_RUNTIME_DIR matches the same env var name every other script
      # in this module uses for the same purpose (dev-cell-provision.sh,
      # dev-cell-executor.sh).
      Environment=DEV_CELL_RUNTIME_DIR=/run/dev-cell
      Environment=DEV_CELL_MCP_PROXY_BIND=127.0.0.1
      Environment=DEV_CELL_MCP_PROXY_PORT=18443

      ExecStart=/usr/local/bin/node /usr/local/bin/dev-cell-mcp-proxy.js
      Restart=on-failure
      RestartSec=15s
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

  - name: executor
    dependencies:
      - { service: provision, kind: start_before }
      - { service: mcp-proxy, kind: start_before }
    unit_body: |
      [Unit]
      Description=Dev-cell: autonomous campaign dev-loop ROOT supervisor (sandboxes agent work as pnagent)
      Documentation=https://github.com/nodealchemy/powernode-platform
      After=network-online.target
      ConditionPathExists=/persist/dev-cell/state/provisioned
      # The headless `claude` CLI this unit drives (via `runuser -u pnagent`),
      # and the credential-fetch script it reuses for its own ANTHROPIC_API_KEY,
      # both come from the claude-tmux module — fail closed (skip) rather than
      # crash-loop if it isn't co-assigned on this instance's template.
      ConditionPathExists=/usr/bin/claude
      ConditionPathExists=/usr/local/bin/claude-tmux-fetch-credential.sh

      [Service]
      Type=simple
      # PRIVILEGE SEPARATION: runs as root, NOT pnagent — this unit is the
      # TRUSTED SUPERVISOR. It holds the Gitea deploy key (for the actual `git
      # push`) and drives all agent-authored work (headless `claude`,
      # scripts/validate.sh) sandboxed via `runuser -u pnagent`, never directly.
      # See dev-cell-executor.sh's own header comment and this module's
      # manifest.yaml description for the full rationale. No User=/Group=/
      # HOME= override here — systemd's own root default is exactly right.
      Environment=DEV_LOOP_NAME=dev-improve
      Environment=POLL_INTERVAL_ACTIVE=15
      Environment=POLL_INTERVAL_IDLE=300
      Environment=MAX_CONSECUTIVE_FAILURES=5
      Environment=DEV_CELL_MCP_PROXY_BIND=127.0.0.1
      Environment=DEV_CELL_MCP_PROXY_PORT=18443
      # Deliberately NOT declaring this unit's own RuntimeDirectory=: the
      # ExecStartPre below reuses claude-tmux-fetch-credential.sh as-is, and
      # pointing it at dev-cell-bootstrap.service's already-root-owned
      # /run/dev-cell (via this override of the env var that script already
      # reads) keeps every dev-cell secret — the Gitea SSH deploy key, the
      # node's own mTLS client cert/key, and the Anthropic API key — in the ONE
      # tmpfs runtime directory, all with the same lifetime (this boot only)
      # AND the same root-only confinement.
      Environment=RUNTIME_DIRECTORY=/run/dev-cell

      # Runs as root (the "+" prefix) — only root can read the on-node agent's
      # mTLS private key. CLAUDE_TMUX_USER=root (overriding that script's own
      # pnadmin default) keeps /run/dev-cell/api_key root-owned too — this
      # unit's own process (root) reads-then-deletes it exactly once at start
      # (see dev-cell-executor.sh), then hands ANTHROPIC_API_KEY down to
      # pnagent's `claude` invocations via `runuser --preserve-environment`,
      # never a pnagent-readable file. Never a systemd/tmux argv either,
      # mirroring claude-tmux-start.sh's own handling of the same secret.
      Environment=CLAUDE_TMUX_USER=root
      ExecStartPre=+/usr/local/bin/claude-tmux-fetch-credential.sh

      ExecStart=/usr/local/bin/dev-cell-executor.sh
      Restart=on-failure
      RestartSec=30s
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

reboot_required: false

# `pnagent`: the DEDICATED, UNPRIVILEGED sandbox account for everything
# this module's contract calls "untrusted" — headless `claude` (stage1
# implement+commit, stage2 report) and scripts/validate.sh itself. NOT the
# platform baseline "pnadmin" account claude-tmux's own interactive tmux
# session runs as: the whole point of this split is that pnagent must
# never hold the Gitea deploy key, the node's mTLS cert/key, or
# GIT_SSH_COMMAND — reusing pnadmin (which nothing else in THIS module
# grants any special access to either, but which IS the account an
# operator's own claude-tmux session runs as, a different trust boundary
# entirely) would blur that line for no benefit. nologin: pnagent is
# reached only via `runuser -u pnagent` from this module's own
# root-supervisor scripts, never an interactive or SSH login.
# etcidentity does not create the home directory (see agent/internal/
# etcidentity/doc.go — it only renders /etc/passwd et al.) — dev-cell-
# provision.sh creates + chowns it itself, same as redis's own
# postgres-start.sh-style precedent for a module-owned service account.
users:
  - name: pnagent
    shell: /usr/sbin/nologin
    home: /home/pnagent
    gecos: "Dev-cell sandboxed agent worker (no secrets, no push authority)"

security:
  capabilities: []
  # Unrestricted egress (the documented, reviewed wildcard escape hatch in
  # agent/internal/security/egress.go). A dev-cell is by nature an unbounded
  # egress sandbox: it clones arbitrary Gitea repos, `bundle`s from rubygems,
  # `npm install`s from the npm registry, reaches the platform + Gitea over
  # the SDWAN, etc. An empty allowlist ([]) means default-DROP — the agent's
  # per-module reconcile installs an nftables OUTPUT chain (policy drop)
  # allowing only established/loopback/DNS + the platform URL, which would
  # firewall provision's git-clone/bundle/npm. Once nft actually ships in the
  # pivoted rootfs (base-os nftables, imp 605b) that default-drop takes effect
  # for the first time, so the dev-cell must opt into unrestricted egress
  # explicitly. IPv4 wildcard (the rule emitter uses `ip daddr`); the SDWAN
  # overlay + provisioning endpoints are IPv4. (imp 605b follow-on)
  egress_allow:
    - "0.0.0.0/0"
  # privileged: the dev-cell's bootstrap/provision/executor units are ROOT
  # supervisors that create + `chown -R pnagent` the workspace and drop to the
  # unprivileged pnagent sandbox via `runuser -u pnagent`. That model needs
  # full root caps (CAP_CHOWN + CAP_SETUID/SETGID). Until inc21 these ran as
  # raw rootfs .service files with no sandbox; the BUG-1 unit_body conversion
  # moved them into manifest `services:`, which newly subjects them to the
  # agent's per-module cap/userns drop-ins. With capabilities:[] the agent
  # writes CapabilityBoundingSet= (empty) → root loses CAP_CHOWN/SETUID →
  # chown/runuser fail EPERM. privileged:true skips the capability drop-in
  # (reconcile.go `if !policy.Privileged`), restoring full-root supervisors.
  # The UNTRUSTED half stays isolated by the dedicated nologin pnagent USER
  # (setuid to pnagent clears caps), NOT by the agent sandbox. Must keep
  # capabilities:[] — policy.Validate() rejects privileged + explicit caps.
  privileged: true
  # user_namespace:false → PrivateUsers=no. PrivateUsers=yes runs each unit in
  # a user namespace where pnagent's host uid is UNMAPPED, so the root
  # supervisor's `chown -R pnagent` fails EINVAL and `runuser -u pnagent`
  # can't map the target uid — fundamentally incompatible with cross-uid
  # privilege separation. The dev-cell isolates via the pnagent user, not a
  # user namespace; the two are mutually exclusive here. (imp 605b follow-on)
  user_namespace: false

skills: []

build:
  apt_snapshot: "20260415T000000Z"
