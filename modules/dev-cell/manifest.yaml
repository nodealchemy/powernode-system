schema_version: 1

name: dev-cell
display_name: "Autonomous Campaign Dev-Cell Executor"
description: >
  Turns a booted fleet instance into an autonomous campaign dev-cell, with
  the untrusted AI-agent work PRIVILEGE-SEPARATED from every credential,
  from the validate/push decision, AND from root's own git invocations: a
  root supervisor (dev-cell-executor.sh) holds the Gitea SSH deploy key
  and the node's own mTLS identity and never runs agent-authored code; a
  dedicated unprivileged, nologin sandbox user (pnagent) runs headless
  Claude Code (implement + commit only, never push) and
  scripts/validate.sh, with NO access to either secret and no MCP reach
  except through a local proxy. Because pnagent OWNS the cloned repo's
  working tree (including .git/), every git command root itself still
  needs to run (fetch/push, both requiring the deploy key) goes through a
  `rootgit` wrapper that disables hooks/fsmonitor/attributes and the
  `ext::` transport, and targets the repo's explicit clone_url rather
  than the pnagent-writable "origin" remote name — otherwise a planted
  .git/hooks/pre-push, `core.fsmonitor`, or a `url.*.insteadOf` rewrite to
  `ext::` could execute arbitrary code AS ROOT (verified empirically, both
  attack and defense, against a real planted hook and a real insteadOf
  rewrite). Every operation that actually WRITES the working tree — the
  validator restore, running validate.sh, and reverting the tree back to
  HEAD afterward — therefore runs AS PNAGENT too, via dev-cell-validate-
  pnagent.sh, never root. Each loop iteration: (1) pnagent implements
  +commits one task; (2) root fetches develop over the explicit clone_url
  into FETCH_HEAD; (3) pnagent restores an IMMUTABLE validator — not just
  scripts/ .claude/ .gitleaks.toml, but the toolchain config
  scripts/validate.sh's own rspec/tsc invocations read (server/.rspec,
  spec_helper.rb, Gemfile.lock, frontend/tsconfig*.json, ...) so neither
  can be neutered by editing config instead of the validator itself — from
  FETCH_HEAD and runs THAT copy of scripts/validate.sh sandboxed (app/ and
  config/ stay agent-authored so test-first work is still genuinely
  exercised — this makes the loop-branch validate BEST-EFFORT, not a full
  guarantee; the existing CI gate re-validates before the loop branch is
  ever merged to develop); (4) only on exit 0 does root itself run an
  unforced (inherently fast-forward-only) `git push`, again over the
  explicit clone_url through the same rootgit wrapper; (5) pnagent reports
  the outcome, already decided by root, via MCP. MCP auth is mTLS, but the
  cert/key never leave root: a local reverse proxy (dev-cell-mcp-proxy.js,
  root-owned, header-allowlisted, connection/body/timeout-capped) is the
  only process holding the node's client cert, forwarding ONLY the /mcp
  path to the platform; pnagent's `claude` points at
  http://127.0.0.1:<port>/mcp with no cert material of its own — this is
  deliberate, not an oversight, even though Claude Code has native
  CLAUDE_CODE_CLIENT_CERT/KEY mTLS support: handing pnagent the node key
  would let a compromised agent re-call dev_cell_bootstrap and mint itself
  a fresh deploy key directly. Gitea auth is a per-repo, read-write SSH
  deploy key scoped to exactly the one source repo cloned, held only by
  root. Composed onto a template ALONGSIDE claude-tmux (Claude Code CLI +
  the credential-fetch script this module reuses for its own headless
  ANTHROPIC_API_KEY), runtime-ruby (Ruby/bundler for scripts/validate.sh
  and the test-DB prep), and postgres-primary (local Postgres the prepared
  test DB lives on, and the psql/createuser/pg_isready this module's own
  provisioning uses) — this module ships only the dev-workspace
  provisioning + the executor-loop pieces, not those runtimes themselves.
  All secrets (the SSH deploy key, the node's own mTLS cert/key, the
  Anthropic API key) are mTLS-fetched / copied from the platform's
  Vault-backed node_api and the node's own PKI directory at boot, staged
  root-only 0600 in a tmpfs runtime directory, and never baked into the
  module image, written to a persisted dotfile, or logged. The residual:
  pnagent CAN still reach the Anthropic API (needs the key to run `claude`
  at all) — a cost-abuse exposure, not a credential-theft one; it cannot
  reach Gitea, cannot reach any node_api path other than /mcp, cannot
  decide whether its own work gets pushed, and cannot get root to execute
  anything through git hooks/config/attributes it controls.
license: MIT
category: build-dev

mask:
  - "/var/cache/apt/**"
  - "/var/lib/apt/lists/**"
  - "/usr/share/doc/**"
  - "/usr/share/man/**"
  - "/usr/share/locale/**"

# campaign 019f6084 P0-C wave 2: curated from the real apt-ownership
# closure (derive-file-spec.sh --mode deb-payload against [git, jq,
# ca-certificates]: 3519 owned files — ca-certificates resolves 0 owned
# files here, same as claude-tmux's identical package, since base-os
# already package_spec's it). git's own Depends (perl:any for git-svn/
# git-instaweb/send-email's Perl scripts, liberror-perl, dpkg for
# git-mergetool's version compare) is the real bulk, none of it pulled by
# base-os's own package_spec. The old blanket
# /usr/lib/x86_64-linux-gnu/** was the SAME over-inclusion bug qemu-guest-
# agent's/runtime-ruby's manifests document — glibc's own gconv modules
# and openssl's engines-3/ plugins are BASE-shared candidates in this
# closure too (git/jq both transitively depend on libc6/libssl3t64,
# already in base-os's own closure via openssh-server/curl), confirmed
# empirically via conformance FAIL (359 over-carved files) before this
# correction. LITERAL entries for the dir's 13 loose files (not
# "libNAME.*" globs — see runtime-ruby's manifest for why that
# compaction is unsound for base-shared library families).
file_spec:
  - "/usr/bin/git"
  - "/usr/bin/git-shell"
  - "/usr/bin/git-receive-pack"
  - "/usr/bin/git-upload-archive"
  - "/usr/bin/git-upload-pack"
  - "/usr/bin/scalar"
  - "/usr/lib/git-core/**"
  - "/usr/share/git-core/**"
  - "/usr/share/gitweb/**"
  - "/usr/share/bash-completion/completions/git"
  - "/usr/share/bash-completion/completions/gitk"
  - "/etc/bash_completion.d/git-prompt"
  - "/usr/bin/jq"

  - /usr/lib/x86_64-linux-gnu/libcurl-gnutls.so.3
  - /usr/lib/x86_64-linux-gnu/libcurl-gnutls.so.4
  - /usr/lib/x86_64-linux-gnu/libcurl-gnutls.so.4.8.0
  - /usr/lib/x86_64-linux-gnu/libgdbm.so.6
  - /usr/lib/x86_64-linux-gnu/libgdbm.so.6.0.0
  - /usr/lib/x86_64-linux-gnu/libgdbm_compat.so.4
  - /usr/lib/x86_64-linux-gnu/libgdbm_compat.so.4.0.0
  - /usr/lib/x86_64-linux-gnu/libjq.so.1
  - /usr/lib/x86_64-linux-gnu/libjq.so.1.0.4
  - /usr/lib/x86_64-linux-gnu/libonig.so.5
  - /usr/lib/x86_64-linux-gnu/libonig.so.5.4.0
  - /usr/lib/x86_64-linux-gnu/libperl.so.5.38
  - /usr/lib/x86_64-linux-gnu/libperl.so.5.38.2
  # perl's own CORE runtime module tree — /usr/share/perl/5.38.2/ is the
  # "perl" package's own exclusive sitedir, safe to glob broadly.
  # /usr/share/perl5/ is NOT equally safe — it's the SHARED third-party-
  # module sitelib every perl package installs into, and debconf (already
  # in base-os's own closure via openssh-server, so correctly subtracted)
  # ships its own Debconf/** tree there too; a directory-wide glob matched
  # debconf's (candidate, not owned) files — empirically confirmed FAIL,
  # same lesson postgres-replica's manifest documents for the identical
  # gap — so this module's own entries (liberror-perl, git's Perl helper
  # modules) are named explicitly instead.
  - "/usr/share/perl/**"
  - "/usr/share/perl5/Error.pm"
  - "/usr/share/perl5/Error/**"
  - "/usr/share/perl5/Git.pm"
  - "/usr/share/perl5/Git/**"
  - "/usr/lib/x86_64-linux-gnu/perl/**"
  - "/usr/lib/x86_64-linux-gnu/perl-base/**"
  # dpkg's own aux dirs (git-mergetool/git's own scripts shell out to
  # dpkg --compare-versions) + its systemd DB-backup unit + mime handler.
  - "/usr/libexec/dpkg/**"
  - "/usr/share/dpkg/**"
  - "/usr/lib/mime/packages/tar"
  - "/usr/lib/systemd/system/dpkg-db-backup.service"
  - "/usr/lib/systemd/system/dpkg-db-backup.timer"
  # Per-package lintian overrides — not a directory-wide glob, same
  # base-shared-candidate reason as runtime-ruby's/postgres-*'s manifests.
  - "/usr/share/lintian/overrides/dpkg"
  - "/usr/share/lintian/overrides/git"
  - "/usr/share/lintian/overrides/libcurl3t64-gnutls"
  - "/usr/share/lintian/overrides/libgdbm-compat4t64"
