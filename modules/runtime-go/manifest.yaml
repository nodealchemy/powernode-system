schema_version: 1

name: runtime-go
display_name: "Powernode Base Go Runtime"
description: >
  Go 1.25.0 (official upstream linux tarball) installed to /usr/local/go, with
  go + gofmt symlinked into /usr/local/bin so they land on the default PATH
  with no profile wiring. Sibling of runtime-ruby and runtime-node, completing
  the language-runtime family: a node that needs a Go toolchain composes this
  and gets `capability:runtime.go` rather than fetching a toolchain itself.

  WHY A MODULE AND NOT A BOOT-TIME INSTALL. dev-cell briefly shipped a unit that
  downloaded the Go tarball from go.dev on first boot and unpacked it to
  /persist. That was wrong on three counts: it verified no checksum or
  signature, it made a boot depend on a third party, and it simply cannot work
  on a node with a restricted egress policy. Fetching in CI Stage 1.5 against a
  pinned sha256 puts the toolchain inside a cosign-signed, fs-verity-verified
  erofs that the node mounts from its local cache — the same treatment ruby,
  node, traefik, cosign and act_runner already get.
license: "BSD-3-Clause"
category: language-runtime

# Nothing from apt. Ubuntu noble ships Go 1.22, which is BELOW the floor the
# agent's go.mod declares (go 1.25.0) — `go` refuses to build when the
# toolchain is older than the directive, so the distro package is unusable
# here regardless of size. The whole toolchain comes from Stage 1.5.
package_spec: []

# Go unpacks to /usr/local/go; the bin symlinks land in /usr/local/bin. Carving
# all of /usr/local matches runtime-node's file_spec exactly.
file_spec:
  - "/usr/local/**"

mask: []
dependency_spec: []
protected_spec: []

reboot_required: false

dependencies:
  requires:
    - "capability:os.userland"
  provides:
    - runtime.go

services: []
skills: []

build:
  # INCIDENT 2026-08-07 — this module published an EMPTY artifact (v2,
  # sha256:0ffc2cc0…, zero files) which auto-promoted. Nodes pulled it, the
  # agent's hot-prune correctly found no surviving layer providing the old
  # paths, and whiteout-deleted the entire Go toolchain — GOROOT/src
  # included — off a live root. The node reported healthy throughout.
  # Nothing in the fetch path below is suspected: the sha256 check and the
  # version-exec check are both fatal. The artifact went out empty during a
  # build batch whose source ref had been deleted mid-flight, so the payload
  # was never staged in the first place. Two consequences worth keeping in
  # mind when touching this module: its payload is an EXTERNAL download, so
  # a build that cannot reach the source produces a structurally valid but
  # empty erofs; and because /usr/local/** is carved wholesale, an empty
  # build here deletes every path this module previously owned. Publish-side
  # guard tracked as IMP 019fd9e2.
  apt_snapshot: "20260415T000000Z"
  # Fetched + sha256-verified in Stage 1.5 (see the runtime-go case in
  # .gitea/workflows -> scripts/module-build/stage15.sh). Bump this alongside
  # BOTH pinned arch sha256 values in that step; they are the official
  # checksums published at https://go.dev/dl/?mode=json.
  #
  # Deliberately EQUAL to agent/go.mod's `go` directive, not merely above it:
  # the powernode-system-base arm reads that same directive to pick the
  # toolchain it compiles the agent with, so holding them equal lets ONE pinned
  # sha256 serve both arms (the cosign pin is shared between arms the same
  # way). Bump agent/go.mod, this key, and BOTH pins together.
  #
  # Note GOTOOLCHAIN is left at its default (auto): if a future go.mod asks for
  # a newer toolchain than this module ships, `go` will try to fetch it at
  # RUNTIME and fail loudly on a restricted-egress node. That is the intended
  # signal to bump this module — not something to paper over with
  # GOTOOLCHAIN=local here.
  go_version: "1.25.0"
