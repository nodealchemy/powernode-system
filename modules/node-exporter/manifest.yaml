schema_version: 1
name: node-exporter
display_name: Prometheus node_exporter
description: >
  Hardware + OS metrics endpoint on :9100. Operator-opt-in observability
  module; fleets without a Prometheus scrape target should NOT attach this
  module (it costs ~20MB RSS per node). Pairs with a Prometheus instance
  (deployed separately) configured to scrape this port over the SDWAN mesh.
license: Apache-2.0
package_spec:
  - prometheus-node-exporter
# Was under-carved (campaign 019f6084 inc0 audit) — the sole entry pointed
# at /etc/systemd/system/node_exporter.service, a path apt never installs
# to (the package's real unit ships at /usr/lib/systemd/system/prometheus-
# node-exporter.service) and whose basename doesn't even match the apt
# package's unit name, so it silently carved nothing; the actual binary
# (/usr/bin/prometheus-node-exporter) the services: block below execs was
# never shipped. Curated from the real apt-ownership closure (P0-C,
# derive-file-spec.sh --mode deb-payload: 19 owned files, all covered
# below) — a single-package closure with no extra shared libs, matching
# the `requires: capability:os.userland` dependency below (only glibc).
file_spec:
  - /etc/default/prometheus-node-exporter
  - /etc/init.d/prometheus-node-exporter
  - /etc/logrotate.d/prometheus-node-exporter
  - /usr/bin/prometheus-node-exporter
  - /usr/lib/systemd/system/prometheus-node-exporter.service
  - /usr/share/doc/prometheus-node-exporter/**
  - /usr/share/man/man1/prometheus-node-exporter.1.gz
mask: []
dependency_spec: []
protected_spec: []
reboot_required: false

dependencies:
  requires:
    # prometheus-node-exporter dynamically links against base-os's glibc —
    # closure guarantee (campaign 019f6084 inc1).
    - capability:os.userland
  provides:
    - observability.metrics

services:
  - name: node-exporter
    start_command: "/usr/bin/prometheus-node-exporter --web.listen-address=:9100 --collector.disable-defaults --collector.cpu --collector.meminfo --collector.diskstats --collector.filesystem --collector.netstat --collector.loadavg --collector.uname"
    restart_policy: always
    user: prometheus
    working_directory: /var/lib/prometheus
    exposed_ports:
      - { port: 9100, protocol: tcp, name: metrics }
    capabilities: []
    health:
      endpoint: "/metrics"
      method: GET
      interval_seconds: 60
      timeout_seconds: 5
      initial_delay_seconds: 15

# The `prometheus` service account is declared here so ManifestImportService
# flows it through System::Identity::UserAllocator, which pins it to its
# reserved fleet-global UID/GID (prometheus = 70410, see
# reserved_identities.rb / reserved.go) — consistent on every instance.
# Same pattern as reverse-proxy-traefik's traefik user; uid/gid
# intentionally omitted (platform-allocated).
groups:
  - name: prometheus
users:
  - name: prometheus
    primary_group: prometheus
    shell: /usr/sbin/nologin
    home: /var/lib/prometheus
    gecos: "Prometheus node exporter"

security:
  # node_exporter reads /proc and /sys but doesn't need extra caps beyond
  # the systemd unit's User= sandboxing.
  capabilities: []
  egress_allow: []
  privileged: false
  user_namespace: true

skills: []

build:
  apt_snapshot: "20260415T000000Z"
