schema_version: 1
name: powernode-hub-backend
display_name: Powernode Hub Backend (Rails 8 API)
description: The Powernode platform's Rails 8 API server with ActionCable; backed by postgres-primary and redis
license: MIT
category: platform-apps
package_spec: []
# Aligns with the production install layout (/opt/powernode/ with
# server/ + extensions/ + worker/ as siblings) — the Gemfile uses
# `require_relative "../extensions_loader_helper"` from server/Gemfile
# which only resolves when the helper sits one dir up from server/.
# hub-backend ships the helper + scripts/ alongside server/ so the
# overlay rootfs has the same shape the systemd-installer creates.
file_spec:
  - /opt/powernode/server/**
  - /opt/powernode/extensions_loader_helper.rb
  - /opt/powernode/scripts/**
mask:
  - /opt/powernode/server/tmp/***
  - /opt/powernode/server/log/***
  - /opt/powernode/server/node_modules/***
  - /opt/powernode/server/.git/***
  - /opt/powernode/server/coverage/***
  # Mask the entire build-time vendor/bundle (it only contains an empty
  # per-build-ruby skeleton from `bundle cache`, e.g. ruby/3.3.0/, which would
  # otherwise make the on-node install-guard think gems are present). The .gem
  # source files ship via vendor/cache; the node installs them into a fresh
  # vendor/bundle/ruby/<runtime-ver> on first boot.
  - /opt/powernode/server/vendor/bundle/***
dependency_spec: []
protected_spec:
  - /opt/powernode/server/config/master.key
  - /opt/powernode/server/config/credentials
reboot_required: false

dependencies:
  requires:
    - powernode/runtime-ruby@^1.0
    - powernode/postgres-primary@^1.0
    - powernode/redis@^1.0

services:
  - name: rails
    # Wrapper handles first-boot bootstrap: generates Rails secrets
    # (secret_key_base + AR encryption keys), waits for postgres,
    # creates the powernode role + database, vendors gems via bundle
    # install, runs db:migrate + first-admin bootstrap
    # (bootstrap-first-admin.rb) + db:seed, then execs puma. Durable
    # state (secrets env, admin credentials, init marker) lives under
    # /persist/powernode-rails when /persist is mounted; /etc/powernode
    # keeps symlinks. Admin password persists at admin-credentials.json
    # (mode 0600) for operator retrieval.
    start_command: "/usr/local/bin/rails-start.sh"
    restart_policy: always
    user: root
    working_directory: /opt/powernode/server
    env:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      DATABASE_URL: "postgres://powernode@localhost:5432/powernode_production"
      REDIS_URL: "redis://localhost:6379/0"
      # Gate for extensions_loader_helper.rb's discover_extension_gems_by_visibility:
      # without it, a deployed node has no .gitmodules (not in file_spec below), so
      # every on-disk extension (including the public system extension composed
      # via the powernode-extension-system module) reads as private-by-determination
      # and gets silently skipped — the Gemfile resolves core-only and the composed
      # extension never loads, with no error. Setting this to "1" tells the Gemfile
      # a node's disk contents ARE the composition decision (a NodeModule put an
      # extension there on purpose), loading every present extension regardless of
      # public/private. MUST live here (systemd env, not the generated
      # backend-default.conf secrets file): rails-start.sh only writes that file on
      # first-boot secret generation, so a persisted secrets file from an older
      # image would never pick this up on a later image upgrade.
      POWERNODE_DEPLOYED: "1"
      # These two overrides were introduced together because this all-in-one hub
      # had NEITHER backing table: the Rails 8 defaults (solid_cache_store /
      # solid_queue) hit a missing table, and Rails.cache writes plus db:seed's
      # site-settings step failed on "solid_cache_entries does not exist".
      #
      # MUST live here (systemd env), not just in the generated
      # backend-default.conf: rails-start.sh only writes the secrets file on
      # first-boot generation, so a persisted secrets file from an older image
      # never picks these up.
      #
      # THAT JUSTIFICATION HAS EXPIRED FOR CACHE, AND ONLY FOR CACHE
      # (IMP-a95f7b6b3e01). db/cache_migrate/20260904175500_create_solid_cache_entries.rb
      # now ships the table, and config/database.yml's production `cache:` entry
      # declares `migrations_paths: db/cache_migrate`, so the db:migrate
      # rails-start.sh already runs creates it — on a fresh install and on an
      # established host's next boot alike. rails-start.sh's own copy of this
      # note was corrected in 815d07cb7 and says the same thing in different
      # words; grepping one of the two misses the other.
      #
      # There is still NO db/queue_migrate (nor db/cable_migrate), so
      # solid_queue's table genuinely does not exist and QUEUE_ADAPTER keeps its
      # original reason. The server also does not bundle sidekiq (background work
      # goes to hub-worker over HTTP), so async remains the safe table-free
      # ActiveJob fallback for stray enqueues.
      #
      # WHY CACHE_STORE STAYS PINNED ANYWAY, deliberately and not by inertia:
      # unpinning it is a live-hub deploy decision, not a config tidy-up. A cache
      # store that cannot be reached at boot fails a self-hosted hub closed, and
      # this hub cannot be recovered by the control plane it is running.
      #
      # The correctness prerequisite for solid_cache IS now landed:
      # CacheVersioning no longer uses a resumable counter, and no longer falls
      # back to a shared "never bumped" namespace either — a swept version row
      # used to let a later bump re-issue keys a previous bump had retired.
      # Deliberately NOT listed as a further prerequisite: config/cache.yml's
      # missing max_age. Setting it explicitly to 2.weeks changes nothing, and
      # setting it to nil only disables the age sweep — the cache_full sweep
      # (max_size: 256 MB) evicts the version row regardless and ignores
      # created_at entirely, so that knob protects nothing the token change did
      # not already handle.
      #
      # WHAT THE PIN COSTS TODAY, stated so nobody assumes otherwise: MemoryStore
      # is per-process, so each puma worker holds its own cache and a
      # CacheVersioning bump in one retires nothing in the others or in
      # hub-worker. Every invalidation is therefore per-process here. That is not
      # a regression — MemoryStore's #delete_matched was equally per-process — but
      # it does mean cross-process invalidation is not yet delivered in
      # production. See app/services/concerns/cache_versioning.rb.
      CACHE_STORE: "memory_store"
      QUEUE_ADAPTER: "async"
      # Pin the internal CA adapter. Unset, System::InternalCaService#
      # resolve_default_mode probes Vault LIVE and prefers it in production, so
      # the first restart after Vault becomes reachable would silently switch
      # this hub from its on-disk anchor to a Vault-issued chain -- a CA
      # ROTATION, which the service's own docs classify as a deliberate,
      # planned operation and not something a health probe should trigger.
      # Every certificate issued by the local anchor would stop verifying.
      # Pinning "local" makes adopting Vault an explicit operator change.
      # (POWERNODE_CA_LOCAL_DIR is NOT set here: its value depends on whether
      # /persist is a mountpoint, which a static manifest value cannot express,
      # so rails-start.sh exports it.)
      POWERNODE_CA_MODE: "local"
    exposed_ports:
      - { port: 3000, protocol: tcp, name: http }
    capabilities: []
    health:
      endpoint: "/up"
      method: GET
      interval_seconds: 30
      timeout_seconds: 5
      initial_delay_seconds: 30
    # Cross-module ordering (postgres + redis must be up first) is
    # expressed at the top-level `dependencies.requires` above. The
    # service-level `dependencies` array is intra-module only —
    # hub-backend has just one service so it stays empty.
    metadata:
      ruby_version: "3.3"
      rails_version: "8.0"
      notes: "ActionCable shares port 3000 via Rack-mounted /cable path."

security:
  capabilities: []
  # The Rails backend calls OUT to Gitea's API directly
  # (System::DevCellBootstrapService's per-repo deploy-key provisioning,
  # disk-image CI's Gitea Actions dispatch/webhook flow), but that host is
  # NOT declared here as a static IP — real infra hosts don't belong
  # hardcoded in tracked source (they rot on DNS/IP changes, same class of
  # incident as the ipnode->powernode migration). It's covered instead by
  # the account-configured protected-egress-hosts mechanism (SiteSetting,
  # resolved fresh by the agent every reconcile tick alongside the platform
  # URL) — see agent/internal/security/egress.go's protectedHosts and
  # reconcile.go. Found + landed 2026-07-21.
  egress_allow: []
  privileged: false
  user_namespace: false

build:
  apt_snapshot: "20260415T000000Z"
