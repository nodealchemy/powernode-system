schema_version: 1
name: runtime-ruby
display_name: Powernode Base Ruby Runtime
description: Ruby 3.2.8 (source-compiled — Noble's apt default is 3.2.3) + bundler 2.7.1 + system dependencies for Rails workloads
license: MIT
category: language-runtime
package_spec:
  - build-essential
  - libpq-dev
  - libssl-dev
  - libyaml-dev
  - zlib1g-dev
  # Standard Ruby build deps — Noble's apt `ruby`/`ruby-dev`/`bundler` are
  # deliberately NOT listed: they'd ship 3.2.3, but the platform pins
  # 3.2.8 (server/.ruby-version), so the build workflow compiles Ruby
  # from source instead (see the runtime-ruby case arm in
  # .gitea/workflows/build-platform-modules.yaml).
  - libffi-dev
  - libreadline-dev
  - libgdbm-dev
  - libncurses-dev
  - libgmp-dev
  - autoconf
  - bison
# campaign 019f6084 P0-C wave 2: curated from the real apt-ownership closure
# (derive-file-spec.sh --mode deb-payload against [build-essential,
# libpq-dev, libssl-dev, libyaml-dev, zlib1g-dev, libffi-dev,
# libreadline-dev, libgdbm-dev, libncurses-dev, libgmp-dev, autoconf,
# bison]: 6784 owned files). Previously a blanket /usr/**+/lib/**+
# /lib64/**+/etc/** — same over-inclusion risk qemu-guest-agent's manifest
# documents (a directory-wide glob also carves any SIBLING module's /usr
# content unioned onto the same fat rootfs, not just this module's own).
# Unlike that single-purpose module, runtime-ruby genuinely IS a full
# compiler+dev-headers+runtime substrate by design (its whole point is
# giving dependents gcc/g++/make + every -dev package's headers to
# compile native gems against), so the correction below uses
# DIRECTORY-WIDE globs for namespaces that are exclusively populated by
# this closure's own packages (gcc's private /usr/lib/gcc + /usr/libexec/
# gcc trees, perl's /usr/share/perl + /usr/lib/.../perl(-base) trees,
# binutils's ldscripts, every -dev package's /usr/include headers — none
# of which base-os or any sibling module's package_spec would ever
# populate) rather than hand-enumerating thousands of individual headers.
# The ONE multiarch dir that does NOT get a blanket glob is
# /usr/lib/x86_64-linux-gnu/ ITSELF (not its perl/ldscripts/pkgconfig/
# gprofng/audit/bfd-plugins subdirs, which ARE globbed broadly below) —
# glibc's own gconv/locale modules live directly in that dir and are
# BASE-shared candidates (every -dev package here also transitively pulls
# libc6, same as base-os's own openssh-server/systemd chain), so a
# directory-wide glob would over-carve them (empirically confirmed FAIL,
# same lesson qemu-guest-agent's manifest documents for its own multiarch
# lib carve). LITERAL per-file entries (not "libNAME.*" wildcards) for
# every loose file in this one directory — a first "libNAME.*" compaction
# attempt (grouping every .a/.so/.so.N/.so.N.M sharing a base into one
# glob line) FAILED conformance empirically: several of this closure's
# -dev packages (libc6-dev, libncurses-dev, ...) ship an unversioned
# .a/.so symlink under the SAME base name a base-shared runtime package
# (libc6, libncursesw6, ...) ships its OWN versioned .so.N under (e.g.
# libc6-dev's libc.so vs. libc6's libc.so.6) — "libc.*" matches both, but
# only the .a/.so-symlink half is actually owned; the versioned .so.N
# half is base-shared and got wrongly carved (28 files: libc.so.6,
# libcrypto.so.3, libgmp.so.10, the libFOOw.so.6* wide-ncurses variants,
# ...). Literal paths sidestep the class entirely — safe by construction,
# consistent with this pipeline's apt_snapshot-pinned reproducibility
# (improvement L's EVR lockfile is the same "pin, don't pattern-match"
# philosophy). /usr/bin/** and /usr/sbin's 3 non-toolchain entries are
# enumerated individually for the same base-shared-candidate reason (not
# directory-globbed) — this is a much bigger closure than any prior P0-C
# pilot module, but the SHAPE of the correction is identical.
file_spec:
  # STAGED: the source-compiled Ruby 3.2.8 + bundler 2.7.1 (stage15.sh's
  # runtime-ruby build arm installs both to /usr/local) — NOT apt-derivable
  # (Noble's apt ruby/bundler are deliberately not package_spec'd; see the
  # package_spec comment above), so deb-payload mode's apt-resolved
  # candidate universe structurally can't see this path at all (same
  # "Fidelity blind spots" class the tool's own header documents, and the
  # same handling claude-tmux's manifest uses for its own staged CLI paths
  # — never flagged as over-inclusion because it's invisible, not silently
  # wrong). Left broad (not enumerated file-by-file): every dependent
  # module (hub-backend, hub-worker, dev-cell's scripts/validate.sh) needs
  # the full compiled tree, including headers under
  # /usr/local/include/ruby-3.2.0/ for compiling native gem extensions.
  - /usr/local/**

