schema_version: 1
name: runtime-ruby
display_name: Powernode Base Ruby Runtime
description: Ruby (noble default — currently 3.2) + bundler + system dependencies for Rails workloads
license: MIT
package_spec:
  - ruby
  - ruby-dev
  - bundler
  - build-essential
  - libpq-dev
  - libssl-dev
  - libyaml-dev
  - zlib1g-dev
# Ship the full apt-installed tree under the four standard FHS roots.
# /usr covers ruby + bundler + gcc/g++ toolchain (build-essential) +
# Ruby stdlib + bundled gems + dev headers (ruby-dev, libpq-dev,
# libssl-dev, libyaml-dev). /lib + /lib64 cover libc + libruby + ssl
# + crypto runtime libs. /etc carries package-installed configs.
# This module is FS-only (services: []) — it's the substrate lower
# layer hub-backend + hub-worker overlay-stack on top of, so the
# blob needs every transitive dep for `bundle exec puma`/`sidekiq`
# to resolve at runtime.
file_spec:
  - /usr/**
  - /lib/**
  - /lib64/**
  - /etc/**
  # Bundler 2.7.1 (gem-installed at build to match the platform Gemfile.lock's
  # `BUNDLED WITH`) lands under /var/lib/gems on Debian/Ubuntu — ship it so the
  # on-node `bundle install --local` finds the exact matching bundler and never
  # self-installs a different version over the (absent) network. Keep this in
  # sync with server/worker Gemfile.lock BUNDLED WITH (see build workflow).
  - /var/lib/gems/**
mask: []
dependency_spec: []
protected_spec: []
reboot_required: false

dependencies:
  requires: []
  provides:
    - runtime.ruby

# Base-ruby is FS-only: it installs the runtime that other modules
# (powernode-hub-backend, powernode-hub-worker) depend on, but it
# doesn't host any services of its own. That's why the services
# list is empty — the modules layered on top declare their own
# Rails/Sidekiq services.
services: []

build:
  apt_snapshot: "20260415T000000Z"
