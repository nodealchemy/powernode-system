schema_version: 1
name: runtime-ruby
display_name: Powernode Base Ruby Runtime
description: Ruby 3.2.8 (source-compiled — Noble's apt default is 3.2.3) + bundler 2.7.1 + system dependencies for Rails workloads
license: MIT
category: language-runtime
package_spec:
  - build-essential
  - libpq-dev
  - libssl-dev
  - libyaml-dev
  - zlib1g-dev
  # Standard Ruby build deps — Noble's apt `ruby`/`ruby-dev`/`bundler` are
  # deliberately NOT listed: they'd ship 3.2.3, but the platform pins
  # 3.2.8 (server/.ruby-version), so the build workflow compiles Ruby
  # from source instead (see the runtime-ruby case arm in
  # .gitea/workflows/build-platform-modules.yaml).
  - libffi-dev
  - libreadline-dev
  - libgdbm-dev
  - libncurses-dev
  - libgmp-dev
  - autoconf
  - bison
# Ship the full tree under the four standard FHS roots. /usr covers the
# source-compiled Ruby 3.2.8 + bundler 2.7.1 (both installed to
# /usr/local by the build workflow — /usr/** already covers /usr/local/**)
# + the gcc/g++ toolchain (build-essential) + Ruby stdlib/bundled gems +
# dev headers (libpq-dev, libssl-dev, libyaml-dev, libffi-dev, ...). /lib
# + /lib64 cover libc + libruby + ssl + crypto runtime libs. /etc carries
# package-installed configs.
# This module is FS-only (services: []) — it's the substrate lower
# layer hub-backend + hub-worker overlay-stack on top of, so the
# blob needs every transitive dep for `bundle exec puma`/`sidekiq`
# to resolve at runtime.
file_spec:
  - /usr/**
  - /lib/**
  - /lib64/**
  - /etc/**
mask: []
dependency_spec: []
protected_spec: []
reboot_required: false

dependencies:
  requires:
    # The source-compiled Ruby 3.2.8 + bundler + gcc/g++ toolchain link
    # against base-os's glibc — closure guarantee (campaign 019f6084 inc1).
    - capability:os.userland
  provides:
    - runtime.ruby

# Base-ruby is FS-only: it installs the runtime that other modules
# (powernode-hub-backend, powernode-hub-worker) depend on, but it
# doesn't host any services of its own. That's why the services
# list is empty — the modules layered on top declare their own
# Rails/Sidekiq services.
services: []

build:
  apt_snapshot: "20260415T000000Z"
  # Keep in sync with server/.ruby-version — the dev-cell composes this
  # module precisely so scripts/validate.sh runs against the platform's
  # EXACT toolchain, not just an ABI-compatible 3.2.x.
  ruby_version: "3.2.8"
