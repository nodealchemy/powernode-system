mask:
  - "/usr/share/doc/**"
  - "/usr/share/man/**"
  - "/usr/share/locale/**"
  # m4/gdbm/libffi/readline's own GNU info manuals — same documentation-
  # content bucket as doc/man, missed by both existing globs (storage-
  # tools' manifest hit the identical gap for sed's own info manual).
  - "/usr/share/info/**"
# Owned (per the closure above) but masked out by the doc/man/locale/info
# rules — same size-conscious convention base-os/storage-tools use.
# Waived so conformance doesn't WARN on the deliberate exclusion.
carve_waivers:
  - "/usr/share/doc/**"
  - "/usr/share/man/**"
  - "/usr/share/locale/**"
  - "/usr/share/info/**"
dependency_spec: []
protected_spec: []
reboot_required: false

dependencies:
  requires:
    # The source-compiled Ruby 3.2.8 + bundler + gcc/g++ toolchain link
    # against base-os's glibc — closure guarantee (campaign 019f6084 inc1).
    - capability:os.userland
  provides:
    - runtime.ruby

# Base-ruby is FS-only: it installs the runtime that other modules
# (powernode-hub-backend, powernode-hub-worker) depend on, but it
# doesn't host any services of its own. That's why the services
# list is empty — the modules layered on top declare their own
# Rails/Sidekiq services.
services: []

build:
  apt_snapshot: "20260415T000000Z"
  # Keep in sync with server/.ruby-version — the dev-cell composes this
  # module precisely so scripts/validate.sh runs against the platform's
  # EXACT toolchain, not just an ABI-compatible 3.2.x.
  ruby_version: "3.2.8"
