schema_version: 1
name: powernode-hub-worker
display_name: Powernode Hub Worker (Sidekiq)
description: Sidekiq worker process; communicates with hub-backend via HTTP API only
license: MIT
category: platform-apps
package_spec: []
# Ship the parent's worker/ tree into /opt/powernode/worker — matches
# production install layout. The Sidekiq config loads via bundle exec
# from this directory; gems resolve through hub-backend's bundled
# Gemfile (worker reuses backend's bundle).
file_spec:
  - /opt/powernode/worker/**
mask:
  - /opt/powernode/worker/tmp/***
  - /opt/powernode/worker/log/***
  - /opt/powernode/worker/.git/***
  # See hub-backend: mask the whole build-time vendor/bundle skeleton so the
  # on-node install-guard runs cleanly; .gem source ships via vendor/cache.
  - /opt/powernode/worker/vendor/bundle/***
dependency_spec: []
protected_spec: []
reboot_required: false

dependencies:
  # Same-host requires: runtime-ruby + redis. The previous co-resident
  # hub-backend dependency is dropped (Stage 8b) — workers can now run
  # as their own NodeInstance, communicating with a remote hub-backend
  # over mTLS via Traefik. For co-resident layouts, hub-backend will
  # still be present on the same node (assigned by the operator) but
  # we no longer enforce it at the module-graph level.
  requires:
    - powernode/runtime-ruby@^1.0
    - powernode/redis@^1.0

services:
  - name: sidekiq
    # Wrapper waits for hub-backend's rails-start.sh to publish
    # /etc/powernode/backend-default.conf (shared secrets file),
    # then sources it and vendors worker gems before exec'ing
    # sidekiq. Worker has its own Gemfile so it needs its own
    # vendor/bundle, separate from the backend's.
    start_command: "/usr/local/bin/sidekiq-start.sh"
    restart_policy: on-failure
    user: root
    working_directory: /opt/powernode/worker
    env:
      RAILS_ENV: production
      # Worker calls /api/v1/internal/* over mTLS (Stage 8b). On a
      # SAME-HOST worker NodeInstance (the historical layout) this
      # resolves to the local Traefik listener which routes back to
      # the co-resident Rails. On a MULTI-HOST worker NodeInstance the
      # config-variety child module overrides this to the platform's
      # public hostname over SDWAN. Either way, HTTPS-via-Traefik is
      # required: the worker presents its client cert and Traefik's
      # single websecure (:443) entrypoint verifies-if-given + forwards
      # the CN (optional-mTLS model).
      BACKEND_API_URL: "https://localhost:443/"
      REDIS_URL: "redis://localhost:6379/0"
      # mTLS material comes from the on-host powernode-agent's PKI dir.
      # Agent owns enrollment + rotation via /node_api/enroll{,/refresh};
      # worker just reads node.crt + node.key + ca-bundle.crt at request
      # time (Faraday re-reads on each ssl_options call).
      WORKER_PKI_DIR: "/persist/var/lib/powernode/pki"
      # This all-in-one hub's Traefik serves a SELF-SIGNED cert (no public CA),
      # so the client side has nothing to chain the server cert to and default
      # verification fails ("certificate verify failed (self-signed certificate)"
      # -> BackendApiClient circuit breaker opens). Skip server-cert verification:
      # the call is loopback (worker + Traefik + Rails co-resident, no MITM risk),
      # and the worker STILL presents its client cert which Traefik verifies.
      # Multi-host prod (real platform cert) overrides this to "true" via the
      # config-variety child module, same seam as BACKEND_API_URL.
      WORKER_TLS_VERIFY: "false"
      # JWT-mode identity (config/application.rb#setup_service_authentication
      # exit(1)s in production if blank). mTLS internal calls identify via the
      # client-cert CN (= NodeInstance id); this is the JWT-side identifier.
      WORKER_ID: "powernode-hub-worker"
    capabilities: []
    # Cross-module ordering (rails + redis must be up first) lives in
    # the top-level dependencies.requires above. Service-level
    # dependencies is intra-module only.
    metadata:
      sidekiq_version: "7.x"
      notes: "Multi-host worker deployments override BACKEND_API_URL via config-variety child module. Cert material is managed by the agent — worker is read-only on PKI dir."

security:
  capabilities: []
  egress_allow: []
  privileged: false
  user_namespace: false

build:
  apt_snapshot: "20260415T000000Z"
