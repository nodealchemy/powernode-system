schema_version: 1
name: powernode-hub-worker
display_name: Powernode Hub Worker (Sidekiq + HTTP API)
description: Sidekiq job processor plus the worker HTTP API (embeddings, LLM proxy, job endpoints); communicates with hub-backend via HTTP API only
license: MIT
category: platform-apps
package_spec: []
# Ship the parent's worker/ tree into /opt/powernode/worker — matches
# production install layout. The Sidekiq config loads via bundle exec
# from this directory; gems resolve through hub-backend's bundled
# Gemfile (worker reuses backend's bundle).
file_spec:
  - /opt/powernode/worker/**
mask:
  - /opt/powernode/worker/tmp/***
  - /opt/powernode/worker/log/***
  - /opt/powernode/worker/.git/***
  # See hub-backend: mask the whole build-time vendor/bundle skeleton so the
  # on-node install-guard runs cleanly; .gem source ships via vendor/cache.
  - /opt/powernode/worker/vendor/bundle/***
dependency_spec: []
protected_spec: []
reboot_required: false

dependencies:
  # Same-host requires: runtime-ruby + redis. The previous co-resident
  # hub-backend dependency is dropped (Stage 8b) — workers can now run
  # as their own NodeInstance, communicating with a remote hub-backend
  # over mTLS via Traefik. For co-resident layouts, hub-backend will
  # still be present on the same node (assigned by the operator) but
  # we no longer enforce it at the module-graph level.
  requires:
    - powernode/runtime-ruby@^1.0
    - powernode/redis@^1.0

services:
  - name: sidekiq
    # Wrapper waits for hub-backend's rails-start.sh to publish
    # /etc/powernode/backend-default.conf (shared secrets file),
    # then sources it and vendors worker gems before exec'ing
    # sidekiq. Worker has its own Gemfile so it needs its own
    # vendor/bundle, separate from the backend's.
    start_command: "/usr/local/bin/sidekiq-start.sh"
    restart_policy: on-failure
    user: root
    working_directory: /opt/powernode/worker
    env:
      RAILS_ENV: production
      # Worker calls /api/v1/internal/* over mTLS (Stage 8b). On a
      # SAME-HOST worker NodeInstance (the historical layout) this
      # resolves to the local Traefik listener which routes back to
      # the co-resident Rails. On a MULTI-HOST worker NodeInstance the
      # config-variety child module overrides this to the platform's
      # public hostname over SDWAN. Either way, HTTPS-via-Traefik is
      # required: the worker presents its client cert and Traefik's
      # single websecure (:443) entrypoint verifies-if-given + forwards
      # the CN (optional-mTLS model).
      BACKEND_API_URL: "https://localhost:443/"
      REDIS_URL: "redis://localhost:6379/0"
      # mTLS material comes from the on-host powernode-agent's PKI dir.
      # Agent owns enrollment + rotation via /node_api/enroll{,/refresh};
      # worker just reads node.crt + node.key + ca-bundle.crt at request
      # time (Faraday re-reads on each ssl_options call).
      WORKER_PKI_DIR: "/persist/var/lib/powernode/pki"
      # This all-in-one hub's Traefik serves a SELF-SIGNED cert (no public CA),
      # so the client side has nothing to chain the server cert to and default
      # verification fails ("certificate verify failed (self-signed certificate)"
      # -> BackendApiClient circuit breaker opens). Skip server-cert verification:
      # the call is loopback (worker + Traefik + Rails co-resident, no MITM risk),
      # and the worker STILL presents its client cert which Traefik verifies.
      # Multi-host prod (real platform cert) overrides this to "true" via the
      # config-variety child module, same seam as BACKEND_API_URL.
      WORKER_TLS_VERIFY: "false"
      # JWT-mode identity (config/application.rb#setup_service_authentication
      # exit(1)s in production if blank). mTLS internal calls identify via the
      # client-cert CN (= NodeInstance id); this is the JWT-side identifier.
      WORKER_ID: "powernode-hub-worker"
    # Cross-module ordering (rails + redis must be up first) lives in
    # the top-level dependencies.requires above. Service-level
    # dependencies is intra-module only.
    metadata:
      sidekiq_version: "7.x"
      notes: "Multi-host worker deployments override BACKEND_API_URL via config-variety child module. Cert material is managed by the agent — worker is read-only on PKI dir."

  - name: worker-web
    # The worker HTTP API — NOT just the /sidekiq dashboard. config.ru maps
    # /api/v1 -> JobsController, which is where embeddings and the LLM proxy
    # live; the backend's WorkerTransport targets it at
    # Rails.application.config.worker_url (WORKER_URL, default
    # http://localhost:4567).
    #
    # Without this service the platform can search embeddings already at rest
    # but cannot generate a query embedding, so semantic search and
    # embed-on-write fail while plain SQL lookups keep working. It ran only on
    # the dev box as a hand-managed systemd unit
    # (scripts/systemd/powernode-worker-web.sh) and so was never modularized —
    # which is why fleet-hosted control planes silently had no embeddings.
    start_command: "/usr/local/bin/worker-web-start.sh"
    restart_policy: on-failure
    user: root
    working_directory: /opt/powernode/worker
    env:
      RAILS_ENV: production
      # Loopback only — the backend is co-resident and reaches us via
      # WORKER_URL=http://localhost:4567. A multi-host worker NodeInstance
      # overrides both sides through the config-variety child module, the
      # same seam as BACKEND_API_URL.
      SIDEKIQ_WEB_HOST: "127.0.0.1"
      SIDEKIQ_WEB_PORT: "4567"
      # Same values as the sidekiq service above — both are processes of the
      # same worker app and share its identity and mTLS material.
      BACKEND_API_URL: "https://localhost:443/"
      REDIS_URL: "redis://localhost:6379/0"
      WORKER_PKI_DIR: "/persist/var/lib/powernode/pki"
      WORKER_TLS_VERIFY: "false"
      WORKER_ID: "powernode-hub-worker"
    exposed_ports:
      - { port: 4567, protocol: tcp, name: http }
    health:
      endpoint: "/health"
      method: GET
      interval_seconds: 30
      timeout_seconds: 5
      initial_delay_seconds: 30
    dependencies:
      # sidekiq owns the one-time offline `bundle install` into the shared
      # vendor/bundle; start after it so the two never install concurrently.
      - { service: sidekiq, kind: start_before }
    metadata:
      notes: "Worker HTTP API (embeddings + LLM proxy + job endpoints), not merely the Sidekiq dashboard. Generates .session.key on first boot because config.ru reads it at load time and the secret is deliberately unshipped."

security:
  # CAP_DAC_READ_SEARCH — read hub-backend's secrets at
  # $STATE_DIR/backend-default.conf. Both launchers (sidekiq-start.sh,
  # worker-web-start.sh) source that file, and since the non-root rails
  # migration STATE_DIR is 0700 owned by powernode-rails. The launchers run
  # as root and assumed that was enough ("root ignores Unix permission bits
  # entirely"), but the agent renders THIS list into a per-unit
  # CapabilityBoundingSet=/AmbientCapabilities= drop-in: an empty list left
  # both units at uid 0 with CapEff=0, unable even to traverse into
  # STATE_DIR. They then crash-looped for ~26h (2026-09-21, NRestarts=387
  # each), taking every Sidekiq cron down with them — including the CI runner
  # lease sweep, which is the only thing that readvances a stalled native
  # module build batch.
  #
  # This MUST stay in the top-level security block: agent buildPolicy reads
  # config["security"]["capabilities"] and applies one module-level policy to
  # every unit. The per-service `capabilities:` key does NOT reach the
  # drop-in. Pinned by spec/integration/system/hub_worker_services_spec.rb.
  #
  # Read/traverse only, deliberately: CAP_DAC_OVERRIDE would also bypass
  # WRITE checks, and nothing here writes outside /opt/powernode/worker,
  # which root already owns.
  capabilities:
    - CAP_DAC_READ_SEARCH
  # Sidekiq jobs (disk-image publication ingest, module OCI ingest, etc.)
  # call Gitea's API/OCI registry directly, but same rationale as
  # hub-backend's manifest: no static real hostnames/IPs baked into tracked
  # source. See hub-backend/manifest.yaml's comment for the mechanism this
  # is covered by instead.
  egress_allow: []
  privileged: false
  user_namespace: false

build:
  apt_snapshot: "20260415T000000Z"
