schema_version: 1

name: claude-tmux
display_name: "Claude Code CLI in a managed tmux session"
description: >
  Runs the Claude Code CLI (@anthropic-ai/claude-code) inside a named,
  systemd-supervised tmux session on the instance — survives SSH
  disconnects; the operator reconnects with `tmux attach -t claude-code`.
  The Anthropic API key is fetched from platform-side Vault storage over
  the mTLS-authenticated node_api at service start; it is never baked
  into this module's image, never written to an env file, and never
  logged. Reusable standalone — any fleet instance can carry this module
  regardless of template.
license: MIT

mask:
  - "/var/cache/apt/**"
  - "/var/lib/apt/lists/**"
  - "/usr/share/doc/**"
  - "/usr/share/man/**"

# campaign 019f6084 P0-C, Step 1 of 2 (Step 2 lands separately — see the
# dependencies: comment below): curated from the real apt-ownership
# closure for the CORRECTED package_spec (derive-file-spec.sh --mode
# deb-payload against [tmux, jq, ca-certificates] — ca-certificates
# resolves 0 owned files here since base-os already package_spec's it;
# tmux+jq resolve 35 owned files, 20 of them doc/man now waived below,
# leaving the 15 file_spec entries under the tmux/jq comment). This
# replaced TWO bugs the old broad carve hid: (1) nodejs+npm's apt
# closure was declared as this module's package_spec, but their real
# payload is npm's own ~27,000-file vendored dev toolchain (babel,
# eslint, node-gyp, python3, dpkg — apt's `npm` package ships its own
# implementation as a giant node_modules tree; NONE of it is
# claude-tmux's own content) that the old /usr/lib/node_modules/** +
# /usr/lib/x86_64-linux-gnu/** globs were silently carving in full,
# confirmed empirically via `derive --mode deb-payload --module
# claude-tmux` against the unmodified manifest (27,183 owned files); (2)
# /usr/share/tmux/** matched nothing at all — Noble's tmux package ships
# no such directory (dead glob, apt binary is /usr/bin/tmux + a share/doc
# tree already covered by the mask above). The staged Claude Code CLI
# entries below are real, physically-written content (the npm-install-
# into-prefix step in stage15.sh's claude-tmux case writes them
# regardless of package_spec) but are NOT apt-derivable, so --mode
# deb-payload structurally can't verify them (they never appear in the
# apt-resolved candidate set it diffs against — see the tool's own
# "Fidelity blind spots" header note); left declared here because
# stage2-carve.sh's real fat-root carve still needs a "+" rule to keep
# them.
file_spec:
  - "/usr/bin/claude"
  - "/usr/bin/jq"
  - "/usr/bin/tmux"
  - "/usr/lib/node_modules/@anthropic-ai/claude-code/**"
  - "/usr/lib/x86_64-linux-gnu/libevent_core-2.1.so*"
  - "/usr/lib/x86_64-linux-gnu/libjq.so*"
  - "/usr/lib/x86_64-linux-gnu/libonig.so*"
  - "/usr/lib/x86_64-linux-gnu/libutempter.so*"
  - "/usr/lib/x86_64-linux-gnu/utempter/utempter"
  - "/usr/share/debianutils/shells.d/tmux"
  - "/usr/share/lintian/overrides/libevent-core-2.1-7t64"
  - "/usr/share/lintian/overrides/libutempter0"
  - "/usr/share/lintian/overrides/tmux"
  - "/usr/local/bin/claude-tmux-fetch-credential.sh"
  - "/usr/local/bin/claude-tmux-start.sh"

# Owned (tmux/jq's real closure) but masked out by /usr/share/doc/** +
# /usr/share/man/** above — waived so conformance doesn't WARN on the
# deliberate exclusion.
carve_waivers:
  - "/usr/share/doc/**"
  - "/usr/share/man/**"

# claude-tmux only ships its own service unit + scripts + the CLI
# runtime — no other module's paths.
protected_spec: []

# tmux + jq + ca-certificates come from apt (mmdebstrap). The Node.js
# runtime that /usr/bin/claude's shebang needs at BOOT time does NOT ship
# from this module as of Step 1 — apt's nodejs/npm (Noble ships v18, too
# old to run the CLI; see runtime-node's manifest comment for the same
# finding) were dropped from package_spec (see file_spec comment above
# for why: their real payload was npm's own giant internal toolchain, not
# a Node runtime claude-tmux needs). Step 2 (separate commit) adds
# `requires: capability:runtime.node` so the shared runtime-node module
# (Node 24.13.0 at /usr/local/bin/node) supplies the interpreter instead —
# until Step 2 lands, an instance carrying ONLY this module has no working
# `node` on PATH; the two steps are meant to land together, not be
# deployed independently (runtime smoke across both steps is PARKED,
# see this increment's report). The Claude Code CLI itself is an npm
# package with no apt equivalent, so it is npm-installed into this
# module's rootfs at CI build time regardless of package_spec (see the
# claude-tmux case in scripts/module-build/stage15.sh Stage 1.5) rather
# than listed here.
package_spec:
  - tmux
  - ca-certificates
  # claude-tmux-fetch-credential.sh parses the mTLS node_api JSON response
  # with jq; declare it so the module is self-sufficient rather than
  # silently relying on a neighbor module (e.g. dev-cell) to pull jq in.
  - jq

dependencies:
  requires:
    # The base module's canonical slug is powernode-system-base (see
    # base-os-ubuntu-noble, which requires the same). The earlier
    # "powernode/system-base" was a naming typo — no module is named
    # system-base, so on a strict resolver it would fail to resolve the
    # base layer for any template composing claude-tmux (e.g. dev-cell).
    - powernode/powernode-system-base@^1.0
    # tmux, jq, and this module's own scripts link against base-os's
    # glibc — closure guarantee (campaign 019f6084 inc1).
    - capability:os.userland
  provides:
    - dev.claude-cli
    - dev.tmux-session

# unit_body passthrough (option A2): Type=forking + the credential-fetch
# ExecStartPre= can't be expressed via the generated-unit Service fields,
# so this rides the services: lifecycle with the unit file's body
# verbatim. No sibling dev-cell/claude-tmux unit references in this body
# (After=/Wants=network-online.target only), so nothing needed stripping
# into `dependencies:`. No `user:` — pnadmin is an agent-baseline
# identity, not a platform-allocated ServiceUser or a
# WELL_KNOWN_SYSTEM_USERS entry, so it can't be declared under `users:`
# without colliding UIDs; the body's own User=/Group=pnadmin governs.
services:
  - name: claude
    unit_body: |
      [Unit]
      Description=Claude Code CLI (managed tmux session)
      Documentation=https://github.com/nodealchemy/powernode-platform
      After=network-online.target
      Wants=network-online.target
      ConditionPathExists=/usr/bin/claude

      [Service]
      # tmux daemonizes itself (the client forks the tmux server and exits) —
      # Type=forking is the correct fit, not Type=simple. Systemd waits for the
      # ExecStart process to exit, then tracks the surviving tmux server process
      # in the unit's cgroup; Restart=on-failure fires once the cgroup empties
      # (the server crashed or was killed) rather than on every ExecStart exit.
      Type=forking
      User=pnadmin
      Group=pnadmin
      Environment=HOME=/home/pnadmin

      # RuntimeDirectory gives us a private, auto-created, auto-cleaned tmpfs
      # dir (0700, owned by User=/Group=) at /run/claude-tmux for the
      # short-lived credential handoff file — never a world-readable path.
      RuntimeDirectory=claude-tmux
      RuntimeDirectoryMode=0700

      # Fetches the Anthropic API key from the platform's Vault-backed node_api
      # over mTLS and writes it to $RUNTIME_DIRECTORY/api_key (0600). Runs as
      # root (the "+" prefix) because only root can read the agent's mTLS
      # private key at /persist/var/lib/powernode/pki/node.key (0600) — the
      # credential file it writes back is chowned to pnadmin so the unprivileged
      # tmux session (User=pnadmin below) can read it exactly once.
      ExecStartPre=+/usr/local/bin/claude-tmux-fetch-credential.sh

      # Starts (or, on restart, no-ops into) the "claude-code" tmux session and
      # launches `claude` inside it. The credential file is read-then-deleted
      # from within the pane's own shell (never passed as a systemd/tmux argv,
      # which would otherwise leak into `ps`).
      ExecStart=/usr/local/bin/claude-tmux-start.sh
      ExecStop=/usr/bin/tmux -L claude-tmux kill-session -t claude-code

      Restart=on-failure
      RestartSec=5s
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

reboot_required: false

security:
  capabilities: []
  egress_allow: []
  privileged: false
  user_namespace: true

skills: []

build:
  apt_snapshot: "20260415T000000Z"
