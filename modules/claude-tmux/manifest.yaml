schema_version: 1

name: claude-tmux
display_name: "Claude Code CLI in a managed tmux session"
description: >
  Runs the Claude Code CLI (@anthropic-ai/claude-code) inside a named,
  systemd-supervised tmux session on the instance — survives SSH
  disconnects; the operator reconnects with `tmux attach -t claude-code`.
  The Anthropic API key is fetched from platform-side Vault storage over
  the mTLS-authenticated node_api at service start; it is never baked
  into this module's image, never written to an env file, and never
  logged. Reusable standalone — any fleet instance can carry this module
  regardless of template.
license: MIT

mask:
  - "/var/cache/apt/**"
  - "/var/lib/apt/lists/**"
  - "/usr/share/doc/**"
  - "/usr/share/man/**"

file_spec:
  - "/usr/bin/tmux"
  - "/usr/share/tmux/**"
  - "/usr/bin/node"
  - "/usr/bin/nodejs"
  - "/usr/bin/npm"
  - "/usr/bin/npx"
  - "/usr/bin/claude"
  - "/usr/lib/node_modules/**"
  # apt's nodejs/tmux packages can pull in shared libraries (e.g. a
  # shared libnode.so build, ICU) under the multiarch lib dir — carve
  # the whole tree rather than enumerate individual .so files, so a
  # Debian/apt version bump can't silently strand the module with a
  # dynamic-linker failure at runtime. Mirrors runtime-ruby's broader
  # /usr/lib/** carve for the same reason (a language runtime's
  # shared-library surface isn't something to hand-enumerate).
  - "/usr/lib/x86_64-linux-gnu/**"
  - "/usr/local/bin/claude-tmux-fetch-credential.sh"
  - "/usr/local/bin/claude-tmux-start.sh"

# claude-tmux only ships its own service unit + scripts + the CLI
# runtime — no other module's paths.
protected_spec: []

# tmux + Node.js runtime come from apt (mmdebstrap); the Claude Code CLI
# itself is an npm package with no apt equivalent, so it is npm-installed
# into this module's rootfs at CI build time (see the claude-tmux case in
# .gitea/workflows/build-platform-modules.yaml Stage 1.5) rather than
# listed here.
package_spec:
  - tmux
  - nodejs
  - npm
  - ca-certificates
  # claude-tmux-fetch-credential.sh parses the mTLS node_api JSON response
  # with jq; declare it so the module is self-sufficient rather than
  # silently relying on a neighbor module (e.g. dev-cell) to pull jq in.
  - jq

dependencies:
  requires:
    # The base module's canonical slug is powernode-system-base (see
    # base-os-ubuntu-noble, which requires the same). The earlier
    # "powernode/system-base" was a naming typo — no module is named
    # system-base, so on a strict resolver it would fail to resolve the
    # base layer for any template composing claude-tmux (e.g. dev-cell).
    - powernode/powernode-system-base@^1.0
    # claude (Node.js binary), tmux, and this module's own scripts link
    # against base-os's glibc — closure guarantee (campaign 019f6084 inc1).
    - capability:os.userland
  provides:
    - dev.claude-cli
    - dev.tmux-session

# unit_body passthrough (option A2): Type=forking + the credential-fetch
# ExecStartPre= can't be expressed via the generated-unit Service fields,
# so this rides the services: lifecycle with the unit file's body
# verbatim. No sibling dev-cell/claude-tmux unit references in this body
# (After=/Wants=network-online.target only), so nothing needed stripping
# into `dependencies:`. No `user:` — pnadmin is an agent-baseline
# identity, not a platform-allocated ServiceUser or a
# WELL_KNOWN_SYSTEM_USERS entry, so it can't be declared under `users:`
# without colliding UIDs; the body's own User=/Group=pnadmin governs.
services:
  - name: claude
    unit_body: |
      [Unit]
      Description=Claude Code CLI (managed tmux session)
      Documentation=https://github.com/nodealchemy/powernode-platform
      After=network-online.target
      Wants=network-online.target
      ConditionPathExists=/usr/bin/claude

      [Service]
      # tmux daemonizes itself (the client forks the tmux server and exits) —
      # Type=forking is the correct fit, not Type=simple. Systemd waits for the
      # ExecStart process to exit, then tracks the surviving tmux server process
      # in the unit's cgroup; Restart=on-failure fires once the cgroup empties
      # (the server crashed or was killed) rather than on every ExecStart exit.
      Type=forking
      User=pnadmin
      Group=pnadmin
      Environment=HOME=/home/pnadmin

      # RuntimeDirectory gives us a private, auto-created, auto-cleaned tmpfs
      # dir (0700, owned by User=/Group=) at /run/claude-tmux for the
      # short-lived credential handoff file — never a world-readable path.
      RuntimeDirectory=claude-tmux
      RuntimeDirectoryMode=0700

      # Fetches the Anthropic API key from the platform's Vault-backed node_api
      # over mTLS and writes it to $RUNTIME_DIRECTORY/api_key (0600). Runs as
      # root (the "+" prefix) because only root can read the agent's mTLS
      # private key at /persist/var/lib/powernode/pki/node.key (0600) — the
      # credential file it writes back is chowned to pnadmin so the unprivileged
      # tmux session (User=pnadmin below) can read it exactly once.
      ExecStartPre=+/usr/local/bin/claude-tmux-fetch-credential.sh

      # Starts (or, on restart, no-ops into) the "claude-code" tmux session and
      # launches `claude` inside it. The credential file is read-then-deleted
      # from within the pane's own shell (never passed as a systemd/tmux argv,
      # which would otherwise leak into `ps`).
      ExecStart=/usr/local/bin/claude-tmux-start.sh
      ExecStop=/usr/bin/tmux -L claude-tmux kill-session -t claude-code

      Restart=on-failure
      RestartSec=5s
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

reboot_required: false

security:
  capabilities: []
  egress_allow: []
  privileged: false
  user_namespace: true

skills: []

build:
  apt_snapshot: "20260415T000000Z"
