schema_version: 1

name: claude-tmux
display_name: "Claude Code CLI in a managed tmux session"
description: >
  Runs the Claude Code CLI (@anthropic-ai/claude-code) inside a named,
  systemd-supervised tmux session on the instance — survives SSH
  disconnects; the operator reconnects with `tmux attach -t claude-code`.
  The credential — an Anthropic API key, or a Claude-subscription OAuth
  login installed seed-once as ~/.claude/.credentials.json — is fetched
  from platform-side Vault storage over the mTLS-authenticated node_api
  at service start; it is never baked into this module's image, never
  written to an env file, and never logged. Reusable standalone — any
  fleet instance can carry this module regardless of template.
license: MIT
category: build-dev

mask:
  - "/var/cache/apt/**"
  - "/var/lib/apt/lists/**"
  - "/usr/share/doc/**"
  - "/usr/share/man/**"

# campaign 019f6084 P0-C, Step 1 of 2 (Step 2 lands separately — see the
# dependencies: comment below): curated from the real apt-ownership
# closure for the CORRECTED package_spec (derive-file-spec.sh --mode
# deb-payload against [tmux, jq, ca-certificates] — ca-certificates
# resolves 0 owned files here since base-os already package_spec's it;
# tmux+jq resolve 35 owned files, 20 of them doc/man now waived below,
# leaving the 15 file_spec entries under the tmux/jq comment). This
# replaced TWO bugs the old broad carve hid: (1) nodejs+npm's apt
# closure was declared as this module's package_spec, but their real
# payload is npm's own ~27,000-file vendored dev toolchain (babel,
# eslint, node-gyp, python3, dpkg — apt's `npm` package ships its own
# implementation as a giant node_modules tree; NONE of it is
# claude-tmux's own content) that the old /usr/lib/node_modules/** +
# /usr/lib/x86_64-linux-gnu/** globs were silently carving in full,
# confirmed empirically via `derive --mode deb-payload --module
# claude-tmux` against the unmodified manifest (27,183 owned files); (2)
# /usr/share/tmux/** matched nothing at all — Noble's tmux package ships
# no such directory (dead glob, apt binary is /usr/bin/tmux + a share/doc
# tree already covered by the mask above). The staged Claude Code CLI
# entries below are real, physically-written content (the npm-install-
# into-prefix step in stage15.sh's claude-tmux case writes them
# regardless of package_spec) but are NOT apt-derivable, so --mode
# deb-payload structurally can't verify them (they never appear in the
# apt-resolved candidate set it diffs against — see the tool's own
# "Fidelity blind spots" header note); left declared here because
# stage2-carve.sh's real fat-root carve still needs a "+" rule to keep
# them.
file_spec:
  - "/usr/bin/claude"
  - "/usr/bin/jq"
  - "/usr/bin/tmux"
  # The terminfo database tmux needs to start at all. BOTH paths are
  # claimed deliberately: ncurses-base installs to /lib/terminfo (usr-merged
  # to /usr/lib/terminfo) while ncurses-term installs to
  # /usr/share/terminfo, and claiming only one leaves tmux's own default
  # TERM unresolvable. Globs rather than individual entries because the set
  # is data, not an interface — pinning entry names here would silently
  # drop terminals on any ncurses refresh.
  - "/lib/terminfo/**"
  - "/usr/lib/terminfo/**"
  - "/usr/share/terminfo/**"
  - "/usr/lib/node_modules/@anthropic-ai/claude-code/**"
  - "/usr/lib/x86_64-linux-gnu/libevent_core-2.1.so*"
  - "/usr/lib/x86_64-linux-gnu/libjq.so*"
  - "/usr/lib/x86_64-linux-gnu/libonig.so*"
  - "/usr/lib/x86_64-linux-gnu/libutempter.so*"
  - "/usr/lib/x86_64-linux-gnu/utempter/utempter"
  - "/usr/share/debianutils/shells.d/tmux"
  - "/usr/share/lintian/overrides/libevent-core-2.1-7t64"
  - "/usr/share/lintian/overrides/libutempter0"
  - "/usr/share/lintian/overrides/tmux"
  - "/usr/local/bin/claude-tmux-fetch-credential.sh"
  - "/usr/local/bin/claude-tmux-start.sh"

# Owned (tmux/jq's real closure) but masked out by /usr/share/doc/** +
# /usr/share/man/** above — waived so conformance doesn't WARN on the
# deliberate exclusion.
carve_waivers:
  - "/usr/share/doc/**"
  - "/usr/share/man/**"

# claude-tmux only ships its own service unit + scripts + the CLI
# runtime — no other module's paths.
protected_spec: []

# tmux + jq + ca-certificates come from apt (mmdebstrap). The Node.js
# runtime that /usr/bin/claude's shebang needs at BOOT time does NOT ship
# from this module as of Step 1 — apt's nodejs/npm (Noble ships v18, too
# old to run the CLI; see runtime-node's manifest comment for the same
# finding) were dropped from package_spec (see file_spec comment above
# for why: their real payload was npm's own giant internal toolchain, not
# a Node runtime claude-tmux needs). Step 2 (separate commit) adds
# `requires: capability:runtime.node` so the shared runtime-node module
# (Node 24.13.0 at /usr/local/bin/node) supplies the interpreter instead —
# until Step 2 lands, an instance carrying ONLY this module has no working
# `node` on PATH; the two steps are meant to land together, not be
# deployed independently (runtime smoke across both steps is PARKED,
# see this increment's report). The Claude Code CLI itself is an npm
# package with no apt equivalent, so it is npm-installed into this
# module's rootfs at CI build time regardless of package_spec (see the
# claude-tmux case in scripts/module-build/stage15.sh Stage 1.5) rather
# than listed here.
package_spec:
  - tmux
  - ca-certificates
  # claude-tmux-fetch-credential.sh parses the mTLS node_api JSON response
  # with jq; declare it so the module is self-sufficient rather than
  # silently relying on a neighbor module (e.g. dev-cell) to pull jq in.
  - jq
  # tmux CANNOT START without a terminfo database — it exits with
  # "missing or unsuitable terminal: <TERM>" before doing anything else.
  # apt pulls ncurses-base in transitively (tmux -> libtinfo6), but a
  # transitive package's FILES are still dropped by Stage 2's rsync filter
  # unless file_spec claims them, so the module shipped the binary without
  # the data it requires. Declared explicitly for the same reason as jq
  # above: on a fat node (dev-cell composes 13 other modules) some
  # neighbour happened to carve /usr/share/terminfo in and tmux worked by
  # accident; the first lean node to compose claude-tmux without such a
  # neighbour — ops-cell, 2026-07-29 — could not start tmux at all.
  - ncurses-base
  # ncurses-term supplies the entries tmux itself sets INSIDE a session
  # (tmux-256color, screen-256color) plus the long tail of client TERMs an
  # operator may arrive with. ncurses-base alone covers xterm-256color and
  # would fix the reported symptom, but a module whose entire purpose is
  # running tmux should not ship a terminfo set that tmux's own default
  # TERM is missing from.
  - ncurses-term

dependencies:
  requires:
    # The base module's canonical slug is powernode-system-base (see
    # base-os-ubuntu-noble, which requires the same). The earlier
    # "powernode/system-base" was a naming typo — no module is named
    # system-base, so on a strict resolver it would fail to resolve the
    # base layer for any template composing claude-tmux (e.g. dev-cell).
    - powernode/powernode-system-base@^1.0
    # tmux, jq, and this module's own scripts link against base-os's
    # glibc — closure guarantee (campaign 019f6084 inc1).
    - capability:os.userland
    # Step 2 of the P0-C node-runtime correction (see file_spec's and
    # package_spec's comments above): /usr/bin/claude's shebang needs a
    # `node` on PATH at boot, and this module no longer ships one itself
    # (apt nodejs/npm were dropped from package_spec in Step 1 — their
    # real payload was npm's own internal toolchain, not a usable Node
    # runtime; Noble's apt nodejs is v18 and can't run the CLI regardless,
    # per runtime-node's own manifest comment). runtime-node provides
    # Node 24.13.0 at /usr/local/bin/node; declaring this as a hard
    # `requires:` capability edge (rather than dev-cell's existing softer
    # "assumed co-module, co-assigned on the same NodeTemplate" pattern —
    # see dev-cell/manifest.yaml's dependencies comment) means the
    # DependencyResolutionService pulls runtime-node into ANY composition
    # that includes claude-tmux automatically, matching the os.userland
    # closure-guarantee precedent from inc1 rather than relying on every
    # template author to remember the co-assignment by hand. Dedups the
    # "two copies of node" risk a manually-co-assigned template could
    # otherwise hit if it ALSO carried an apt-sourced node from elsewhere.
    - capability:runtime.node
  provides:
    - dev.claude-cli
    - dev.tmux-session

# unit_body passthrough (option A2): Type=forking + the condition gate and
# oneshot credential stager below can't be expressed via the generated-unit
# Service fields, so these ride the services: lifecycle with the unit files'
# bodies verbatim. The one sibling reference (claude -> credential) is
# stripped out into `dependencies:` rather than hand-written as
# After=/Requires= in the body, so the generator owns the real unit names.
# No `user:` — pnadmin is an agent-baseline
# identity, not a platform-allocated ServiceUser or a
# WELL_KNOWN_SYSTEM_USERS entry, so it can't be declared under `users:`
# without colliding UIDs; the body's own User=/Group=pnadmin governs.
services:
  # The credential fetch is its OWN unit, not an ExecStartPre of the session
  # below, because of a systemd rule that is easy to get wrong:
  # RestartPreventExitStatus= (and Restart= decisions generally) key off the
  # MAIN process. An ExecStartPre is a CONTROL process — systemd logs
  # "Control process exited, code=exited, status=78/CONFIG" and restarts the
  # unit anyway. Measured on live systemd 2026-08-17: exit 78 from
  # ExecStartPre with RestartPreventExitStatus=78 gave NRestarts=5; the same
  # exit from ExecStart gave NRestarts=0. So the "fail once and stay put"
  # posture CANNOT be expressed from a pre-hook at all.
  #
  # Splitting it lets each half use the mechanism that actually applies:
  #   - fetching is a root oneshot whose exit code IS its main-process exit,
  #     so SuccessExitStatus=78 makes "no credential configured" a clean
  #     success rather than a fault to retry;
  #   - the session is gated by ConditionPathExists on the staged credential.
  #     A false CONDITION is not a failure: systemd skips the unit, with no
  #     restart, no failed state, and no type=1130 res=failed audit record.
  #     That is the posture the 404 branch always wanted.
  - name: credential
    unit_body: |
      [Unit]
      Description=Claude Code CLI: stage the Anthropic credential (root, mTLS)
      Documentation=https://github.com/nodealchemy/powernode-platform
      After=network-online.target
      Wants=network-online.target
      ConditionPathExists=/usr/bin/claude
      # Bounds genuinely transient faults (network/mTLS, 5xx). MUST live in
      # [Unit] — systemd silently ignores these in [Service].
      #
      # Burst is 20, not 5, because StartLimitBurst counts STARTS, NOT
      # FAILURES. This unit has no RemainAfterExit, so the session unit pulls
      # it afresh on every one of its own starts — and those starts SUCCEED.
      # At Burst=5 five successful stagings inside the window exhausted the
      # allowance, systemd answered the next pull with "Start request repeated
      # too quickly", and Requires= turned that into "Dependency failed" on the
      # session (observed on dev-cell 2026-08-17). So the budget has to clear
      # the consumer's own restart budget: the session can emit at most 5
      # starts per 180s before its own limit holds it down, well under 20.
      #
      # It still bounds a real fetch loop: retries are 30s apart, so 20 starts
      # take 600s, inside the 1800s window. As always the interval must exceed
      # RestartSec x Burst or the limit could never trip at all.
      StartLimitIntervalSec=1800
      StartLimitBurst=20

      [Service]
      Type=oneshot
      # Runs as root: only root can read the agent's mTLS private key at
      # /persist/var/lib/powernode/pki/node.key (0600). The staged key is
      # chowned to the session user by the script.
      RuntimeDirectory=claude-tmux
      RuntimeDirectoryMode=0700
      # Preserve past this oneshot's own exit — the session unit below reads
      # the staged file, and an auto-removed RuntimeDirectory would take the
      # credential with it the moment this unit went inactive.
      RuntimeDirectoryPreserve=yes
      Environment=CLAUDE_TMUX_USER=pnadmin
      ExecStart=/usr/local/bin/claude-tmux-fetch-credential.sh
      # 78 (EX_CONFIG) = this instance has NO credential configured. That is
      # a supported, deliberate state (the fallback SiteSetting defaults OFF
      # since inc21 so an idle cell cannot burn API credits), NOT a fault —
      # so it completes successfully having staged nothing, and the session
      # unit's ConditionPathExists then skips cleanly. Every other failure
      # keeps exit 1 and is retried below.
      SuccessExitStatus=78
      Restart=on-failure
      RestartSec=30s
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

  - name: claude
    dependencies:
      - { service: credential, kind: start_before }
    unit_body: |
      [Unit]
      Description=Claude Code CLI (managed tmux session)
      Documentation=https://github.com/nodealchemy/powernode-platform
      After=network-online.target
      Wants=network-online.target
      ConditionPathExists=/usr/bin/claude
      # The gate. No credential staged => this unit is SKIPPED, not failed:
      # no restart, no failed state, no audit record. Replaces the old
      # ExecStartPre=+...fetch-credential.sh, whose exit code could not
      # suppress a restart because a pre-hook is a control process.
      #
      # TWO staged shapes, EITHER satisfies the gate — the "|" prefix makes
      # these lines a triggering (OR) group while the plain /usr/bin/claude
      # condition above stays AND'd: api_key is the staged Anthropic key the
      # pane exports; oauth_ready marks that the fetch installed (or found,
      # seed-once) a usable ~/.claude/.credentials.json OAuth login, which
      # claude reads itself with no env var involved.
      ConditionPathExists=|/run/claude-tmux/api_key
      ConditionPathExists=|/run/claude-tmux/oauth_ready
      # Bounds a PERSISTENT tmux-side failure. Interval must exceed
      # RestartSec x Burst (5s x 5 = 25s); the stock 10s/5 cannot trip.
      StartLimitIntervalSec=180
      StartLimitBurst=5

      [Service]
      # tmux daemonizes itself (the client forks the tmux server and exits) —
      # Type=forking is the correct fit, not Type=simple. Systemd waits for the
      # ExecStart process to exit, then tracks the surviving tmux server process
      # in the unit's cgroup; Restart=on-failure fires once the cgroup empties
      # (the server crashed or was killed) rather than on every ExecStart exit.
      Type=forking
      User=pnadmin
      Group=pnadmin
      Environment=HOME=/home/pnadmin

      # Same private tmpfs dir the credential unit created and preserved. It
      # is re-declared here so systemd re-applies ownership to this unit's
      # User=/Group= (the credential unit runs as root, so the dir arrives
      # root-owned) and so it is cleaned up when the session stops — never a
      # world-readable path either way.
      RuntimeDirectory=claude-tmux
      RuntimeDirectoryMode=0700

      # Starts (or, on restart, no-ops into) the "claude-code" tmux session and
      # launches `claude` inside it. The credential file is read-then-deleted
      # from within the pane's own shell (never passed as a systemd/tmux argv,
      # which would otherwise leak into `ps`).
      ExecStart=/usr/local/bin/claude-tmux-start.sh
      ExecStop=/usr/bin/tmux -L claude-tmux kill-session -t claude-code

      # Governs the tmux server dying, which is the only failure this unit
      # can now have — "no credential configured" never reaches here, it is
      # answered by the ConditionPathExists gate above. Deliberately NO
      # RestartPreventExitStatus=: it was inert here (a pre-hook is a
      # control process) and there is no longer a pre-hook to guard.
      Restart=on-failure
      RestartSec=5s
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

reboot_required: false

security:
  capabilities: []
  # The module ships the Claude Code CLI and must therefore permit the one
  # host that CLI exists to talk to. An empty list here is not "no policy" —
  # the agent unions every desired module's egress_allow into one node-wide
  # nftables default-deny chain, so shipping the CLI with [] guaranteed it
  # could never work. Observed on ops-cell 2026-07-29 as
  # "ECONNREFUSED api.anthropic.com" while git.powernode.org stayed reachable,
  # which reads like a network fault and is actually this manifest.
  #
  # CAVEAT worth knowing before trusting this: entries are resolved to A/AAAA
  # records at install time and re-resolved only on cert-rotate (~67 days).
  # api.anthropic.com sits behind a CDN whose addresses rotate, so the pinned
  # IPs can go stale between resolutions and the symptom returns looking
  # identical. If that recurs, the fix is not another host here — it is
  # DNS-aware egress (see ApplyEgressAllowlist's sidecar note), and a
  # reconcile or cert-rotate is the interim unstick.
  egress_allow:
    - api.anthropic.com
  privileged: false
  user_namespace: true

skills: []

build:
  apt_snapshot: "20260415T000000Z"
  # Claude Code CLI version npm-installed in Stage 1.5 (see the claude-tmux
  # case in scripts/module-build/stage15.sh). Pinned for reproducibility —
  # previously the install floated to npm's implicit @latest at CI build time,
  # the one build input in this repo not version/sha-pinned (contrast
  # runtime-node/runtime-ruby/oras/act_runner). Unlike a release-binary fetch
  # there is no single sha256 to verify; the exact npm version + npm's own
  # package-lock integrity is the reproducibility unit. Bump deliberately.
  claude_code_version: "2.1.220"
