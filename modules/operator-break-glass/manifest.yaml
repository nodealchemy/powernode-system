schema_version: 1
name: operator-break-glass
display_name: Operator Break-Glass Sudo
description: >-
  Grants the pnadmin login user unrestricted NOPASSWD sudo on the nodes this
  module is assigned to. A DELIBERATE, per-node privilege grant for the
  development phase — assign it only where an operator needs a standing path to
  root, and unassign it to revoke.
category: config

# The whole module is the sudoers grant below — it ships no payload.
#
# That is the point. The agent renders /etc/sudoers.d from the ASSIGNED
# manifest set every reconcile tick, not from the mounted union, so the grant
# takes effect without the composed overlay being rebuilt. On a self-hosted
# control plane, whose boot composition is a permanently frozen LKG, that is
# the difference between "works on the next reconcile" and "needs an LKG
# rewrite and a reboot".
#
# It is also why this is a MODULE rather than the agent's
# POWERNODE_OPERATOR_BREAK_GLASS env flag. That flag lives in a systemd drop-in
# under /etc, and / on a composed node is an overlay whose upperdir is tmpfs —
# so the flag, and the sudo it grants, evaporate on every reboot. A module
# assignment is state the platform holds, re-applied on every boot.
package_spec: []
file_spec: []
mask: []
dependency_spec: []
protected_spec: []
reboot_required: false

dependencies:
  requires:
    # sudo + the pnadmin account come from the OS userland layer; the grant is
    # meaningless without them.
    - capability:os.userland
  provides:
    - operator.break-glass

# Renders to: pnadmin ALL=(ALL) NOPASSWD: ALL
#
# Deliberately unrestricted, and deliberately narrow in SCOPE instead: the
# blast radius is controlled by which nodes carry the assignment, not by which
# commands are listed. A partial command list would invite the false comfort of
# looking restricted while `sudo sh` remains one entry away.
#
# The agent's built-in break-glass (internal/etcsudoers/breakglass.go) writes
# an identical line and its own docs say production should use module-declared
# grants like this one instead. Revoke by unassigning the module — the next
# reconcile sweeps the file, no reboot needed.
sudoers:
  - id: all
    user: pnadmin
    runas: ALL
    commands:
      - ALL

services: []

build:
  apt_snapshot: "20260415T000000Z"
