# Re-enables X11Forwarding for instances carrying dev-cell-browser, scoped
# to ONLY this module (not a fleet-wide flip — base-os-ubuntu-noble's own
# 10-powernode.conf keeps X11Forwarding no for every instance that does NOT
# carry this module).
#
# Filename ordering is load-bearing, not cosmetic: sshd's `Include
# /etc/ssh/sshd_config.d/*.conf` (Ubuntu's apt-default sshd_config) reads
# files in glob (alphabetical) order, and for each keyword "the first
# obtained value will be used" (sshd_config(5)) — later duplicate keyword
# lines are silently ignored. base-os-ubuntu-noble's own drop-in is
# `10-powernode.conf` (sets X11Forwarding no); naming this file `05-...` so
# it sorts BEFORE `10-` means sshd sees `X11Forwarding yes` FIRST and locks
# it in, and base-os's later `X11Forwarding no` for that same keyword is
# the one that gets silently ignored — the reverse of what a `20-...` name
# would have done (base-os's `no` would have won, this module's `yes`
# ignored, X11 forwarding silently still off).
X11Forwarding yes
