schema_version: 1

name: dev-cell-browser
display_name: "dev-cell browser (Google Chrome, X11 + headless)"
description: >
  Real, non-snap Google Chrome (google-chrome-stable) for interactive
  development on dev-cell: an operator SSHed in with X11 forwarding can run
  `google-chrome` and see windows locally, or drive it headless
  (`--headless=new`) for scripted use. One real Chrome binary supports both.
  .
  Ubuntu Noble's apt `chromium-browser`/`firefox` are transitional
  snap-redirect stubs, not real .deb packages — snapd is incompatible with
  this platform's mmdebstrap/immutable-EROFS build model outright, so a real
  browser has to come from outside Ubuntu's own apt. The Docker-official
  essential-hook approach for adding a third-party apt repo mid-mmdebstrap
  is empirically unreliable (see gitea-act-runner/manifest.yaml's
  package_spec comment: tried for the docker-ce repo, failed — "the hook
  runs AFTER the package index is built, with no re-index before
  --include"). This module sidesteps that failure mode entirely: instead of
  adding Google's apt repo, stage15.sh's dev-cell-browser case fetches the
  google-chrome-stable .deb DIRECTLY (pinned exact version + sha256, same
  discipline as the traefik/cosign/oras/act_runner fetches elsewhere in that
  script) and extracts it with `dpkg-deb -x` — no repo add, no hook, no
  re-index race. Chrome's own real Ubuntu-apt dependency closure (libnss3,
  libgtk-3-0t64, fonts-liberation, xdg-utils, etc. below in package_spec)
  comes from Noble's own main/universe archive, resolved normally by
  mmdebstrap — no third-party repo needed for those.
  .
  Being stock consumer Chrome (not Playwright's bundled "Chrome for
  Testing") measurably reduces OAuth2 automation-fingerprinting exposure
  for a human operator's own interactive session — though it is not a
  magic bullet; driving it via CDP/automation tooling would still leave
  signals. The point here is enabling genuine interactive, X11-forwarded
  use, not scripted automation.
  .
  X11Forwarding is fleet-wide `no` (base-os-ubuntu-noble's own
  sshd_config.d/10-powernode.conf), deliberately, for every instance class.
  This module ships its own sshd_config.d/05-dev-cell-browser.conf
  re-enabling it — see that file's own comment for why the `05-` filename
  prefix (not `20-` or similar) is load-bearing: sshd's Include directive
  takes the FIRST value it sees per keyword, so this file must sort BEFORE
  base-os's `10-powernode.conf` to actually win. Scoped to only instances
  carrying this module — base-os's own default stays untouched for
  everything else. `xauth` is in package_spec (below) for the SSH-side
  MIT-cookie handoff X11 forwarding needs — without it, forwarding silently
  degrades to nothing happening rather than failing loudly.
  .
  Chrome's own self-update cron trigger (`/etc/cron.daily/google-chrome`) is
  deliberately masked out below — this platform's module system is the
  authoritative, signed, versioned update path; letting Chrome silently
  self-update via cron would drift the running binary away from what this
  module's own signed artifact says is installed. Desktop-shell integration
  files (.desktop launchers, appdata.xml, gnome-control-center entries) are
  masked too — irrelevant noise on a headless/X11-forwarded CLI-launched
  instance with no desktop shell to read them.
license: MIT
category: build-dev

mask:
  - "/var/cache/apt/**"
  - "/var/lib/apt/lists/**"
  - "/usr/share/doc/**"
  - "/usr/share/man/**"
  - "/usr/share/locale/**"
  # See the description above — Chrome's own self-update trigger and
  # desktop-shell integration files, neither of which fit this module's
  # headless/X11-forwarded CLI use case.
  - "/etc/cron.daily/google-chrome"
  - "/usr/share/applications/**"
  - "/usr/share/appdata/**"
  - "/usr/share/gnome-control-center/**"

# Two distinct sources: (1) Chrome's own payload — fetched directly (pinned
# google-chrome-stable_150.0.7871.128-1_amd64.deb, sha256-verified) and
# dpkg-deb -x'd by stage15.sh's dev-cell-browser case, since Chrome isn't
# apt-resolvable on Noble; (2) Chrome's real Ubuntu-apt dependency closure,
# resolved normally via package_spec below and curated here via
# `derive-file-spec.sh derive --mode deb-payload --module dev-cell-browser
# --workspace extensions/system` (12,966 owned files post-mask — GTK3 +
# fontconfig + icon-theme closures are legitimately this large; see
# dev-cell/manifest.yaml's own "Interactive dev userland" precedent for the
# same order-of-magnitude finding on a different apt set). Directory-wide
# globs are used only for subtrees confirmed package-exclusive (icon
# themes, fontconfig, GTK/glib/gio/gdk-pixbuf/avahi's own multiarch
# subdirs, X11 app-defaults) — the SHARED multiarch lib dir's loose .so
# files use per-library `.so*` globs instead (89 of them), matching
# claude-tmux's/redis's/gitea-act-runner's existing convention of never
# directory-globbing /usr/lib/x86_64-linux-gnu/** directly (that glob
# would over-carve unrelated sibling-module content living in the SAME
# shared directory).
file_spec:
  # ── Chrome's own payload (not apt-derivable — see stage15.sh) ──────────
  - "/opt/google/chrome/**"
  - "/usr/bin/google-chrome-stable"
  # update-alternatives symlink Chrome's postinst would normally create
  # (dpkg-deb -x doesn't run postinst — see stage15.sh's dev-cell-browser
  # case, which creates this by hand). The common invocation name most
  # tooling/scripts expect.
  - "/usr/bin/google-chrome"

  # ── Dependency closure: package-exclusive directory-wide globs ─────────
  - "/etc/X11/Xsession.d/**"
  - "/etc/fonts/**"
  - "/etc/gtk-3.0/**"
  - "/usr/lib/x86_64-linux-gnu/avahi/**"
  - "/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/**"
  - "/usr/lib/x86_64-linux-gnu/gio/**"
  - "/usr/lib/x86_64-linux-gnu/glib-2.0/**"
  - "/usr/lib/x86_64-linux-gnu/gtk-3.0/**"
  - "/usr/lib/x86_64-linux-gnu/libgtk-3-0t64/**"
  - "/usr/share/X11/**"
  - "/usr/share/alsa/**"
  - "/usr/share/fontconfig/**"
  - "/usr/share/fonts/**"
  - "/usr/share/gcc/**"
  - "/usr/share/gettext/**"
  - "/usr/share/glib-2.0/**"
  - "/usr/share/gtk-3.0/**"
  - "/usr/share/icons/**"
  - "/usr/share/libdrm/**"
  - "/usr/share/libthai/**"
  - "/usr/share/mime/**"
  - "/usr/share/themes/**"
  - "/usr/share/xml/**"

