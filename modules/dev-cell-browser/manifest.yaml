# Owned (per the closure above) but masked out by the doc/man/locale rules
# above.
carve_waivers:
  - "/usr/share/doc/**"
  - "/usr/share/man/**"
  - "/usr/share/locale/**"
  - "/etc/cron.daily/google-chrome"
  - "/usr/share/applications/**"
  - "/usr/share/appdata/**"
  - "/usr/share/gnome-control-center/**"

# dev-cell-browser only ships its own browser + X11-forwarding drop-in — no
# other module's paths.
protected_spec: []

package_spec:
  # Chrome's own real Ubuntu-apt Depends: line, verified against the
  # google-chrome-stable_150.0.7871.128-1 package's actual apt metadata
  # (dl.google.com/linux/chrome/deb/dists/stable/main/binary-amd64/Packages)
  # and each name confirmed resolvable on Noble via `apt-cache policy`
  # (several are Ubuntu's 64-bit-time_t "t64" renames — libasound2 ->
  # libasound2t64, libatk1.0-0 -> libatk1.0-0t64, etc. — not a typo).
  - ca-certificates
  - fonts-liberation
  - libasound2t64
  - libatk-bridge2.0-0t64
  - libatk1.0-0t64
  - libatspi2.0-0t64
  - libcairo2
  - libcups2t64
  - libcurl4t64
  - libdbus-1-3
  - libexpat1
  - libgbm1
  - libglib2.0-0t64
  - libgtk-3-0t64
  - libnspr4
  - libnss3
  - libpango-1.0-0
  - libudev1
  - libvulkan1
  - libx11-6
  - libxcb1
  - libxcomposite1
  - libxdamage1
  - libxext6
  - libxfixes3
  - libxkbcommon0
  - libxrandr2
  - wget
  - xdg-utils
  # Not a Chrome dependency — needed for the SSH-side MIT-cookie handoff
  # X11 forwarding requires (see the description + sshd drop-in comment).
  # Declared here so this module is self-sufficient rather than silently
  # relying on a neighbor module to pull it in (same philosophy
  # claude-tmux's own package_spec comment documents for jq).
  - xauth

dependencies:
  requires:
    - powernode/powernode-system-base@^1.0
    - capability:os.userland
  provides:
    - dev.browser

# No services: stanza — Chrome is launched on demand (interactively over an
# X11-forwarded SSH session, or invoked headless by a script), not a
# long-running daemon this module should supervise.

reboot_required: false

security:
  capabilities: []
  # Real internet egress — Chrome needs to actually reach the sites an
  # operator is testing OAuth2 flows against (arbitrary origins), not a
  # fixed allowlist.
  egress_allow:
    - "0.0.0.0/0"
  privileged: false
  user_namespace: true

skills: []

build:
  apt_snapshot: "20260415T000000Z"
  # Chrome's own pinned version (150.0.7871.128-1) + sha256 are hardcoded
  # directly in stage15.sh's dev-cell-browser case (same convention as the
  # traefik/cosign/oras fetches in that file — no generic custom-version
  # slot exists on this manifest's `build:` schema, unlike act_runner's
  # dedicated `act_runner_version` field).
