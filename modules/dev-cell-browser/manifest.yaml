  # confirmed by an actual over-carve FAIL when several of these were first
  # tried as directory-wide globs: base-os-owned files like
  # /usr/share/pam-configs/{mkhomedir,unix} and /usr/share/pkgconfig/
  # {systemd,udev}.pc got swept in). Narrowed to the exact package-scoped
