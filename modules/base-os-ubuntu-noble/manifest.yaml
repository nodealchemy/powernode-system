schema_version: 1

name: base-os-ubuntu-noble
display_name: "Powernode Base — Ubuntu 24.04 (Noble) userland"
description: "OS-specific layer on top of powernode-system-base — Ubuntu 24.04 LTS minbase userland: systemd as PID 1, systemd-networkd for DHCP, openssh-server, ca-certificates, libssl, coreutils, the standard Debian filesystem layout. Inherits /sbin/powernode-agent from the minimal powernode-system-base via overlay union; this module only owns the OS-specific bits. Sibling modules for Debian (trixie), Alpine, and other base images will provide the same `base.os` capability."
license: "MIT"

mask:
  - "/var/cache/apt/**"
  - "/var/lib/apt/lists/**"
  - "/usr/share/doc/**"
  - "/usr/share/man/**"
  - "/usr/share/locale/**"
  - "/var/log/**"

file_spec:
  - "/etc/**"
  - "/usr/bin/**"
  - "/usr/sbin/**"
  - "/usr/lib/**"
  - "/lib/**"
  - "/sbin/**"
  - "/bin/**"

# Sensitive paths that NO higher-priority module may override at union mount.
# Build pipeline folds these into every higher neighbor's effective_mask, so
# their blobs cannot ship these files. Anything machine-identity, account
# policy, or trust-boundary lives here.
protected_spec:
  # Identity + account policy
  - "/etc/passwd"
  - "/etc/shadow"
  - "/etc/group"
  - "/etc/gshadow"
  - "/etc/sudoers"
  - "/etc/sudoers.d/**"
  # Authentication policy
  - "/etc/pam.d/**"
  - "/etc/security/**"
  - "/etc/login.defs"
  # SSH machine identity + policy
  - "/etc/ssh/sshd_config"
  - "/etc/ssh/sshd_config.d/**"
  - "/etc/ssh/ssh_host_*_key"
  - "/etc/ssh/ssh_host_*_key.pub"
  # Powernode-agent identity + binary
  - "/etc/systemd/system/powernode-agent.service"
  - "/usr/sbin/powernode-agent"
  - "/sbin/powernode-agent"
  # SUID trust boundary binaries
  - "/usr/bin/sudo"
  - "/usr/bin/su"
  - "/usr/sbin/sshd"

package_spec:
  - bash
  - coreutils
  - util-linux
  # On Ubuntu Noble, systemd-networkd ships inside the `systemd` package —
  # listing it separately causes `Unable to locate package` failures during
  # mmdebstrap. systemd-resolved is NOT part of `systemd`; it's its own
  # binary package (confirmed via `apt-cache search resolved` / `dpkg -S` —
  # the prior comment here claiming otherwise was wrong, which is why
  # un-masking rootfs/etc/systemd/system/systemd-resolved.service alone
  # never worked: there was no apt-installed unit underneath it to reveal).
  # Must be listed explicitly to get the unit, the binary, and its
  # sysusers.d/tmpfiles.d fragments.
  - systemd
  - systemd-sysv
  - systemd-resolved
  - dbus
  - iputils-ping
  - iproute2
  # nftables provides /usr/sbin/nft — the on-node agent's per-module reconcile
  # (runtime.attachModule → policy.Apply → security.ApplyEgressAllowlist) shells
  # out to `nft` to install the default-deny egress chain BEFORE it renders the
  # module's systemd units. Without nft in the pivoted rootfs, policy.Apply
  # errors ("nft: executable file not found in $PATH"), attachModule returns
  # early, AttachServices never runs, and every module's units are left as the
  # stale pre-render skeleton (empty ExecStart) → services never start. The
  # initramfs stages its own nft, so this only bit post-switch_root. (imp 605b)
  - nftables
  - openssh-server
  - ca-certificates
  - curl
  - dosfstools
  - kmod
  - udev

dependencies:
  # Depends on the truly-minimal powernode-system-base for the
  # /sbin/powernode-agent binary itself. The split lets multiple
  # base-OS variants (this one, debian-trixie, alpine, etc.) share
  # a single source-of-truth for the Powernode agent without
  # duplicating the Go cross-compile in every variant's CI step.
  # The Powernode dependency resolver mounts powernode-system-base
  # at a lower-priority layer so its /sbin/powernode-agent appears
  # in /sysroot under this module's /sbin (which is a directory
  # from the apt-installed coreutils — no file conflict).
  requires:
    - powernode/powernode-system-base@^1.0
  # Capability tags that hub / app modules can match against. The
  # dependency resolver picks any module providing `base.os` that
  # matches the node's arch + base-OS combination — e.g. this module
  # (ubuntu noble amd64) today, future powernode-system-base-trixie-arm64,
  # powernode-system-base-alpine, etc. Operators don't pin the slug;
  # they declare the capability they need and the resolver picks the
  # variant compatible with the node it's being assigned to.
  provides:
    - base.os
    - base.os.ubuntu-noble
    - net.systemd-networkd
    - sshd
    - init.systemd

# Deliberately empty. The post-switch_root agent service is shipped
# as a HAND-CURATED unit file at rootfs/etc/systemd/system/
# powernode-agent.service rather than a generated one from
# lifecycle/service.go. Rationale: system-base IS the platform on a
# pivot_root node — there's no higher-priority module to layer a
# generated unit on top of, and generated units use a
# `powernode-<module-uuid>-<name>.service` namespace that's noise here.
# Letting the agent reconcile loop create a parallel unit alongside
# the curated one would result in two competing instances of the same
# binary; instead leave services: empty and rely on the rootfs/ overlay.
services: []

# Service accounts the base-OS systemd units require to start. Declared here
# (NOT hand-written into /etc/passwd, NOT hardcoded in the agent baseline) so
# the platform-global UID allocator assigns stable UIDs and the agent's
# etcidentity renderer unions them with the baseline into the composed
# /etc/passwd at pivot. dbus/systemd-networkd/systemd-resolved failed at boot
# for lack of these users — the reason 019f3baf masked them; declaring the
# users lets the three run, which is what gives the pivoted hub working DHCP
# (networkd) and DNS resolution (resolved) so the agent can reach the platform.
# NOTE: verified in a standalone Containerfile build that all three owning
# packages (dbus, systemd, systemd-resolved) already create their account
# at build time via their own postinst — so this declaration isn't
# load-bearing for account *existence*. It's load-bearing for UID
# *stability*: apt's postinst assigns these dynamically in install order
# (observed messagebus=100, systemd-network=998, systemd-resolve=993 in one
# run), which isn't guaranteed identical between mmdebstrap (what CI
# actually uses — see .gitea/workflows/build-platform-modules.yaml) and a
# Containerfile/buildah build, or even across two mmdebstrap runs if the
# package set changes. The platform UID allocator pins these instead.
groups:
  - name: messagebus
  - name: systemd-network
  - name: systemd-resolve
users:
  - name: messagebus
    primary_group: messagebus
    shell: /usr/sbin/nologin
    home: /nonexistent
    gecos: "D-Bus system message bus"
  - name: systemd-network
    primary_group: systemd-network
    shell: /usr/sbin/nologin
    home: /run/systemd
    gecos: "systemd Network Management"
  - name: systemd-resolve
    primary_group: systemd-resolve
    shell: /usr/sbin/nologin
    home: /run/systemd
    gecos: "systemd Resolver"

reboot_required: false

security:
  capabilities:
    - CAP_NET_ADMIN
    - CAP_NET_BIND_SERVICE
    - CAP_SYS_ADMIN
  egress_allow: []
  privileged: false
  user_namespace: false

skills: []

build:
  ubuntu_digest: null
  apt_snapshot: "20260415T000000Z"
