schema_version: 1

name: base-os-ubuntu-noble
display_name: "Powernode Base — Ubuntu 24.04 (Noble) userland"
description: "OS-specific layer on top of powernode-system-base — Ubuntu 24.04 LTS minbase userland: systemd as PID 1, systemd-networkd for DHCP, openssh-server, ca-certificates, libssl, coreutils, the standard Debian filesystem layout. Inherits /sbin/powernode-agent from the minimal powernode-system-base via overlay union; this module only owns the OS-specific bits. Sibling modules for Debian (trixie), Alpine, and other base images will provide the same `base.os` capability."
license: "MIT"
category: base-os

mask:
  - "/var/cache/apt/**"
  - "/var/lib/apt/lists/**"
  - "/usr/share/doc/**"
  - "/usr/share/man/**"
  - "/usr/share/locale/**"
  - "/var/log/**"
  # Build-chroot identity that must NOT ship fleet-wide (campaign 019f6084
  # inc0 — carve-conformance audit). Both are generated INSIDE the
  # mmdebstrap chroot by package postinst scripts during Stage 1, before
  # this mask ever runs — confirmed by reading the actual Ubuntu Noble
  # postinst scripts (same distro/packages this module builds against):
  #   - systemd.postinst calls `systemd-machine-id-setup` unconditionally,
  #     which WRITES a real (non-empty) /etc/machine-id — not the usual
  #     "ships empty, populated at first boot" story.
  #   - openssh-server.postinst generates /etc/ssh/ssh_host_{rsa,ecdsa,
  #     ed25519}_key via `ssh-keygen -q -f ... -N ''` if they don't
  #     already exist in the chroot.
  # file_spec's broad "/etc/**" would otherwise carve both into the
  # shipped erofs blob, baking ONE identity into every fleet node that
  # boots this module. For the ssh host keys specifically this also
  # silently defeats rootfs/etc/systemd/system/ssh-host-keygen.service's
  # first-boot regeneration: that unit's
  # `ConditionPathExistsGlob=!/etc/ssh/ssh_host_ed25519_key` checks the
  # MERGED overlay view, so if the read-only erofs lower already ships
  # that file the condition is false on every boot and the unit never
  # runs — every node would keep the one host key baked into the blob
  # forever, not just on first boot. protected_spec below already
  # protects these paths from being overridden by a NEIGHBOR module;
  # that does not stop base-os's OWN build from carving them, hence the
  # mask. Needs an independent parity check on the next real erofs build
  # (not run here — no build environment in this increment) to confirm
  # the masked blob still boots clean and ssh-host-keygen.service still
  # fires on first boot.
  - "/etc/machine-id"
  - "/etc/ssh/ssh_host_*_key"
  - "/etc/ssh/ssh_host_*_key.pub"
  # /etc/hostname is likewise build-chroot identity that must NOT ship fleet-
  # wide: the mmdebstrap/native build chroot writes its own hostname (observed
  # live as a container id like "2f87ea2fe15b" on ops-hub base-os #24), and
  # file_spec's broad "/etc/**" would carve that into the erofs so every pivot
  # node boots with the builder's hostname instead of its own. Masking it out
  # makes the on-node agent's write authoritative on every boot — the agent
  # renders /etc/hostname into the composed union from the platform-supplied
  # instance_name (agent/internal/etcidentity.ApplyHostname, sourced by
  # runtime.desiredHostname); with the erofs no longer shipping a competing
  # lower-layer file, the agent's writable-upper write wins.
  - "/etc/hostname"

file_spec:
  - "/etc/**"
  - "/usr/bin/**"
  - "/usr/sbin/**"
  - "/usr/lib/**"
  - "/lib/**"
  - "/sbin/**"
  - "/bin/**"
  # dbus ships its system-bus config under /usr/share/dbus-1 (system.conf +
  # system.d/**). Without it dbus-daemon exits 1 ("Failed to open
  # /usr/share/dbus-1/system.conf"), cascading into hostnamectl/logind failures
  # post-pivot. The carve omitted /usr/share entirely; include the dbus tree
  # specifically (a blanket /usr/share/** would balloon the erofs blob).
  - "/usr/share/dbus-1/**"
  # sudo's private libs + policy plugins live under /usr/libexec/sudo on
  # Ubuntu Noble (sudo 1.9.15): libsudo_util.so.0, sudoers.so, group_file.so,
  # etc. The carve above (/usr/lib, /usr/bin, /usr/sbin) misses /usr/libexec
  # ENTIRELY, so base-os #23 shipped /usr/bin/sudo + /usr/sbin/visudo as
  # BROKEN binaries ("libsudo_util.so.0: cannot open shared object file").
  # That wedged the agent reconciler at sudoers_write (visudo -cf exits 127),
  # which in turn blocked module service-unit generation post-pivot. Carve
  # /usr/libexec so the full sudo runtime closure ships.
  - "/usr/libexec/**"

# Sensitive paths that NO higher-priority module may override at union mount.
# Build pipeline folds these into every higher neighbor's effective_mask, so
# their blobs cannot ship these files. Anything machine-identity, account
# policy, or trust-boundary lives here.
protected_spec:
  # Identity + account policy
  - "/etc/passwd"
  - "/etc/shadow"
  - "/etc/group"
  - "/etc/gshadow"
  - "/etc/sudoers"
  - "/etc/sudoers.d/**"
  # Authentication policy
  - "/etc/pam.d/**"
  - "/etc/security/**"
  - "/etc/login.defs"
  # SSH machine identity + policy
  - "/etc/ssh/sshd_config"
  - "/etc/ssh/sshd_config.d/**"
  - "/etc/ssh/ssh_host_*_key"
  - "/etc/ssh/ssh_host_*_key.pub"
  # Powernode-agent identity + binary
  - "/etc/systemd/system/powernode-agent.service"
  - "/usr/sbin/powernode-agent"
  - "/sbin/powernode-agent"
  # SUID trust boundary binaries
  - "/usr/bin/sudo"
  - "/usr/bin/su"
  - "/usr/sbin/sshd"

package_spec:
  - bash
  - coreutils
  - util-linux
  # On Ubuntu Noble, systemd-networkd ships inside the `systemd` package —
  # listing it separately causes `Unable to locate package` failures during
  # mmdebstrap. systemd-resolved is NOT part of `systemd`; it's its own
  # binary package (confirmed via `apt-cache search resolved` / `dpkg -S` —
  # the prior comment here claiming otherwise was wrong, which is why
  # un-masking rootfs/etc/systemd/system/systemd-resolved.service alone
  # never worked: there was no apt-installed unit underneath it to reveal).
  # Must be listed explicitly to get the unit, the binary, and its
  # sysusers.d/tmpfiles.d fragments.
  - systemd
  - systemd-sysv
  - systemd-resolved
  - dbus
  - iputils-ping
  - iproute2
  # nftables provides /usr/sbin/nft — the on-node agent's per-module reconcile
  # (runtime.attachModule → policy.Apply → security.ApplyEgressAllowlist) shells
  # out to `nft` to install the default-deny egress chain BEFORE it renders the
  # module's systemd units. Without nft in the pivoted rootfs, policy.Apply
  # errors ("nft: executable file not found in $PATH"), attachModule returns
  # early, AttachServices never runs, and every module's units are left as the
  # stale pre-render skeleton (empty ExecStart) → services never start. The
  # initramfs stages its own nft, so this only bit post-switch_root. (imp 605b)
  - nftables
  - openssh-server
  - ca-certificates
  - curl
  # sudo provides /usr/bin/sudo (+ visudo). The break-glass + manifest
  # sudoers-grant subsystem (agent/internal/etcsudoers) is fully built and
  # boot-wired but INERT without the binary — no module shipped it, so
  # /usr/bin/sudo was reserved in protected_spec (below) yet never installed.
  # Installing it activates: (1) operator break-glass
  # (POWERNODE_OPERATOR_BREAK_GLASS=1 → pnadmin NOPASSWD:ALL, breakglass.go),
  # (2) manifest SudoersGrant rows (e.g. postgres-primary's ACME cert reload,
  # previously inert), and (3) etcsudoers' `visudo -cf` validation (which
  # silently no-ops when visudo is absent). No per-machine secret in sudo's
  # postinst, so no mask needed.
  - sudo
  - dosfstools
  # systemd-boot provides /usr/bin/bootctl + the systemd-bless-boot*.service /
  # boot-complete.target boot-assessment units the node needs for A/B boot-image
  # rollback (campaign 019f505f inc 3). bootctl was split out of the `systemd`
  # package (~v250); on Noble it lives in this separate binary package. The agent
  # shells out to `bootctl set-oneshot/set-good/set-default` to drive the slots.
  - systemd-boot
  - kmod
  - udev

dependencies:
  # Depends on the truly-minimal powernode-system-base for the
  # /sbin/powernode-agent binary itself. The split lets multiple
  # base-OS variants (this one, debian-trixie, alpine, etc.) share
  # a single source-of-truth for the Powernode agent without
  # duplicating the Go cross-compile in every variant's CI step.
  # The Powernode dependency resolver mounts powernode-system-base
  # at a lower-priority layer so its /sbin/powernode-agent appears
  # in /sysroot under this module's /sbin (which is a directory
  # from the apt-installed coreutils — no file conflict).
  requires:
    - powernode/powernode-system-base@^1.0
  # Capability tags that hub / app modules can match against. The
  # dependency resolver picks any module providing `base.os` that
  # matches the node's arch + base-OS combination — e.g. this module
  # (ubuntu noble amd64) today, future powernode-system-base-trixie-arm64,
  # powernode-system-base-alpine, etc. Operators don't pin the slug;
  # they declare the capability they need and the resolver picks the
  # variant compatible with the node it's being assigned to.
  provides:
    - base.os
    - base.os.ubuntu-noble
    - net.systemd-networkd
    - sshd
    - init.systemd
    # Closure guarantee (campaign 019f6084 inc1): base-os owns the base
    # userland (glibc, coreutils, the FHS layout) that every ELF-shipping
    # module dynamically links against. Modules whose binaries aren't
    # statically linked declare `requires: capability:os.userland` so the
    # dependency resolver (System::DependencyResolutionService, via
    # TemplateExpansionService/TemplateApplyService) always folds base-os
    # into a template's closure even when no module explicitly requires
    # base-os by name. See the sibling `requires: capability:os.userland`
    # edges added on claude-tmux, dev-cell, gitea-act-runner, module-forge,
    # postgres-primary, postgres-replica, redis, qemu-guest-agent,
    # runtime-ruby, node-exporter, storage-tools, runtime-node.
    - os.userland

# Deliberately empty. The post-switch_root agent service is shipped
# as a HAND-CURATED unit file at rootfs/etc/systemd/system/
# powernode-agent.service rather than a generated one from
# lifecycle/service.go. Rationale: system-base IS the platform on a
# pivot_root node — there's no higher-priority module to layer a
# generated unit on top of, and generated units use a
# `powernode-<module-uuid>-<name>.service` namespace that's noise here.
# Letting the agent reconcile loop create a parallel unit alongside
# the curated one would result in two competing instances of the same
# binary; instead leave services: empty and rely on the rootfs/ overlay.
services: []

# Service accounts the base-OS systemd units require to start. Declared here
# (NOT hand-written into /etc/passwd, NOT hardcoded in the agent baseline) so
# the platform-global UID allocator assigns stable UIDs and the agent's
# etcidentity renderer unions them with the baseline into the composed
# /etc/passwd at pivot. dbus/systemd-networkd/systemd-resolved failed at boot
# for lack of these users — the reason 019f3baf masked them; declaring the
# users lets the three run, which is what gives the pivoted hub working DHCP
# (networkd) and DNS resolution (resolved) so the agent can reach the platform.
# NOTE: verified in a standalone Containerfile build that all three owning
# packages (dbus, systemd, systemd-resolved) already create their account
# at build time via their own postinst — so this declaration isn't
# load-bearing for account *existence*. It's load-bearing for UID
# *stability*: apt's postinst assigns these dynamically in install order
# (observed messagebus=100, systemd-network=998, systemd-resolve=993 in one
# run), which isn't guaranteed identical between mmdebstrap (what CI
# actually uses — see .gitea/workflows/build-platform-modules.yaml) and a
# Containerfile/buildah build, or even across two mmdebstrap runs if the
# package set changes. The platform UID allocator pins these instead.
groups:
  - name: messagebus
  - name: systemd-network
  - name: systemd-resolve
users:
  - name: messagebus
    primary_group: messagebus
    shell: /usr/sbin/nologin
    home: /nonexistent
    gecos: "D-Bus system message bus"
  - name: systemd-network
    primary_group: systemd-network
    shell: /usr/sbin/nologin
    home: /run/systemd
    gecos: "systemd Network Management"
  - name: systemd-resolve
    primary_group: systemd-resolve
    shell: /usr/sbin/nologin
    home: /run/systemd
    gecos: "systemd Resolver"

# base-os IS the root OS layer itself (glibc, coreutils, systemd, the FHS
# layout every other module dynamically links against / runs on top of) —
# it is deliberately the safety boundary that keeps the pivot-node
# hot-reconcile file-copy path (agent/internal/runtime/hotreconcile.go) OUT
# of scope for base-os changes. A rebuilt base-os erofs genuinely needs a
# reboot to apply safely; hot-copying glibc/systemd out from under a live
# running root is not something to attempt.
reboot_required: true

security:
  capabilities:
    - CAP_NET_ADMIN
    - CAP_NET_BIND_SERVICE
    - CAP_SYS_ADMIN
  egress_allow: []
  privileged: false
  user_namespace: false

skills: []

build:
  ubuntu_digest: null
  apt_snapshot: "20260415T000000Z"
