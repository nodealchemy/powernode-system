[Service]
StandardOutput=journal+console
StandardError=journal+console
ExecStartPre=
# Ensure the privsep dir + root's .ssh exist (the agent populates
# /root/.ssh/authorized_keys only AFTER enrollment, so it is absent on the first
# boots), then test the config. Use ';' not '&&' so the diagnostic ls can never
# abort startup — only `sshd -t` gates. The old `ls ... && sshd -t` failed with
# exit 2 on the missing /root/.ssh and took the whole service down.
ExecStartPre=/bin/sh -c "mkdir -p /run/sshd /root/.ssh; chmod 700 /root/.ssh; ls -la /etc/ssh/ /root/.ssh/ /run/sshd; exec /usr/sbin/sshd -t"
