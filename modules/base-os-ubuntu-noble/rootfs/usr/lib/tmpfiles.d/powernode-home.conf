# Powernode home-directory ownership backstop.
#
# Boot-time (pre-sshd) counterpart to the agent's etcidentity home-owner
# reconcile (agent/internal/etcidentity/homes.go). systemd-tmpfiles-setup
# runs --create at boot BEFORE ssh.service, and resolves the user/group
# NAMES below against the etcidentity-rendered /etc/passwd (pnadmin = uid
# 1000) — which ComposeForPivot writes into the union before pivot. This
# creates the home chain with correct ownership on first boot so a fresh
# node is loginable even before the agent's first reconcile tick, and
# heals it every boot if the agent is wedged.
#
# Ownership is declared by NAME (never a baked numeric uid — ids are
# per-install allocated); the modes MUST match homeParentMode/homeDirMode
# in agent/internal/etcidentity/homes.go.
d /home              0755 root    root    -
d /home/pnadmin      0700 pnadmin pnadmin -
d /home/pnadmin/.ssh 0700 pnadmin pnadmin -
