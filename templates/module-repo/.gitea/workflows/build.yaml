# Powernode Module CI — two-stage build with multi-arch matrix.
# Triggered by either:
#   - workflow_dispatch (Powernode platform sends rsync_spec + package_spec)
#   - tag push (matches v*.* — module author publishes a release)
#
# Stage 1: builder image (Containerfile + package_spec)          [build, per-arch]
# Stage 2: composer (rsync_spec → mkcomposefs → fs-verity)        [build, per-arch]
# Stage 3: assemble multi-arch OCI index + cosign sign + notify   [assemble, once]
#
# The server (System::ModuleOciIngestService::OrasOciAdapter) fetches the
# BARE tag ref expecting an OCI image index (`manifests[]` with one entry
# per architecture) and verifies a registry-attached signature via
# `cosign verify <oci_ref>` — a static cosign key, since Gitea isn't on
# Sigstore Fulcio's trusted-issuer list. The `build` matrix jobs only ever
# produce per-arch-tagged artifacts, so the `assemble` job below is what
# creates the bare-tag index and attaches the signature the server expects.
#
# Reference: Golden Eclipse plan M1 — two-stage CI design.

name: build-module

on:
  workflow_dispatch:
    inputs:
      rsync_spec:
        description: "rsync filter rules (multi-line; '- excl', '+ incl', '- *')"
        required: true
        type: string
      package_spec:
        description: "Newline-separated package names for apt-get install"
        required: false
        type: string
        default: ""
      fingerprint:
        description: "SHA256 fingerprint of compiled inputs (cache key)"
        required: true
        type: string
      module_id:
        description: "NodeModule UUID — passed back through to webhook"
        required: true
        type: string
      module_name:
        description: "Module slug for logging"
        required: false
        type: string
        default: "module"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read       # checkout
  packages: write      # oras push to Gitea registry

env:
  REGISTRY: ${{ vars.POWERNODE_OCI_REGISTRY || 'registry.example.com' }}
  COMPOSEFS_TOOLS_VERSION: "1.0.4"

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    # Matrix-invariant — every arch leg resolves the same tag/fingerprint/
    # module_id/module_name, so surfacing them as job outputs is safe (the
    # usual "last matrix leg wins" hazard only bites when legs disagree).
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      fingerprint: ${{ steps.resolve.outputs.fingerprint }}
      module_id: ${{ steps.resolve.outputs.module_id }}
      module_name: ${{ steps.resolve.outputs.module_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            buildah skopeo rsync xz-utils \
            composefs-tools="${COMPOSEFS_TOOLS_VERSION}*" || \
            sudo apt-get install -y composefs-tools

          # oras + syft + grype from official releases (cosign lives only in
          # the `assemble` job now — signing happens once, on the multi-arch
          # index, not per-arch here).
          curl -sSL \
            "https://github.com/oras-project/oras/releases/latest/download/oras_linux_${{ matrix.arch }}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          curl -sSL \
            "https://github.com/anchore/syft/releases/latest/download/syft_linux_${{ matrix.arch }}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin syft
          curl -sSL \
            "https://github.com/anchore/grype/releases/latest/download/grype_linux_${{ matrix.arch }}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin grype
          sudo chmod +x /usr/local/bin/oras /usr/local/bin/syft /usr/local/bin/grype

      - name: Resolve dispatch inputs (or tag-push defaults)
        id: resolve
        run: |
          set -eux
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s' "${{ inputs.rsync_spec }}"   > rsync_spec.filter
            printf '%s' "${{ inputs.package_spec }}" > package_spec.txt
            FINGERPRINT="${{ inputs.fingerprint }}"
            MODULE_ID="${{ inputs.module_id }}"
            MODULE_NAME="${{ inputs.module_name }}"
            TAG="dispatched-${FINGERPRINT:-${{ github.sha }}}"
          else
            # Tag-push fallback: use whatever the repo committed under spec/
            cp spec/rsync_spec.filter   rsync_spec.filter   2>/dev/null || echo "- *" > rsync_spec.filter
            cp spec/package_spec.txt    package_spec.txt    2>/dev/null || true
            FINGERPRINT="$(sha256sum rsync_spec.filter package_spec.txt 2>/dev/null | awk '{print $1}' | head -1)"
            MODULE_ID="$(yq '.name' manifest.yaml)"
            MODULE_NAME="$(yq '.name' manifest.yaml)"
            # Real tag push — the ref IS the tag; never fall back to a
            # synthetic "dispatched-*" value here (that's dispatch-only).
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "fingerprint=${FINGERPRINT}" >> "$GITHUB_OUTPUT"
          echo "module_id=${MODULE_ID}"     >> "$GITHUB_OUTPUT"
          echo "module_name=${MODULE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"                 >> "$GITHUB_OUTPUT"

      # Stage 1: build the fat staging image with package_spec + rootfs/
      - name: Stage 1 — buildah bud (builder image)
        run: |
          set -eux
          buildah bud \
            --platform="linux/${{ matrix.arch }}" \
            --build-arg "APT_SNAPSHOT=${APT_SNAPSHOT:-20260415T000000Z}" \
            -t "module-builder:${{ matrix.arch }}" \
            -f Containerfile \
            .

      - name: Mount the builder image and rsync into staging
        run: |
          set -eux
          BUILDER=$(buildah from "module-builder:${{ matrix.arch }}")
          MOUNT=$(buildah mount "$BUILDER")
          mkdir -p /tmp/staging
          rsync -aH --filter="merge rsync_spec.filter" "$MOUNT/" /tmp/staging/
          buildah umount "$BUILDER"
          buildah rm "$BUILDER"

      # Stage 2: compose into composefs + sign + push
      - name: Stage 2 — mkcomposefs + fs-verity digest
        id: compose
        run: |
          set -eux
          mkdir -p cfs-store
          mkcomposefs --digest-store=./cfs-store /tmp/staging /tmp/module.cfs
          fsverity digest /tmp/module.cfs --hash-alg sha256 > /tmp/fsverity_root_hash.txt
          # extract just the hash hex
          ROOT_HASH=$(awk '{print $1}' /tmp/fsverity_root_hash.txt)
          echo "fsverity_root_hash=${ROOT_HASH}" >> $GITHUB_OUTPUT
          echo "size_bytes=$(stat -c%s /tmp/module.cfs)" >> $GITHUB_OUTPUT

      - name: Generate SBOM (CycloneDX)
        run: |
          syft /tmp/staging -o cyclonedx-json > /tmp/sbom.cdx.json

      - name: Vulnerability scan (VEX)
        run: |
          grype --add-cpes-if-none /tmp/staging -o json > /tmp/vex.json || true

      - name: Push artifact to OCI registry (oras)
        # sbom_uri/vex_uri point at the SBOM/VEX sibling layers pushed in this
        # same command (OrasOciAdapter#fetch_manifest reads them straight off
        # these annotations — see module_oci_ingest_service.rb). No
        # io.powernode.provenance_uri here: this workflow doesn't generate a
        # build-provenance attestation yet, so there is no sibling layer for
        # it to point at (queued separately rather than annotating a URI to
        # nothing).
        id: push
        env:
          ORAS_USERNAME: ${{ secrets.GITEA_PUSH_USERNAME }}
          ORAS_PASSWORD: ${{ secrets.GITEA_PUSH_TOKEN }}
        run: |
          set -eux
          REPO_PATH="${{ github.repository }}"
          TAG="${{ steps.resolve.outputs.tag }}-${{ matrix.arch }}"
          ARTIFACT_REF="${REGISTRY}/${REPO_PATH}:${TAG}"
          set +x  # SECURITY: do not xtrace-leak the push token into the CI log
          echo "${ORAS_PASSWORD}" | oras login "${REGISTRY}" -u "${ORAS_USERNAME}" --password-stdin
          set -x
          oras push "${ARTIFACT_REF}" \
            --artifact-type application/vnd.powernode.module.v1 \
            --annotation "io.powernode.fsverity_root_hash=${{ steps.compose.outputs.fsverity_root_hash }}" \
            --annotation "io.powernode.fingerprint=${{ steps.resolve.outputs.fingerprint }}" \
            --annotation "io.powernode.module_id=${{ steps.resolve.outputs.module_id }}" \
            --annotation "io.powernode.built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --annotation "io.powernode.sbom_uri=${ARTIFACT_REF}.sbom" \
            --annotation "io.powernode.vex_uri=${ARTIFACT_REF}.vex" \
            /tmp/module.cfs:application/octet-stream \
            /tmp/sbom.cdx.json:application/vnd.cyclonedx+json \
            /tmp/vex.json:application/vnd.cyclonedx.vex+json
          echo "artifact_ref=${ARTIFACT_REF}" >> $GITHUB_OUTPUT

      - name: Notify Powernode SBOM webhook
        # Sends the parsed SBOM to the platform so CVE exposure calculation
        # can use ecosystem-aware version-range matching. The `assemble` job
        # (below) triggers OCI ingestion once the multi-arch index is signed
        # and pushed; this per-arch SBOM POST may race ahead of it, so we
        # retry with backoff if the artifact row isn't in the DB yet.
        if: success() && steps.push.outputs.artifact_ref != ''
        env:
          SBOM_WEBHOOK_URL: ${{ vars.POWERNODE_SBOM_WEBHOOK_URL || 'https://platform.example.com/api/v1/system/webhooks/gitea/module_sbom' }}
          WEBHOOK_SECRET: ${{ secrets.POWERNODE_WEBHOOK_SECRET }}
        run: |
          set -eu
          PAYLOAD=$(jq -c -n \
            --arg module_id "${{ steps.resolve.outputs.module_id }}" \
            --arg tag "${{ steps.resolve.outputs.tag }}" \
            --arg architecture "${{ matrix.arch }}" \
            --slurpfile sbom /tmp/sbom.cdx.json \
            '{module_id:$module_id, tag:$tag, architecture:$architecture, sbom:$sbom[0]}')
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | sed 's/^.*= //')
          # Widened vs. the original 0/10/30/60s budget: ingestion is now
          # triggered from the separate `assemble` job (tooling install +
          # index assembly + signing + async worker pickup), not from this
          # same job, so the race window this retries against is measured in
          # minutes, not seconds.
          for delay in 0 15 30 60 120 180; do
            [ "$delay" -gt 0 ] && { echo "[info] retrying SBOM ingestion in ${delay}s"; sleep "$delay"; }
            RESP=$(curl -sS -X POST "$SBOM_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Gitea-Signature: ${SIG}" \
              --data "$PAYLOAD" || echo '{"message":"network error"}')
            case "$RESP" in
              *"SBOM ingested"*)
                echo "$RESP"
                exit 0
                ;;
              *"Artifact not found"*)
                echo "[info] artifact not yet ingested, will retry"
                ;;
              *)
                echo "[warn] SBOM webhook returned: $RESP"
                exit 0
                ;;
            esac
          done
          echo "[warn] SBOM not ingested after retries; CVE matching will fall back to keyword overlap until next build"

  # Runs once, after every per-arch build leg has pushed its artifact.
  # Assembles the bare-tag OCI image index the server expects, attaches a
  # registry-signature via a static cosign key (Gitea isn't Fulcio-trusted,
  # so keyless signing never verifies server-side — see OrasOciAdapter),
  # and only THEN fires the module-publish webhook, so ingestion never runs
  # against a bare tag that doesn't have an index yet.
  assemble:
    needs: build
    # Runs even if a build leg failed — mirrors the old per-arch webhook's
    # `if: always()`, so the platform still hears about the failure (via
    # system.module_publish_failed) instead of the publish going silent.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # Gate the assembly/signing steps on every build leg having actually
      # succeeded — a matrix job's outputs come from whichever leg the
      # runner happens to report last, so a failed leg that never reached
      # `id: resolve` can leave `needs.build.outputs.tag` empty even though
      # `if: always()` still runs this job. Only the final notify step (which
      # must fire on failure too, to report system.module_publish_failed)
      # stays ungated.
      - name: Install oras + cosign + jq
        if: needs.build.result == 'success'
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y jq
          curl -sSLo /usr/local/bin/cosign \
            "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64"
          curl -sSL \
            "https://github.com/oras-project/oras/releases/latest/download/oras_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          sudo chmod +x /usr/local/bin/cosign /usr/local/bin/oras

      - name: Assemble + push multi-arch OCI index
        id: index
        if: needs.build.result == 'success'
        env:
          ORAS_USERNAME: ${{ secrets.GITEA_PUSH_USERNAME }}
          ORAS_PASSWORD: ${{ secrets.GITEA_PUSH_TOKEN }}
        run: |
          set -eux
          REPO_PATH="${{ github.repository }}"
          TAG="${{ needs.build.outputs.tag }}"
          REF="${REGISTRY}/${REPO_PATH}:${TAG}"
          set +x  # SECURITY: do not xtrace-leak the push token into the CI log
          echo "${ORAS_PASSWORD}" | oras login "${REGISTRY}" -u "${ORAS_USERNAME}" --password-stdin
          set -x

          MANIFESTS_JSON="[]"
          # Arch list intentionally mirrors `strategy.matrix.include` above
          # and System::ModuleOciIngestService::SUPPORTED_ARCHS (Ruby) — keep
          # all three in sync when adding/removing an architecture. A missing
          # arch here fails loudly (the fetch below 404s under `set -e`),
          # never silently drops a platform from the index.
          for arch in amd64 arm64; do
            oras manifest fetch --descriptor "${REF}-${arch}" > "descriptor-${arch}.json"
            ENTRY=$(jq --arg arch "$arch" \
              '{mediaType, digest, size, platform: {architecture: $arch, os: "linux"}, annotations: (.annotations // {})}' \
              "descriptor-${arch}.json")
            MANIFESTS_JSON=$(jq --argjson e "$ENTRY" '. + [$e]' <<<"$MANIFESTS_JSON")
          done

          jq -n --argjson manifests "$MANIFESTS_JSON" \
            '{schemaVersion: 2, mediaType: "application/vnd.oci.image.index.v1+json", manifests: $manifests}' \
            > index.json

          oras manifest push "${REF}" index.json
          echo "artifact_ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Cosign sign the multi-arch index (static key)
        # Gitea's OIDC issuer isn't in Sigstore Fulcio's trusted-issuer list,
        # so keyless `cosign sign` can never produce a signature the server's
        # `cosign verify <oci_ref>` (module_oci_ingest_service.rb) accepts.
        # POWERNODE_COSIGN_PRIVATE_KEY is this repo's half of the static key
        # pair whose public half is the platform's POWERNODE_COSIGN_PUBLIC_KEY.
        if: needs.build.result == 'success'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.POWERNODE_COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.POWERNODE_COSIGN_KEY_PASSWORD }}
        run: |
          set -eu  # SECURITY: no xtrace — this step handles the cosign private key
          if [ -z "${COSIGN_PRIVATE_KEY:-}" ]; then
            echo "[warn] POWERNODE_COSIGN_PRIVATE_KEY not set — pushing an unsigned index; server-side cosign verify will fail until this secret is configured"
          else
            export __COSIGN_KEY_INLINE="${COSIGN_PRIVATE_KEY}"
            cosign sign --key env://__COSIGN_KEY_INLINE --yes "${{ steps.index.outputs.artifact_ref }}"
          fi

      - name: Notify Powernode webhook
        # SIGNING CONTRACT (module-publish + SBOM callbacks):
        #   X-Gitea-Signature = sha256=hex(HMAC-SHA256(WEBHOOK_SECRET, raw_body))
        # where WEBHOOK_SECRET == the module's DERIVED webhook secret. The
        # platform derives the verifier as
        #   ModuleBuildDispatchService.module_webhook_secret_for(module.id)
        #   = HMAC-SHA256(server_root_secret, "module-webhook:<module.id>")
        # and (when POWERNODE_MODULE_WEBHOOK_ENFORCE=true) REJECTS any body it
        # can't verify. Set POWERNODE_WEBHOOK_SECRET (this repo's Actions
        # secret) to the value shown on the module's detail view in the
        # Powernode UI. Same secret also goes in the Gitea repo's native push
        # webhook config so push events verify too.
        #
        # NB: runs only on success (default) — a failed build/oras-push must NOT
        # announce an artifact_ref the registry never received, or the platform
        # ingests a guaranteed-failed publication and mints an artifact-less
        # NodeModuleVersion (IMP-4982). Failed CI runs are reconciled separately.
        env:
          WEBHOOK_URL: ${{ vars.POWERNODE_WEBHOOK_URL || 'https://platform.example.com/api/v1/system/webhooks/gitea/module' }}
          WEBHOOK_SECRET: ${{ secrets.POWERNODE_WEBHOOK_SECRET }}
        run: |
          set -eux
          PAYLOAD=$(jq -c -n \
            --arg repo "${{ github.repository }}" \
            --arg ref  "refs/tags/${{ needs.build.outputs.tag }}" \
            --arg artifact "${{ steps.index.outputs.artifact_ref }}" \
            --arg fingerprint "${{ needs.build.outputs.fingerprint }}" \
            '{repository:{full_name:$repo}, ref:$ref, artifact:$artifact, fingerprint:$fingerprint}')
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | sed 's/^.*= //')
          curl -fsS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Gitea-Signature: ${SIG}" \
            --data "$PAYLOAD" || echo "[warn] webhook delivery failed; will retry on next dispatch"
